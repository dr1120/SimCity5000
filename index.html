<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyline 5000</title>
<style>
:root{
  color-scheme: light;
  --bg:#e8edf0; --panel:#f7f9fa; --panel2:#e9eef1; --ink:#13202a; --muted:#566673; --line:#c9d3da;
  --accent:#1f6f8b; --good:#2a8450; --bad:#c2452d; --warn:#a96f12;
  --btn:#ffffff; --btnOn:#13202a; --btnOnInk:#f7f9fa; --scrim:rgba(10,20,30,.5);
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1620; --panel:#13222e; --panel2:#1a2d3b; --ink:#e8f0f5; --muted:#8fa3b1; --line:#26394a;
    --accent:#5bb5d6; --good:#4fc083; --bad:#f0715a; --warn:#e2ad4b;
    --btn:#1a2d3b; --btnOn:#e8f0f5; --btnOnInk:#0c1620; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1620; --panel:#13222e; --panel2:#1a2d3b; --ink:#e8f0f5; --muted:#8fa3b1; --line:#26394a;
  --accent:#5bb5d6; --good:#4fc083; --bad:#f0715a; --warn:#e2ad4b;
  --btn:#1a2d3b; --btnOn:#e8f0f5; --btnOnInk:#0c1620; --scrim:rgba(0,0,0,.6);
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
#app{max-width:480px;margin:0 auto;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px;height:calc(var(--app-h,100vh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;overflow-x:hidden;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12.5px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.stats{flex:none;display:grid;grid-template-columns:1.25fr 1fr 1fr 1.1fr;gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.stat .lab{font-size:11.5px;color:var(--muted)}
.stat .val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--bad)} .pos{color:var(--good)}
.ticker{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.3;height:40px;overflow:hidden;flex:none}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--muted)}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--accent)}
.econ{display:flex;gap:5px;overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}.econ::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:74px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 8px}
.chip .lab{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.chip .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .tr{font-size:9px;margin-left:3px}
.board{position:relative;flex:1 1 auto;min-height:170px}
#cv{display:block;position:absolute;left:0;top:0;width:100%;height:100%;border-radius:12px;border:1px solid var(--line);touch-action:none;background:var(--panel)}
#mm{position:absolute;left:8px;bottom:8px;width:84px;height:84px;border-radius:8px;border:2px solid rgba(255,255,255,.85);image-rendering:pixelated;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.navbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.navbtns button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-size:19px;font-weight:700;line-height:1;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:70%;background:var(--btnOn);color:var(--btnOnInk);
  padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.show{opacity:1}
.info{font-size:12.5px;color:var(--muted);height:34px;overflow:hidden;line-height:1.3;flex:none}
.groups{align-self:flex-start;flex:none;max-width:100%;overflow-x:auto}
.tools{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tool{flex:none;min-width:68px;scroll-snap-align:start;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:7px 6px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool .sw{width:14px;height:14px;border-radius:4px;margin-bottom:2px}
.tool .nm{font-size:13px;font-weight:600;white-space:nowrap}
.tool .ct{font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.tool.on{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn)}
.tool.lock{opacity:.55}
.bar{flex:none;display:flex;gap:6px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--btn)}
.seg button{background:transparent;border:0;padding:8px 9px;font-weight:700;min-width:36px;display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--btnOn);color:var(--btnOnInk)}
.seg svg{width:14px;height:14px;fill:currentColor}
.groups button{font-size:13px;padding:6px 11px;flex:none}
.tabs{margin:8px 0 10px}
.tabs button{flex:1;font-size:14px}
.navbtns button.on{background:var(--btnOn);color:var(--btnOnInk)}
.act{position:relative;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.act.badge::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;z-index:20}
.overlay.open{display:flex}
.overlay{align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:16px}
.sheet,.card{width:100%;max-width:480px;background:var(--panel);color:var(--ink);overflow:auto;-webkit-user-select:none;user-select:none}
.sheet{border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh}
.card{border-radius:18px;padding:20px;max-height:92vh;border:1px solid var(--line)}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{margin:0 0 6px;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
h2{margin:0;font-size:22px;font-weight:800}
h3{margin:16px 0 6px;font-size:15px;font-weight:800}
p{margin:6px 0}
.tag{font-size:15px;color:var(--muted);margin:8px 0 14px}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.row{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.row label{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.debt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.debt .meta{display:flex;flex-direction:column;font-size:13px}
.debt .meta b{font-size:15px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.btns button,.primary,.sm{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px}
button.primary{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn);font-size:16px;padding:12px}
button:disabled{opacity:.4;cursor:default}
.ln{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;font-variant-numeric:tabular-nums}
.ln.tot{font-weight:800;border-top:1px solid var(--line);margin-top:3px;padding-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.diag{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.diag div{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;display:flex;flex-direction:column}
.diag b{font-size:17px;font-variant-numeric:tabular-nums}
.chart{margin-top:12px}
.chart .ct{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:3px}
.chart .ct span{font-weight:400;color:var(--muted);text-align:right}
.chart canvas{width:100%;height:92px;display:block;background:var(--panel2);border-radius:10px}
.news{margin:0;padding:0;list-style:none}
.news li{display:flex;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.news time{flex:none;width:62px;color:var(--muted);font-size:12px}
.how{margin:16px 0 0;padding-left:20px;font-size:14px}
.how li{margin:6px 0}
.best{font-size:13px;color:var(--muted);margin-top:12px}
.tech{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.tech small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tst{flex:none;width:112px;text-align:right}
.prog{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-bottom:3px}
.prog i{display:block;height:100%;background:var(--accent)}
.firm{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel2)}
.fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fh b{font-size:15.5px}
.tagc{font-size:12px;color:var(--muted)}
.stg{margin-left:auto;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.stg.public{color:var(--good)} .stg.acquired{color:var(--warn)}
.fs{font-size:13px;margin:6px 0 8px}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>Skyline 5000</b><span id="date" class="muted"></span></div>
    <button class="ghost" id="btnMenu">Menu</button>
  </header>
  <section class="stats">
    <div class="stat"><span class="lab">Cash</span><span class="val" id="cash">$0</span></div>
    <div class="stat"><span class="lab">People</span><span class="val" id="pop">0</span></div>
    <div class="stat"><span class="lab">Approval</span><span class="val" id="appr">70%</span></div>
    <div class="stat"><span class="lab">Per month</span><span class="val" id="net">$0</span></div>
  </section>
  <div class="ticker"><i class="dot" id="tdot"></i><span id="ttext"></span></div>
  <section class="econ" id="econ"></section>
  <div class="board" id="board">
    <canvas id="cv"></canvas>
    <canvas id="mm" width="112" height="112"></canvas>
    <div class="navbtns">
      <button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">&minus;</button>
      <button id="rotL" aria-label="Rotate left">&#8634;</button><button id="rotR" aria-label="Rotate right">&#8635;</button>
      <button id="hand" aria-label="Toggle pan or paint">&#9995;</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="info" id="info"></div>
  <div class="seg groups" id="groups"></div>
  <nav class="tools" id="tools" aria-label="Build tools"></nav>
  <div class="bar">
    <div class="seg" id="speed">
      <button data-s="0" aria-label="Pause"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button>
      <button data-s="1" aria-label="Normal speed">1&times;</button>
      <button data-s="2" aria-label="Fast">2&times;</button>
      <button data-s="3" aria-label="Fastest">3&times;</button>
    </div>
    <button class="act" id="btnPolicy">Policy</button>
    <button class="act" id="btnEcon">Economy</button>
    <button class="act" id="btnCorp">Corp</button>
  </div>
</div>
<div id="sheet" class="overlay"><div class="sheet" id="sheetBody"></div></div>
<div id="splash" class="overlay center open"><div class="card" id="splashBody"></div></div>
<script>
(function(){
'use strict';
/* ================= constants ================= */
var MW=56,MH=56,N=MW*MH;
var EMPTY=0,ROAD=1,RES=2,COM=3,IND=4,PLANT=5,PARK=6,PORT=7,PLINE=8,PIPE=9,PUMP=10,POLICE=11,FIRE=12,SCHOOL=13,LAB=14,SOLAR=15,FUSION=16,DESAL=17,DC=18,BIO=19,GAS=20,NUKE=21,HYDRO=22,WIND=23,STADIUM=24,AIRPORT=25,UNIV=26,CONV=27,METRO=28,EXCH=29,BATT=30,SUB=39;
var GRASS=0,FOREST=1,WATER=2,ROCK=3;
var RES_CAP=[0,6,15,30],COM_JOBS=[0,4,10,20],IND_JOBS=[0,6,14,26];
var ZUSE={};ZUSE[RES]=2;ZUSE[COM]=1;ZUSE[IND]=2.5;
var RANKS=[[0,'Hamlet'],[150,'Village'],[600,'Town'],[1500,'City'],[3500,'Metropolis']];
var SAVE_KEY='skyline5000.save.v3',BEST_KEY='skyline5000.best';
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* object table: cost, monthly upkeep, power made (mw) and radius, water made (wc), power use (pu), water use (wu) */
var OBJ={
  road:{t:ROAD,cost:15,cat:'road'},
  pline:{t:PLINE,cost:6,up:0.2,cat:'road'},
  pipe:{t:PIPE,cost:8,up:0.3,cat:'water'},
  res:{t:RES,cost:100},com:{t:COM,cost:150},ind:{t:IND,cost:150},
  plant:{t:PLANT,cost:3200,up:35,mw:60,rad:8,cat:'power',size:[2,2],jobs:20},
  gas:{t:GAS,cost:5200,up:45,mw:85,rad:8,cat:'power',size:[2,2],jobs:12},
  nuke:{t:NUKE,cost:60000,up:160,mw:420,rad:14,cat:'power',tech:'fission',build:10,size:[3,3],jobs:90},
  hydro:{t:HYDRO,cost:9000,up:15,mw:26,rad:6,cat:'power',shore:true,build:5,size:[2,1],jobs:10},
  solar:{t:SOLAR,cost:3500,up:10,mw:12,rad:5,cat:'power',size:[3,3],jobs:6},
  wind:{t:WIND,cost:3000,up:12,mw:14,rad:5,cat:'power',size:[3,3],jobs:5},
  batt:{t:BATT,cost:12000,up:40,cat:'power',size:[2,2],jobs:3},
  fusion:{t:FUSION,cost:90000,up:60,mw:650,rad:16,cat:'power',tech:'fusion',build:14,size:[4,4],jobs:120},
  pump:{t:PUMP,cost:1200,up:25,wc:100,rad:8,pu:1,shore:true,cat:'water',jobs:4},
  desal:{t:DESAL,cost:5000,up:70,wc:80,rad:8,pu:6,tech:'water',cat:'water',size:[2,2],jobs:15},

  police:{t:POLICE,cost:1500,up:60,pu:2,cat:'civic',jobs:8},
  fire:{t:FIRE,cost:1500,up:50,pu:2,cat:'civic',jobs:8},
  school:{t:SCHOOL,cost:2200,up:70,pu:2,wu:4,cat:'civic',size:[2,2],jobs:12},
  lab:{t:LAB,cost:5000,up:120,pu:4,wu:4,cat:'civic',size:[2,2]},
  dc:{t:DC,cost:22000,up:160,pu:22,tech:'fiber',shore:true,cat:'civic',size:[3,3],build:8},
  bio:{t:BIO,cost:12000,up:90,pu:6,wu:8,tech:'bio',cat:'civic',size:[2,2]},
  stadium:{t:STADIUM,cost:45000,up:400,pu:8,build:8,req:600,cat:'proj',size:[3,3]},
  airport:{t:AIRPORT,cost:90000,up:900,pu:12,build:12,req:1500,cat:'proj',size:[4,4]},
  univ:{t:UNIV,cost:65000,up:600,pu:8,wu:6,build:10,req:900,cat:'proj',size:[3,3]},
  conv:{t:CONV,cost:55000,up:450,pu:6,wu:5,build:8,req:1000,cat:'proj',size:[3,2]},
  metro:{t:METRO,cost:70000,up:700,pu:10,build:12,req:1200,cat:'proj',size:[2,1]},
  exch:{t:EXCH,cost:80000,up:500,pu:8,build:10,req:1400,cat:'proj',size:[2,2]}
};
var BYT={};(function(){for(var k in OBJ){OBJ[k].id=k;BYT[OBJ[k].t]=OBJ[k];}})();
var TOOLS={
  inspect:{name:'Move',sw:'#8a98a3',desc:'Drag to pan the map. Tap a tile to see what it does and needs.'},
  road:{name:'Road',sw:'#59666f',desc:'Zones need a road beside them. Bridges over water cost 4×.'},
  res:{name:'Homes',sw:'#38a169',desc:'Zone homes. Builders move in when housing is scarce and credit is cheap.'},
  com:{name:'Shops',sw:'#3b82d6',desc:'Zone shops. They employ people and sell goods from factories or ports.'},
  ind:{name:'Factory',sw:'#d9a520',desc:'Zone factories. They employ people and make the goods shops sell.'},
  park:{name:'Park',sw:'#4f9d5e',desc:'Parks lift mood. Tall housing needs about one park per 15 home lots.'},
  plant:{name:'Coal',sw:'#6b7785',desc:'Cheap 60 MW baseload, reaches 8 tiles. Dirty, and the fuel bill follows supply shocks.'},
  batt:{name:'Battery',sw:'#8a8f4a',desc:'Lithium storage: evens out solar and wind swings by up to 8 MW a tile, loses 15% going in and out, costs a fortune per MW, and can catch fire. Fire stations barely help.'},
  gas:{name:'Gas',sw:'#c98a3a',desc:'85 MW dispatchable power, cleaner than coal. Fuel prices swing hard in supply shocks.'},
  nuke:{name:'Nuclear',sw:'#8d6fd1',desc:'Advanced fission: 420 MW on one tile of clean, steady baseload with passive safety. Fuel is cheap and shocks barely touch it, so your whole grid holds prices steadier. 10 months to build. Needs Advanced fission.'},
  hydro:{name:'Hydro',sw:'#3d8fd1',desc:'About 26 MW, needs a waterfront tile, 5 months to build, and drought halves it.'},
  solar:{name:'Solar',sw:'#2a4f9a',desc:'Only about 12 MW and weaker in winter and under cloud. Photovoltaics research boosts it 50%.'},
  wind:{name:'Wind',sw:'#7fa8c9',desc:'About 14 MW but gusty and unreliable. Better on hills and coasts.'},
  fusion:{name:'Fusion',sw:'#26b6c9',desc:'650 MW, reaches 16 tiles, 14 months to build. The holy grail: needs Fusion power, which takes a huge research effort.'},
  pline:{name:'Power line',sw:'#c9a227',desc:'Carries power from a plant. Powered lines reach 4 tiles around them.'},
  pump:{name:'Pump',sw:'#3d8fd1',desc:'100 water, reaches 8 tiles. Must touch water and needs power.'},
  desal:{name:'Desalination',sw:'#2f9fb5',desc:'80 water anywhere, reaches 8 tiles. Needs Water recycling research.'},
  pipe:{name:'Water pipe',sw:'#5aa9e6',desc:'Carries water from a pump. Wet pipes reach 4 tiles around them.'},
  police:{name:'Police',sw:'#2c4a9a',desc:'Covers 8 tiles. Safer streets lift mood. Needs power.'},
  fire:{name:'Fire station',sw:'#c0392b',desc:'Covers 8 tiles. Stops fires from spreading. Needs power.'},
  school:{name:'School',sw:'#a8683a',desc:'Covers 9 tiles. Lifts mood, wages and research. Needs power and water.'},
  lab:{name:'Research lab',sw:'#8fa8c4',desc:'Speeds up R&D and spins out startups. Needs power and water.'},
  port:{name:'Port',sw:'#2a9d8f',desc:'Must touch water and a road. Imports goods when factories fall short.'},
  dc:{name:'Data center',sw:'#4b5563',desc:'Advanced computing campus. Sits on the waterfront for closed-loop cooling that uses no water, draws lots of power (nuclear pairs well), and brings construction work, 70 high-wage jobs, cloud revenue and faster research. Needs Fiber and cloud.'},
  bio:{name:'Biotech',sw:'#3fa796',desc:'40 high-wage jobs. Needs Biotech research, power and water.'},
  stadium:{name:'Stadium',sw:'#d98c3a',desc:'Capital project, 8 months. Lifts mood and approval and brings in tourism money.'},
  airport:{name:'Airport',sw:'#7a8da3',desc:'Capital project, 12 months. Boosts exports and business demand. Noisy.'},
  univ:{name:'University',sw:'#b0733f',desc:'Capital project, 10 months. Speeds research 60% and lifts wages.'},
  conv:{name:'Convention',sw:'#4a7bc4',desc:'Capital project, 8 months. Lifts retail sales and brings in visitors.'},
  metro:{name:'Metro',sw:'#c0463a',desc:'Capital project, 12 months. Eases traffic, lifts mood and housing demand.'},
  exch:{name:'Exchange',sw:'#9a8456',desc:'Capital project, 10 months. Doubles IPO fees and makes listings far more likely.'},
  bull:{name:'Bulldoze',sw:'#c2452d',desc:'Clears tiles or cuts down forest.'}
};

function nb4(i){

/* ================= terrain ================= */
function hash2(x,y,s){
  var h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,982451653)|0;
  h=Math.imul(h^(h>>>13),1274126177);h=h^(h>>>16);
  return (h>>>0)%10000/10000;
}
function vnoise(x,y,s){
  var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  var a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,s){
  var t=0,a=0.5,f=1,n=0;
  for(var o=0;o<4;o++){t+=a*vnoise(x*f,y*f,s+o*17);n+=a;a*=0.5;f*=2;}
  return t/n;
}
function genTerrain(){
  var seed=rnd(100000),phase=Math.random()*6.28,x,y,i,k;
  var sx=Math.round(MW*0.5)+rnd(3)-1,sy=Math.round(MH*0.48)+rnd(3)-1;
  function coastAt(yy){return 8+4*Math.sin(yy*0.2+phase)+2.2*Math.sin(yy*0.47+phase*2);}
  TER=new Array(N).fill(GRASS);EL=new Array(N).fill(1);
  for(y=0;y<MH;y++){
    var coast=coastAt(y);
    for(x=0;x<MW;x++){
      i=y*MW+x;
      if(x<coast){TER[i]=WATER;EL[i]=0;continue;}
      var v=fbm(x*0.08,y*0.08,seed)+(x-coast)*0.0085;
      if(v<0.36){TER[i]=WATER;EL[i]=0;continue;}
      EL[i]=clamp(Math.round((v-0.36)*9)+1,1,7);
    }
  }
  for(var pass=0;pass<2;pass++){
    var ne=EL.slice();
    for(y=0;y<MH;y++)for(x=0;x<MW;x++){
      i=y*MW+x;if(TER[i]===WATER)continue;
      var sum=EL[i]*2,cnt=2;
      for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
        var xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=MW||yy>=MH)continue;
        var j=yy*MW+xx;if(TER[j]===WATER)continue;sum+=EL[j];cnt++;
      }
      ne[i]=clamp(Math.round(sum/cnt),1,7);
    }
    EL=ne;
  }
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    i=y*MW+x;var d=Math.sqrt((x-sx)*(x-sx)+(y-sy)*(y-sy));
    if(d<=9){TER[i]=GRASS;EL[i]=2;}
    else if(d<14){
      var t=(d-9)/5;
      if(TER[i]===WATER&&d<12){TER[i]=GRASS;EL[i]=2;}
      else if(TER[i]!==WATER)EL[i]=Math.round(EL[i]*t+2*(1-t));
    }
  }
  var pts=[[sx+8+rnd(10),0],[sx+8+rnd(3),sy-11],[sx+7,sy+1],[sx-1-rnd(2),sy+12],[coastAt(sy+18)+1,sy+18+rnd(3)]];
  for(k=0;k<pts.length-1;k++){
    var a=pts[k],b=pts[k+1],len=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));
    for(var s=0;s<=len*2;s++){
      var tt=s/(len*2),px=a[0]+(b[0]-a[0])*tt+Math.sin(tt*9+k*2+phase)*1.1,py=a[1]+(b[1]-a[1])*tt;
      var rx=Math.round(px),ry=Math.round(py);
      if(rx<0||ry<0||rx>=MW||ry>=MH)continue;
      i=ry*MW+rx;TER[i]=WATER;EL[i]=0;
      if(k>=2&&rx+1<MW){TER[i+1]=WATER;EL[i+1]=0;}
    }
  }
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    i=y*MW+x;if(TER[i]===WATER)continue;
    var wet=false;
    for(var ey=-1;ey<=1&&!wet;ey++)for(var ex=-1;ex<=1;ex++){
      var x2=x+ex,y2=y+ey;if(x2<0||y2<0||x2>=MW||y2>=MH)continue;
      if(TER[y2*MW+x2]===WATER){wet=true;break;}
    }
    if(wet)EL[i]=Math.min(EL[i],2);
  }
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    i=y*MW+x;if(TER[i]===WATER)continue;
    if(EL[i]>=6)TER[i]=ROCK;
    else{
      var moist=fbm(x*0.14+50,y*0.14+50,seed+99),d2=Math.sqrt((x-sx)*(x-sx)+(y-sy)*(y-sy));
      if(moist>0.56&&EL[i]<=4&&d2>8)TER[i]=FOREST;
    }
  }
  for(i=0;i<N;i++){
    SHORE[i]=0;if(TER[i]===WATER)continue;
    var nn=nb4(i);for(k=0;k<nn.length;k++){if(TER[nn[k]]===WATER)SHORE[i]=1;}
  }
  return {x:sx,y:sy};
}

/* ================= footprints ================= */
function sizeOf(id){var o=OBJ[id];return (o&&o.size)||[1,1];}
function anchorFor(i,sz){return [(i%MW)-Math.floor(sz[0]/2),((i/MW)|0)-Math.floor(sz[1]/2)];}
function footTiles(ax,ay,sz){var r=[];for(var dy=0;dy<sz[1];dy++)for(var dx=0;dx<sz[0];dx++)r.push((ay+dy)*MW+ax+dx);return r;}
function rootOf(i){return (T[i]===SUB&&PAR[i]>=0)?PAR[i]:i;}
function footOfAnchor(a){var o=BYT[T[a]],sz=(o&&o.size)||[1,1];return footTiles(a%MW,(a/MW)|0,sz);}
function centerIdx(a){var o=BYT[T[a]],sz=(o&&o.size)||[1,1];return (((a/MW)|0)+Math.floor(sz[1]/2))*MW+(a%MW)+Math.floor(sz[0]/2);}
function clearAt(i){
  var a=rootOf(i);
  if(a===i&&T[i]!==SUB&&!(BYT[T[i]]&&BYT[T[i]].size)){T[i]=EMPTY;L[i]=0;B[i]=0;PAR[i]=-1;F[i]=0;return;}
  var tiles=(T[a]===SUB)?[i]:footOfAnchor(a);
  for(var k=0;k<tiles.length;k++){var t=tiles[k];T[t]=EMPTY;L[t]=0;B[t]=0;PAR[t]=-1;F[t]=0;}
}
function nearWaterTile(i){var nn=nb4(i);for(var k=0;k<nn.length;k++){if(TER[nn[k]]===WATER)return true;}return false;}
function checkSite(ax,ay,id){
  var o=OBJ[id],sz=sizeOf(id);
  if(ax<0||ay<0||ax+sz[0]>MW||ay+sz[1]>MH)return 'That does not fit on the map.';
  var tiles=footTiles(ax,ay,sz),mn=99,mx=-1,wet=false,k;
  for(k=0;k<tiles.length;k++){
    var i=tiles[k];
    if(TER[i]===WATER)return 'Part of that site is water.';
    if(TER[i]===ROCK)return 'Part of that site is too steep.';
    if(T[i]!==EMPTY)return 'Something is already there. Bulldoze it first.';
    mn=Math.min(mn,EL[i]);mx=Math.max(mx,EL[i]);
    if(nearWaterTile(i))wet=true;
  }
  if(mx-mn>2)return 'The ground is too uneven. Pick flatter land.';
  if(o.shore&&!wet)return 'The '+TOOLS[id].name.toLowerCase()+' must touch the water.';
  return '';
}

/* ================= utilities scan ================= */
function mark(arr,x,y,r){
  for(var dy=-r;dy<=r;dy++){
    var yy=y+dy;if(yy<0||yy>=MH)continue;
    var w=r-Math.abs(dy);
    for(var dx=-w;dx<=w;dx++){var xx=x+dx;if(xx>=0&&xx<MW)arr[yy*MW+xx]=1;}
  }
}
function cover(arr,srcs,lineType,lineRad){
  var seen=new Uint8Array(N),q=[],k,head=0;
  for(k=0;k<srcs.length;k++){
    var s=srcs[k],ci=centerIdx(s),ft=footOfAnchor(s);
    mark(arr,ci%MW,(ci/MW)|0,BYT[T[s]].rad);
    for(var q2=0;q2<ft.length;q2++)q.push(ft[q2]);
  }
  while(head<q.length){
    var c=q[head++],nn=nb4(c);
    for(k=0;k<nn.length;k++){
      var n=nn[k];
      if(T[n]===lineType&&!seen[n]){seen[n]=1;q.push(n);mark(arr,n%MW,(n/MW)|0,lineRad);}
    }
  }
}
function mwEff(t,i){
  var m=BYT[t].mw;
  if(t===SOLAR)m*=(S&&S.tech.solar?1.5:1)*(S?S.sunF:1);
  else if(t===WIND)m*=(S?S.windF:1)*(EL[i]>=3?1.3:1)*(SHORE[i]?1.15:1);
  else if(t===HYDRO)m*=(S&&S.drought>0?0.5:1);
  return m;
}
function mwMean(t,i){
  var m=BYT[t].mw;
  if(t===SOLAR)m*=(S&&S.tech.solar?1.5:1);
  else if(t===WIND)m*=(EL[i]>=3?1.3:1)*(SHORE[i]?1.15:1);
  return m;
}
function scan(){
  var g={cnt:new Array(40).fill(0),done:new Array(40).fill(0),resCap:0,jobsC:0,jobsI:0,jobsT:0,jobsB:0,pwDemand:0,wDemand:0,builtRes:0,propVal:0,pCap:0,wCap:0,
    flags:new Uint8Array(N),pc:new Uint8Array(N),wc:new Uint8Array(N),polC:new Uint8Array(N),fireC:new Uint8Array(N),schC:new Uint8Array(N),
    active:new Uint8Array(N),act:{lab:0,school:0,police:0,fire:0,dc:0,bio:0,stadium:0,airport:0,univ:0,conv:0,metro:0,exch:0},
    polCov:0,fireCov:0,schCov:0,parkCov:0,pollution:0};
  var inf=S?(0.85+0.15*Math.min(1,S.sp.infra)):1;
  var pSrc=[],wAll=[],i,t,o,k,volAct=0,volMean=0,nukeMW=0;
  for(i=0;i<N;i++){
    t=T[i];if(!t)continue;o=BYT[t];g.cnt[t]++;
    var constr=!!(o&&o.build&&L[i]>0);
    if(!constr)g.done[t]++;
    if(o&&constr){var szc=o.size||[1,1];g.jobsB+=14*szc[0]*szc[1];}
    else if(o&&o.jobs)g.jobsB+=o.jobs;
    if(o&&o.mw&&!constr){
      pSrc.push(i);var mwv=mwEff(t,i)*inf;g.pCap+=mwv;
      if(t===NUKE)nukeMW+=mwv;
      if(t===SOLAR||t===WIND){volAct+=mwv;volMean+=mwMean(t,i)*inf;}
    }
    if(o&&o.wc&&!constr)wAll.push(i);
  }
  var battCap=g.done[BATT]*8,dev=volMean-volAct;
  if(g.done[BATT]>0&&dev!==0){var off=clamp(dev,-battCap,battCap);g.pCap+=off>0?off:off*0.85;}
  g.nukeShare=g.pCap>0?nukeMW/g.pCap:0;
  cover(g.pc,pSrc,PLINE,4);
  var wSrc=[];
  for(k=0;k<wAll.length;k++){if(g.pc[centerIdx(wAll[k])]){wSrc.push(wAll[k]);g.wCap+=BYT[T[wAll[k]]].wc*inf;}}
  cover(g.wc,wSrc,PIPE,4);
  for(i=0;i<N;i++){
    t=T[i];o=BYT[t];if(!o||!(o.pu||o.wu||o.mw||o.wc))continue;
    var cons=!!(o.build&&L[i]>0);
    if(o.mw){g.active[i]=cons?0:1;continue;}
    var ci=centerIdx(i),pOK=g.pc[ci],wOK=!o.wu||g.wc[ci];
    g.flags[i]=(pOK?2:0)|(g.wc[ci]?4:0);
    if(cons)continue;
    if(o.wc){if(pOK)g.active[i]=1;continue;}
    if(pOK&&wOK){
      g.active[i]=1;g.pwDemand+=o.pu||0;g.wDemand+=o.wu||0;
      if(t===POLICE){g.act.police++;mark(g.polC,ci%MW,(ci/MW)|0,8);}
      else if(t===FIRE){g.act.fire++;mark(g.fireC,ci%MW,(ci/MW)|0,8);}
      else if(t===SCHOOL){g.act.school++;mark(g.schC,ci%MW,(ci/MW)|0,9);}
      else if(t===LAB){g.act.lab++;g.jobsT+=12;}
      else if(t===DC){g.act.dc++;g.jobsT+=70;}
      else if(t===BIO){g.act.bio++;g.jobsT+=40;}
      else if(t===STADIUM){g.act.stadium++;g.jobsT+=20;}
      else if(t===AIRPORT){g.act.airport++;g.jobsT+=40;}
      else if(t===UNIV){g.act.univ++;g.jobsT+=30;}
      else if(t===CONV){g.act.conv++;g.jobsT+=25;}
      else if(t===METRO){g.act.metro++;g.jobsT+=15;}
      else if(t===EXCH){g.act.exch++;g.jobsT+=35;}
    }
  }
  var resBuilt=0,polN=0,fireN=0,schN=0;
  for(i=0;i<N;i++){
    t=T[i];if(t!==RES&&t!==COM&&t!==IND&&t!==PORT)continue;
    var x=i%MW,y=(i/MW)|0,f=0;
    if(t===PORT){
      var pf=footOfAnchor(i),pk,pn,pj;
      for(pk=0;pk<pf.length&&!(f&1);pk++){pn=nb4(pf[pk]);for(pj=0;pj<pn.length;pj++){if(T[pn[pj]]===ROAD){f|=1;break;}}}
      f|=6;g.flags[i]=f;continue;
    }
    if((x>0&&T[i-1]===ROAD)||(x<MW-1&&T[i+1]===ROAD)||(y>0&&T[i-MW]===ROAD)||(y<MH-1&&T[i+MW]===ROAD))f|=1;
    if(g.pc[i])f|=2;if(g.wc[i])f|=4;
    g.flags[i]=f;
    if(t===RES&&L[i]>0){resBuilt++;if(g.polC[i])polN++;if(g.fireC[i])fireN++;if(g.schC[i])schN++;}
    if(L[i]>0&&f===7){
      g.pwDemand+=L[i]*2;g.wDemand+=L[i]*ZUSE[t];
      if(t===RES){g.resCap+=RES_CAP[L[i]];g.builtRes++;g.propVal+=RES_CAP[L[i]]*60*(1+0.1*SHORE[i]+0.05*Math.max(0,EL[i]-2));}
      else if(t===COM)g.jobsC+=COM_JOBS[L[i]];
      else g.jobsI+=IND_JOBS[L[i]];
    }
  }
  g.polCov=resBuilt?polN/resBuilt:0;g.fireCov=resBuilt?fireN/resBuilt:0;g.schCov=resBuilt?schN/resBuilt:0;
  g.parkCov=g.builtRes>0?Math.min(1,g.cnt[PARK]/(g.builtRes/5)):(g.cnt[PARK]>0?1:0);
  g.pollution=g.done[PLANT]*1+g.done[GAS]*0.35;
  g.portsOK=0;
  for(i=0;i<N;i++){if(T[i]===PORT&&(g.flags[i]&1))g.portsOK++;}
  return g;
}

/* ================= economy ================= */
function mult(){return (1+S.pop/4000)*(1+S.shock)*(1+Math.max(0,S.infl-2)*0.015);}
function terrainCost(i){return (TER[i]===FOREST?1.35:1)*(1+0.12*Math.max(0,EL[i]-2));}
function costFor(id,i){
  if(id==='inspect')return 0;if(id==='bull')return 10;
  var c=OBJ[id].cost*mult();
  if(i!==undefined&&i>=0)c*=terrainCost(i);
  return Math.ceil(c);
}
function firmJobsTotal(){
  var j=0;for(var k=0;k<S.firms.length;k++){var f=S.firms[k];if(f.stage==='public'||f.stage==='acquired')j+=f.jobs;}return j;
}
function rdRate(g){
  var labs=g.act.lab,labF=labs===0?0.25:(1+0.4*(labs-1));
  return S.rd.budget/30*labF*(1+0.06*g.act.school)*(S.tech.ai?1.25:1)*(g.act.univ?1.6:1)*(1+0.2*Math.min(4,g.act.dc))*(0.9+0.1*S.sp.edu);
}
function inflTarget(tight,shock,fiscal,stim,rec,rate,qe){
  return 2.0+2.6*Math.max(tight,-0.6)+2.2*shock+0.30*(4.5-rate)+1.0*fiscal+(qe>0?0.35:qe<0?-0.3:0)+(stim?0.6:0)+(rec?-0.8:0);
}
function computeEconomy(){
  var g=scan(),e={g:g},supply=1+S.shock,mort=S.mort,k,tx=S.tax,sp=S.sp,A=g.act,d=g.done;
  var heat=S.heat>0?1.2:1,dry=S.drought>0?0.7:1;
  var pwD=g.pwDemand*heat,pw=pwD>0?Math.min(1,g.pCap/pwD):1;
  var wD=g.wDemand*(S.tech.water?0.7:1),ww=wD>0?Math.min(1,g.wCap*dry/wD):1;
  var ef=pw*(0.6+0.4*ww);
  var firmJobs=firmJobsTotal(),dividends=0;
  for(k=0;k<S.firms.length;k++){var fm=S.firms[k];if(fm.stage==='public')dividends+=fm.stake*fm.val*0.0022*(A.exch?1.1:1);}
  var jobsT=g.jobsT+firmJobs,workforce=S.pop*0.6;
  var jobsRaw=g.jobsC*(0.4+0.6*S.shopFill)+g.jobsI+g.jobsB+jobsT,jobsEff=jobsRaw*ef;
  var fill=jobsEff>0?Math.min(1,workforce/jobsEff):0,employed=Math.min(workforce,jobsEff);
  var unemp=workforce>0?1-employed/workforce:0;
  var empT=jobsEff>0?employed*jobsT*ef/jobsEff:0;
  var produced=g.jobsI*ef*fill*9/(1+(supply-1)*0.8)*(S.tech.auto?1.3:1);

        +0.08*wfFrac+(A.stadium?0.06:0)+(A.metro?0.04:0)-(A.airport?0.03:0)-pol
        -Math.max(0,tx.inc-9)*0.04+Math.max(0,9-tx.inc)*0.01-Math.max(0,tx.sales-8)*0.02-Math.max(0,tx.prop-1.3)*0.1
        -(1-shopFill)*0.3-(1-pw)*0.5-(1-ww)*0.4-unemp*0.6*Math.min(1,workforce/30)*(1-0.3*wfFrac)
        -Math.max(0,S.infl-4)*0.035-Math.max(0,-S.infl)*0.02;
  h+=0.04*g.nukeShare;h=clamp(h,0.15,1.25);

  var jf=workforce>0?clamp(jobsEff/workforce,0.3,1):1;

  var jobsGap=clamp((jobsEff-workforce)/(workforce+20),-1,1),wfGap=clamp((workforce-jobsEff)/(workforce+20),-1,1);
  var occEff=S.pop<30?1:occ;
  var Rdem=clamp(3.5*(occEff-0.72)+0.5*jobsGap+(S.remote>0?0.25:0)+clamp((S.hpi-100)/250,-0.1,0.2)+clamp((S.mkt-100)/600,-0.1,0.15)
        -0.1*(tx.prop-1)+(S.stim>0?0.1:0)+(A.metro?0.08:0)-(S.infl<0?0.15:0),-1,1);
  var Cdem=clamp((S.pop*0.42-g.jobsC)/(S.pop*0.42+10),-1,1)-(S.remote>0?0.2:0)-(S.recession>0?0.2:0)-0.03*(tx.sales-6)-0.02*(tx.corp-8)
        +(A.stadium?0.05:0)+(A.airport?0.08:0);

  var apprTarget=clamp(h*65+(1-unemp*Math.min(1,workforce/30))*25-Math.max(0,tx.inc-11)*2-Math.max(0,tx.sales-9)-Math.max(0,S.infl-5)*2+(A.stadium?3:0)-(S.cash<0?10:0),0,100);
  e.supply=supply;e.mort=mort;e.pw=pw;e.ww=ww;e.workforce=workforce;e.employed=employed;e.unemp=unemp;e.tight=jobsGap;e.mortReal=mort-(S.infl-2);

  e.rev=[['Income tax',incTax],['Sales tax',saleTax],['Property tax',propTax],['Business tax',bizTax],['Exports',exports],['Dividends',dividends],['Tourism',tourism],['Cloud services',cloud]];

  var gapProxy=clamp(4*jobsGap-20*Math.max(0,unemp-0.05),-6,6);
  e.taylor=clamp(2+S.infl+0.5*(S.infl-2)+0.5*gapProxy,0,15);

}

/* ================= inflation outlook ================= */
function forecastInflation(n,rate){
  var infl=S.infl,shock=S.shock,e=E||{tight:0,costs:0,revenue:1};
  var fiscal=clamp((e.costs-e.revenue)/(e.revenue+500),-0.3,0.6),mean=[],sd=[];
  if(rate===undefined)rate=S.rate;
  for(var t=1;t<=n;t++){
    shock*=0.93;
    var tg=inflTarget(e.tight||0,shock*(1-0.4*(e.g?e.g.nukeShare:0)),fiscal,t<=S.stim,t<=S.recession,rate,S.qe);
    infl+=(tg-infl)*0.10;mean.push(infl);sd.push(0.16*Math.sqrt(t)+0.02*t);
  }
  return {mean:mean,sd:sd};
}

function setRate(r){

  var diff=r-S.rate;S.rate=r;
  addNews('You '+(diff>0?'raised':'cut')+' the policy rate by '+Math.abs(diff).toFixed(2)+' points to '+r.toFixed(2)+'%.',diff>0?'warn':'info');
  toast('Policy rate set to '+r.toFixed(2)+'%');

function setQE(v){

function sendStimulus(per){
  var c=Math.round(S.pop*per);

  if(S.cash<c){toast('Not enough cash. Checks cost '+money(c)+'.');return;}
  S.cash-=c;S.stim=4;S.approval=Math.min(100,S.approval+Math.min(6,per/8));

function bailout(){
  if(S.crash<=0&&S.crunch<=0&&S.panic<=0){toast('There is no crisis to fight right now.');return;}
  var c=Math.max(2000,Math.round(S.pop*30));
  if(S.cash<c){toast('Not enough cash. A bailout costs '+money(c)+'.');return;}
  S.cash-=c;S.panic=0;S.crunch=Math.min(S.crunch,3);S.crash=Math.min(S.crash,4);S.mktBubble+=0.8;S.infl+=0.3;

function setDeposit(on){

}
function stepMacro(e){
  var prev=S.prevRate;
  S.shock*=0.93;if(S.shock<0.01)S.shock=0;
  S.bubble*=0.9;if(S.bubble<0.02)S.bubble=0;
  if(S.recession>0)S.recession--;if(S.remote>0)S.remote--;if(S.heat>0)S.heat--;if(S.drought>0)S.drought--;if(S.stim>0)S.stim--;
  S.sunF=clamp(1+0.35*Math.sin((S.month-3)*Math.PI/6)+gauss()*0.25,0.4,1.4);
  S.windF=clamp(1+gauss()*0.8,0.15,1.8);
  /* inflation reacts to labour tightness, supply shocks, policy stance and deficits */
  var fiscal=clamp((e.costs-e.revenue)/(e.revenue+500),-0.3,0.6);
  var tg=inflTarget(e.tight,S.shock*(1-0.4*e.g.nukeShare),fiscal,S.stim>0,S.recession>0,S.rate,S.qe);
  S.infl=clamp(S.infl+(tg-S.infl)*0.10+gauss()*0.12,-3,25);
  /* mortgage rates follow the policy rate with a lag and a spread */
  var mt=S.rate+1.2+Math.max(0,S.infl-6)*0.15+(S.qe>0?-0.7:S.qe<0?0.6:0)+(e.unemp>0.2?0.4:0)+(S.crunch>0?1.5:0);
  S.mort+=(mt-S.mort)*0.25;
  if(S.qe>0)S.bubble+=0.05;
  if(S.dins)S.mktBubble+=0.03;
  var realMort=S.mort-(S.infl-2);
  var d=(e.g.resCap>0&&S.pop>=30?(e.occ-0.82)*6:0)-(realMort-5.5)*0.35+S.hpiMom*0.5+S.bubble
        -Math.max(0,S.hpi-150)*0.02+Math.max(0,85-S.hpi)*0.04-(S.tax.prop-1)*0.15+(S.qe>0?0.15:S.qe<0?-0.1:0)+(Math.random()-0.5)*0.8;
  d=clamp(d,-5,5);S.hpiMom=d;S.hpi=clamp(S.hpi*(1+d/100),40,260);
  var md=0.5-(S.rate-4.5)*0.12-(S.rate-prev)*6+S.mktBubble+(S.recession>0?-1.2:0)-Math.max(0,S.infl-5)*0.15
        +(S.qe>0?0.4:S.qe<0?-0.3:0)-(S.tax.corp-8)*0.03+gauss()*3.2;
  md=clamp(md,-22,14);

  else{
    var hz=0.003+0.010*Math.max(0,(S.mkt-150)/100)+0.012*S.mktBubble+(S.rate-prev>0.5?0.03:0)+(S.infl>6?0.01:0);
    if(S.crash===0&&Math.random()<hz)startCrash();
  }
  if(S.crash>0)S.crash--;if(S.crunch>0)S.crunch--;
  S.mktD=md;S.mkt=clamp(S.mkt*(1+md/100),20,600);S.mktBubble*=0.88;if(S.mktBubble<0.05)S.mktBubble=0;

function exchOn(){return !!(E&&E.g&&E.g.act.exch);}

function stepBatteries(g){

  for(var i=0;i<N;i++){

function mktSentiment(){

/* ================= R&D, startups, IPOs, M&A ================= */
function firmName(sector){
  for(var tries=0;tries<20;tries++){
    var n=pick(NAME_A)+pick(NAME_B),clash=false;
    for(var k=0;k<S.firms.length;k++){if(S.firms[k].name===n)clash=true;}
    if(!clash)return n;
  }
  return pick(NAME_A)+pick(NAME_B)+' '+S.fid;
}
function spawnFirm(sector,why){
  var val=Math.round((9000+rnd(7000))/100)*100;
  var f={id:S.fid++,name:firmName(sector),sector:sector,stage:'seed',val:val,stake:0,runway:16+rnd(8),
    burn:Math.round(val*0.012/10)*10,age:0,jobs:0,acq:0};
  S.firms.push(f);
  addNews(why==='lab'?f.name+' ('+sector+') spins out of a local lab and is looking for seed money.':f.name+' ('+sector+') launches a startup in your city.','info');
  return f;
}
function nextTech(){
  for(var i=0;i<TECH_ORDER.length;i++){
    var id=TECH_ORDER[i],t=TECHS[id];
    if(!S.tech[id]&&(!t.req||S.tech[t.req])&&(!t.req2||S.tech[t.req2]))return id;
  }
  return null;
}
function stepResearch(e){
  var id=S.rd.active;
  if(!id){S.rd.active=nextTech();return;}
  if(id==='fusion'){
    if(!(e.g.act.lab>=3&&e.g.act.univ>=1)){if(S.month%12===0)addNews('Fusion research is stalled. It needs at least 3 working labs and a university.','warn');return;}
    if(Math.random()<0.04){S.rd.pts*=0.85;addNews('Plasma instability forces the fusion team to redo months of work.','bad');}
  }
  S.rd.pts+=rdRate(e.g);
  if(S.rd.pts>=TECHS[id].cost){
    S.tech[id]=true;S.rd.pts=0;S.rd.active=nextTech();
    addNews('Breakthrough: '+TECHS[id].name+' is ready. '+TECHS[id].desc,'good');
    toast(TECHS[id].name+' researched');
    spawnFirm(TECHS[id].sector,'tech');
  }
}
function ipo(f){
  f.stage='public';f.val*=1.25;f.jobs=18+rnd(14);
  var proceeds=f.stake*0.35*f.val*0.96,fees=f.val*0.01*(E&&E.g&&E.g.act.exch?2.5:1);
  S.cash+=proceeds+fees;f.stake*=0.65;
  addNews(f.name+' goes public at a '+money(f.val)+' valuation. '+(proceeds>0?'Your stake raised '+money(proceeds)+'. ':'')+'Listing fees added '+money(fees)+'.','good');
  toast(f.name+' IPO!');
}
function killFirm(f,msg){
  f.stage='dead';f.val=0;f.jobs=0;
  addNews(msg,'bad');
}
function stepFirms(){
  var sent=mktSentiment(),k,f,seeds=0,exch=!!(E&&E.g&&E.g.act.exch);
  for(k=0;k<S.firms.length;k++){
    f=S.firms[k];
    if(f.stage==='seed'){
      seeds++;f.age++;f.runway--;
      var g=clamp(1.5*S.mktD/100,-0.3,0.3)+0.045-Math.max(0,S.tax.corp-8)*0.002+(Math.random()-0.5)*0.16;
      if(Math.random()<0.018)g-=0.35;
      f.val=Math.max(500,f.val*(1+g));
      if(f.runway<=0){
        if(S.mkt>=95&&Math.random()<0.55){f.runway+=10;f.stake*=0.85;f.val*=1.1;addNews(f.name+' raises a bridge round. Existing investors are diluted.','info');}
        else killFirm(f,f.name+' runs out of cash and shuts down.'+(f.stake>0?' Your stake is worthless.':''));
      }else if(f.val<=1200&&Math.random()<0.5)killFirm(f,f.name+' collapses after a failed product launch.');
      else if(f.age>=12&&f.val>=70000&&sent>-0.01&&Math.random()<0.2*(exch?1.5:1))ipo(f);
    }else if(f.stage==='public'){
      var gp=clamp(S.mktD/100,-0.25,0.25)+0.004+(Math.random()-0.5)*0.06;
      f.val=Math.max(3000,f.val*(1+gp));
      f.jobs=clamp(16+Math.round(f.val/15000),16,140);
      var hasOffer=false;for(var j=0;j<S.offers.length;j++){if(S.offers[j].fid===f.id)hasOffer=true;}
      if(!hasOffer&&S.month>12&&Math.random()<0.012*(S.mkt>110?1.5:1)){
        var prem=0.2+Math.random()*0.4,buyer=pick(BUYERS);
        S.offers.push({id:S.fid++,fid:f.id,buyer:buyer,prem:prem,expires:S.month+3});
        addNews(buyer+' bids '+Math.round(prem*100)+'% above market for '+f.name+'. Check Corp > Deals.','warn');
      }
    }else if(f.stage==='acquired'){
      f.acq++;if(f.acq===12)f.jobs=Math.round(f.jobs*0.6);
      if(f.acq===30){f.jobs=Math.round(f.jobs*0.67);}
    }
  }
  var labs=E&&E.g?E.g.act.lab:0;
  if(labs>0&&seeds<3&&Math.random()<Math.min(0.08,0.03*labs)){
    var sec=S.tech&&Object.keys(S.tech).length&&Math.random()<0.7?TECHS[pick(Object.keys(S.tech))].sector:pick(['Software','Materials','Mobility','Health']);
    spawnFirm(sec,'lab');
  }
  for(var q=S.offers.length-1;q>=0;q--){
    if(S.offers[q].expires<=S.month){addNews('The bid for '+firmById(S.offers[q].fid).name+' was withdrawn.','info');S.offers.splice(q,1);}
  }
}
function firmById(id){for(var i=0;i<S.firms.length;i++){if(S.firms[i].id===id)return S.firms[i];}return {name:'a firm',val:0,stake:0};}
function invest(id,amt){
  var f=firmById(id);if(f.stage!=='seed')return;
  if(S.cash<amt){toast('Not enough cash.');return;}
  S.cash-=amt;
  var post=f.val+amt;f.stake=(f.stake*f.val+amt)/post;f.val=post;f.runway+=Math.max(1,Math.round(amt/f.burn*0.9));
  toast('Invested '+money(amt)+' in '+f.name);
}
function buyShares(id,frac){
  var f=firmById(id);if(f.stage!=='public')return;
  frac=Math.min(frac,1-f.stake);if(frac<=0.0001){toast('You already own all of it.');return;}
  var c=frac*f.val*1.01;
  if(S.cash<c){toast('Not enough cash. You need '+money(c)+'.');return;}
  S.cash-=c;f.stake+=frac;
}
function sellShares(id,frac){
  var f=firmById(id);if(f.stage!=='public'&&f.stage!=='seed')return;
  frac=Math.min(frac,f.stake);if(frac<=0.0001)return;
  S.cash+=frac*f.val*0.99;f.stake-=frac;
}
function acceptOffer(oid){
  for(var i=0;i<S.offers.length;i++){
    var o=S.offers[i];if(o.id!==oid)continue;
    var f=firmById(o.fid),price=f.val*(1+o.prem),got=f.stake*price*0.98+price*0.012;
    S.cash+=got;f.stage='acquired';f.val=price;f.stake=0;f.acq=0;
    addNews(o.buyer+' completes its takeover of '+f.name+' for '+money(price)+'. The city collected '+money(got)+'. Expect headquarters job cuts.','warn');
    S.offers.splice(i,1);return;
  }
}
function rejectOffer(oid){
  for(var i=0;i<S.offers.length;i++){if(S.offers[i].id===oid){addNews('You turned down the bid for '+firmById(S.offers[i].fid).name+'.','info');S.offers.splice(i,1);return;}}
}
function buyout(id){
  var f=firmById(id);if(f.stage!=='public')return;
  var c=f.val*1.2*(1-f.stake);
  if(S.cash<c){toast('Not enough cash. A buyout costs '+money(c)+'.');return;}
  S.cash-=c;f.stake=1;toast('The city now owns '+f.name+' outright');
}
function mergePartner(f){
  var best=null;
  for(var i=0;i<S.firms.length;i++){var o=S.firms[i];if(o.id!==f.id&&o.stage==='public'&&(!best||o.val>best.val))best=o;}
  return best;
}
function mergeFirms(id){
  var a=firmById(id),b=mergePartner(a);if(!b||a.stage!=='public')return;
  var val=(a.val+b.val)*1.15,stake=(a.stake*a.val+b.stake*b.val)/(a.val+b.val);
  var fee=val*0.01;S.cash+=fee;
  var m={id:S.fid++,name:a.name.split(' ')[0]+'-'+b.name.split(' ')[0],sector:a.sector,stage:'public',val:val,stake:stake,runway:0,burn:0,age:0,jobs:Math.round((a.jobs+b.jobs)*0.75),acq:0};
  a.stage='dead';b.stage='dead';a.jobs=0;b.jobs=0;a.val=0;b.val=0;
  S.firms.push(m);
  addNews(a.name+' and '+b.name+' merge into '+m.name+' at a '+money(val)+' valuation. Synergies cut headcount 25%. Deal taxes: '+money(fee)+'.','info');
}

/* ================= disasters ================= */
function flammable(i){return (T[i]!==EMPTY&&T[i]!==ROAD&&T[i]!==PIPE)||TER[i]===FOREST;}
function igniteAt(i,ttl){if(F[i]===0)F[i]=ttl||4;}
function damageTile(i,n){
  var t=T[i];
  if(t===RES||t===COM||t===IND)L[i]=Math.max(0,L[i]-n);
}
function relief(){
  if(S.approval>45){var c=Math.round(2500+S.pop*2.5);S.cash+=c;addNews('Disaster relief: federal aid sends '+money(c)+' to the treasury.','good');}
}
function startFire(i){
  if(i===undefined){
    var c=[],k;for(k=0;k<N;k++){if(flammable(k)&&(T[k]!==EMPTY||TER[k]===FOREST))c.push(k);}
    if(!c.length)return;i=pick(c);
  }
  igniteAt(i,4);dirty=true;
  addNews('A fire has broken out and is spreading. Fire stations stop it from jumping tiles.','bad');
}
function quake(){
  var c=[],k,i;for(k=0;k<N;k++){if(T[k]!==EMPTY)c.push(k);}
  if(!c.length)c.push(rnd(N));
  var ep=pick(c),ex=ep%MW,ey=(ep/MW)|0,hit=0;
  for(i=0;i<N;i++){
    var d=Math.abs(i%MW-ex)+Math.abs(((i/MW)|0)-ey);
    if(d>9||T[i]===EMPTY)continue;
    var p=0.7*(1-d/10);
    if(Math.random()>p)continue;
    hit++;
    if(T[i]===ROAD&&Math.random()<0.3){T[i]=EMPTY;B[i]=0;}
    else if(T[i]===RES||T[i]===COM||T[i]===IND)L[i]=Math.max(0,L[i]-1-(Math.random()<0.4?1:0));
    else if(T[i]!==ROAD&&Math.random()<0.25)clearAt(i);
  }
  for(k=0;k<2+rnd(3);k++){
    var fx=clamp(ex+rnd(9)-4,0,MW-1),fy=clamp(ey+rnd(9)-4,0,MH-1),fi=fy*MW+fx;
    if(flammable(fi))igniteAt(fi,4);
  }
  shakeUntil=performance.now()+1500;dirty=true;
  addNews('Earthquake! Buildings are damaged and fires have started. '+hit+' tiles were hit.','bad');relief();
}
function flood(){
  var n=0,i;
  for(i=0;i<N;i++){
    if(TER[i]===WATER||EL[i]>2)continue;
    var x=i%MW,y=(i/MW)|0,near=false;
    for(var dy=-2;dy<=2&&!near;dy++)for(var dx=-2;dx<=2;dx++){
      var xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=MW||yy>=MH)continue;
      if(TER[yy*MW+xx]===WATER){near=true;break;}
    }
    if(!near||Math.random()>0.7)continue;
    FLD[i]=2+rnd(2);n++;
    if(Math.random()<0.6)damageTile(i,1);
  }
  dirty=true;addNews('Flooding along the water. '+n+' low-lying tiles are under water and homes are damaged.','bad');relief();
}
function tornado(){
  var side=rnd(4),x,y,dx,dy;
  if(side===0){x=0;y=rnd(MH);dx=1;dy=rnd(3)-1;}
  else if(side===1){x=MW-1;y=rnd(MH);dx=-1;dy=rnd(3)-1;}
  else if(side===2){x=rnd(MW);y=0;dx=rnd(3)-1;dy=1;}
  else{x=rnd(MW);y=MH-1;dx=rnd(3)-1;dy=-1;}
  S.tor={x:x,y:y,dx:dx,dy:dy,steps:16};dirty=true;
  addNews('A tornado touched down and is tearing across the map.','bad');
}
function stepDisasters(g){
  var i,k,list=[];
  for(i=0;i<N;i++){if(F[i]>0)list.push(i);if(FLD[i]>0)FLD[i]--;}
  for(k=0;k<list.length;k++){
    i=list[k];var covered=g.fireC[i];
    if(covered&&Math.random()<(T[i]===BATT?0.12:0.5)){F[i]=0;damageTile(i,1);continue;}
    F[i]--;
    var nn=nb4(i);
    for(var q=0;q<nn.length;q++){
      var n=nn[q];
      if(F[n]===0&&flammable(n)&&Math.random()<(g.fireC[n]?0.08:(T[i]===BATT?0.55:0.3)))F[n]=3+rnd(2);
    }
    if(F[i]===0){
      if(T[i]===EMPTY&&TER[i]===FOREST)TER[i]=GRASS;
      else if(T[i]===RES||T[i]===COM||T[i]===IND)L[i]=0;
      else if(T[i]!==EMPTY)clearAt(i);
    }
  }
  if(S.tor){
    var tr=S.tor;
    for(var s=0;s<2;s++){
      tr.x+=tr.dx;tr.y+=tr.dy;if(Math.random()<0.4)tr.y+=rnd(3)-1;if(Math.random()<0.2)tr.x+=rnd(3)-1;
      if(tr.x<0||tr.y<0||tr.x>=MW||tr.y>=MH){tr.steps=0;break;}
      var ti=tr.y*MW+tr.x,tn=[ti].concat(nb4(ti));
      for(k=0;k<tn.length;k++){
        var t2=tn[k];
        if(T[t2]===RES||T[t2]===COM||T[t2]===IND){if(Math.random()<0.7)L[t2]=0;else L[t2]=Math.max(0,L[t2]-1);}
        else if(T[t2]!==EMPTY&&T[t2]!==ROAD&&Math.random()<0.6)clearAt(t2);
        if(TER[t2]===FOREST&&Math.random()<0.5)TER[t2]=GRASS;
      }
      tr.steps--;
    }
    if(tr.steps<=0){S.tor=null;addNews('The tornado has dissipated.','info');relief();}
    dirty=true;
  }
}
function triggerDisaster(kind){
  if(!S||S.over)return;
  if(kind==='fire')startFire();else if(kind==='quake')quake();else if(kind==='flood')flood();else if(kind==='tornado')tornado();
  ui();
}
function animOn(){
  if(S&&S.tor)return true;
  if(performance.now()<shakeUntil)return true;
  for(var i=0;i<N;i++){if(F[i]>0||FLD[i]>0)return true;}
  return false;
}

function fireEvent(){
  var pool=EVENTS.filter(function(ev){return S.disasters!==false||!ev.dis;}),tot=0,i;
  for(i=0;i<pool.length;i++)tot+=pool[i].w;
  var r=Math.random()*tot,ev=pool[0];
  for(i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){ev=pool[i];break;}}
  ev.fn();if(ev.text)addNews(ev.text,ev.tone);S.lastEvent=S.month;
}

/* ================= development ================= */
function develop(e){
  var g=e.g,f=g.flags,kinds=[[RES,e.Rdem],[COM,e.Cdem],[IND,e.Idem]],i;
  for(var q=0;q<3;q++){
    var type=kinds[q][0],dem=kinds[q][1],elig=[],built=[];
    for(i=0;i<N;i++){
      if(T[i]!==type)continue;
      if(L[i]>0)built.push(i);
      if(f[i]===7&&L[i]<3&&F[i]===0&&FLD[i]===0){
        if(type===RES&&L[i]===2&&g.parkCov<0.3)continue;
        elig.push(i);
      }
    }
    if(dem>0.03&&elig.length){
      var n=Math.round(dem*e.appetite*(1+elig.length*0.14)*(0.5+Math.random()*1.5));
      if(n<1&&dem>0.12&&Math.random()<Math.min(1,dem*e.appetite*1.5))n=1;
      n=Math.min(n,elig.length);
      for(var k=0;k<n;k++){
        var fresh=elig.filter(function(ix){return L[ix]===0;});
        var pool=(fresh.length&&Math.random()<0.75)?fresh:elig;
        var ti=pool[rnd(pool.length)];
        L[ti]=Math.min(3,L[ti]+1);elig.splice(elig.indexOf(ti),1);
      }
    }
    if(S.pop>=30&&built.length&&dem<-0.45&&Math.random()<0.3)L[built[rnd(built.length)]]--;
  }
  for(i=0;i<N;i++){
    var t=T[i];
    if((t===RES||t===COM||t===IND)&&L[i]>0&&f[i]!==7&&Math.random()<0.04)L[i]--;
  }
}

/* ================= monthly tick ================= */
function tick(){
  var e=computeEconomy();
  stepMacro(e);
  S.cash+=e.net;S.shopFill=e.shopFill;
  var delta=(e.targetPop-S.pop)*0.15;
  if(Math.abs(delta)<1&&Math.abs(e.targetPop-S.pop)>=1)delta=delta<0?-1:1;
  S.pop=Math.max(0,Math.round(S.pop+delta));
  if(e.g.resCap===0&&S.pop<3)S.pop=0;
  S.approval+=(e.apprTarget-S.approval)*0.2;
  stepResearch(e);E=e;stepConstruction();stepBatteries(e.g);stepFirms();
  stepDisasters(e.g);
  develop(e);
  S.month++;
  if(S.month>=10&&S.month-S.lastEvent>5&&Math.random()<0.09)fireEvent();
  var hh=S.hist;
  hh.rate.push(S.rate);hh.infl.push(S.infl);hh.mort.push(S.mort);hh.hpi.push(S.hpi);hh.supply.push(1+S.shock);hh.pop.push(S.pop);hh.mkt.push(S.mkt);
  if(hh.rate.length>180){for(var key in hh){hh[key].shift();}}
  if(S.pop>S.peak)S.peak=S.pop;
  var r=rankIdx(S.peak);
  if(r>S.rank){S.rank=r;toast('Your city is now a '+RANKS[r][1]);addNews('Census: your city has grown into a '+RANKS[r][1]+'.','good');}
  if(!S.won&&S.peak>=3500){S.won=true;addNews('Metropolis! Your skyline is the envy of the region. Keep it thriving.','good');}
  if(S.approval<25)S.lowApproval++;else S.lowApproval=0;
  if(S.cash<-4000)S.lowCash++;else S.lowCash=0;
  if(S.cash<0&&S.cash>=-4000&&S.month%3===0)toast('Overdrawn. Borrow, raise taxes or cut costs.');
  if(S.lowApproval>=8)return endGame('recall');
  if(S.lowCash>=2)return endGame('bankrupt');
  if(S.month%6===0)save();
  dirty=true;mmDirty=true;ui();
}
function endGame(kind){
  S.over=kind;speed=0;
  var best=parseInt(fetchStore(BEST_KEY)||'0',10)||0;
  if(S.peak>best)store(BEST_KEY,String(S.peak));
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  showSplash('over');ui();
}

/* ================= building ================= */
function spend(c){
  if(S.cash<c){toast('Not enough cash. You need '+money(c)+'.');return false;}
  S.cash-=c;return true;
}
function techLocked(id){var o=OBJ[id];return o&&o.tech&&!S.tech[o.tech];}
function nearWater(i){var nn=nb4(i);for(var k=0;k<nn.length;k++){if(TER[nn[k]]===WATER)return true;}return false;}
function buildable(i){return TER[i]!==WATER&&TER[i]!==ROCK&&T[i]===EMPTY;}
function place(i,id,t){
  if(!spend(costFor(id,i)))return false;
  T[i]=t;L[i]=(OBJ[id]&&OBJ[id].build)||0;B[i]=0;if(TER[i]===FOREST)TER[i]=GRASS;return true;
}
function placeBuilding(ax,ay,id){
  var o=OBJ[id],sz=sizeOf(id),tiles=footTiles(ax,ay,sz),a=ay*MW+ax,k,sum=0;
  if(!spend(costFor(id,a)))return false;
  for(k=0;k<tiles.length;k++)sum+=EL[tiles[k]];
  var lvl=Math.round(sum/tiles.length);
  for(k=0;k<tiles.length;k++){var t=tiles[k];T[t]=SUB;PAR[t]=a;EL[t]=lvl;L[t]=0;B[t]=0;if(TER[t]===FOREST)TER[t]=GRASS;}
  T[a]=o.t;L[a]=o.build||0;PAR[a]=a;
  return true;
}
var pending=null;
var lastToastKey='';
function say(k,msg){if(k!==lastToastKey){lastToastKey=k;toast(msg);}}
function act(i,first){
  var t=T[i],ok=false,o=OBJ[tool];
  if(tool!=='inspect'&&pending&&pending.tool!==tool)pending=null;
  if(tool==='inspect'){pending=null;inspectIdx=rootOf(i);showTile(i);dirty=true;return;}
  if(tool==='bull'){
    if(T[i]!==EMPTY){
      var rt=rootOf(i),ro=BYT[T[rt]],ar=(ro&&ro.size)?ro.size[0]*ro.size[1]:1;
      if(spend(10*ar)){if(T[i]===WATER)T[i]=EMPTY;clearAt(i);ok=true;}
    }
    else if(TER[i]===FOREST){if(spend(10)){TER[i]=GRASS;ok=true;}}
    if(ok){dirty=true;mmDirty=true;ui();}
    return;
  }
  if(!o)return;
  if(techLocked(tool)){if(first)toast('Research '+TECHS[o.tech].name+' to unlock this.');return;}
  if(o.req&&S.peak<o.req){if(first)toast('Capital project unlocks at '+o.req.toLocaleString('en-US')+' people.');return;}
  if(tool==='road'){
    if(TER[i]===ROCK){if(first)toast('Too steep. Roads cannot cross mountains.');return;}
    if(TER[i]===WATER){if(T[i]===EMPTY&&spend(Math.ceil(costFor('road')*4))){T[i]=ROAD;B[i]=1;ok=true;}}
    else if(T[i]===EMPTY)ok=place(i,'road',ROAD);
  }else if(tool==='res'||tool==='com'||tool==='ind'){
    var zt=o.t;
    if(TER[i]===WATER||TER[i]===ROCK){if(first)toast(TER[i]===WATER?'You cannot zone water.':'Too steep to build on.');return;}
    if(T[i]===EMPTY)ok=place(i,tool,zt);
    else if((t===RES||t===COM||t===IND)&&L[i]===0&&t!==zt){if(spend(costFor(tool,i))){T[i]=zt;ok=true;}}
  }else if(sizeOf(tool)[0]*sizeOf(tool)[1]>1){
    if(!first)return;
    var sz=sizeOf(tool),anc=anchorFor(i,sz),ax=anc[0],ay=anc[1],err=checkSite(ax,ay,tool),key=ay*MW+ax;
    if(err){pending=null;toast(err);dirty=true;return;}
    if(!pending||pending.tool!==tool||pending.a!==key){
      pending={tool:tool,a:key};dirty=true;
      toast('Tap the same spot again to build for '+money(costFor(tool,key))+'.');return;
    }
    pending=null;ok=placeBuilding(ax,ay,tool);
  }else{
    if(!first&&!(tool==='pline'||tool==='pipe'))return;
    if(TER[i]===WATER||TER[i]===ROCK){if(first)toast(TER[i]===WATER?'That is water.':'Too steep to build on.');return;}
    if(T[i]!==EMPTY){if(first)toast('That tile is taken. Bulldoze it first.');return;}
    if(o.shore&&!nearWater(i)){if(first)toast('The '+TOOLS[tool].name.toLowerCase()+' must touch the water.');return;}
    ok=place(i,tool,o.t);
  }
  if(ok){dirty=true;mmDirty=true;ui();}
}
var inspectIdx=-1;
function showTile(i){
  i=rootOf(i);
  var t=T[i],f=scan().flags[i],s='',nm={};
  nm[RES]='Homes';nm[COM]='Shops';nm[IND]='Factory';
  var ter=TER[i]===WATER?'Water':TER[i]===FOREST?'Forest':TER[i]===ROCK?'Mountain':'Grass';
  var base=ter+', elevation '+EL[i]+'. ';
  if(t===EMPTY){s=base+(TER[i]===FOREST?'Costs 35% more to build on.':'')+(TER[i]===ROCK?'Too steep to build.':'');}
  else if(t===ROAD)s=B[i]?'Bridge over water.':'Road. '+base;
  else if(t===RES||t===COM||t===IND){
    var lv=L[i];
    if(lv===0)s=nm[t]+' zone, waiting for a builder.';
    else if(t===RES)s='Homes, level '+lv+': houses '+RES_CAP[lv]+' people.';
    else if(t===COM)s='Shops, level '+lv+': '+COM_JOBS[lv]+' jobs.';
    else s='Factory, level '+lv+': '+IND_JOBS[lv]+' jobs.';
    if(!(f&1))s+=' Needs a road beside it.';
    if(!(f&2))s+=' No power.';
    if(!(f&4))s+=' No water.';
  }else{
    var o=BYT[t];s=TOOLS[o.id].name+'. '+TOOLS[o.id].desc;
    if(o.build&&L[i]>0)s='Under construction: '+L[i]+' more months. '+s;
    if(o.pu&&!(f&2))s+=' Not powered.';
    if(o.wu&&!(f&4))s+=' No water.';
  }
  $('info').textContent=s;
}

/* ================= new game / save ================= */

  T=new Array(N).fill(EMPTY);L=new Array(N).fill(0);B=new Array(N).fill(0);F=new Uint8Array(N);FLD=new Uint8Array(N);PAR=new Int32Array(N).fill(-1);pending=null;

    for(var i=0;i<N;i++){SHORE[i]=0;if(TER[i]===WATER)continue;var nn=nb4(i);for(var k=0;k<nn.length;k++){if(TER[nn[k]]===WATER)SHORE[i]=1;}}
    tool='inspect';group='zones';speed=1;inspectIdx=-1;

var cam={wx:20,wy:20,z:0.62,rot:0},VW=360,VH=420,ctx=null,hoverIdx=-1;

function view(){
  var z=cam.z,tw=TWb*z,th=THb*z,es=ESb*z,bu=BUb*z,c=rotUV(cam.wx,cam.wy,cam.rot);
  return {z:z,tw:tw,th:th,es:es,bu:bu,ox:VW/2-(c[0]-c[1])*tw/2,oy:VH/2-(c[0]+c[1])*th/2+2*es};
}
function clampCam(){cam.wx=clamp(cam.wx,0,MW);cam.wy=clamp(cam.wy,0,MH);cam.z=clamp(cam.z,0.3,1.7);}
function panBy(dx,dy){
  var v=view(),du=dx/v.tw+dy/v.th,dv=dy/v.th-dx/v.tw,c=rotUV(cam.wx,cam.wy,cam.rot);
  var w=rotInvUV(c[0]-du,c[1]-dv,cam.rot);cam.wx=w[0];cam.wy=w[1];clampCam();dirty=true;
}
function zoomAt(f,sx,sy){
  var v=view(),nz=clamp(cam.z*f,0.3,1.7);

  var a=(sx-v.ox)*2/v.tw,b=(sy-v.oy+v.es*2)*2/v.th,ru=(a+b)/2,rv=(b-a)/2;
  cam.z=nz;
  var v2=view(),X=v2.ox+(ru-rv)*v2.tw/2,Y=v2.oy+(ru+rv)*v2.th/2-2*v2.es;

var shadeCache={};

  var k=hex+f;if(shadeCache[k])return shadeCache[k];

  if(f<1){r*=f;g*=f;b*=f;}else{var t=f-1;r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t;}
  return shadeCache[k]='rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function tri(hex){return {t:shade(hex,1.14),l:hex,r:shade(hex,0.72)};}

/* ================= picking ================= */
function pickTile(px,py){
  var v=view(),a=(px-v.ox)*2/v.tw,b=(py-v.oy+v.es*2)*2/v.th,u=(a+b)/2,w=(b-a)/2,cx=Math.floor(u),cy=Math.floor(w),best=-1,bd=-1,r=cam.rot;
  for(var dy=-5;dy<=5;dy++)for(var dx=-5;dx<=5;dx++){
    var rx=cx+dx,ry=cy+dy;if(rx<0||ry<0||rx>=MW||ry>=MH)continue;
    var wi=invTile(rx,ry,r),i=wi[1]*MW+wi[0],e=EL[i];
    var X0=v.ox+(rx-ry)*v.tw/2,Y0=v.oy+(rx+ry)*v.th/2-e*v.es,hgt=bHeight(i),hit=false;
    for(var s=0;s<=hgt&&!hit;s+=0.5){
      var ddx=Math.abs(px-X0)/(v.tw/2),ddy=Math.abs(py-(Y0+v.th/2-s*v.bu))/(v.th/2);
      if(ddx+ddy<=1)hit=true;
    }
    if(hit&&rx+ry>bd){bd=rx+ry;best=i;}
  }
  return best;
}

/* ================= minimap ================= */
function drawMini(){
  var c=$('mm');if(!c||!S)return;var m=c.getContext('2d'),sz=c.width/MW,i;
  for(i=0;i<N;i++){
    var x=i%MW,y=(i/MW)|0,col,t=T[i];
    if(t===ROAD)col='#4b5560';else if(t===RES)col='#38a169';else if(t===COM)col='#3b82d6';else if(t===IND)col='#d9a520';
    else if(t!==EMPTY)col='#f4f4f4';
    else if(TER[i]===WATER)col='#4f9fca';else if(TER[i]===ROCK)col='#8a8d93';else if(TER[i]===FOREST)col='#4a8a52';else col='#9cc784';
    m.fillStyle=col;m.fillRect(x*sz,y*sz,sz,sz);
  }
  m.strokeStyle='#ffffff';m.lineWidth=1.5;
  var cx=cam.wx*sz,cy=cam.wy*sz,half=Math.max(3,(VW/(TWb*cam.z))*sz*0.35);

function trend(arr,upBad){
  if(!arr||arr.length<7)return '';
  var a=arr[arr.length-1],b=arr[arr.length-7];
  if(Math.abs(a-b)<Math.abs(b)*0.01)return '';
  var up=a>b,bad=upBad?up:!up;
  return '<span class="tr '+(upBad===null?'':(bad?'neg':'pos'))+'">'+(up?'\u25B2':'\u25BC')+'</span>';
}
function chip(label,val,tr,cls){
  return '<div class="chip"><span class="lab">'+label+'</span><span class="val '+(cls||'')+'">'+val+tr+'</span></div>';
}
function pct(v){return Math.round(v*100)+'%';}

  ec+=chip('Stocks',String(Math.round(S.mkt)),trend(hh.mkt,false),(S.mktD<-5||S.crash>0)?'neg':'');
  ec+=chip('Supply cost','\u00D7'+(1+S.shock).toFixed(2),trend(hh.supply,true),S.shock>0.25?'neg':'');

function drawPolicyChart(){
  var cv=$('chM');if(!cv)return;
  var s=chartSetup(cv),c=s.c,w=s.w,h=s.h,muted=cssVar('--muted','#888'),line=cssVar('--line','#ccc'),acc=cssVar('--accent','#1f6f8b'),warn=cssVar('--warn','#a96f12'),bad=cssVar('--bad','#c2452d');
  var hr=S.hist.rate.slice(-30),hi=S.hist.infl.slice(-30),hl=hr.length,fc=forecastInflation(24,pendingRate),total=hl+24,i;
  var mn=Math.min(0,S.infl,S.rate),mx=Math.max(S.rate,pendingRate,S.infl)+0.5;
  for(i=0;i<hl;i++){mn=Math.min(mn,hi[i],hr[i]);mx=Math.max(mx,hi[i],hr[i]);}
  for(i=0;i<24;i++){mn=Math.min(mn,fc.mean[i]-1.65*fc.sd[i]);mx=Math.max(mx,fc.mean[i]+1.65*fc.sd[i]);}
  mn-=0.3;mx+=0.3;
  function X(k){return 6+(w-12)*(k/Math.max(1,total-1));}
  function Y(v){return h-6-(h-12)*((v-mn)/(mx-mn));}
  c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(0,Y(2)+0.5);c.lineTo(w,Y(2)+0.5);c.stroke();
  c.fillStyle=bad;c.globalAlpha=0.18;c.beginPath();c.moveTo(X(Math.max(hl-1,0)),Y(S.infl));
  for(i=0;i<24;i++)c.lineTo(X(hl+i),Y(fc.mean[i]+1.65*fc.sd[i]));
  for(i=23;i>=0;i--)c.lineTo(X(hl+i),Y(fc.mean[i]-1.65*fc.sd[i]));
  c.closePath();c.fill();c.globalAlpha=1;
  function lineSer(arr,col,dash){c.strokeStyle=col;c.lineWidth=2;c.setLineDash(dash||[]);c.beginPath();for(var k=0;k<arr.length;k++){if(k===0)c.moveTo(X(k),Y(arr[k]));else c.lineTo(X(k),Y(arr[k]));}c.stroke();c.setLineDash([]);}
  lineSer(hr,acc);lineSer(hi,bad);
  c.strokeStyle=bad;c.setLineDash([5,4]);c.lineWidth=2;c.beginPath();c.moveTo(X(Math.max(hl-1,0)),Y(S.infl));for(i=0;i<24;i++)c.lineTo(X(hl+i),Y(fc.mean[i]));c.stroke();c.setLineDash([]);
  c.strokeStyle=acc;c.setLineDash([2,4]);c.beginPath();c.moveTo(X(Math.max(hl-1,0)),Y(S.rate));c.lineTo(X(total-1),Y(pendingRate));c.stroke();c.setLineDash([]);
  c.fillStyle=muted;c.fillText(mx.toFixed(1)+'%',8,12);c.fillText(mn.toFixed(1)+'%',8,h-8);c.fillText('2% target',w-60,Y(2)-3);
  $('capM').textContent='blue: policy rate, red: inflation';
  $('fcTxt').textContent='The shaded cone is the 90% range for inflation if you set the policy rate to '+pendingRate.toFixed(2)+'% and leave it. Supply shocks and tight labor markets can push it outside the cone.';
}

function cssVar(n,d){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||d;}
function chartSetup(cv){
  var dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||300,h=cv.clientHeight||84;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  c.font='11px '+cssVar('--font','sans-serif');
  return {c:c,w:w,h:h};
}
function drawChart(cv,series,fmt){
  var s=chartSetup(cv),c=s.c,w=s.w,h=s.h,muted=cssVar('--muted','#888'),line=cssVar('--line','#ccc');
  var len=series[0].data.length;
  if(len<2){c.fillStyle=muted;c.fillText('Collecting data\u2026',10,h/2);return;}
  var mn=Infinity,mx=-Infinity,i,k;
  for(k=0;k<series.length;k++)for(i=0;i<series[k].data.length;i++){mn=Math.min(mn,series[k].data[i]);mx=Math.max(mx,series[k].data[i]);}
  var pad=(mx-mn)*0.12||1;mn-=pad;mx+=pad;
  c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(0,h-0.5);c.lineTo(w,h-0.5);c.moveTo(0,0.5);c.lineTo(w,0.5);c.stroke();
  for(k=0;k<series.length;k++){
    c.strokeStyle=series[k].color;c.lineWidth=2;c.beginPath();
    for(i=0;i<len;i++){var px=6+(w-12)*(i/(len-1)),py=h-6-(h-12)*((series[k].data[i]-mn)/(mx-mn));if(i===0)c.moveTo(px,py);else c.lineTo(px,py);}
    c.stroke();
  }
  c.fillStyle=muted;c.fillText(fmt(mx),8,12);c.fillText(fmt(mn),8,h-8);
}

   +'<h3>Disaster lab</h3><p class="hint">Trigger a disaster to test your fire stations and nerves.</p>'
   +'<div class="btns"><button class="sm" data-dis="fire">Fire</button><button class="sm" data-dis="quake">Earthquake</button><button class="sm" data-dis="flood">Flood</button><button class="sm" data-dis="tornado">Tornado</button></div>';
  $('mSave').onclick=function(){save();closeSheet();toast('City saved');};
  $('mHow').onclick=function(){closeSheet();showSplash('start');};
  $('mDis').onclick=function(){S.disasters=!(S.disasters!==false);closeSheet();toast('Random disasters '+(S.disasters?'on':'off'));};
  $('sheet').className='overlay open';
}

/* ================= input ================= */
var ptrs={},gest=null,painting=false,lastIdx=-1,firstHit=false,downInfo=null;
function localXY(e){var r=$('cv').getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function paintAt(x,y){
  var i=pickTile(x,y);if(i<0||i===lastIdx)return;
  var first=firstHit;firstHit=false;
  if(lastIdx>=0&&!first){
    var x0=lastIdx%MW,y0=(lastIdx/MW)|0,x1=i%MW,y1=(i/MW)|0,n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
    if(n>1){for(var k=1;k<n;k++){act(Math.round(y0+(y1-y0)*k/n)*MW+Math.round(x0+(x1-x0)*k/n),false);}}
  }
  lastIdx=i;hoverIdx=i;act(i,first);
}
function startGesture(){
  var ids=Object.keys(ptrs),a=ptrs[ids[0]],b=ptrs[ids[1]];
  gest={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
}
function wire(){
  var cv=$('cv');
  cv.addEventListener('pointerdown',function(e){
    if(splashOpen||sheetKind)return;e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(x){}
    var p=localXY(e);ptrs[e.pointerId]={x:p[0],y:p[1]};
    if(Object.keys(ptrs).length>=2){startGesture();painting=false;downInfo=null;return;}
    if(!S||S.over)return;
    var panMode=handMode||(tool==='inspect')||e.button===1||e.button===2;
    downInfo={x:p[0],y:p[1],lx:p[0],ly:p[1],moved:false,pan:panMode};
    if(!panMode){painting=true;lastIdx=-1;firstHit=true;paintAt(p[0],p[1]);}
  });
  cv.addEventListener('pointermove',function(e){
    var p=localXY(e);
    if(ptrs[e.pointerId]){ptrs[e.pointerId].x=p[0];ptrs[e.pointerId].y=p[1];}
    if(gest&&Object.keys(ptrs).length>=2){
      var ids=Object.keys(ptrs),a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      zoomAt(d/gest.d,mx,my);panBy(mx-gest.mx,my-gest.my);gest.d=d;gest.mx=mx;gest.my=my;return;
    }
    if(downInfo){
      if(downInfo.pan){
        var dx=p[0]-downInfo.lx,dy=p[1]-downInfo.ly;
        if(!downInfo.moved&&Math.hypot(p[0]-downInfo.x,p[1]-downInfo.y)>6)downInfo.moved=true;
        if(downInfo.moved){panBy(dx,dy);}
        downInfo.lx=p[0];downInfo.ly=p[1];
      }else if(painting)paintAt(p[0],p[1]);
    }else if(e.pointerType==='mouse'&&S&&!S.over){var hi=pickTile(p[0],p[1]);if(hi!==hoverIdx){hoverIdx=hi;dirty=true;}}
  });
  var up=function(e){
    var wasTwo=Object.keys(ptrs).length>=2;
    delete ptrs[e.pointerId];
    if(wasTwo){if(Object.keys(ptrs).length<2)gest=null;downInfo=null;painting=false;return;}
    if(downInfo&&downInfo.pan&&!downInfo.moved&&S&&!S.over&&!splashOpen&&!sheetKind){
      var i=pickTile(downInfo.x,downInfo.y);if(i>=0)act(i,true);
    }
    downInfo=null;painting=false;lastIdx=-1;
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  cv.addEventListener('wheel',function(e){e.preventDefault();var p=localXY(e);zoomAt(Math.exp(-e.deltaY*0.0015),p[0],p[1]);},{passive:false});
  $('tools').addEventListener('click',function(e){var b=e.target.closest('.tool');if(b)selectTool(b.getAttribute('data-t'));});
  $('groups').addEventListener('click',function(e){var b=e.target.closest('button');if(b)selectGroup(b.getAttribute('data-g'));});
  $('speed').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;speed=parseInt(b.getAttribute('data-s'),10);ui();});
  $('btnPolicy').addEventListener('click',function(){if(S&&!S.over)openSheet('policy');});
  $('hand').addEventListener('click',function(){handMode=!handMode;ui();toast(handMode?'Drag pans the map. Tap to build.':'Drag paints with the current tool. Two fingers pan and zoom.');});
  $('btnEcon').addEventListener('click',function(){if(S&&!S.over)openSheet('econ');});
  $('btnCorp').addEventListener('click',function(){if(S&&!S.over)openSheet('corp');});
  $('btnMenu').addEventListener('click',function(){if(S&&!S.over&&!splashOpen)showMenu();});
  $('zIn').addEventListener('click',function(){zoomAt(1.25);});
  $('zOut').addEventListener('click',function(){zoomAt(0.8);});
  $('rotL').addEventListener('click',function(){cam.rot=(cam.rot+3)%4;dirty=true;});
  $('rotR').addEventListener('click',function(){cam.rot=(cam.rot+1)%4;dirty=true;});
  $('mm').addEventListener('pointerdown',function(e){
    var r=$('mm').getBoundingClientRect();cam.wx=clamp((e.clientX-r.left)/r.width*MW,0,MW);cam.wy=clamp((e.clientY-r.top)/r.height*MH,0,MH);dirty=true;mmDirty=true;
  });
  $('sheet').addEventListener('click',function(e){
    if(e.target.id==='sheet'||e.target.getAttribute('data-close')){closeSheet();return;}
    var d=e.target.closest('[data-dis]');if(d){closeSheet();triggerDisaster(d.getAttribute('data-dis'));return;}
    var pl=e.target.closest('[data-pol]');if(pl&&sheetKind==='policy'){polAct(pl);return;}
    var a=e.target.closest('[data-act]');if(a&&sheetKind==='corp')corpAct(a);
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
  window.addEventListener('pagehide',save);
  window.addEventListener('resize',resize);
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('board'));
  try{new MutationObserver(function(){dirty=true;if(sheetKind==='econ')refreshEcon();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(x){}
  if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){dirty=true;if(sheetKind==='econ')refreshEcon();});}catch(x){}}
}

/* ================= main loop and boot ================= */
var lastT=0,acc=0;
function frame(t){
  var dt=Math.min(250,t-lastT);lastT=t;
  if(S&&!S.over&&speed>0&&!sheetKind&&!splashOpen){
    acc+=dt;var per=[0,1400,700,280][speed];
    while(acc>=per){acc-=per;tick();if(!S||S.over||splashOpen)break;}
  }else acc=0;
  if(S&&animOn())dirty=true;
  if(dirty){dirty=false;draw();}
  if(mmDirty){mmDirty=false;drawMini();}
  requestAnimationFrame(frame);
}
(function boot(){
  var st=genTerrain();
  wire();resize();refreshTools();
  camSet(st.x+0.5,st.y+0.5,0.5,0);
  $('info').textContent='Pick a tool below, then tap or drag on the map.';
  showSplash('start');
  requestAnimationFrame(function(t){lastT=t;frame(t);});
  if(window.__SKYTEST){window.__sky={get S(){return S;},get T(){return T;},get L(){return L;},get TER(){return TER;},get EL(){return EL;},tick:tick,newGame:newGame,computeEconomy:computeEconomy,scan:scan,
    setTool:function(t){tool=t;},act:act,bailout:bailout,setDeposit:setDeposit,checkSite:checkSite,placeBuilding:placeBuilding,clearAt:clearAt,rootOf:rootOf,sizeOf:sizeOf,get PAR(){return PAR;},get MW(){return MW;},setPending:function(p){pending=p;},setRate:setRate,setQE:setQE,sendStimulus:sendStimulus,renderPolicy:renderPolicy,setPolTab:function(t){polTab=t;},borrow:borrow,repay:repay,draw:draw,cam:cam,view:view,pickTile:pickTile,drawMini:drawMini,
    invest:invest,buyShares:buyShares,sellShares:sellShares,acceptOffer:acceptOffer,buyout:buyout,mergeFirms:mergeFirms,spawnFirm:spawnFirm,
    triggerDisaster:triggerDisaster,ipo:ipo,forecastInflation:forecastInflation,openSheet:openSheet,corpAct:corpAct,save:save,loadSave:loadSave,
    get F(){return F;},get FLD(){return FLD;},resize:resize,setCorpTab:function(t){corpTab=t;}};}
})();


})();
</script>
