<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimCity 5000</title>
<style>
:root{
  color-scheme: light;
  --bg:#e8edf0; --panel:#f7f9fa; --panel2:#e9eef1; --ink:#13202a; --muted:#566673; --line:#c9d3da;
  --accent:#1f6f8b; --good:#2a8450; --bad:#c2452d; --warn:#a96f12;
  --btn:#ffffff; --btnOn:#13202a; --btnOnInk:#f7f9fa; --scrim:rgba(10,20,30,.5);
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1620; --panel:#13222e; --panel2:#1a2d3b; --ink:#e8f0f5; --muted:#8fa3b1; --line:#26394a;
    --accent:#5bb5d6; --good:#4fc083; --bad:#f0715a; --warn:#e2ad4b;
    --btn:#1a2d3b; --btnOn:#e8f0f5; --btnOnInk:#0c1620; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1620; --panel:#13222e; --panel2:#1a2d3b; --ink:#e8f0f5; --muted:#8fa3b1; --line:#26394a;
  --accent:#5bb5d6; --good:#4fc083; --bad:#f0715a; --warn:#e2ad4b;
  --btn:#1a2d3b; --btnOn:#e8f0f5; --btnOnInk:#0c1620; --scrim:rgba(0,0,0,.6);
}
html{font-size:16px;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:0.9375rem;line-height:1.35;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
#app{max-width:480px;margin:0 auto;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px;height:calc(var(--app-h,100vh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;overflow-x:hidden;overflow-y:auto}
@supports (height:100dvh){#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:0.7812rem}
.hbtns{display:flex;gap:6px}
.ghost{position:relative;background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600;font-size:0.875rem}
.stats{flex:none;display:grid;grid-template-columns:1.25fr 1fr 1fr 1.1fr;gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.stat .lab{font-size:0.7188rem;color:var(--muted)}
.stat .val{font-size:1.062rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--bad)} .pos{color:var(--good)}
.ticker{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:0.7812rem;line-height:1.3;height:40px;overflow:hidden;flex:none}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--muted)}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--accent)}
.econ{display:flex;gap:5px;overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}.econ::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:74px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 8px}
.chip .lab{display:block;font-size:0.6875rem;color:var(--muted);white-space:nowrap}
.chip .val{font-size:0.875rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .tr{font-size:0.5625rem;margin-left:3px}
.board{position:relative;flex:1 1 auto;min-height:170px}
#cv{display:block;position:absolute;left:0;top:0;width:100%;height:100%;border-radius:12px;border:1px solid var(--line);touch-action:none;background:var(--panel)}
#mm{position:absolute;left:8px;bottom:8px;width:84px;height:84px;border-radius:8px;border:2px solid rgba(255,255,255,.85);image-rendering:pixelated;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.navbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.navbtns button.tx{font-size:0.6875rem;font-weight:700}
.navbtns button{width:46px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-size:1.188rem;font-weight:700;line-height:1;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);max-width:62%;z-index:4;background:var(--btnOn);color:var(--btnOnInk);
  padding:7px 12px;border-radius:10px;font-size:0.8125rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.show{opacity:1}
.info{font-size:0.7812rem;color:var(--muted);height:34px;overflow:hidden;line-height:1.3;flex:none}
.toolrow{flex:none;display:flex;gap:6px;align-items:center}
.groups{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.toolrow .act{padding:8px 9px;font-size:0.7812rem;flex:none}
.tools{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tool{flex:none;min-width:68px;scroll-snap-align:start;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:7px 6px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool .sw{width:14px;height:14px;border-radius:4px;margin-bottom:2px}
.tool .nm{font-size:0.8125rem;font-weight:600;white-space:nowrap}
.tool .ct{font-size:0.7188rem;opacity:.7;font-variant-numeric:tabular-nums}
.tool.on{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn)}
.tool.lock{opacity:.55}
.bar{flex:none;display:flex;gap:6px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--btn)}
.seg button{background:transparent;border:0;padding:8px 9px;font-weight:700;min-width:36px;display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--btnOn);color:var(--btnOnInk)}
.seg svg{width:14px;height:14px;fill:currentColor}
.groups button{font-size:0.7812rem;padding:7px 9px;flex:none;min-width:0}
.tabs{margin:8px 0 10px}
.tabs button{flex:1;font-size:0.875rem}
.field{width:100%;font:inherit;font-size:1.062rem;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink);-webkit-user-select:text;user-select:text;resize:none}
.scn{display:block;width:100%;text-align:left;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}
.scn b{display:block;font-size:0.9375rem}.scn span{display:block;font-size:0.7812rem;color:var(--muted);margin-top:2px}
.scn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.adv{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:0.8125rem;background:var(--panel2);border-left:4px solid var(--accent)}
.adv.bad{border-left-color:var(--bad)}.adv.warn{border-left-color:var(--warn)}.adv.info{border-left-color:var(--good)}
.adv b{margin-right:4px}
.legend{position:absolute;left:100px;bottom:8px;background:rgba(10,20,30,.72);color:#fff;border-radius:8px;padding:5px 9px;font-size:0.7188rem;min-width:112px}
.legend .bar{display:block;height:8px;border-radius:4px;margin:4px 0 2px;background:linear-gradient(90deg,hsl(125,78%,46%),hsl(62,78%,46%),hsl(0,78%,46%))}
.legend .bar.inv{background:linear-gradient(90deg,hsl(0,78%,46%),hsl(62,78%,46%),hsl(125,78%,46%))}
.legend .lr{display:flex;justify-content:space-between;opacity:.85}.legend i{font-style:normal}
.navbtns button.on{background:var(--btnOn);color:var(--btnOnInk)}
.act{position:relative;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:0.8125rem}
.ghost.badge::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.advpop{position:absolute;left:8px;right:66px;top:8px;z-index:3;display:none;gap:8px;align-items:flex-start;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 6px 8px 10px;font-size:0.7812rem;line-height:1.3;box-shadow:0 3px 12px rgba(0,0,0,.35)}
.advpop span{flex:1}
.advpop button{flex:none;border:0;background:transparent;font-size:1.375rem;line-height:1;color:var(--muted);padding:0 6px;margin-top:-3px}
.act.badge::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;z-index:20}
.overlay.open{display:flex}
.overlay{align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:16px}
.sheet,.card{width:100%;max-width:480px;background:var(--panel);color:var(--ink);overflow:auto;-webkit-user-select:none;user-select:none}
.sheet{border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh}
.card{border-radius:18px;padding:20px;max-height:92vh;border:1px solid var(--line)}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{margin:0 0 6px;font-size:2.125rem;font-weight:800;letter-spacing:-.02em;line-height:1}
h2{margin:0;font-size:1.375rem;font-weight:800}
h3{margin:16px 0 6px;font-size:0.9375rem;font-weight:800}
p{margin:6px 0}
.tag{font-size:0.9375rem;color:var(--muted);margin:8px 0 14px}
.hint{font-size:0.7812rem;color:var(--muted);margin:2px 0 10px}
.row{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.row label{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.debt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.debt .meta{display:flex;flex-direction:column;font-size:0.8125rem}
.debt .meta b{font-size:0.9375rem}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.btns button,.primary,.sm{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;font-size:0.8438rem}
button.primary{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn);font-size:1rem;padding:12px}
button:disabled{opacity:.4;cursor:default}
.ln{display:flex;justify-content:space-between;padding:3px 0;font-size:0.875rem;font-variant-numeric:tabular-nums}
.ln.tot{font-weight:800;border-top:1px solid var(--line);margin-top:3px;padding-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.diag{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.diag div{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:0.8125rem;display:flex;flex-direction:column}
.diag b{font-size:1.062rem;font-variant-numeric:tabular-nums}
.chart{margin-top:12px}
.chart .ct{display:flex;justify-content:space-between;gap:8px;font-size:0.8125rem;font-weight:700;margin-bottom:3px}
.chart .ct span{font-weight:400;color:var(--muted);text-align:right}
.chart canvas{width:100%;height:92px;display:block;background:var(--panel2);border-radius:10px}
.news{margin:0;padding:0;list-style:none}
.news li{display:flex;gap:8px;font-size:0.8125rem;padding:5px 0;border-top:1px solid var(--line)}
.news time{flex:none;width:62px;color:var(--muted);font-size:0.75rem}
.how{margin:16px 0 0;padding-left:20px;font-size:0.875rem}
.how li{margin:6px 0}
.best{font-size:0.8125rem;color:var(--muted);margin-top:12px}
.tech{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.tech small{display:block;color:var(--muted);font-size:0.75rem;margin-top:2px}
.tst{flex:none;width:112px;text-align:right}
.prog{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-bottom:3px}
.prog i{display:block;height:100%;background:var(--accent)}
.firm{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel2)}
.fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fh b{font-size:0.9688rem}
.tagc{font-size:0.75rem;color:var(--muted)}
.stg{margin-left:auto;font-size:0.7188rem;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.stg.public{color:var(--good)} .stg.acquired{color:var(--warn)}
.fs{font-size:0.8125rem;margin:6px 0 8px}



.floaters{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
.floaters button{display:none;min-width:54px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--btn);font-weight:700;font-size:0.7812rem;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.groups{display:flex}
.groups button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 3px;font-size:0.7188rem;min-width:0;white-space:nowrap}
.groups .gi{font-style:normal;font-size:0.9375rem;line-height:1}
.tools .hdr{flex:none;align-self:stretch;display:flex;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:0.6562rem;color:var(--muted);padding:0 3px;white-space:nowrap}
/* ---- manual ---- */
.toc{margin:6px 0 4px;padding-left:22px;columns:1}
.toc li{margin:5px 0}
.toc a,.back{color:var(--accent);text-decoration:none;font-weight:600}
.gsec{margin-top:18px;padding-top:6px;border-top:1px solid var(--line)}
.gsec h3{font-size:1.062rem;margin:10px 0 6px}
.gsec h4{margin:12px 0 4px;font-size:0.8438rem;color:var(--muted)}
.brief{background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:0.875rem}
.more{font-size:0.875rem}
.more p,.more li{margin:6px 0}
.gt{width:100%;border-collapse:collapse;font-size:0.8125rem;margin:6px 0}
.gt th,.gt td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.gt th{color:var(--muted);font-weight:600}
.back{display:inline-block;margin-top:8px;font-size:0.8125rem}
#trayBtn{display:none}
/* ---- responsive layout, compact header, desktop ---- */
.upper,.lower{display:contents}
.trayBox{display:contents}
.brand{cursor:pointer}
.brand b::after{content:" \25BE";font-size:0.75rem;opacity:.55}
#app.compact .brand b::after{content:" \25B8"}
#app.compact .stats,#app.compact .econ{display:none}
.chip{cursor:pointer}
.chip:hover{border-color:var(--accent)}
.pn{display:flex;align-items:center;gap:1px;font-size:0.6875rem;color:var(--muted);flex:none;margin-top:-1px}
.pn button{border:0;background:transparent;color:var(--ink);font-size:1.25rem;line-height:1;padding:0 4px}
.subh{margin:12px 0 4px;font-size:0.8125rem;color:var(--muted)}
.advpop .sm{padding:5px 10px;font-size:0.75rem;flex:none;margin-top:-2px}
.keys div{padding:6px 0;border-top:1px solid var(--line);font-size:0.8438rem}
.keys b{display:inline-block;min-width:128px}

@media (max-aspect-ratio:11/10), (min-aspect-ratio:11/10) and (min-width:560px) and (max-height:519px){
  :root{--il:env(safe-area-inset-left,0px);--ir:env(safe-area-inset-right,0px)}
  #app{display:block;position:relative;max-width:none;padding:0;overflow:hidden}
  .board{position:absolute;left:var(--il);right:var(--ir);top:0;bottom:0;min-height:0}
  #cv{border-radius:0;border:0}
  .upper,.lower{display:contents}
  .top{position:absolute;z-index:6;left:calc(var(--il) + 8px);top:6px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 6px 3px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .brand{max-width:190px;min-width:0}
  .brand b{font-size:1rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand span{font-size:0.7188rem;white-space:nowrap}
  .stats{position:absolute;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .stat{padding:2px 6px}
  .stat .lab{font-size:0.6562rem}
  .stat .val{font-size:0.875rem}
  .econ{display:none}
  #app.chips .econ{display:flex;position:absolute;z-index:6;left:calc(var(--il) + 8px);right:calc(var(--ir) + 62px)}
  .info{display:none}
  .advpop{z-index:7;left:8px;right:auto;width:calc(100% - 70px);max-width:460px}
  .trayBox{display:none}
  #app.tray .trayBox{display:flex;flex-direction:column;gap:6px;position:absolute;z-index:6;left:calc(var(--il) + 8px);right:calc(var(--ir) + 8px);bottom:calc(var(--bar-h,82px) + 12px);padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  #app.tray .toolrow{display:block}
  #app.tray .tools{display:flex}
  .bar{position:absolute;z-index:6;left:calc(var(--il) + 8px);right:calc(var(--ir) + 8px)}
  #trayBtn{display:inline-block}
}
@media (max-aspect-ratio:11/10){
  .top{right:calc(var(--ir) + 62px)}
  .stats{top:52px;left:calc(var(--il) + 8px);right:calc(var(--ir) + 62px)}
  #app.chips .econ{top:96px}
  .advpop{top:96px}
  .bar{bottom:6px;display:flex;flex-wrap:wrap;gap:6px}
  #trayBtn{flex:1 1 38%}
  .bar .seg{flex:0 0 auto}
  #btnPolicy,#btnEcon,#btnCorp{flex:1 1 27%}
  .floaters{bottom:calc(var(--bar-h,82px) + 12px)}
  #mm{bottom:calc(var(--bar-h,82px) + 12px)}
  .legend{bottom:calc(var(--bar-h,82px) + 12px)}
  .toast{bottom:calc(var(--bar-h,82px) + 24px)}
}
@media (min-aspect-ratio:11/10) and (min-width:560px) and (max-height:519px){
  .top{right:auto}
  .stats{top:6px;left:calc(var(--il) + 340px);right:calc(var(--ir) + 62px)}
  #app.chips .econ{top:50px}
  .advpop{top:50px}
  .floaters{bottom:calc(var(--bar-h,44px) + 12px)}
  .bar{bottom:6px;right:calc(var(--ir) + 62px)}
  #app.tray .trayBox{right:calc(var(--ir) + 62px)}
  #mm{bottom:calc(var(--bar-h,44px) + 12px)}
  .legend{bottom:calc(var(--bar-h,44px) + 12px)}
  .toast{bottom:calc(var(--bar-h,44px) + 24px)}
}
@media (min-aspect-ratio:11/10) and (min-width:560px) and (min-height:520px){
  #app.side{max-width:1280px;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);column-gap:10px;row-gap:6px;padding:6px 10px}
  #app.side .board{grid-column:1;grid-row:1 / span 2;min-height:0}
  #app.side .upper{display:flex;flex-direction:column;gap:6px;grid-column:2;grid-row:1;min-width:0}
  #app.side .lower{display:flex;flex-direction:column;gap:6px;grid-column:2;grid-row:2;min-height:0;min-width:0;overflow-y:auto;scrollbar-width:thin}
}

/* desktop: floating panels, like the phone layout, with room to breathe */
@media (min-aspect-ratio:11/10) and (min-width:560px) and (min-height:520px){
  :root{--il:env(safe-area-inset-left,0px);--ir:env(safe-area-inset-right,0px)}
  #app:not(.side){display:block;position:relative;max-width:none;padding:0;overflow:hidden}

function hash2(x,y,s){

function vnoise(x,y,s){
  var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);

function genTerrain(){

      if(x<coast){TER[i]=WATER;EL[i]=0;continue;}
      var v=fbm(x*0.08,y*0.08,seed)+(x-coast)*0.0085;
      if(v<0.36){TER[i]=WATER;EL[i]=0;continue;}
      EL[i]=clamp(Math.round((v-0.36)*9)+1,1,7);
    }
  }
  for(var pass=0;pass<2;pass++){
    var ne=EL.slice();
    for(y=0;y<MH;y++)for(x=0;x<MW;x++){
      i=y*MW+x;if(TER[i]===WATER)continue;
      var sum=EL[i]*2,cnt=2;
      for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
        var xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=MW||yy>=MH)continue;
        var j=yy*MW+xx;if(TER[j]===WATER)continue;sum+=EL[j];cnt++;
      }
      ne[i]=clamp(Math.round(sum/cnt),1,7);
    }
    EL=ne;
  }
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    i=y*MW+x;var d=Math.sqrt((x-sx)*(x-sx)+(y-sy)*(y-sy));
    if(d<=9){TER[i]=GRASS;EL[i]=2;}
    else if(d<14){
      var t=(d-9)/5;
      if(TER[i]===WATER&&d<12){TER[i]=GRASS;EL[i]=2;}
      else if(TER[i]!==WATER)EL[i]=Math.round(EL[i]*t+2*(1-t));
    }
  }
  var pts=[[sx+8+rnd(10),0],[sx+8+rnd(3),sy-11],[sx+7,sy+1],[sx-1-rnd(2),sy+12],[coastAt(sy+18)+1,sy+18+rnd(3)]];

      if(k>=2&&rx+1<MW){TER[i+1]=WATER;EL[i+1]=0;}
    }
  }
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    i=y*MW+x;if(TER[i]===WATER)continue;
    var wet=false;

      var x2=x+ex,y2=y+ey;if(x2<0||y2<0||x2>=MW||y2>=MH)continue;

  }
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    i=y*MW+x;if(TER[i]===WATER)continue;
    if(EL[i]>=6)TER[i]=ROCK;

function footSz(a){var o=BYT[T[a]];if(!o||!o.size)return [1,1];return ORI[a]?[o.size[1],o.size[0]]:o.size;}
function anchorFor(i,sz){return [(i%MW)-Math.floor(sz[0]/2),((i/MW)|0)-Math.floor(sz[1]/2)];}
function footTiles(ax,ay,sz){var r=[];for(var dy=0;dy<sz[1];dy++)for(var dx=0;dx<sz[0];dx++)r.push((ay+dy)*MW+ax+dx);return r;}
function rootOf(i){return (T[i]===SUB&&PAR[i]>=0)?PAR[i]:i;}
function footOfAnchor(a){var sz=footSz(a);return footTiles(a%MW,(a/MW)|0,sz);}
function centerIdx(a){var sz=footSz(a);return (((a/MW)|0)+Math.floor(sz[1]/2))*MW+(a%MW)+Math.floor(sz[0]/2);}
function rec(i){if(undoFrame&&!undoFrame.t[i])undoFrame.t[i]=[T[i],L[i],B[i],PAR[i],TER[i],EL[i],F[i],ORI[i],PU[i]];}
function clearAt(i){
  var a=rootOf(i);
  if(wreck&&!seeding)queueRepair(i);
  if(a===i&&T[i]!==SUB&&!(BYT[T[i]]&&BYT[T[i]].size)){rec(i);T[i]=EMPTY;L[i]=0;B[i]=0;PAR[i]=-1;F[i]=0;ORI[i]=0;return;}
  var tiles=(T[a]===SUB)?[i]:footOfAnchor(a);
  for(var k=0;k<tiles.length;k++){var t=tiles[k];rec(t);T[t]=EMPTY;L[t]=0;B[t]=0;PAR[t]=-1;F[t]=0;ORI[t]=0;}
}
function nearWaterTile(i){var nn=nb4(i);for(var k=0;k<nn.length;k++){if(TER[nn[k]]===WATER)return true;}return false;}
function checkSite(ax,ay,id,rot){
  var o=OBJ[id],sz=sizeOf(id,rot);
  if(ax<0||ay<0||ax+sz[0]>MW||ay+sz[1]>MH)return 'That does not fit on the map.';
  var tiles=footTiles(ax,ay,sz),mn=99,mx=-1,wet=false,k;
  for(k=0;k<tiles.length;k++){
    var i=tiles[k];
    if(TER[i]===WATER)return 'Part of that site is water.';
    if(TER[i]===ROCK)return 'Part of that site is too steep.';
    if(T[i]!==EMPTY)return 'Something is already there. Bulldoze it first.';
    mn=Math.min(mn,EL[i]);mx=Math.max(mx,EL[i]);
    if(nearWaterTile(i))wet=true;
  }
  if(mx-mn>2)return 'The ground is too uneven. Pick flatter land.';
  if(o.shore&&!wet)return 'The '+TOOLS[id].name.toLowerCase()+' must touch the water.';
  return '';
}

/* ================= utilities scan ================= */
function mark(arr,x,y,r){
  for(var dy=-r;dy<=r;dy++){
    var yy=y+dy;if(yy<0||yy>=MH)continue;
    var w=r-Math.abs(dy);
    for(var dx=-w;dx<=w;dx++){var xx=x+dx;if(xx>=0&&xx<MW)arr[yy*MW+xx]=1;}
  }
}
function sat(n,base,r){return n>0?base*(1-Math.pow(r,n))/(1-r):0;}
function conducts(t){return t!==EMPTY&&t!==ROAD&&t!==PLINE&&t!==PIPE&&t!==RAIL&&t!==PORT;}
function roadWithin2(i){
  var x=i%MW,y=(i/MW)|0,dx,dy;
  for(dy=-2;dy<=2;dy++){var yy=y+dy;if(yy<0||yy>=MH)continue;var w=2-Math.abs(dy);for(dx=-w;dx<=w;dx++){var xx=x+dx;if(xx>=0&&xx<MW&&T[yy*MW+xx]===ROAD)return true;}}
  return false;
}
function cover(arr,srcs,lineType,lineRad,ugBit){
  var seen=new Uint8Array(N),q=[],k,head=0;
  for(k=0;k<srcs.length;k++){
    var s=srcs[k],ci=centerIdx(s),ft=footOfAnchor(s);
    mark(arr,ci%MW,(ci/MW)|0,BYT[T[s]].rad);
    for(var q2=0;q2<ft.length;q2++)q.push(ft[q2]);
  }
  while(head<q.length){
    var c=q[head++],nn=nb4(c);
    for(k=0;k<nn.length;k++){
      var n=nn[k];
      if(seen[n])continue;
      if(T[n]===lineType||(ugBit&&(PU[n]&ugBit))){seen[n]=1;q.push(n);mark(arr,n%MW,(n/MW)|0,lineRad);}
      else if(conducts(T[n])){seen[n]=1;q.push(n);arr[n]=1;}
    }
  }
}
function mwEff(t,i){
  var m=BYT[t].mw;
  if(t===SOLAR)m*=(S&&S.tech.solar?1.5:1)*(S?S.sunF:1);
  else if(t===WIND)m*=(S?S.windF:1)*(EL[i]>=3?1.3:1)*(SHORE[i]?1.15:1);
  else if(t===HYDRO)m*=(S&&S.drought>0?0.5:1);
  return m;
}
function mwMean(t,i){
  var m=BYT[t].mw;
  if(t===SOLAR)m*=(S&&S.tech.solar?1.5:1);
  else if(t===WIND)m*=(EL[i]>=3?1.3:1)*(SHORE[i]?1.15:1);
  return m;
}
function roadCap(g,i){return g.capBase*(1+(g.busC[i]?0.6:0)+(g.railC&&g.railC[i]?0.5:0));}
function footRoadAdj(i){var f=footOfAnchor(i),art=S&&S.tech&&S.tech.arterial;for(var k=0;k<f.length;k++){var nn=nb4(f[k]);for(var j=0;j<nn.length;j++){if(T[nn[j]]===ROAD)return true;}if(art&&roadWithin2(f[k]))return true;}return false;}
function railPath(comp,aSt,bSt,stAt){
  var inComp={},k,j;for(k=0;k<comp.length;k++)inComp[comp[k]]=1;
  var starts=[],goal={};
  for(k=0;k<comp.length;k++){
    var nn=nb4(comp[k]);
    for(j=0;j<nn.length;j++){if(stAt[nn[j]]===aSt){starts.push(comp[k]);break;}}
    for(j=0;j<nn.length;j++){if(stAt[nn[j]]===bSt){goal[comp[k]]=1;break;}}
  }
  if(!starts.length)return [];
  var prev={},q=[],head=0;
  for(k=0;k<starts.length;k++){prev[starts[k]]=-1;q.push(starts[k]);}
  var end=-1;
  while(head<q.length&&end<0){
    var c=q[head++];if(goal[c]){end=c;break;}
    var n2=nb4(c);for(j=0;j<n2.length;j++){var nb=n2[j];if(inComp[nb]&&prev[nb]===undefined){prev[nb]=c;q.push(nb);}}
  }

  var path=[];for(var p=end;p!==-1;p=prev[p])path.push(p);
  return path.reverse();
}

function sendStimulus(per){
  if(locked()){lockMsg();return;}

  if(locked()){lockMsg();return;}
  if(S.crash<=0&&S.crunch<=0&&S.panic<=0){toast('There is no crisis to fight right now.');return;}

}

function scheduleEvent(id,delay,warn){
  if(S.sched.some(function(q){return q.id===id;})||S.crises.some(function(c){return c.id===id;}))return;
  var ev=macroBrief(id),sp=SPECIAL[id],w=ev?ev.warn:(sp?sp.warn:'');
  if(ev&&((ev.maxEra!==undefined&&S.era>ev.maxEra)||(ev.minEra!==undefined&&S.era<ev.minEra)))return;
  if(warn&&delay>=2&&w)addNews(w,'warn','World');
  S.sched.push({id:id,at:S.month+delay});
}
function runScheduled(){
  for(var i=S.sched.length-1;i>=0;i--){
    if(S.sched[i].at>S.month)continue;
    var id=S.sched[i].id;S.sched.splice(i,1);
    var ev=macroBrief(id);
    if(ev){if(!S.crises.some(function(c){return c.id===id;}))startCrisis(ev);}
    else if(SPECIAL[id]){SPECIAL[id].run();if(SPECIAL[id].head)addNews(SPECIAL[id].head,'bad','World');}
  }
}
function macroBrief(cid){for(var i=0;i<MACRO.length;i++){if(MACRO[i].id===cid)return MACRO[i];}return null;}
function startCrisis(ev){
  S.lastShock=S.month;
  metaInit();S.st.seen[ev.id]=S.month;S.st.crisesYear++;chron(ev.good?'good':'crisis',ev.name+(ev.region?' ('+ev.region+')':''));
  var chs=ev.ch;if(S.tech.vaccine&&chs.health){chs={};for(var kk in ev.ch)chs[kk]=ev.ch[kk];chs.health*=0.5;}
  var c={id:ev.id,name:ev.name,region:ev.region,ch:chs,total:ev.dur,left:ev.dur,age:0,mult:1,end:ev.end,good:!!ev.good};
  S.crises.push(c);
  if(ev.mkt)S.mkt=clamp(S.mkt*(1+ev.mkt),20,600);
  if(ev.rec&&Math.random()<ev.rec)S.recession=Math.max(S.recession,12);
  if(ev.fn)ev.fn();
  if(ev.chain){for(var ci=0;ci<ev.chain.length;ci++){var ch=ev.chain[ci];if(Math.random()<ch.p)scheduleEvent(ch.id,ch.d[0]+rnd(ch.d[1]-ch.d[0]+1),Math.random()<0.6);}}
  var hasOpts=ev.opts&&ev.opts.length&&!ev.good,id=ev.id;
  if(hasOpts){
    S.briefs.push({cid:id,left:3});
    addNews(ev.head,'bad','World',function(){return S.briefs.some(function(b){return b.cid===id;});},true,'brief');
  }else addNews(ev.head,ev.good?'good':'warn','World');
}
function maybeMacro(){
  if(S.month<12||S.pop<60||S.crises.length>=2||S.sched.length>=3||Math.random()>0.07*dm('ev'))return;
  var pool=MACRO.filter(function(ev){return !ev.chainOnly&&!S.crises.some(function(c){return c.id===ev.id;})&&(ev.maxEra===undefined||S.era<=ev.maxEra)&&(ev.minEra===undefined||S.era>=ev.minEra)&&(!ev.need||ev.need());}),tot=0,i;
  if(!pool.length)return;
  for(i=0;i<pool.length;i++)tot+=pool[i].w;
  var r=Math.random()*tot,ev=pool[0];
  for(i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){ev=pool[i];break;}}
  if(Math.random()<0.65)scheduleEvent(ev.id,3,true);else startCrisis(ev);
}
function stepCrises(){
  var tgt={energy:0,freight:0,materials:0,chips:0,food:0,trade:0,health:0,orbit:0,ore:0},i,k;
  for(i=S.crises.length-1;i>=0;i--){
    var c=S.crises[i];c.age++;c.left--;
    var ramp=Math.max(0.15,Math.min(1,c.age/2,(c.left+2)/3));
    for(k in c.ch)tgt[k]+=c.ch[k]*c.mult*ramp;
    if(c.left<=0){addNews(c.end,'good','World');S.crises.splice(i,1);}
  }
  for(k in tgt){
    var cur=S.mc[k]||0;
    S.mc[k]=cur+(tgt[k]-cur)*(Math.abs(tgt[k])>Math.abs(cur)?0.4:0.12);
    if(tgt[k]===0&&Math.abs(S.mc[k])<0.01)S.mc[k]=0;
  }
  for(i=S.briefs.length-1;i>=0;i--){S.briefs[i].left--;if(S.briefs[i].left<=0)S.briefs.splice(i,1);}
}
function applyBrief(cid,oi){
  var ev=macroBrief(cid),c=null,i;
  for(i=0;i<S.crises.length;i++){if(S.crises[i].id===cid)c=S.crises[i];}
  if(!ev||!c){return;}
  if(oi>=0){
    var o=OPT[ev.opts[oi]],cost=Math.round(S.pop*o.cp);
    if(!spend(cost))return;
    c.mult*=o.mult;if(o.appr)S.approval=clamp(S.approval+o.appr,0,100);if(o.fn)o.fn();
    addNews('You chose to '+o.label.toLowerCase()+' during the '+ev.name.toLowerCase()+'.','info','World');
  }else addNews('You chose to wait out the '+ev.name.toLowerCase()+'.','info','World');
  for(i=S.briefs.length-1;i>=0;i--){if(S.briefs[i].cid===cid)S.briefs.splice(i,1);}
  prunePop();
}

function stepInfra(e){
  var r=S.renew;
  if(r<1)S.cond-=0.008*(1-r)*Math.min(1,e.assets/15000);
  else S.cond+=0.004+0.005*Math.max(0,r-1);
  S.cond=clamp(S.cond,0.2,1);
  var kinds=['water','power','road'],msgs={water:'A water main bursts and a district loses pressure.',power:'Aging transformers fail and part of the grid goes dark.',road:'A bridge and several roads close for emergency repairs.'},i;
  for(i=0;i<3;i++){

function complacency(e){

  var wealth=clamp(Math.log10(Math.max(1,monthsCash/12))/1.5,0,1);

function stepFund(e){

function firmById(id){for(var i=0;i<S.firms.length;i++){if(S.firms[i].id===id)return S.firms[i];}return {name:'a firm',val:0,stake:0};}
function invest(id,amt){

  if(amt>room){amt=Math.floor(room);toast('The founders will only sell up to 40%, so you invest '+money(amt)+'.');}
  S.cash-=amt;
  var post=f.val+amt;f.stake=(f.stake*f.val+amt)/post;f.val=post;f.runway+=Math.max(1,Math.round(amt/f.burn*0.9));

function buyShares(id,frac){

function sellShares(id,frac){

function acceptOffer(oid){

function mergeFirms(id){

/* ================= disasters ================= */
function flammable(i){var t=T[i];if(t!==EMPTY&&hardened(t===SUB?T[rootOf(i)]:t))return false;return (t!==EMPTY&&t!==ROAD&&t!==PIPE)||TER[i]===FOREST;}
function igniteAt(i,ttl){if(F[i]===0)F[i]=ttl||4;}
/* ---- repair crews: roads, lines, pipes and public buildings that a disaster destroys are rebuilt for you ---- */
function queueRepair(i){
  if(!S||!S.ord||!S.ord.repair)return;
  var a=rootOf(i),t=T[a];
  if(t===EMPTY||t===RES||t===COM||t===IND)return;
  var o=BYT[t],id=(t===ROAD)?'road':(o&&o.id);
  if(!id)return;
  if(!S.rq)S.rq=[];
  for(var k=0;k<S.rq.length;k++){if(S.rq[k].a===a)return;}
  if(S.rq.length<800)S.rq.push({a:a,id:id,rot:ORI[a]|0,br:(t===ROAD&&B[a])?1:0,m:S.month});
}
function repairCritical(id){var o=OBJ[id];return !!(o&&(o.mw||o.wc));}
function repairPrio(e){return repairCritical(e.id)?0:e.id==='road'?1:(e.id==='pline'||e.id==='pipe')?2:3;}
function stepRepair(e){
  var q=S.rq;
  if(!q||!q.length){if(S.rqStat&&S.rqStat.n>0&&!S.rqStat.told){addNews('The repair crews are finished: '+S.rqStat.n+' pieces of the city rebuilt for '+money(S.rqStat.cost)+'.','good','Repair');chron('good','Repair crews rebuilt '+S.rqStat.n+' roads, lines and buildings.');S.rqStat.told=true;}return;}
  if(!S.ord.repair)return;
  if(!S.rqStat)S.rqStat={n:0,cost:0,told:false};
  if(S.rqStat.told){S.rqStat={n:0,cost:0,told:false};}
  var spentNow=0,budget=Math.max(4,Math.round(S.pop/120)+(S.tech.robotics?4:0)+(S.tech.autoveh?3:0)+(S.tech.agi?4:0)),done=0,k;
  q.sort(function(a,b){return repairPrio(a)-repairPrio(b)||a.m-b.m;});
  for(k=0;k<q.length&&done<budget+8;k++){
    var r=q[k];
    var crit=repairCritical(r.id);
    if(S.month-r.m<(crit?0:2))continue;
    if(!crit&&done>=budget)continue;
    if(S.month-r.m>360||T[r.a]!==EMPTY){q.splice(k,1);k--;continue;}
    var o=OBJ[r.id];if(!o){q.splice(k,1);k--;continue;}
    var c0=S.cash,ok=false;
    var price=Math.ceil(costFor(r.id,r.a)*(r.br?4:1));
    if(S.cash<price*1.5+500&&!S.sandbox)continue;
    if(!crit&&price>S.cash*0.2&&!S.sandbox)continue;
    if(!crit&&spentNow+price>S.cash*0.25&&!S.sandbox)continue;
    bulk=true;
    try{
      if(o.size){var ax=r.a%MW,ay=(r.a/MW)|0;if(checkSite(ax,ay,r.id,r.rot)==='')ok=placeBuilding(ax,ay,r.id,r.rot);else{q.splice(k,1);k--;bulk=false;continue;}}
      else if(r.id==='road'){if(TER[r.a]===WATER){if(spend(price)){T[r.a]=ROAD;B[r.a]=1;ok=true;}}else ok=place(r.a,'road',ROAD);}
      else ok=place(r.a,r.id,o.t);
    }finally{bulk=false;}
    if(ok){if(o.phased)L[r.a]=bMon(o);else if(o.build)L[r.a]=Math.min(L[r.a],1);var prem=Math.round((c0-S.cash)*0.25);S.cash-=prem;S.rqStat.n++;S.rqStat.cost+=(c0-S.cash);spentNow+=(c0-S.cash);done++;q.splice(k,1);k--;}
  }
  if(done)dirty=true;
}
/* ---- utility planners: when power or water stays short, the city quietly adds plants, pumps and desalination ---- */
function planCentroid(){
  var sx=0,sy=0,n=0,i;
  for(i=0;i<N;i++){if((T[i]===RES||T[i]===COM||T[i]===IND)&&L[i]>0){sx+=i%MW;sy+=(i/MW)|0;n++;}}
  return n?{x:sx/n,y:sy/n}:{x:S.start.x,y:S.start.y};

function planSite(id,c,minD,maxD,needPower,g){
  var k;

    var rad=maxD*(1+k/300),ax=Math.round(c.x+(Math.random()*2-1)*rad),ay=Math.round(c.y+(Math.random()*2-1)*rad);

    var d=Math.abs(ax-c.x)+Math.abs(ay-c.y);if(d<minD||d>rad*1.5)continue;

}
function stepPlanners(e){

      if(placeBuilding(site[0],site[1],pid,0)){var pa=site[1]*MW+site[0];L[pa]=Math.min(L[pa],2);S.cash-=cost*0.5;need-=(BYT[po.t].mw||60);made++;msgs.push(TOOLS[pid].name.toLowerCase());}
      else break;
    }
  }

      wt++;
      var wid=(OBJ.desal&&!techLocked('desal'))?'desal':'pump',wc2=costFor(wid,0);
      if(S.cash<wc2*3&&!S.sandbox)break;

      if(placeBuilding(ws[0],ws[1],wid,0)){var wa=ws[1]*MW+ws[0];L[wa]=Math.min(L[wa],2);S.cash-=wc2*0.5;wneed-=(BYT[OBJ[wid].t].wc||80);made++;msgs.push(TOOLS[wid].name.toLowerCase());}
      else break;

    while(sneed>0&&made<5&&st<4){
      st++;var scost=costFor('sew',0);
      if(S.cash<scost*3&&!S.sandbox)break;

      if(placeBuilding(ss[0],ss[1],'sew',0)){var sa=ss[1]*MW+ss[0];L[sa]=Math.min(L[sa],2);S.cash-=scost*0.5;sneed-=150;made++;msgs.push('sewage plant');}else break;
    }
  }
  if(P.gb>=6){
    var gdem=e.gb>0.01?(g.garbCap+g.act.recy*120+g.act.wte*200)/e.gb:S.pop*0.04,gneed=gdem*1.1-(g.garbCap+g.act.recy*120+g.act.wte*200),gt=0;

    }

function damageTile(i,n){

}
function relief(){
  if(S.approval>45){var c=Math.round(2500+S.pop*2.5);S.cash+=c;addNews('Disaster relief: federal aid sends '+money(c)+' to the treasury.','good');}
}
function startFire(i){

    var c=[],k;for(k=0;k<N;k++){if(flammable(k)&&(T[k]!==EMPTY||TER[k]===FOREST))c.push(k);}
    if(!c.length)return;i=pick(c);

function quake(){

}
function quakeBody(){
  var c=[],k,i;for(k=0;k<N;k++){if(T[k]!==EMPTY)c.push(k);}
  if(!c.length)c.push(rnd(N));
  var ep=pick(c),ex=ep%MW,ey=(ep/MW)|0,hit=0;
  for(i=0;i<N;i++){
    var d=Math.abs(i%MW-ex)+Math.abs(((i/MW)|0)-ey);

    else if(T[i]===RES||T[i]===COM||T[i]===IND)L[i]=Math.max(0,L[i]-1-(Math.random()<0.4*rf?1:0));
    else if(T[i]!==ROAD&&Math.random()<0.25&&!hardened(T[i]===SUB?T[rootOf(i)]:T[i]))clearAt(i);

function flood(){

function tornado(){

  if(side===0){x=0;y=rnd(MH);dx=1;dy=rnd(3)-1;}
  else if(side===1){x=MW-1;y=rnd(MH);dx=-1;dy=rnd(3)-1;}
  else if(side===2){x=rnd(MW);y=0;dx=rnd(3)-1;dy=1;}
  else{x=rnd(MW);y=MH-1;dx=rnd(3)-1;dy=-1;}

function stepDisasters(g){

}
function stepDisastersBody(g){
  var i,k,list=[];
  for(i=0;i<N;i++){if(F[i]>0)list.push(i);if(FLD[i]>0)FLD[i]--;}
  for(k=0;k<list.length;k++){

    var nn=nb4(i);
    for(var q=0;q<nn.length;q++){
      var n=nn[q];
      if(F[n]===0&&flammable(n)&&Math.random()<(g.fireC[n]?0.08:(T[i]===BATT?0.55:0.3)))F[n]=3+rnd(2);
    }
    if(F[i]===0){
      if(T[i]===EMPTY&&TER[i]===FOREST)TER[i]=GRASS;

  }

      tr.x+=tr.dx;tr.y+=tr.dy;if(Math.random()<0.4)tr.y+=rnd(3)-1;if(Math.random()<0.2)tr.x+=rnd(3)-1;
      if(tr.x<0||tr.y<0||tr.x>=MW||tr.y>=MH){tr.steps=0;break;}

  }

function triggerDisaster(kind){

/* ================= events ================= */

function evW(ev){return ev.w*(ev.dis?disMit():1);}

function fireEvent(){
  var pool=EVENTS.filter(function(ev){return (S.disasters!==false||!ev.dis)&&(!ev.need||ev.need(E));}),tot=0,i;
  if(!pool.length)return;

}

/* ================= development ================= */
function tryMerge(e,type,dem){
  if(dem<0.1||Math.random()>0.3*e.appetite)return;
  var g=e.g,f=g.flags,cands=[],x,y;
  for(y=0;y<MH-1;y++)for(x=0;x<MW-1;x++){
    var a=y*MW+x,b=a+1,c2=a+MW,d2=a+MW+1;
    if(T[a]!==type||T[b]!==type||T[c2]!==type||T[d2]!==type)continue;
    if(L[a]<3||L[b]<3||L[c2]<3||L[d2]<3)continue;
    if(f[a]!==7||f[b]!==7||f[c2]!==7||f[d2]!==7)continue;
    if(F[a]||F[b]||F[c2]||F[d2])continue;
    if(type===RES&&g.parkCov<0.3)continue;
    cands.push(a);
  }
  if(!cands.length)return;
  var a2=pick(cands),tiles=[a2,a2+1,a2+MW,a2+MW+1],lvl=Math.round((EL[a2]+EL[a2+1]+EL[a2+MW]+EL[a2+MW+1])/4),k;
  for(k=0;k<4;k++){var t=tiles[k];T[t]=SUB;PAR[t]=a2;L[t]=0;EL[t]=lvl;ORI[t]=0;}
  T[a2]=type===RES?MRES:MCOM;L[a2]=4;PAR[a2]=a2;ORI[a2]=0;
  if(!S.megaSeen){S.megaSeen=true;addNews('Developers are merging four tall lots into a single mega '+(type===RES?'residential tower.':'skyscraper.'),'good');}
}
function develop(e){
  var g=e.g,f=g.flags,kinds=[[RES,e.Rdem],[COM,e.Cdem],[IND,e.Idem]],i;
  for(var q=0;q<3;q++){
    var type=kinds[q][0],dem=kinds[q][1],elig=[],built=[];
    for(i=0;i<N;i++){
      if(T[i]!==type)continue;
      if(L[i]>0)built.push(i);
      if(f[i]===7&&L[i]<3&&F[i]===0&&FLD[i]===0){
        if(type===RES&&L[i]===2&&g.parkCov<0.3)continue;
        elig.push(i);
      }
    }
    if(dem>0.03&&elig.length){
      var n=Math.round(dem*e.appetite*(1+elig.length*0.14)*(0.5+Math.random()*1.5));
      if(n<1&&dem>0.12&&Math.random()<Math.min(1,dem*e.appetite*1.5))n=1;
      n=Math.min(n,elig.length);
      for(var k=0;k<n;k++){
        var fresh=elig.filter(function(ix){return L[ix]===0;});
        var pool=(fresh.length&&Math.random()<0.75)?fresh:elig;
        var ti=pool[rnd(pool.length)];
        L[ti]=Math.min(3,L[ti]+1);elig.splice(elig.indexOf(ti),1);
      }
    }
    if(S.pop>=30&&built.length&&dem<-0.45&&Math.random()<0.3)L[built[rnd(built.length)]]--;
  }
  for(i=0;i<N;i++){
    var t=T[i];
    if((t===RES||t===COM||t===IND)&&L[i]>0&&f[i]!==7&&Math.random()<0.04)L[i]--;
  }
  tryMerge(e,RES,e.Rdem);tryMerge(e,COM,e.Cdem);
}

/* ================= monthly tick ================= */
function tick(){
  var e=computeEconomy();
  stepMacro(e);
  S.cash+=e.net;S.shopFill=e.shopFill;
  var delta=(e.targetPop-S.pop)*(e.targetPop<S.pop?0.05:0.15);
  if(delta<0)delta=Math.max(delta,-0.04*S.pop-1);
  if(Math.abs(delta)<1&&Math.abs(e.targetPop-S.pop)>=1)delta=delta<0?-1:1;
  S.pop=Math.max(0,Math.round(S.pop+delta));
  S.hs=(S.hs===undefined)?e.h:S.hs+(e.h-S.hs)*0.12;
  S.xp=clamp((S.xp||0)+(e.h>0.85?0.0015:e.h<0.6?-0.0008:0),0,0.5);
  if(e.g.resCap===0&&S.pop<3)S.pop=0;
  S.approval+=(e.apprTarget-S.approval)*0.2;
  if(S.approval>92)S.approval=92;  /* one-off boosts cannot lift anyone past 92% */
  stepResearch(e);E=e;stepInfra(e);stepWaste(e);stepFund(e);stepReserves(e);stepConstruction();stepRepair(e);stepPlanners(e);stepPP(e);stepKard(e);stepEra(e);stepAuto(e);stepMeta(e);stepBatteries(e.g);stepFirms();stepSwan(e);stepOffice(e);
  stepDisasters(e.g);
  develop(e);
  S.month++;
  if(S.month>=10&&S.month-S.lastEvent>5&&S.pop>=60&&Math.random()<0.09*dm('ev'))fireEvent();
  runScheduled();maybeMacro();
  var hh=S.hist;
  hh.rate.push(S.rate);hh.infl.push(S.infl);hh.mort.push(S.mort);hh.hpi.push(S.hpi);hh.supply.push(1+shk());hh.pop.push(S.pop);hh.mkt.push(S.mkt);
  if(hh.rate.length>180){for(var key in hh){hh[key].shift();}}
  if(S.pop>S.peak)S.peak=S.pop;
  var r=rankIdx(S.peak);
  if(r>S.rank){S.rank=r;toast('Your city is now a '+RANKS[r][1]);addNews('Census: your city has grown into a '+RANKS[r][1]+'.','good');}
  if(!S.won&&S.peak>=3500){S.won=true;addNews('Metropolis! Your skyline is the envy of the region. Keep it thriving.','good');}
  checkScenario(e);advisorTick(e);prunePop();
  if(S.sandbox){S.cash=Math.max(S.cash,50000000);}
  if(S.approval>92)S.approval=92;
  if(S.approval<25&&!S.sandbox)S.lowApproval++;else S.lowApproval=0;
  var cashFloor=(e.costs>100000)?-e.costs*1.5:-4000;
  if(S.cash<cashFloor&&!S.sandbox)S.lowCash++;else S.lowCash=0;
  if(!S.sandbox&&S.cash<0&&S.cash>=cashFloor&&S.month%3===0)toast('Overdrawn. Borrow, raise taxes or cut costs.');
  if(S.lowApproval>=8&&(S.office||{mode:'mayor'}).mode==='mayor')startRecall();
  if(S.lowCash>=2&&(S.office||{mode:'mayor'}).mode!=='receiver')startReceivership();
  if(S.month%6===0)save();
  dirty=true;mmDirty=true;ui();
}
function endGame(kind){
  S.over=kind;speed=0;
  var best=parseInt(fetchStore(BEST_KEY)||'0',10)||0;
  if(S.peak>best)store(BEST_KEY,String(S.peak));
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  showSplash('over');ui();
}

/* ================= building ================= */
function spend(c){
  if(!S.sandbox&&S.cash<c){toast('Not enough cash. You need '+money(c)+'.');sfx('bad');return false;}
  S.cash-=c;if(undoFrame)undoFrame.spent+=c;return true;
}
function techLocked(id){var o=OBJ[id];return o&&o.tech&&!S.tech[o.tech];}
function nearWater(i){var nn=nb4(i);for(var k=0;k<nn.length;k++){if(TER[nn[k]]===WATER)return true;}return false;}
function buildable(i){return TER[i]!==WATER&&TER[i]!==ROCK&&T[i]===EMPTY;}
function place(i,id,t){
  if(!spend(costFor(id,i)))return false;
  rec(i);T[i]=t;L[i]=(OBJ[id]&&OBJ[id].build)||0;B[i]=0;if(TER[i]===FOREST)TER[i]=GRASS;return true;
}
var distState=null;
function distRect(a,b){
  var x0=Math.min(a%MW,b%MW),x1=Math.max(a%MW,b%MW),y0=Math.min((a/MW)|0,(b/MW)|0),y1=Math.max((a/MW)|0,(b/MW)|0);
  x1=Math.min(x1,x0+15);y1=Math.min(y1,y0+15);
  return {x0:x0,x1:x1,y0:y0,y1:y1};
}
function planDistrict(kind,a,b){
  var r=distRect(a,b),mix=DIST[kind],roads=[],zones=[],cost=0,x,y;
  function ok(i){return T[i]===EMPTY&&TER[i]!==WATER&&TER[i]!==ROCK;}
  for(y=r.y0;y<=r.y1;y++){
    var roadRow=((y-r.y0)%3===0)||y===r.y1;
    for(x=r.x0;x<=r.x1;x++){
      var i=y*MW+x;if(!ok(i))continue;
      var roadCol=(x===r.x0)||(x===r.x1)||((x-r.x0)%8===0);
      if(roadRow||roadCol){roads.push(i);cost+=costFor('road',i);}
      else{
        var q=hash2(x,y,17),zt=q<mix.homes?RES:(q<mix.homes+mix.shops?COM:IND),zid=zt===RES?'res':(zt===COM?'com':'ind');
        zones.push([i,zt]);cost+=costFor(zid,i);
      }
    }
  }
  return {rect:r,roads:roads,zones:zones,cost:cost};
}
function buildDistrict(plan){
  if(!spend(plan.cost))return false;
  var k,i;
  for(k=0;k<plan.roads.length;k++){i=plan.roads[k];rec(i);T[i]=ROAD;L[i]=0;B[i]=0;if(TER[i]===FOREST)TER[i]=GRASS;}
  for(k=0;k<plan.zones.length;k++){i=plan.zones[k][0];rec(i);T[i]=plan.zones[k][1];L[i]=0;B[i]=0;if(TER[i]===FOREST)TER[i]=GRASS;}
  return true;
}
function placeBuilding(ax,ay,id,rot){
  var o=OBJ[id],sz=sizeOf(id,rot),tiles=footTiles(ax,ay,sz),a=ay*MW+ax,k,sum=0;
  var full=costFor(id,a),price=o.phased?Math.ceil(full/bMon(o)):full;
  if(!spend(price))return false;
  if(o.phased)S.phasePay[a]=price;
  for(k=0;k<tiles.length;k++)sum+=EL[tiles[k]];
  var lvl=Math.round(sum/tiles.length);
  for(k=0;k<tiles.length;k++){var t=tiles[k];rec(t);T[t]=SUB;PAR[t]=a;EL[t]=lvl;L[t]=0;B[t]=0;ORI[t]=0;if(TER[t]===FOREST)TER[t]=GRASS;}
  T[a]=o.t;L[a]=bMon(o)||0;PAR[a]=a;ORI[a]=(rot&&sz[0]!==sz[1])?1:0;
  return true;
}
var pending=null;
var lastToastKey='';
function say(k,msg){if(k!==lastToastKey){lastToastKey=k;toast(msg);}}
var buildRot=0;
function startClock(){if(S&&S.started===false){S.started=true;speed=1;toast('Time is running. Use the pause button any time.');}}
function act(i,first){
  if(locked()&&tool!=='inspect'){if(first)lockMsg();return;}
  var own=!undoFrame;if(own)beginUndo();
  var c0=S.cash;
  try{doAct(i,first);}finally{if(own)commitUndo();}
  if(tool!=='inspect'&&S.started===false&&S.cash<c0)startClock();
}
function beginUndo(){undoFrame={t:{},spent:0};}
function commitUndo(){
  if(undoFrame&&Object.keys(undoFrame.t).length){undoStack.push(undoFrame);if(undoStack.length>30)undoStack.shift();}
  undoFrame=null;
}
var undoStack=[];
function undoLast(){
  var f=undoStack.pop();
  if(!f){toast('Nothing to undo.');return;}
  for(var k in f.t){var v=f.t[k],i=+k;T[i]=v[0];L[i]=v[1];B[i]=v[2];PAR[i]=v[3];TER[i]=v[4];EL[i]=v[5];F[i]=v[6];ORI[i]=v[7];PU[i]=v[8]||0;}
  S.cash+=f.spent;pending=null;dirty=true;mmDirty=true;toast('Undone. '+money(f.spent)+' refunded.');ui();
}
function doAct(i,first){
  var t=T[i],ok=false,o=OBJ[tool];
  if(tool!=='inspect'&&pending&&pending.tool!==tool)pending=null;
  if(distState&&distState.tool!==tool)distState=null;
  if(tool==='inspect'){pending=null;inspectIdx=rootOf(i);showTile(i);dirty=true;return;}
  if(tool==='bull'){
    if(T[i]!==EMPTY){
      var rt=rootOf(i),fsz=footSz(rt),ar=fsz[0]*fsz[1];
      var fee=(T[rt]===LF&&L[rt]>=LF_CAP)?Math.ceil(4000*mult()):0;
      if(spend(10*ar+fee)){if(fee)addNews('Capped landfill removed. Environmental cleanup cost '+money(fee)+'.','info');if(T[i]===WATER)T[i]=EMPTY;clearAt(i);ok=true;}
    }
    else if(PU[i]){if(spend(5)){rec(i);PU[i]=0;ok=true;}}
    else if(TER[i]===FOREST){if(spend(10)){TER[i]=GRASS;ok=true;}}
    if(ok){dirty=true;mmDirty=true;ui();}
    return;
  }
  if(DIST[tool]){
    if(!first)return;
    if(!distState||distState.tool!==tool){distState={tool:tool,a:i,b:-1,plan:null};dirty=true;toast('Corner set. Tap the opposite corner.');return;}
    var ds=distState;
    if(ds.b!==i){
      ds.b=i;ds.plan=planDistrict(tool,ds.a,i);dirty=true;
      if(!ds.plan.roads.length&&!ds.plan.zones.length){toast('Nothing buildable in that area.');ds.plan=null;ds.b=-1;return;}
      toast(ds.plan.roads.length+' roads and '+ds.plan.zones.length+' lots for '+money(ds.plan.cost)+'. Tap the same corner again to build.');return;
    }
    ok=buildDistrict(ds.plan);distState=null;if(ok)sfx('big');dirty=true;
    if(ok){mmDirty=true;ui();}
    return;
  }
  if(!o)return;
  if(techLocked(tool)){if(first)toast('Research '+TECHS[o.tech].name+' to unlock this.');return;}
  if(o.req&&S.peak<o.req){if(first)toast('Capital project unlocks at '+o.req.toLocaleString('en-US')+' people.');return;}
  if(o.kmin&&(E?E.kard:0)<o.kmin){if(first)toast('Needs a Type '+(o.kmin===1?'I':'II')+' civilization. Check the Kardashev meter in Economy.');return;}
  if(tool==='pipe'||tool==='ucable'){
    var ubit=tool==='pipe'?1:2;
    if(TER[i]===WATER||TER[i]===ROCK){if(first)toast(TER[i]===WATER?'Pipes and cables cannot run under open water.':'Too rocky to dig.');return;}
    if(PU[i]&ubit)return;
    if(spend(costFor(tool,i))){rec(i);PU[i]|=ubit;ok=true;}
    if(ok){dirty=true;mmDirty=true;ui();}
    return;
  }
  if(tool==='road'){
    if(TER[i]===ROCK){if(first)toast('Too steep. Roads cannot cross mountains.');return;}
    if(TER[i]===WATER){if(T[i]===EMPTY&&spend(Math.ceil(costFor('road')*4))){rec(i);T[i]=ROAD;B[i]=1;ok=true;}}
    else if(T[i]===EMPTY)ok=place(i,'road',ROAD);
  }else if(tool==='res'||tool==='com'||tool==='ind'){
    var zt=o.t;
    if(TER[i]===WATER||TER[i]===ROCK){if(first)toast(TER[i]===WATER?'You cannot zone water.':'Too steep to build on.');return;}
    if(T[i]===EMPTY)ok=place(i,tool,zt);
    else if((t===RES||t===COM||t===IND)&&L[i]===0&&t!==zt){if(spend(costFor(tool,i))){rec(i);T[i]=zt;ok=true;}}
  }else if(sizeOf(tool)[0]*sizeOf(tool)[1]>1){
    if(!first)return;
    var sz=sizeOf(tool,buildRot),anc=anchorFor(i,sz),ax=anc[0],ay=anc[1],err=checkSite(ax,ay,tool,buildRot),key=ay*MW+ax;
    if(err){pending=null;toast(err);sfx('bad');dirty=true;return;}
    if(!pending||pending.tool!==tool||pending.a!==key||pending.rot!==buildRot){
      pending={tool:tool,a:key,rot:buildRot};dirty=true;
      toast(OBJ[tool].phased?'Tap again to start this megaproject: '+money(costFor(tool,key))+' in all, paid as '+money(Math.ceil(costFor(tool,key)/bMon(OBJ[tool])))+' a month.':'Tap the same spot again to build for '+money(costFor(tool,key))+'.');return;
    }
    pending=null;ok=placeBuilding(ax,ay,tool,buildRot);if(ok)sfx('big');
  }else{
    if(!first&&!(tool==='pline'||tool==='pipe'||tool==='ucable'||tool==='rail'))return;
    if(TER[i]===WATER||TER[i]===ROCK){if(first)toast(TER[i]===WATER?'That is water.':'Too steep to build on.');return;}
    if(T[i]!==EMPTY){if(first)toast('That tile is taken. Bulldoze it first.');return;}
    if(o.shore&&!nearWater(i)){if(first)toast('The '+TOOLS[tool].name.toLowerCase()+' must touch the water.');return;}
    ok=place(i,tool,o.t);
  }
  if(ok){if(!bulk){if(!pending)sfx('build');ui();}dirty=true;mmDirty=true;}
}
var inspectIdx=-1;
function showTile(i){

var AU={ctx:null,master:null,sfx:true,music:true,timer:0,step:0};
(function(){try{var d=JSON.parse(localStorage.getItem('sc5000.audio')||'null');if(d){AU.sfx=d.sfx!==false;AU.music=d.music!==false;}}catch(e){}})();
function auSave(){store('sc5000.audio',JSON.stringify({sfx:AU.sfx,music:AU.music}));}
function auInit(){
  if(AU.ctx){try{if(AU.ctx.state==='suspended')AU.ctx.resume();}catch(e){}return;}
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=0.6;AU.master.connect(AU.ctx.destination);}catch(e){AU.ctx=null;return;}
  if(AU.music)musicStart();
}
function tone(f,dur,type,vol,delay,f2){
  if(!AU.ctx)return;
  try{
    var c=AU.ctx,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.08,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfx(n){
  if(seeding)return;
  if(!AU.sfx||!AU.ctx)return;
  if(n==='build'){tone(520,0.07,'square',0.05);tone(780,0.09,'square',0.04,0.05);}
  else if(n==='big'){tone(196,0.18,'triangle',0.09);tone(294,0.18,'triangle',0.08,0.08);tone(392,0.3,'triangle',0.08,0.16);}
  else if(n==='bad'){tone(170,0.18,'sawtooth',0.06,0,120);}
  else if(n==='cash'){tone(880,0.1,'sine',0.07);tone(1320,0.25,'sine',0.06,0.08);}
  else if(n==='ok'){tone(660,0.12,'sine',0.06);tone(880,0.2,'sine',0.05,0.1);}
  else if(n==='crash'){tone(330,0.9,'sawtooth',0.08,0,70);tone(220,1.1,'sine',0.09,0.1,50);}
  else if(n==='siren'){for(var k=0;k<4;k++){tone(600,0.25,'sine',0.06,k*0.5,900);tone(900,0.25,'sine',0.06,k*0.5+0.25,600);}}
}
var CHORDS=[[220,277,330],[196,247,294],[175,220,262],[196,247,330],[165,208,247]];
function musicStep(){
  if(!AU.ctx||!AU.music||document.hidden){AU.timer=setTimeout(musicStep,3000);return;}
  var ch=CHORDS[AU.step%CHORDS.length];AU.step++;
  for(var i=0;i<ch.length;i++){
    try{
      var c=AU.ctx,t0=c.currentTime+i*0.15,o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=ch[i]*(Math.random()<0.2?2:1);
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.025,t0+1.6);g.gain.exponentialRampToValueAtTime(0.0001,t0+5.5);
      o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+5.7);
    }catch(e){}
  }
  if(Math.random()<0.6)tone(ch[2]*2*(Math.random()<0.5?1:1.5),1.4,'triangle',0.015,2+Math.random()*2);
  AU.timer=setTimeout(musicStep,5200);
}
function musicStart(){clearTimeout(AU.timer);if(AU.ctx&&AU.music)musicStep();}
function musicStop(){clearTimeout(AU.timer);}
function setAudio(kind,on){
  if(kind==='sfx')AU.sfx=on;else{AU.music=on;if(on)musicStart();else musicStop();}
  auSave();
}

var SLOT_N=3;
function slotKey(n){return 'sc5000.slot.'+n;}
function slotMeta(n){try{return JSON.parse(fetchStore(slotKey(n)+'.meta'));}catch(e){return null;}}
function saveSlot(n){
  if(!S)return false;
  try{
    localStorage.setItem(slotKey(n),JSON.stringify(snapshot()));
    localStorage.setItem(slotKey(n)+'.meta',JSON.stringify({city:S.city,pop:S.pop,date:dateLabel(S.month)}));
    return true;
  }catch(e){return false;}
}
function loadSlot(n){try{return restore(JSON.parse(fetchStore(slotKey(n))));}catch(e){return false;}}
function deleteSlot(n){try{localStorage.removeItem(slotKey(n));localStorage.removeItem(slotKey(n)+'.meta');}catch(e){}}
function b64FromBytes(buf){
  var b=new Uint8Array(buf),s='',CH=0x8000;
  for(var i=0;i<b.length;i+=CH)s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));
  return btoa(s);
}
function bytesFromB64(str){var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
function exportCode(cb){
  var json=JSON.stringify(snapshot());
  if(typeof CompressionStream!=='undefined'){
    try{
      var st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      new Response(st).arrayBuffer().then(function(buf){cb('SC5K1:'+b64FromBytes(buf));},function(){cb('SC5K0:'+btoa(unescape(encodeURIComponent(json))));});
      return;
    }catch(e){}
  }
  cb('SC5K0:'+btoa(unescape(encodeURIComponent(json))));
}
function importCode(code,cb){
  code=(code||'').replace(/\s+/g,'');
  try{
    if(code.indexOf('SC5K0:')===0){cb(restore(JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))))));return;}
    if(code.indexOf('SC5K1:')===0&&typeof DecompressionStream!=='undefined'){
      var st=new Blob([bytesFromB64(code.slice(6))]).stream().pipeThrough(new DecompressionStream('gzip'));
      new Response(st).text().then(function(t){try{cb(restore(JSON.parse(t)));}catch(e){cb(false);}},function(){cb(false);});
      return;
    }
  }catch(e){}
  cb(false);
}

/* ---------- windfalls: variable rewards with a pity timer ---------- */
var WINDFALLS=[
 {r:'common',w:30,run:function(e){var a=Math.round(Math.max(800,e.revenue*0.4));S.cash+=a;return 'Bumper month: tax receipts beat forecasts by '+money(a)+'.';}},
 {r:'common',w:24,run:function(e){var a=Math.round(1500+S.pop*6);S.cash+=a;return 'An anonymous donor gives the city '+money(a)+' for the public good.';}},
 {r:'common',w:18,run:function(e){S.approval=Math.min(100,S.approval+3);return 'A feel-good headline goes viral. Residents are proud of '+S.city+'.';}},
 {r:'common',w:16,need:function(){return S.rd.active&&TECHS[S.rd.active];},run:function(e){var a=Math.round(Math.min(TECHS[S.rd.active].cost*(0.05+Math.random()*0.07),Math.max(1,rdRate(e.g))*(2+Math.random()*4)));S.rd.pts+=a;return 'Eureka: a lab finds a shortcut and adds '+a+' research points.';}},
 {r:'rare',w:12,run:function(e){var a=Math.round(Math.max(3000,e.revenue*1.6));S.cash+=a;return 'A federal grant is approved: '+money(a)+' lands in the city account.';}},
 {r:'rare',w:10,run:function(e){S.approval=Math.min(100,S.approval+6);S.hpi=Math.min(260,S.hpi*1.03);return 'A magazine names '+S.city+' one of the most livable cities. Approval and home prices rise.';}},
 {r:'rare',w:10,need:function(){return S.rd.active&&TECHS[S.rd.active];},run:function(e){var a=Math.round(Math.min(TECHS[S.rd.active].cost*(0.2+Math.random()*0.15),Math.max(1,rdRate(e.g))*(8+Math.random()*10)));S.rd.pts+=a;return 'Research breakthrough: a lucky result adds '+a+' research points.';}},
 {r:'epic',w:3,run:function(e){var a=Math.round(Math.max(12000,e.revenue*6));S.cash+=a;S.approval=Math.min(100,S.approval+8);return 'Archaeologists unearth a famous ancient site beneath the city. Tourism and pride surge, and '+money(a)+' pours in.';}},
 {r:'epic',w:3,need:function(){return S.rd.active&&TECHS[S.rd.active];},run:function(e){var a=Math.round(Math.min(TECHS[S.rd.active].cost*(0.5+Math.random()*0.3),Math.max(1,rdRate(e.g))*(24+Math.random()*24)));S.rd.pts+=a;return 'Eureka of the decade: your scientists leap ahead by '+a+' research points.';}}
];
function stepWindfall(e){
  var st=S.st;
  if(S.sandbox||S.pop<30||S.month<4||st.sinceWin<4)return;
  var p=0.07+0.006*st.sinceWin;if(S.month<24)p*=1.4;
  p=Math.min(0.25*dm('luck'),p*dm('luck'));
  if(Math.random()>=p)return;
  var u=Math.random(),r=u<0.04?'epic':u<0.28?'rare':'common';
  var pool=WINDFALLS.filter(function(w){return w.r===r&&(!w.need||w.need());}),tot=0,i;
  if(!pool.length)pool=WINDFALLS.filter(function(w){return w.r==='common'&&(!w.need||w.need());});
  for(i=0;i<pool.length;i++)tot+=pool[i].w;
  var x=Math.random()*tot,w=pool[0];
  for(i=0;i<pool.length;i++){x-=pool[i].w;if(x<=0){w=pool[i];break;}}
  var msg=w.run(e);
  st.sinceWin=0;st.wins++;st.winsYear++;if(r==='epic')st.epics++;
  sfx(r==='common'?'cash':'big');
  toast((r==='epic'?'\u2605\u2605 ':r==='rare'?'\u2605 ':'')+msg,r==='common'?3200:4600);
  addNews(msg,r==='common'?'info':'good','Windfall');
  if(r!=='common')chron('win',msg);
}

/* ---------- yearly report ---------- */
function gradeOf(snap,prev){
  var g=55,gr=prev&&prev.pop>0?(snap.pop-prev.pop)/prev.pop:0;
  g+=20*Math.max(-1,Math.min(1,gr/0.15));
  g+=0.3*(snap.appr-55);
  g+=snap.net>0?8:-10;
  g-=12*Math.max(0,Math.abs(snap.infl-2)-1)/3;
  g-=Math.max(0,snap.unemp-6)*0.8;
  if(snap.cash<0)g-=15;
  return g;
}
function letter(g){return g>=85?'A':g>=70?'B':g>=55?'C':g>=40?'D':'F';}
function stepYear(e){
  var st=S.st,prev=S.yrs[S.yrs.length-1],yr=Math.floor(S.month/12);
  var ach=0,k;for(k in S.ach){if(S.ach[k]>=S.month-12)ach++;}
  var snap={y:yr,m:S.month,pop:Math.round(S.pop),cash:Math.round(S.cash),net:Math.round(e.net),appr:Math.round(S.approval),infl:+S.infl.toFixed(1),unemp:Math.round(e.unemp*100),kard:+e.kard.toFixed(2),era:S.era|0,ach:ach,crises:st.crisesYear,wins:st.winsYear};
  var sc=gradeOf(snap,prev);snap.grade=letter(sc);
  var gr=prev&&prev.pop>0?(snap.pop-prev.pop)/prev.pop:0;
  snap.head=snap.cash<0?'A year in the red':st.crisesYear>=2?'A year of storms weathered':snap.infl>5?'Prices ran hot':snap.infl<0?'Prices slipped below zero':gr>0.12&&snap.appr>=60?'A year of growth':gr<-0.03?'A year of decline':snap.appr<35?'A year of discontent':'A steady year';
  S.yrs.push(snap);if(S.yrs.length>400)S.yrs.shift();
  st.crisesYear=0;st.winsYear=0;
  chron('report','Year '+yr+': '+snap.head+', grade '+snap.grade+'.');
  if(yr<=20||yr%5===0)addNews('State of the city, year '+yr+': '+snap.head+'. Grade '+snap.grade+'.','good','Report',null,false,'report');
}

/* ---------- goals: what to do next ---------- */
function nextUps(e){
  var list=[],i,g=e.g;
  if(S.tut<TUT.length)list.push({i:'guide',t:TUT[S.tut].t,p:null,kind:'guide'});
  var resItem=null;
  if(S.rd.active&&TECHS[S.rd.active]){
    var c=TECHS[S.rd.active].cost,rate=rdRate(g),left=Math.max(0,c-S.rd.pts),rmo=rate>0?Math.max(1,Math.ceil(left/rate)):0;
    resItem={i:S.rd.active,t:'Research '+TECHS[S.rd.active].name,p:Math.min(1,S.rd.pts/c),note:rate>0?(rmo>=240?'about '+Math.round(rmo/12)+' game years':'about '+rmo+' months'):'stalled',kind:'research'};
  }
  var best=null;
  for(i=0;i<N;i++){var o=BYT[T[i]];if(o&&o.build&&L[i]>0&&(!best||L[i]<best.l))best={l:L[i],n:TOOLS[o.id].name,b:bMon(o),k:o.id};}
  if(best)list.push({i:best.k,t:'Finish the '+best.n,p:1-best.l/best.b,note:best.l+' months left',kind:'build'});
  var ri=rankIdx(S.pop);
  if(ri<RANKS.length-1&&S.tut>=TUT.length)list.push({i:'rank',t:'Grow to a '+RANKS[ri+1][1].toLowerCase(),p:Math.min(1,(S.pop-RANKS[ri][0])/(RANKS[ri+1][0]-RANKS[ri][0])),note:Math.round(S.pop)+' of '+RANKS[ri+1][0].toLocaleString('en-US')+' people',kind:'rank'});
  if(resItem)list.push(resItem);
  if(S.tech.rockets||e.kard>0.45){
    var lv=Math.floor(e.kard);list.push({i:'kard',t:'Reach Type '+['I','II','III','IV','V','VI'][Math.min(5,lv)],p:Math.min(1,e.kard-lv),note:'rating '+e.kard.toFixed(2)+' of '+(lv+1)+'.0',kind:'kard'});
  }
  if(S.tech.auto&&e.abund>0.55&&S.auto.psc<12)list.push({i:'psc',t:'Reach post-scarcity',p:Math.min(1,e.abund/0.8),note:'abundance '+Math.round(e.abund*100)+'% of 80%',kind:'psc'});
  var near=[];
  for(i=0;i<ACH.length;i++){var a=ACH[i];if(S.ach[a.id]!==undefined||!a.p)continue;var pv=0;try{pv=a.p(e);}catch(x){pv=0;}if(pv>0&&pv<1)near.push({i:'ach',t:'Achievement: '+a.name,p:pv,note:a.desc,kind:'ach',tier:a.tier});}
  near.sort(function(x,y){return y.p-x.p;});
  for(i=0;i<near.length&&i<3;i++)list.push(near[i]);
  return list;
}
function goalShort(e){
  var l=nextUps(e);if(!l.length)return {text:'No goals right now',p:0};
  var f=l[0];return {text:f.t+(f.note?' ('+f.note+')':''),p:f.p===null?0:f.p};
}
function goalsHTML(e){
  var l=nextUps(e),h='<h3>Next up</h3>',i;
  if(!l.length)h+='<p class="hint">Nothing queued. Start a research project or plan something big.</p>';

    var x=l[i];
    h+='<div class="goal"><div class="gt"><b>'+(x.i&&ICONS[x.i]?'<span class="gi2">'+ico(x.i,17)+'</span>':'')+x.t+'</b>'+(x.note?'<small>'+x.note+'</small>':'')+'</div>'+(x.p===null?'':'<div class="prog"><i style="width:'+Math.round(x.p*100)+'%"></i></div>')+'</div>';

/* ---------- score and shareable code ---------- */
function scoreParts(){
  var k=E?E.kard:0,years=Math.min(200,Math.floor(S.month/12));
  var emp=E&&E.unemp!==undefined?Math.round((1-Math.max(0,Math.min(1,E.unemp)))*500):0;
  var bal=(E&&E.net!==undefined&&E.net>=0)?500:0;
  return [['Peak population',Math.floor(S.peak/2)],['Years in office (to 200)',years*10],['Achievements ('+achCount()+')',achCount()*40],['Voter approval',Math.round(S.approval*8)],['Jobs',emp],['Balanced budget',bal],['Kardashev rating',Math.floor(120*k*k)],['Eras reached',(S.era|0)*30],['Comebacks, less scandals',Math.max(0,(S.comebacks|0)*150-(S.scandalsTotal|0)*30)]];
}
function scoreOf(){var s=0,p=scoreParts();for(var i=0;i<p.length;i++)s+=p[i][1];return Math.round(s*dm('score'));}
function hash5(str){var h=5381;for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}return (h>>>0).toString(36).slice(0,5);}
function b64e(s){try{return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(x){return '';}}
function b64d(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}catch(x){return '';}}
function encodeScore(){
  var data=[S.city.slice(0,24),Math.floor(S.month/12),Math.round(S.peak),+(E?E.kard:0).toFixed(2),S.era|0,achCount(),scoreOf(),Math.round(S.approval),S.diff||'normal'];
  var body=b64e(JSON.stringify(data));
  return 'SC5K1.'+body+'.'+hash5(body);
}
function decodeScore(code){
  var m=(code||'').trim().split('.');
  if(m.length!==3||m[0]!=='SC5K1'||hash5(m[1])!==m[2])return null;
  var s=b64d(m[1]),d;try{d=JSON.parse(s);}catch(x){return null;}
  if(!d||d.length<8)return null;
  return {city:String(d[0]),years:d[1],peak:d[2],kard:d[3],era:d[4],ach:d[5],score:d[6],appr:d[7],diff:(d[8]&&DIFF[d[8]])?d[8]:'normal'};
}

var BLOCS=[['homeowners','Homeowners',0.25],['renters','Renters',0.20],['business','Business owners',0.15],['workers','Workers',0.20],['retirees','Retirees',0.10],['young','Young residents',0.10]];
var CARE_NAMES=['Margaret Ellis','Raymond Cho','Dolores Vance','Walter Okafor','Priya Raman','Gordon Pike','Lucinda Marsh','Tomas Ibarra'];
var PERSONA_TXT={smallgov:'a small-government conservative who cuts taxes and trims spending',biggov:'an activist who raises taxes and spends more on services',austerity:'an austerity board'};

  'A contractor is caught kicking back money to a city hall insider.',

/* ---- voting blocs: approval is the weighted view of six groups with different worries ---- */
function blocCalc(v){
  var tx=v.tx,hp=clamp((v.hpi-100)/100,-1.3,1.3),i,adj={},list=[],mw=0,h=S&&S.office&&S.office.hostile;
  adj.homeowners=-(tx.prop-1)*8+hp*6-(v.mort-5)*1.2;
  adj.renters=-hp*6+6*(v.socCov-0.5)-(tx.sales-6)*0.8;
  adj.business=-(tx.corp-6)*1.5+clamp((v.mkt-100)/100*6,-6,6);
  adj.workers=-v.unemp*60-(tx.inc-9)*1.2+4*clamp(v.tight,0,1);
  adj.retirees=8*(v.hc-0.5)-(v.infl-2)*2.5-(tx.prop-1)*5;
  adj.young=8*(v.schCov-0.5)-hp*5-v.unemp*30;
  for(i=0;i<BLOCS.length;i++){
    var id=BLOCS[i][0],a=clamp(adj[id],-14,14);
    if(h&&h.id===id&&S.month<h.until)a-=10;
    mw+=BLOCS[i][2]*a;
    list.push({id:id,name:BLOCS[i][1],w:BLOCS[i][2],adj:a,appr:clamp(v.appr+a,0,100)});
  }
  return {list:list,mw:mw};
}
