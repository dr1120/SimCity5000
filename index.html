function officeInit(){
  if(!S.office)S.office={mode:'mayor'};
  if(!S.mayors)S.mayors=[];
  if(!S.mayors.length)openTenure('you',S.city||'You','');
  S.recalls=S.recalls|0;S.receiverships=S.receiverships|0;S.comebacks=S.comebacks|0;S.scandalsTotal=S.scandalsTotal|0;S.pcap=S.pcap||0;
}
function openTenure(who,name,persona){
  S.mayors.push({who:who,name:name,persona:persona||'',from:S.month,to:null,popFrom:Math.round(S.pop),popTo:null,apprFrom:Math.round(S.approval),apprTo:null,peak:Math.round(S.pop),how:'',scandals:0,apprSum:0,apprN:0});
}
function closeTenure(how){
  var t=S.mayors[S.mayors.length-1];if(!t||t.to!==null)return;
  t.to=S.month;t.popTo=Math.round(S.pop);t.apprTo=Math.round(S.approval);t.how=how;
}
function curTenure(){return S.mayors[S.mayors.length-1];}
function newCamp(){return {rt:0,pts:0,used:{},cool:{},fix:'',noise:(Math.random()+Math.random()-1)*3};}

/* ---- recall: the voters show you the door, but the city carries on ---- */
function readStance(){
  var tx=S.tax,sp=S.sp,e=E||{};
  var spend=(sp.svc+sp.safety+sp.health+sp.edu+sp.infra)/5;
  var big=(tx.inc-9)/3+(tx.sales-6)/2+(tx.prop-1)/0.4+(tx.corp-6)/4+(spend-1)/0.2;   /* positive: high taxes and generous spending */
  var gap=(e.taylor!==undefined)?S.rate-e.taylor:0;                                    /* positive: tighter money than the guide */
  return {big:big,gap:gap};
}
function choosePersona(st){
  if(Math.abs(st.big)<0.25)return Math.random()<0.5?'smallgov':'biggov';
  return st.big>0?'smallgov':'biggov';
}
/* the caretaker governs by the opposite playbook: opposite taxes and spending, opposite ordinances, opposite money */
function applyStance(P,st){
  var tx=S.tax,sp=S.sp,o=S.office;
  o.bias=st.gap<=0?0.75:-0.75;
  if(P==='smallgov'){
    tx.inc=7;tx.sales=5;tx.prop=0.9;tx.corp=5;sp.svc=0.9;sp.safety=0.95;sp.health=0.9;sp.edu=0.9;sp.infra=0.9;
    o.log.push('Cut income tax to 7%, sales tax to 5% and business tax to 5%, and trimmed spending.');
  }else{
    tx.inc=11;tx.sales=7;tx.prop=1.2;tx.corp=7;sp.svc=1.15;sp.safety=1.1;sp.health=1.2;sp.edu=1.2;sp.infra=1.1;
    o.log.push('Raised income tax to 11%, sales tax to 7% and business tax to 7%, and boosted services.');
  }
  var flipped=[];['recycle','clean','transit','retrofit'].forEach(function(k){S.ord[k]=!S.ord[k];flipped.push((S.ord[k]?'adopted ':'repealed ')+k);});
  o.log.push('Reversed your ordinances: '+flipped.join(', ')+'.');
  o.log.push('Set interest rates '+(o.bias>0?'tighter':'looser')+' than you did.');
}
function startRecall(){
  if(!S.office||S.office.mode!=='mayor'||S.sandbox)return;
  officeInit();closeTenure('recalled');
  var st=readStance(),P=choosePersona(st),nm=pick(CARE_NAMES);
  S.recalls++;
  S.office={mode:'caretaker',persona:P,name:nm,since:S.month,why:'recall',popAt:Math.round(S.pop),apprAt:Math.round(S.approval),camp:newCamp(),log:[],fix:[],hostile:null,bias:0,stance:st};
  S.pcap=clamp(25+achCount()*2+Math.min(15,(S.pp&&S.pp.built?S.pp.built.length:0)*5),0,80);
  applyStance(P,st);
  S.ord.repair=true;S.ord.planners=true;S.lowApproval=0;
  openTenure('caretaker',nm,P);
  S.approval=Math.max(S.approval,32);
  addNews('You have been recalled. '+nm+', '+PERSONA_TXT[P]+', is now running the city, and will govern the opposite way to you. You have 30 minutes of running time to campaign for the job back.','bad','Politics');
  chron('crisis','Recalled by voters. '+nm+' takes over as caretaker mayor.');
  toast('Recalled. A caretaker is in charge. Open the Campaign sheet.',5200);sfx('bad');
  if(typeof setTimeout==='function')setTimeout(function(){if(S&&locked()&&!sheetKind&&!splashOpen)openSheet('camp');},400);
}

/* ---- receivership instead of bankruptcy ---- */
var SELLABLE=['airport','metro','univ','exch','conv','stadium','dc','lab','bio','stn'];
function boardSell(n){
  var sold=0,gain=0,names=[],k,i;
  for(k=0;k<SELLABLE.length&&sold<n;k++){
    var o=OBJ[SELLABLE[k]];if(!o)continue;
    for(i=0;i<N&&sold<n;i++){
      if(T[i]===o.t&&(PAR[i]===i||PAR[i]===-1)){gain+=o.cost*0.4;names.push(TOOLS[SELLABLE[k]].name.toLowerCase());clearAt(i);sold++;}
    }
  }
  if(sold){S.cash+=gain;dirty=true;mmDirty=true;addNews('The control board sold '+names.join(', ')+' for '+money(gain)+' to cut the city\u2019s running costs.','warn','Politics');}
  return sold;
}
function startReceivership(){
  if(!S.office||S.office.mode==='receiver'||S.sandbox)return;
  officeInit();closeTenure('receivership');
  var costs=Math.max(6000,(E&&E.costs)||6000),tx=S.tax,sp=S.sp;
  S.receiverships++;
  S.office={mode:'receiver',persona:'austerity',name:'The Financial Control Board',since:S.month,why:'bankruptcy',popAt:Math.round(S.pop),apprAt:Math.round(S.approval),ok:0,log:[],fix:[],camp:null,hostile:null};
  S.office.old={svc:sp.svc,safety:sp.safety,health:sp.health,edu:sp.edu,infra:sp.infra};
  tx.inc=Math.max(tx.inc,11);tx.sales=Math.max(tx.sales,7);
  sp.svc=Math.min(sp.svc,0.85);sp.safety=Math.min(sp.safety,0.9);sp.health=Math.min(sp.health,0.9);sp.edu=Math.min(sp.edu,0.9);
  sp.infra=Math.min(sp.infra,0.8);
  S.cash=Math.max(S.cash,0)+costs*8;boardSell(3);
  S.office.log.push('Raised taxes, trimmed spending and sold surplus city assets. Infrastructure renewal stays funded.');
  S.ord.repair=true;S.ord.planners=true;S.lowCash=0;S.approval=Math.max(0,S.approval-5);
  openTenure('board','The Financial Control Board','austerity');
  addNews('The city has run out of money. A financial control board has taken over, raised taxes, cut services and sold assets. It stays until the city is solvent again.','bad','Politics');
  chron('crisis','Financial control board takes over after a bankruptcy.');
  toast('Receivership. A control board is in charge until the city is solvent.',5200);sfx('bad');
}

/* ---- the caretaker (and the control board) run the city every month ---- */
function caretakerGovern(e){
  var o=S.office,tx=S.tax,sp=S.sp,costs=Math.max(1,e.costs||1),i;
  var tg=Math.round((e.taylor+(o.bias||0))*4)/4;
  if(Math.abs(tg-S.rate)>=0.25)S.rate=clamp(Math.round((S.rate+(tg>S.rate?1:-1)*Math.min(0.5,Math.abs(tg-S.rate)))*4)/4,0,RATE_MAX);
  S.ord.repair=true;S.ord.planners=true;
  if(S.month%6===0){
    var deficit=e.net<0&&S.cash<costs*24,surplus=e.net>costs*(o.mode==='receiver'?0.12:0.3)&&S.cash>costs*(o.mode==='receiver'?4:12);
    var cutSvc=function(){var done=false;[['svc',0.8],['safety',0.85],['health',0.8],['edu',0.8]].forEach(function(p){if(sp[p[0]]>p[1]){sp[p[0]]=Math.max(p[1],Math.round((sp[p[0]]-0.05)*100)/100);done=true;}});return done;};
    if(o.mode==='receiver'){
      if(deficit&&tx.inc<12)tx.inc=Math.min(12,tx.inc+1);
      else if(surplus&&tx.inc>9)tx.inc=Math.max(9,tx.inc-0.5);
    }else if(o.persona==='smallgov'){
      /* cuts spending before it raises taxes, and hands any surplus back as tax cuts */
      if(deficit){if(!cutSvc()&&tx.inc<12)tx.inc=Math.min(12,tx.inc+0.5);}
      else if(surplus&&tx.inc>5)tx.inc=Math.max(5,tx.inc-0.5);
    }else{
      /* raises taxes before it cuts services, and spends any surplus on services */
      if(deficit){if(tx.inc<13)tx.inc=Math.min(13,tx.inc+1);else cutSvc();}
      else if(surplus){['svc','safety','health','edu'].forEach(function(k){if(sp[k]<1.3)sp[k]=Math.min(1.3,Math.round((sp[k]+0.05)*100)/100);});}
    }
    if(e.net<0&&S.cash<costs*6&&tx.sales<8)tx.sales=Math.min(8,tx.sales+0.5);
  }
  /* mistakes: a competent caretaker, but not a perfect one */
  if(o.mode==='caretaker'&&S.month%3===0&&!o.fix.length&&Math.random()<0.04*dm('ev')){
    var k=pick(['cut','tax','neglect','scandal']);
    if(k==='cut'){o.fix.push({kind:'cut',until:S.month+24,old:[sp.svc,sp.safety,sp.health,sp.edu]});sp.svc=Math.max(0.6,sp.svc-0.2);sp.safety=Math.max(0.6,sp.safety-0.2);sp.health=Math.max(0.6,sp.health-0.2);sp.edu=Math.max(0.6,sp.edu-0.2);o.log.push('Cut services across the board to save money.');}
    else if(k==='tax'){o.fix.push({kind:'tax',until:S.month+18,old:[tx.inc]});tx.inc=Math.min(14,tx.inc+2);o.log.push('Raised income tax two points on a hunch.');}
    else if(k==='neglect'){o.fix.push({kind:'neglect',until:S.month+12,old:[S.renew]});S.renew=0.7;o.log.push('Let infrastructure renewal slip for a year.');}
    else scandalHit('The caretaker\u2019s office is dragged into a scandal.');
  }
  for(i=o.fix.length-1;i>=0;i--){
    var f=o.fix[i];if(S.month<f.until)continue;
    if(f.kind==='cut'){sp.svc=f.old[0];sp.safety=f.old[1];sp.health=f.old[2];sp.edu=f.old[3];}
    else if(f.kind==='tax')tx.inc=f.old[0];
    else if(f.kind==='neglect')S.renew=f.old[0];
    o.fix.splice(i,1);
  }
  if(o.log.length>8)o.log.splice(0,o.log.length-8);
}

/* ---- scandals ---- */
function scandalHit(txt){
  var t=curTenure();S.scandalsTotal++;if(t)t.scandals++;
  S.approval=Math.max(0,S.approval-(8+Math.random()*6));S.scand=(S.scand||0)+4;
  addNews('Scandal: '+(txt||pick(SCANDALS)),'bad','Politics');chron('crisis','Scandal at city hall.');sfx('bad');
}
function stepOffice(e){
  officeInit();
  var o=S.office,t=curTenure();
  if(t){t.apprSum+=S.approval;t.apprN++;t.peak=Math.max(t.peak,Math.round(S.pop));}
  S.recallPen=Math.max(0,(S.recallPen||0)-0.1);S.scand=Math.max(0,(S.scand||0)-0.05);
  if(S.ord.transparency)S.cash-=0.002*Math.max(0,e.costs||0);
  /* scandal odds rise with graft risk and fall with transparency */
  if(S.month>24&&S.pop>=150&&!S.sandbox){
    var p=0.0012*(1+0.25*(S.pp&&S.pp.built?S.pp.built.length:0))*(S.ord.transparency?0.4:1)*dm('ev');
    if(Math.random()<p)scandalHit();
  }
  if(o.mode==='caretaker'||o.mode==='receiver')caretakerGovern(e);
  if(o.mode==='receiver'){
    var costs=Math.max(1,e.costs||1);
    if(S.cash>=costs*3&&e.net>0)o.ok=(o.ok|0)+1;else o.ok=0;
    o.months=(o.months|0)+1;
    if(e.net<0&&o.months%12===0){var sd=boardSell(2);if(!sd)o.log.push('Nothing left to sell, and the books are still in the red.');}
    if(o.months>=120&&o.ok<12){S.cash=Math.max(S.cash,0)+costs*6;o.log.push('After ten years of austerity the state forgave the shortfall.');addNews('After ten years of austerity the state steps in, forgives the shortfall and hands the city back.','info','Politics');endReceivership();return;}
    if(o.ok>=12)endReceivership();
  }
  if(o.mode==='caretaker'&&o.camp)o.camp.noise=clamp(o.camp.noise+(Math.random()-0.5)*0.8,-4,4);
}
function endReceivership(){
  closeTenure('solvent again');
  var old=S.office.old;if(old){S.sp.svc=Math.max(S.sp.svc,old.svc);S.sp.safety=Math.max(S.sp.safety,old.safety);S.sp.health=Math.max(S.sp.health,old.health);S.sp.edu=Math.max(S.sp.edu,old.edu);S.sp.infra=Math.max(S.sp.infra,old.infra);}
  S.renew=Math.max(S.renew,1);S.tax.inc=Math.min(S.tax.inc,11);S.tax.sales=Math.min(S.tax.sales,7);
  S.office={mode:'mayor'};S.approval=Math.max(S.approval,35);S.recallPen=Math.max(S.recallPen||0,4);S.lowCash=0;S.lowApproval=0;
  S.backBlack=true;
  openTenure('you',S.city||'You','');
  addNews('The city is solvent again. The control board hands the keys back to you.','good','Politics');chron('good','Control board steps aside. The mayor returns.');toast('Solvent again. You are back in charge.',4800);
}

/* ---- the campaign ---- */
function campaignClock(ms,force){
  if(!S||!S.office||S.office.mode!=='caretaker'||S.over)return;
  var c=S.office.camp;if(!c)return;
  var d=force?ms:Math.min(ms,500);
  c.rt+=d;S.pcap=Math.min(100,(S.pcap||0)+d/60000);
  if(c.rt>=CAMP_MS)resolveElection();
}
function supportCalc(){
  var o=S.office,c=o.camp,you=null,i;
  for(i=S.mayors.length-1;i>=0;i--){if(S.mayors[i].who==='you'){you=S.mayors[i];break;}}
  var avg=you&&you.apprN?you.apprSum/you.apprN:50;
  var pTo=you?(you.popTo!==null?you.popTo:S.pop):S.pop,gr=you?(pTo-you.popFrom)/Math.max(50,you.popFrom):0;
  var legacy=clamp((avg-50)*0.25,-12,12)+clamp(gr*20,-6,6)-3*Math.max(0,(S.recalls|0)-1)-2*(you?you.scandals:0);
  var dPop=(S.pop-o.popAt)/Math.max(50,o.popAt)*100,dAp=S.approval-o.apprAt;
  var trend=clamp(dPop*0.4,-10,10)+clamp(dAp*0.3,-10,10);
  var sup=38+legacy-trend+c.pts;
  return {sup:sup,legacy:legacy,trend:trend,camp:c.pts};
}
function pollNow(){var r=supportCalc(),c=S.office.camp;var you=clamp(r.sup+(c?c.noise:0),0,100);return {you:you,them:100-you,parts:r};}
var CAMP_ACTIONS={
  town:{label:'Hold a town hall',cost:10,pts:8,cool:150000,desc:'Meet voters in a packed hall. Worth a few points. Repeat after a short wait.'},
  debate:{label:'Challenge a debate',cost:25,pts:20,once:true,desc:'One big night. A strong swing, once per campaign.'},
  fixtax:{label:'Promise tax relief',cost:20,pts:15,once:'fix',desc:'Own the tax grievance. If you win, income tax falls a point.'},
  fixsvc:{label:'Promise better services',cost:20,pts:15,once:'fix',desc:'Own the services grievance. If you win, service spending rises 10%.'}
};
function campAvail(id){
  var c=S.office.camp,a=CAMP_ACTIONS[id];
  if(!a)return {ok:false,why:'Unknown action.'};
  if(S.pcap<a.cost)return {ok:false,why:'Not enough political capital.'};
  if(a.once===true&&c.used[id])return {ok:false,why:'Already done this campaign.'};
  if(a.once==='fix'&&c.fix)return {ok:false,why:'You already made a promise.'};
  if(a.cool&&c.cool[id]!==undefined&&c.rt-c.cool[id]<a.cool)return {ok:false,why:'Wait '+Math.ceil((a.cool-(c.rt-c.cool[id]))/1000)+' seconds.'};
  return {ok:true,why:''};
}
function campAction(id){
  if(!S.office||S.office.mode!=='caretaker')return false;
  var c=S.office.camp,v;
  if(id.indexOf('endorse:')===0){
    var bid=id.slice(8);if(c.used[id])return false;
    var bl=(E&&E.blocs)||[],b=null;for(var i=0;i<bl.length;i++){if(bl[i].id===bid)b=bl[i];}
    if(!b||b.appr<55||S.pcap<8)return false;
    S.pcap-=8;c.pts+=6;c.used[id]=1;addNews(b.name+' endorse your comeback.','good','Politics');return true;
  }
  v=campAvail(id);if(!v.ok){toast(v.why);return false;}
  var a=CAMP_ACTIONS[id];S.pcap-=a.cost;c.pts+=a.pts;
  if(a.once===true)c.used[id]=1;if(a.once==='fix')c.fix=id;
  if(a.cool)c.cool[id]=c.rt;
  addNews(a.label+'. Your standing improves.','good','Politics');return true;
}
function resolveElection(){
  var o=S.office,r=supportCalc();
  var share=clamp(r.sup+(Math.random()+Math.random()+Math.random()-1.5)*2*5,0,100);
  S.elections=(S.elections|0)+1;
  if(share>=50)winElection(share,r);else loseElection(share);
}
function winElection(share,r){
  var o=S.office,fix=o.camp?o.camp.fix:'',bl=(E&&E.blocs)||[],worst=null,i;
  closeTenure('lost the election');
  for(i=0;i<bl.length;i++){if(!worst||bl[i].appr<worst.appr)worst=bl[i];}
  S.office={mode:'mayor',hostile:worst?{id:worst.id,until:S.month+24}:null};
  S.comebacks++;if(share>=65)S.landslide=true;
  S.approval=Math.min(70,Math.max(S.approval,45+(share-50)*0.5));S.recallPen=6;S.lowApproval=0;
  if(fix==='fixtax')S.tax.inc=Math.max(3,S.tax.inc-1);
  if(fix==='fixsvc'){S.sp.svc=Math.min(1.5,S.sp.svc*1.1);}
  openTenure('you',S.city||'You','');
  addNews('You won the election with '+Math.round(share)+'% and are back as mayor.'+(worst?' '+worst.name+' have not forgiven you.':''),'good','Politics');
  chron('good','Won back the mayor\u2019s office with '+Math.round(share)+'% of the vote.');
  toast('You won! Welcome back, Mayor.',5200);sfx('cash');
}
function loseElection(share){
  var o=S.office;
  addNews('You lost the election with '+Math.round(share)+'%. '+o.name+' stays on. You can run again.','warn','Politics');
  chron('crisis','Lost an election with '+Math.round(share)+'%.');
  o.camp=newCamp();S.pcap=Math.min(100,(S.pcap||0)+10);
  toast('You lost the election. A new campaign starts now.',5200);sfx('bad');
}
function retire(){
  if(!S||S.over)return;
  closeTenure('retired');endGame('retired');
}
function campLeftMs(){return (S&&S.office&&S.office.camp)?Math.max(0,CAMP_MS-S.office.camp.rt):0;}
function fmtClock(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;return m+':'+(s<10?'0':'')+s;}

var HOWTXT={recalled:'Recalled by voters','lost the election':'Lost the election',receivership:'Bankrupt, put into receivership','solvent again':'Solvent again, returned control',retired:'Retired','':'In office'};
