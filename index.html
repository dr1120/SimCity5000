 '<p><b>Grid link:</b> lets you sell surplus power and buy shortfalls at neighbouring cities\u2019 prices. Buying is expensive.</p>'},
{id:'g-water',title:'Water, sewage, garbage and recycling',
 brief:'Water works like power: pumps cover an area and pipes extend it. Past 150 people you also need sewage treatment and somewhere to put garbage, or voters get unhappy. Landfills fill up, so plan alternatives.',
 more:'<p><b>Pumps</b> (Utilities tab) give 100 units, reach 8 tiles, must touch water, and need power. Desalination gives 80 units anywhere. Pipes carry water and each wet pipe reaches 4 tiles. Homes use 2 units per level, shops 1 and factories 2.5. Droughts cut supply 30%. Water recycling research cuts demand 30%. Each reservoir blunts a drought by about 8 points, up to 27%.</p>'+
 '<p><b>Sewage:</b> a plant treats 150 units and needs power. Demand is 80% of your water use. Untreated sewage drags mood down.</p>'+
 '<p><b>Garbage demand</b> is about 0.04 per resident plus 0.03 per job. Three things can take it:</p>'+
 '<ul><li><b>Landfill</b> (150 units a month, cheap). It has finite space, about 9,000 units, so a landfill fed at full speed is full in five years and at a more typical load lasts a decade or more. A full landfill is capped and stops accepting garbage. Removing a capped landfill costs a cleanup fee of about $4,000. Landfills also add pollution nearby.</li>'+
 '<li><b>Recycling plant</b> (120 units a month, needs power). It sells the materials, so it earns a little, and it never fills a landfill.</li>'+
 '<li><b>Waste-to-energy</b> (200 units a month and 30 MW of power). A bit of pollution, but it never fills a landfill.</li></ul>'+
 '<p>Processing plants take garbage first. Landfills get only what is left. A recycling ordinance cuts garbage by 30% for a monthly fee. These penalties only start once the city passes about 150 people.</p>'},
{id:'g-civic',title:'Police, fire, schools, hospitals and parks',
 brief:'Services make people happier and protect the city. Police, fire and schools cover an area, so place them near homes. Hospitals and schools also have capacity, so you need enough of them for your population.',
 more:'<p><b>Police</b> cover 8 tiles and lift mood. <b>Fire stations</b> cover 8 tiles and stop fires from spreading. <b>Schools</b> cover 9 tiles for mood, wages and research. <b>Hospitals</b> are 2 by 2, need power and water, and each serves about 800 residents.</p>'+
 '<p><b>Capacity.</b> Once the city passes about 150 people you also need enough seats: roughly one school per 700 residents (universities count for more) and one hospital per 800. Gaps cost mood. Hospitals also soften outbreaks.</p>'+
 '<p><b>Parks</b> lift mood, cut pollution nearby, and let tall homes happen.</p>'+
 '<p><b>Funding:</b> the Public services, Public safety, Healthcare and Education sliders in Policy change both the cost and how well these work. See Taxes, spending and debt.</p>'},
{id:'g-social',title:'Social services and homelessness',
 brief:'A city has to help people who are out of work or priced out of housing. If you do not, mood and approval fall. The need grows with unemployment and expensive housing.',
 more:'<p><b>The need</b> is about 0.04 per resident, plus more when unemployment is high and when homes are unaffordable (high prices and mortgage rates). It also creeps up as the city ages. The Economy panel shows the amount.</p>'+
 '<p><b>Funding:</b> Policy, Spending, Social services sets a flat monthly amount. Even with zero spending charities and churches cover about 30% of the need. Meeting the full need removes the mood penalty. Because unemployment and housing stress feed it, a recession or a rate hike raises the bill.</p>'},
{id:'g-traffic',title:'Traffic, buses and rail',
 brief:'Every built lot sends trips onto nearby roads. When roads fill up, jobs and mood suffer. Buses and rail add capacity.',
 more:'<p>Each road tile carries about 6 units. A lot loads the roads within 3 tiles of it. Above 100% of capacity, productivity and mood fall. Pick the Traffic layer to see red roads. On the map, cars turn red when a road is jammed.</p>'+
 '<p><b>More capacity:</b> a bus depot adds 60% within 6 tiles. A powered rail station adds 50% within 8 tiles. A metro adds 25% citywide. The transit subsidy ordinance adds 15%. A denser road grid spreads trips out.</p>'+
 '<p><b>Rail:</b> place two stations (Transport tab), join them with Rail track, and make sure both have power. Track alone does nothing, and a station alone does nothing. Once connected, a train runs between them, riders pay fares, and the roads nearby get relief. Stations and track cost upkeep and rarely pay for themselves, so treat them as a way to unlock growth.</p>'},
{id:'g-layers',title:'Layers: pollution, crime and land value',
 brief:'The Layers button colours the map to show hidden numbers. Green is good and red is bad, except land value where it flips.',
 more:'<p><b>Power and Water</b> show what is covered. <b>Pollution</b> comes from factories, coal and gas, ports, airports and landfills, and is soaked up by parks. <b>Crime</b> grows with density and unemployment and is cut by police. <b>Land value</b> rises with waterfront, hills, parks, schools, rail and the metro, and falls with pollution and crime. <b>Traffic</b> shows road load.</p>'+
 '<p>Pollution is the only layer that directly changes mood. The clean air ordinance cuts it about 35% at a small cost to factory output.</p>'},
{id:'g-fiscal',title:'Taxes, spending and debt',
 brief:'You set every tax and every budget line. Taxes fund the city, but each rate has a price in growth or mood. Borrowing gets you cash now and costs interest later.',
 more:'<p><b>Taxes</b> (Policy, Taxes tab): income tax (default 9%), sales tax (6%), property tax (1.0 times) and business tax (6%). Income tax above 10% slows builders and sours voters. Sales tax above 8% cuts shopping. Property tax above 1.3 times chills housing. Business tax above 10% makes firms hesitate and slows startups.</p>'+
 '<p><b>Spending</b> (Spending tab), as percentages of normal: Public services (city staff), Public safety (police and fire pay and equipment), Healthcare (hospitals and clinics), Education (schools and universities), Infrastructure upkeep and Infrastructure renewal. Social services is a flat monthly amount. More funding makes services work better and costs more. Cutting infrastructure upkeep below 100% makes power and water plants lose output. Cutting renewal lets the city wear out (see Aging infrastructure).</p>'+
 '<p><b>Other costs you will see:</b> pensions and retiree costs, public safety overtime when crime is high, healthcare costs that rise as the city ages, and resilience costs for levees, reservoirs and seismic retrofit.</p>'+
 '<p><b>Stimulus:</b> checks of $25 or $100 per resident. Spending jumps for four months and approval rises, but it feeds inflation.</p>'+
 '<p><b>Ordinances:</b> recycling, clean air, transit subsidy and seismic retrofit, each with a cost and an effect described there.</p>'+
 '<p><b>Debt</b> (Books tab): a fixed bond locks the rate at policy rate plus 2.0 points. A variable loan floats at policy rate plus 1.0. You can borrow in $5,000 steps up to a limit of $12,000 plus $25 per resident. Because you set the policy rate, a variable loan costs whatever you decide.</p>'+
 '<p>The Books tab also shows last month\u2019s revenue and costs line by line.</p>'},
{id:'g-aging',title:'Aging infrastructure and long-run costs',
 brief:'Pipes, wires, roads and plants wear out, and the bills grow as your city gets older. If you cut corners on renewal, things start to fail.',
 more:'<p><b>Condition.</b> The city has one infrastructure condition score from 20% to 100%. It only falls if you underfund renewal (Policy, Spending, Infrastructure renewal). At 100% funding it stays put. Above 100% it slowly rebuilds. Condition also drops after earthquakes and floods.</p>'+
 '<p><b>What renewal costs.</b> The amount needed to hold steady is a share of the value of your roads, lines, pipes, plants and public buildings. That share starts around 0.12% a month and grows every year the city ages, reaching roughly 0.5% a month after 35 years. So the bill rises on its own, which is why a rich young city does not stay rich forever.</p>'+
 '<p><b>What poor condition does.</b> Power and water output and road capacity fall a little as condition drops. Upkeep gets dearer (up to about double at very low condition). Below 75% random failures begin: a water main bursts (water supply down 30%), transformers fail (power down 25%), or a bridge and roads close (road capacity down 15%), each lasting two to four months.</p>'+
 '<p><b>Other costs that grow with age.</b> Pensions and retiree costs build up as the city gets older, up to about 0.8 dollars a month per resident after 25 years. Healthcare costs climb about 0.15% a month. Services, civic buildings and capital projects also get dearer by about 1.2% a year. Inflation raises costs further.</p>'+
 '<p><b>Choices.</b> You can fund renewal fully, underfund it to save cash now and pay later, or overfund to rebuild. The Economy panel shows condition and the monthly renewal needed.</p>'},
{id:'g-monetary',title:'Interest rates and inflation',
 brief:'You set the policy rate. Low rates speed up building and lift stocks and house prices but heat up inflation. High rates cool prices but freeze growth. Aim for inflation near 2% with people at work.',
 more:'<p><b>Setting the rate:</b> Policy, Monetary tab. Move the slider in quarter points and tap Set policy rate. A preview shows where inflation is likely headed in a year. The Taylor-rule guide suggests a sensible rate from current inflation and jobs.</p>'+
 '<p><b>Mortgage rates</b> follow your policy rate with a lag (about a quarter of the gap closes each month) plus a spread of about 1.2 points. The spread grows when inflation is above 6% or in a credit crunch.</p>'+
 '<p><b>Inflation</b> has momentum. Each month it speeds up while the real rate (your policy rate minus inflation) is below about 2 points, and slows down while the real rate is above that. So a rate that looks low today lets prices run away over a few years, and a rate that is too high drives prices down and eventually into deflation. Tight labor markets, supply shocks, deficits, stimulus and balance-sheet expansion add pressure, and recessions take it away. Nuclear power cuts the effect of supply shocks.</p><p>Inflation above 4% hurts mood, above 5% hurts approval, and below zero freezes building. Mortgage rates also add a risk premium when inflation is above 2%.</p><p><b>Rule of thumb:</b> with inflation at target you need a policy rate around 4%. If inflation is higher, you need more than the same gap above it. The Taylor-rule guide in Policy does this arithmetic for you, including labor, shocks and deficits.</p>'+
 '<p><b>Balance sheet:</b> Expand buys bonds, which lowers mortgage rates and lifts stocks but builds bubbles and inflation. Shrink does the opposite.</p>'+
 '<p><b>Big surprises:</b> a large rate jump moves the stock market the same month.</p>'},
{id:'g-economy',title:'Housing, jobs and the business cycle',
 brief:'Home prices, jobs and supply costs all respond to your policy and to outside shocks. Watch the chips along the top.',
 more:'<p><b>Home prices</b> rise when homes are scarce and borrowing is cheap, and fall when rates climb or homes sit empty. Your property tax revenue follows them. Very high prices lower affordability and slow immigration.</p>'+
 '<p><b>Jobs:</b> workers are about 60% of residents. Shops, factories, data centers, projects and many buildings give jobs, and construction itself gives temporary jobs. Power and water shortages and traffic jams cut productive jobs.</p>'+
 '<p><b>Supply costs</b> multiply construction costs and hurt goods production. They blend the world channels (energy, shipping, materials, chips, food and trade). See World events and trade. Ports can import goods when factories fall short.</p>'+
 '<p><b>Local events</b> only start once your city has some size: recessions, remote-work waves, inflation scares, heatwaves, droughts and more. World events are covered separately. The headlines and Tips tell you what changed.</p>'},
{id:'g-world',title:'World events and trade',
 brief:'Things happen abroad that you cannot control: wars, embargoes, shipping crises, chip bans. Each hits a different channel, so each one hurts your city in a different way. You can respond, at a price.',
 more:'<p>World events start once your city is established, and at most two run at a time. Each pushes one or more of seven channels, shown under World watch in the Economy panel and as chips along the top when they are active.</p>'+
 '<table class="gt"><tr><th>Channel</th><th>What it does to you</th></tr>'+
 '<tr><td>Energy prices</td><td>Coal and gas plants cost much more to run, nuclear barely, renewables not at all. Pushes inflation up.</td></tr>'+
 '<tr><td>Shipping costs</td><td>Imported goods cost more and construction is dearer. Factories and ports feel it most.</td></tr>'+
 '<tr><td>Materials</td><td>Construction costs rise.</td></tr>'+
 '<tr><td>Chip supply</td><td>Research slows, and labs, data centers and biotech campuses cost more.</td></tr>'+
 '<tr><td>Food prices</td><td>Feeds inflation and sours mood.</td></tr>'+
 '<tr><td>Trade disruption</td><td>Export revenue and port import capacity fall.</td></tr>'+
 '<tr><td>Public health strain</td><td>Workplace output falls, services cost more, mood drops.</td></tr></table>'+
 '<p><b>Examples.</b> A war in the Gulf spikes energy and shipping. Tension around an East Asian strait starves you of chips. Attacks on shipping lanes triple freight. A tariff war or an embargo hits materials and export orders. A grain export ban pushes up food prices. A new virus cuts output. A banking crisis abroad tightens credit at home. Some events help: a new oil supply glut cuts energy prices, a global boom lifts exports, a trade deal eases tariffs.</p>'+
 '<p><b>Briefings.</b> When a crisis begins you get a popup with a Respond button and three months to decide. Each option costs money or support and softens the crisis: releasing fuel reserves, chartering ships, backing a domestic chip partnership, funding food assistance, sending a trade mission, ordering a lockdown. If you do nothing, the crisis runs at full strength.</p>'+
 '<p><b>Warnings and chains.</b> Most events give a few months of warning in the headlines, such as rising tensions or a market rumour, so you can build reserves first. Big crises also cause follow-ons. A Gulf war can lead to an oil cartel cut, an inflation scare, a shipping crisis or a recession. A tariff war can become an embargo. A virus can lead to a banking crisis, a recession and a remote-work wave. A bank failure can lead to a default or a stock crash. A grain ban can lead to food riots and inflation. Watch the World headlines for what comes next.</p>'+
 '<p><b>How long.</b> Crises build over a couple of months, last from half a year to well over a year, then fade slowly. Their effects feed into inflation, stocks and sometimes recessions, so your policy rate decisions interact with them.</p>'+
 '<p><b>Grid link.</b> Neighbouring cities\u2019 power prices follow world energy prices, so selling surplus power pays better in an energy crisis and buying shortfalls costs more.</p>'},
{id:'g-markets',title:'Stocks, crashes and bailouts',
 brief:'A stock market runs in the background. It rises on cheap money and falls on high rates. Sometimes it crashes. You can soften the blow with insurance, a bailout, or an exchange.',
 more:'<p>Crash risk is low in normal times and climbs when the index is far above its start, when bubbles build, when you expand the balance sheet for long, and after sharp rate hikes. It only applies once the city passes about 300 people.</p>'+
 '<p><b>A crash</b> wipes out about a third of the market over three panic months, followed by a bear market. Startups lose funding and IPOs freeze. Banks tighten credit, adding 1.5 points to mortgage rates for a year. A recession follows about 60% of the time.</p>'+
 '<p><b>Deposit insurance</b> (Policy, Monetary tab) softens crashes by about a quarter but costs money every month and encourages risk. A <b>bailout</b> ends the panic and reopens credit, but traders then expect rescues. A <b>stock exchange</b> adds circuit breakers that shorten and soften crashes.</p>'},
{id:'g-corp',title:'Research, startups, IPOs and takeovers',
 brief:'Fund research to unlock new technology. Each breakthrough spins out a startup you can invest in. Startups can fail, dilute you or go public and pay off big.',
 more:'<p><b>Research:</b> open Corp, then Research. Set a monthly R&D budget (up to $20,000), pick a project, and points accumulate. Labs multiply the speed, and so do schools, universities, data centers and Applied AI. Without a lab research runs at a quarter speed.</p>'+
 '<table class="gt"><tr><th>Technology</th><th>Unlocks</th></tr>'+
 '<tr><td>Photovoltaics</td><td>Solar farms produce 50% more.</td></tr>'+
 '<tr><td>Fiber and cloud</td><td>Data centers, and shop sales up 10%.</td></tr>'+
 '<tr><td>Water recycling</td><td>Demand down 30% and desalination.</td></tr>'+
 '<tr><td>Factory automation</td><td>Factories make 30% more goods. Needs Fiber.</td></tr>'+
 '<tr><td>Biotech</td><td>Biotech campuses.</td></tr>'+
 '<tr><td>Applied AI</td><td>Services cost 15% less and research is 25% faster. Needs Fiber.</td></tr>'+
 '<tr><td>Advanced fission</td><td>Nuclear plants.</td></tr>'+
 '<tr><td>Fusion power</td><td>Fusion plants. Needs fission and AI, three working labs and a university, and plasma setbacks keep resetting progress.</td></tr></table>'+
 '<p><b>Frontier technologies</b> are the late-game tier. They are expensive and slow, and they stall unless you have at least 2 working labs and a university. Raise the R&D budget (up to $20,000 a month) to speed them up.</p>'+
 '<table class="gt"><tr><th>Technology</th><th>Effect</th></tr>'+
 '<tr><td>Genomic medicine</td><td>Hospitals serve 40% more, healthcare costs fall 15%, outbreaks hit 30% softer. Needs Biotech.</td></tr>'+
 '<tr><td>Rapid vaccine platforms</td><td>Pandemics start at half strength.</td></tr>'+
 '<tr><td>Autonomous vehicles</td><td>Roads carry 30% more before jamming. Needs Applied AI.</td></tr>'+
 '<tr><td>Vertical farming</td><td>Food price shocks hit half as hard. Needs Water recycling.</td></tr>'+
 '<tr><td>Advanced materials</td><td>Construction costs fall 12%, infrastructure ages 25% slower. Needs Automation.</td></tr>'+
 '<tr><td>Quantum computing</td><td>Research 30% faster, data centers earn 50% more. Needs Applied AI.</td></tr>'+
 '<tr><td>Superconductors</td><td>Power lines reach 2 tiles farther, 8% more usable power. Needs fission and AI.</td></tr>'+
 '<tr><td>Carbon capture and climate engineering</td><td>Pollution halved, heatwaves and droughts half as long. Needs fission.</td></tr>'+
 '<tr><td>General-purpose AI</td><td>Income tax up 15%, services 15% cheaper, but about 8% of jobs vanish and social needs rise 25%. Needs Quantum and AI.</td></tr>'+
 '<tr><td>Reusable launch vehicles</td><td>Unlocks the Spaceport. Needs Advanced materials and AI.</td></tr>'+
 '<tr><td>Orbital manufacturing</td><td>Spaceports earn double, exports up 20%, chip shortages half as bad.</td></tr>'+
 '<tr><td>Asteroid mining</td><td>Materials permanently cheaper and mining income per spaceport. Needs Orbital and Fusion.</td></tr>'+
 '<tr><td>Colony ship program</td><td>Unlocks the Colony ship yard, a milestone project. Needs Asteroid mining and Carbon capture.</td></tr>'+
 '<tr><td>Space elevator</td><td>Unlocks the Space elevator. Needs Reusable launch vehicles and Advanced materials.</td></tr>'+
 '<tr><td>Orbital solar power</td><td>Unlocks Orbital arrays. Needs Space elevator and Superconductors.</td></tr>'+
 '<tr><td>Antimatter production</td><td>Research 20% faster, launch fees up 25%. Needs Orbital solar power and Quantum computing.</td></tr>'+
 '<tr><td>Dyson swarm engineering</td><td>Unlocks Dyson nodes. Stalls until you are Type I. Needs Antimatter and Asteroid mining.</td></tr>'+
 '<tr><td>Matrioshka brains</td><td>Dyson nodes earn double, research 50% faster. Stalls until Type I. Needs Dyson swarms and General-purpose AI.</td></tr>'+
 '<tr><td>Traversable wormholes</td><td>Unlocks Galactic relays. Stalls until you are Type II. Needs Matrioshka brains.</td></tr></table>'+
 '<p><b>Sovereign wealth fund</b> (Corp, Fund tab): park surplus cash in a fund that invests in stocks, bonds and cash. Stocks follow the market and crash with it, bonds earn a bit above cash when rates are high. You can set a yearly payout into the budget (3% is the classic rule), withdraw any time, and let the fund auto-cover cash shortfalls. If the fund grows beyond about two years of revenue while income tax is above 9%, voters grumble.</p>'+
 '<p><b>Data centers</b> are 3 by 3, must touch water for closed-loop cooling that uses none, and draw a lot of power. They bring construction work, 70 high-wage jobs, cloud revenue and faster research.</p>'+
 '<p><b>Ventures:</b> each startup shows its value, runway and your stake. Invest to raise your stake and extend its runway. A startup lists when it passes $70,000 after at least a year if the market is calm. At the IPO you sell 35% of your stake and the city collects listing fees. Listed firms pay dividends, bring jobs and can be bought, sold, merged or taken over.</p>'+
 '<p><b>Deals:</b> now and then a buyer bids for a listed firm. Accepting pays you and the city, but takeovers usually cut headquarters jobs 40% within two years.</p>'},
{id:'g-projects',title:'Capital projects',
 brief:'Big, expensive buildings unlock as your city grows. Each takes months to build and pays off in a specific way.',
 more:'<table class="gt"><tr><th>Project</th><th>Unlocks at</th><th>Payoff</th></tr>'+
 '<tr><td>Stadium</td><td>600 people</td><td>Mood, approval, tourism money.</td></tr>'+
 '<tr><td>University</td><td>900</td><td>Research up 60%, wages up.</td></tr>'+
 '<tr><td>Convention center</td><td>1,000</td><td>Retail sales up 12%, visitors.</td></tr>'+
 '<tr><td>Metro</td><td>1,200</td><td>Traffic relief, mood, housing demand.</td></tr>'+
 '<tr><td>Stock exchange</td><td>1,400</td><td>Doubles IPO fees, softens crashes.</td></tr>'+
 '<tr><td>Airport</td><td>1,500</td><td>Exports up 35%, business demand. Noisy.</td></tr>'+
 '<tr><td>Spaceport</td><td>3,000 and Reusable rockets</td><td>$2,500 a month in launch fees ($5,000 with Orbital manufacturing), 150 jobs. A 4 by 4 pad that takes 24 months. A bit noisy.</td></tr>'+
 '<tr><td>Colony ship yard</td><td>3,500 and Colony ship program</td><td>A milestone. About $2.5 million and 48 months. Adds 0.10 to your Kardashev rating.</td></tr>'+
 '<tr><td>Space elevator</td><td>3,000 and Space elevator tech</td><td>Launch fees triple, +$20,000 a month, +0.15 Kardashev. Monthly installments.</td></tr>'+
 '<tr><td>Orbital array</td><td>3,000 and Orbital solar power</td><td>Sells power, +$120,000 a month each, +0.20 Kardashev each (three count). Monthly installments.</td></tr>'+
 '<tr><td>Dyson node</td><td>3,000, Dyson swarm engineering and Type I</td><td>+$1.2 million a month each (double with Matrioshka brains), +0.25 Kardashev each (four count).</td></tr>'+
 '<tr><td>Galactic relay</td><td>3,000, Traversable wormholes and Type II</td><td>+$8 million a month each, +0.25 Kardashev each (four count).</td></tr></table>'+
 '<p>All need power, and some need water. They cost upkeep every month, so make sure the payoff is worth it.</p>'},
{id:'g-kard',title:'The Kardashev scale (keeping score)',
 brief:'The long game is to climb the Kardashev scale: Type I commands the energy of a planet, Type II a star, Type III a galaxy. There is no final victory. It is an infinite game and the scale is how you keep score. Your rating shows in the Economy panel and as a chip once you start on space.',
 more:'<p>Your rating starts with a small base from your power grid (up to 0.40). Everything else comes from finished megaprojects. Under-construction projects do not count.</p>'+
 '<table class="gt"><tr><th>Step</th><th>What you need</th><th>Rating</th></tr>'+
 '<tr><td>Type I</td><td>A Space elevator (+0.15) and three Orbital arrays (+0.20 each) add 0.75. You also need a grid base of about 0.25, which means roughly 320 MW of power (a nuclear plant does it). The colony ship (+0.10) lowers that to 0.15.</td><td>1.0</td></tr>'+
 '<tr><td>Type II</td><td>Research Dyson swarm engineering, then four Dyson nodes (+0.25 each).</td><td>2.0</td></tr>'+
 '<tr><td>Type III</td><td>Research Traversable wormholes, then four Galactic relays (+0.25 each). The game does not end here.</td><td>3.0</td></tr></table>'+
 '<p><b>Monthly installments.</b> Megaprojects are not paid up front. Placing one pays the first installment, and then each month the same amount is taken from your cash. If cash runs short, work stops until you can pay. Each extra project of the same kind costs 15% more than the last.</p>'+
 '<p><b>They pay for themselves.</b> Finished megaprojects bring in a large monthly income, listed in the capital projects table, so each step funds the next. A sovereign wealth fund, steady research and a healthy city are how you get there. Expect this to take well over a century of game time. Run the game at fast speed.</p>'+
 '<p>Dyson and wormhole research will not progress until you reach the earlier Type, so plan the order.</p>'},
{id:'g-eras',title:'Eras, aliens and a changing world',
 brief:'The game is infinite, and the world keeps changing as your civilization advances. Old problems fade and new ones arrive. Your current era shows in the Economy panel and as a chip.',
 more:'<table class="gt"><tr><th>Era</th><th>You enter it when</th><th>What changes</th></tr>'+
 '<tr><td>Industrial</td><td>The start.</td><td>Oil, shipping lanes and grain prices rule the world.</td></tr>'+
 '<tr><td>Digital</td><td>Applied AI.</td><td>Chip supply matters more. Your civic AI can demand a say once it is advanced enough.</td></tr>'+
 '<tr><td>Fusion</td><td>Fusion or superconductors.</td><td>Energy shocks hit only 60% as hard. Coal and gas plants cost 30% more to run for each era past this one.</td></tr>'+
 '<tr><td>Orbital</td><td>A finished Spaceport.</td><td>Orbital debris and solar storms appear. Oil wars stop happening.</td></tr>'+
 '<tr><td>Interplanetary</td><td>Asteroid mining.</td><td>Ore price booms and gluts drive mining income. Shipping-lane and grain crises stop. Strange signals, first contact and alien pathogens become possible.</td></tr>'+
 '<tr><td>Planetary (Type I)</td><td>Kardashev 1.0.</td><td>Energy prices barely matter. Climate engineering can backfire. Each game year counts as 50.</td></tr>'+
 '<tr><td>Stellar (Type II)</td><td>Kardashev 2.0.</td><td>Stellar superflares and swarm collision cascades. Each game year counts as 1,000.</td></tr>'+
 '<tr><td>Galactic (Type III)</td><td>Kardashev 3.0.</td><td>The Galactic Council, a silent hunter of civilizations, and vacuum scares. Each game year counts as 10,000.</td></tr></table>'+
 '<p><b>New world channels.</b> Orbital hazard cuts launch fees and space income. Ore prices swing mining income and nudge construction costs.</p>'+
 '<p><b>Aliens.</b> A mysterious signal may lead to first contact. If you open talks the visitors are usually friendly: an interstellar trade deal lifts exports 30%, speeds research 20% and gives a research windfall. If you do not, the visitors choose. Hostile probes jam satellites and you can build a planetary shield. An extraterrestrial pathogen can arrive in asteroid ore and strains public health for a year.</p>'+
 '<p><b>The cosmic calendar.</b> After you reach Type I the calendar speeds up, because real civilizations take millennia to climb the scale. The date shows as a year only. Events and construction still run in game months.</p>'},
{id:'g-future',title:'Money in the space age',
 brief:'Taxes, spending, interest rates and inflation stay at the heart of the game in every era. The future changes the problems, not the discipline. Abundance pulls prices down, space income rides the stock market, automation eats the tax base, and rates can hit zero.',
 more:'<p><b>The neutral rate falls.</b> Cheap energy, automation and AI push prices down a little more every month in later eras. Each era past Digital lowers the neutral real rate, and General-purpose AI lowers it again. By Type I the Taylor guide may tell you to hold rates near zero, and in the Galactic era it can ask for less than zero.</p>'+
 '<p><b>The zero bound.</b> Rates cannot go below 0%. If prices start to fall and you are already at zero, deflation feeds on itself. Your tools then are asset purchases (QE), stimulus checks, a universal dividend and deficit spending. Each of these has a price in bubbles and inflation, so the balance never goes away.</p>'+
 '<p><b>Space income is not free money.</b> Launch fees, asteroid mining and the space economy all scale with space-sector confidence, which rises and falls with the stock market, drops when real interest rates are high and drops again in a recession. Cheap money in the space age inflates a space-stock bubble, and a crash takes your space income down with it.</p>'+
 '<p><b>Automation levy</b> (Policy, Taxes, once you have Automation). A tax on the payroll that machines replaced. The share of work automated grows with Automation, Autonomous vehicles, General-purpose AI and Matrioshka brains. It replaces the income tax that automation erodes, and a heavy levy slows factory output.</p>'+
 '<p><b>Universal dividend</b> (Policy, Spending, once you have General-purpose AI). A monthly payment of up to $16 per resident. It lifts affordability, eases social needs, and pushes prices up. Funding it by deficit adds more inflation.</p>'+
 '<p><b>Credit grows with the era.</b> Lenders extend more credit to a bigger civilization: about 75% more for each era you pass. Megaprojects are still paid in monthly installments from cash, so interest rates, deficits and the sovereign fund all matter.</p>'+
 '<p><b>Events carry money themes.</b> An ore rush can bring inflation and a space bubble, an ore glut or interstellar trade can bring deflation, and debris cascades and a hostile silent hunter can crash the market and cause recessions.</p>'},
{id:'g-disasters',title:'Disasters and resilience',
 brief:'Fires, floods, earthquakes and tornadoes can strike once your city is big enough. Fire stations, levees, reservoirs and retrofit programs limit the damage, and savings help you rebuild.',
 more:'<p><b>Fire</b> spreads tile to tile unless a fire station covers it. <b>Earthquakes</b> shake the screen, damage buildings, start fires and wear down infrastructure. <b>Floods</b> hit low ground near water. <b>Tornadoes</b> cut a path across the map. After a disaster, federal aid may arrive if voters like you.</p>'+
 '<p><b>Resilience</b> (Utilities tab): a <b>levee</b> is a cheap wall that protects the 3 tiles around it from flooding. A <b>reservoir</b> is water storage that softens droughts. The <b>seismic retrofit</b> ordinance (Policy, Spending) halves earthquake damage for a monthly fee.</p>'+
 '<p>Battery storage can also burn on its own, more often in a heatwave. You can turn random disasters off in the Menu, or trigger one in the Disaster lab to test your city.</p>'},

{id:'g-advisors',title:'Advisors and popups',

{id:'g-desktop',title:'Desktop and keyboard',

/* ================= camera ================= */
var animEnabled=(fetchStore('sc5000.anim')!=='0');
function ambientOn(){return animEnabled&&S&&!S.over&&!splashOpen&&!sheetKind&&cam.z>=0.4;}
var cam={wx:20,wy:20,z:0.62,rot:0},VW=360,VH=420,ctx=null,hoverIdx=-1;
var TWb=64,THb=32,ESb=9,BUb=17;
function camSet(wx,wy,z,rot){cam.wx=wx;cam.wy=wy;cam.z=z;cam.rot=rot;dirty=true;}
function rotUV(u,v,r){switch(r){case 0:return [u,v];case 1:return [MW-v,u];case 2:return [MW-u,MH-v];default:return [v,MH-u];}}
function rotInvUV(ru,rv,r){switch(r){case 0:return [ru,rv];case 1:return [rv,MW-ru];case 2:return [MW-ru,MH-rv];default:return [MH-rv,ru];}}
function rotTile(x,y,r){switch(r){case 0:return [x,y];case 1:return [MW-1-y,x];case 2:return [MW-1-x,MH-1-y];default:return [y,MW-1-x];}}
function invTile(rx,ry,r){switch(r){case 0:return [rx,ry];case 1:return [ry,MW-1-rx];case 2:return [MW-1-rx,MH-1-ry];default:return [MW-1-ry,rx];}}
function dirRot(dx,dy,r){switch(r){case 0:return [dx,dy];case 1:return [-dy,dx];case 2:return [-dx,-dy];default:return [dy,-dx];}}
function view(){
  var z=cam.z,tw=TWb*z,th=THb*z,es=ESb*z,bu=BUb*z,c=rotUV(cam.wx,cam.wy,cam.rot);
  return {z:z,tw:tw,th:th,es:es,bu:bu,ox:VW/2-(c[0]-c[1])*tw/2,oy:VH/2-(c[0]+c[1])*th/2+2*es};
}
function clampCam(){cam.wx=clamp(cam.wx,0,MW);cam.wy=clamp(cam.wy,0,MH);cam.z=clamp(cam.z,0.3,1.7);}
function panBy(dx,dy){
  var v=view(),du=dx/v.tw+dy/v.th,dv=dy/v.th-dx/v.tw,c=rotUV(cam.wx,cam.wy,cam.rot);
  var w=rotInvUV(c[0]-du,c[1]-dv,cam.rot);cam.wx=w[0];cam.wy=w[1];clampCam();dirty=true;
}
function zoomAt(f,sx,sy){
  var v=view(),nz=clamp(cam.z*f,0.3,1.7);
  if(sx===undefined){cam.z=nz;dirty=true;return;}
  var a=(sx-v.ox)*2/v.tw,b=(sy-v.oy+v.es*2)*2/v.th,ru=(a+b)/2,rv=(b-a)/2;
  cam.z=nz;
  var v2=view(),X=v2.ox+(ru-rv)*v2.tw/2,Y=v2.oy+(ru+rv)*v2.th/2-2*v2.es;
  panBy(sx-X,sy-Y);dirty=true;
}

/* ================= overlays ================= */
var OV_NAMES=['Off','Power coverage','Water coverage','Pollution','Crime','Land value','Traffic'];
var overlay=0,ovArr=null;
var ovCache={};
function ovColor(v,inv){
  if(inv)v=1-v;
  var q=Math.round(clamp(v,0,1)*20);
  if(ovCache[q])return ovCache[q];
  return ovCache[q]='hsl('+Math.round(125-125*q/20)+',78%,46%)';
}
function overlayData(mode,g){
  var a=new Float32Array(N).fill(-1),i,x,y;
  if(mode===1){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=g.pc[i]?0:1;}}
  else if(mode===2){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=g.wc[i]?0:1;}}
  else if(mode===3){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=clamp(g.poll[i]/1.2,0,1);}}
  else if(mode===4||mode===5){
    var dens=new Float32Array(N),un=E?E.unemp:0.1;
    for(i=0;i<N;i++){
      var t=T[i],w=0;
      if((t===RES||t===COM||t===IND)&&L[i]>0)w=L[i];else if(t===MRES||t===MCOM)w=3;
      if(!w)continue;
      var c=(t===MRES||t===MCOM)?centerIdx(i):i;x=c%MW;y=(c/MW)|0;
      for(var dy=-2;dy<=2;dy++){var yy=y+dy;if(yy<0||yy>=MH)continue;var wd=2-Math.abs(dy);for(var dx=-wd;dx<=wd;dx++){var xx=x+dx;if(xx>=0&&xx<MW)dens[yy*MW+xx]+=w;}}
    }
    var crime=new Float32Array(N);
    for(i=0;i<N;i++){crime[i]=dens[i]>0?clamp(dens[i]/6*(0.6+1.5*un)*(g.polC[i]?0.4:1),0,1):0;}
    if(mode===4){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=crime[i];}}
    else{
      var lv=new Float32Array(N);
      for(i=0;i<N;i++){if(TER[i]!==WATER)lv[i]=0.4+0.12*SHORE[i]+0.04*(EL[i]-2)-0.45*clamp(g.poll[i],0,1)-0.25*crime[i]+(g.railC[i]?0.12:0);}
      var addV=function(i0,val,r){var px=i0%MW,py=(i0/MW)|0;for(var dy=-r;dy<=r;dy++){var yy=py+dy;if(yy<0||yy>=MH)continue;var w=r-Math.abs(dy);for(var dx=-w;dx<=w;dx++){var xx=px+dx;if(xx>=0&&xx<MW)lv[yy*MW+xx]+=val*(1-(Math.abs(dx)+Math.abs(dy))/(r+1));}}};
      for(i=0;i<N;i++){
        var tt=T[i];if(tt===PARK)addV(i,0.3,4);
        else if((tt===SCHOOL||tt===UNIV||tt===STADIUM||tt===METRO||tt===BUS)&&L[i]===0)addV(centerIdx(i),0.18,6);
      }
      for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=clamp(lv[i],0,1);}
    }
  }
  else if(mode===6){
    for(i=0;i<N;i++){if(T[i]===ROAD)a[i]=clamp((g.trf[i]/roadCap(g,i))/1.6,0,1);}
  }
  return a;
}
function refreshOverlay(){ovArr=(overlay>0&&E&&E.g)?overlayData(overlay,E.g):null;dirty=true;}
function setOverlay(n){
  overlay=n;
  var lg=$('legend');
  if(lg){
    if(n===0){lg.style.display='none';}
    else{
      lg.style.display='block';
      var inv=(n===5);
      lg.innerHTML='<b>'+OV_NAMES[n]+'</b><span class="bar'+(inv?' inv':'')+'"></span><span class="lr"><i>'+(inv?'low':'good')+'</i><i>'+(inv?'high':'bad')+'</i></span>';
    }
  }
  refreshOverlay();
}
function cycleOverlay(){setOverlay((overlay+1)%OV_NAMES.length);toast('Map layer: '+OV_NAMES[overlay]);}

/* ================= colours ================= */
var shadeCache={};
function shade(hex,f){
  var k=hex+f;if(shadeCache[k])return shadeCache[k];
  var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  if(f<1){r*=f;g*=f;b*=f;}else{var t=f-1;r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t;}
  return shadeCache[k]='rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function tri(hex){return {t:shade(hex,1.14),l:hex,r:shade(hex,0.72)};}
var CL={cream:tri('#eadfc4'),brick:tri('#c98a68'),concrete:tri('#cfcac0'),tower:tri('#dcd6c9'),shop:tri('#5f93d9'),office:tri('#78a8e0'),glass:tri('#4a7bc4'),
  shed:tri('#d9b857'),fact:tri('#c9a24a'),plant:tri('#8e98a3'),pump:tri('#d6dde4'),police:tri('#3b5db0'),fire:tri('#c8483a'),school:tri('#b27b4a'),
  lab:tri('#eef2f6'),stone:tri('#e4dfd3'),yellow:tri('#e8b923'),white:tri('#f2f4f6'),dc:tri('#444d59'),metal:tri('#7b8590'),deck:tri('#9ca3ab'),red:tri('#c0463a'),blue:tri('#3d6fb7'),green:tri('#4f9d5e'),bio:tri('#d9e6e0')};
var ROOF={a:'#8f3f2b',l:'#b5523b',r:'#7d3624',t:'#c9654b'};
var ZC={};ZC[RES]='#38a169';ZC[COM]='#3b82d6';ZC[IND]='#d9a520';

function groundColor(i,x,y){
  var t=TER[i],e=EL[i],c;
  if(t===WATER)return '#4f9fca';
  if(t===ROCK)c=e>=7?'#eef2f5':(e===6?'#9a9da3':'#8a8d93');
  else if(t===FOREST)c='#5a955b';
  else if(SHORE[i]&&e<=1)c='#e1d3a0';
  else c=['#86b86f','#86b86f','#8dbd6f','#9cbf70','#aebc78','#bdb783'][clamp(e,0,5)];
  return ((x+y)&1)?shade(c,0.965):c;
}
function sideColors(i){
  if(TER[i]===ROCK)return ['#767a80','#5c6065'];
  if(SHORE[i]&&EL[i]<=1)return ['#cdbd8b','#b3a373'];
  return ['#8a6a4b','#6f5439'];
}

/* ================= low-level drawing in tile-local coordinates ================= */
var gX0=0,gY0=0,gHW=32,gHH=16,gBU=17,hz=1,gWu=1,gWv=1,gS=1,gHS=1;
function PX(lx,ly){return gX0+(lx*gWu-ly*gWv)*gHW;}
function PY(lx,ly,h){return gY0+(lx*gWu+ly*gWv)*gHH-h*gBU*gHS;}
function quad(x1,y1,x2,y2,x3,y3,x4,y4,fill){
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function face(fill,x1,y1,h1,x2,y2,h2,x3,y3,h3,x4,y4,h4){
  quad(PX(x1,y1),PY(x1,y1,h1),PX(x2,y2),PY(x2,y2,h2),PX(x3,y3),PY(x3,y3,h3),PX(x4,y4),PY(x4,y4,h4),fill);
}
function boxL(x0,y0,x1,y1,hb,ht,c){
  face(c.r,x1,y0,hb,x1,y1,hb,x1,y1,ht,x1,y0,ht);
  face(c.l,x0,y1,hb,x1,y1,hb,x1,y1,ht,x0,y1,ht);
  face(c.t,x0,y0,ht,x1,y0,ht,x1,y1,ht,x0,y1,ht);
}
function roofL(x0,y0,x1,y1,hb,hp){
  var ym=(y0+y1)/2;
  face(ROOF.t,x0,y0,hb,x1,y0,hb,x1,ym,hp,x0,ym,hp);
  face(ROOF.r,x1,y0,hb,x1,y1,hb,x1,ym,hp,x1,ym,hp);
  face(ROOF.l,x0,y1,hb,x1,y1,hb,x1,ym,hp,x0,ym,hp);
}
function winGrid(x0,y0,x1,y1,hb,ht,rows,cols,seed,lit,dark){
  var r,c,wH=(ht-hb)*(0.8/rows)*0.55,hh,a,b,col;
  for(r=0;r<rows;r++){
    hh=hb+(ht-hb)*(0.1+r*(0.8/rows));
    for(c=0;c<cols;c++){
      col=((c*7+r*3+seed)%5<2)?lit:dark;
      a=x0+(x1-x0)*(0.12+c*(0.76/cols));b=a+(x1-x0)*(0.76/cols)*0.55;
      face(col,a,y1,hh,b,y1,hh,b,y1,hh+wH,a,y1,hh+wH);
      a=y0+(y1-y0)*(0.12+c*(0.76/cols));b=a+(y1-y0)*(0.76/cols)*0.55;
      face(col,x1,a,hh,x1,b,hh,x1,b,hh+wH,x1,a,hh+wH);
    }
  }
}
function cyl(cx,cy,r,hb,ht,col){
  var X=PX(cx,cy),Yb=PY(cx,cy,hb),Yt=PY(cx,cy,ht),rx=r*1.414*gHW*gS,ry=r*1.414*gHH*gS;
  ctx.fillStyle=col;ctx.fillRect(X-rx,Yt,rx*2,Yb-Yt);
  ctx.beginPath();ctx.ellipse(X,Yb,rx,ry,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(X,Yt,rx,Yb-Yt);
  ctx.beginPath();ctx.ellipse(X,Yb,rx,ry,0,0,Math.PI);ctx.fill();
  ctx.fillStyle=shade(col.charAt(0)==='#'?col:'#aaaaaa',1.2);
  ctx.beginPath();ctx.ellipse(X,Yt,rx,ry,0,0,6.283);ctx.fill();
}
function tree(lx,ly,size,c1,c2){
  var X=PX(lx,ly),Yb=PY(lx,ly,0),rx=size*gHW*0.9*gS,hgt=size*gBU*3.2*gS;
  ctx.fillStyle='#6b4a2b';ctx.fillRect(X-rx*0.12,Yb-hgt*0.28,rx*0.24,hgt*0.3);
  ctx.fillStyle=c1;ctx.beginPath();ctx.moveTo(X,Yb-hgt);ctx.lineTo(X-rx,Yb-hgt*0.22);ctx.lineTo(X+rx,Yb-hgt*0.22);ctx.closePath();ctx.fill();
  ctx.fillStyle=c2;ctx.beginPath();ctx.moveTo(X,Yb-hgt);ctx.lineTo(X,Yb-hgt*0.22);ctx.lineTo(X+rx,Yb-hgt*0.22);ctx.closePath();ctx.fill();
}
function smoke(lx,ly,h){
  var X=PX(lx,ly),Y=PY(lx,ly,h),r=gHW*0.2*gS;
  if(animEnabled){
    var t=performance.now()/2800+(lx*3.1+ly*1.7+gX0*0.013),k,ph;
    for(k=0;k<3;k++){
      ph=(t+k/3)%1;ctx.globalAlpha=0.6*(1-ph);ctx.fillStyle='#dadcde';ctx.beginPath();
      ctx.arc(X+r*(0.2+ph*2.0),Y-r*(0.7+ph*5.8),r*(0.65+ph*1.1),0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;return;
  }
  ctx.fillStyle='rgba(215,215,215,.55)';ctx.beginPath();ctx.arc(X+r*0.2,Y-r*0.8,r,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(225,225,225,.42)';ctx.beginPath();ctx.arc(X+r*0.9,Y-r*2.3,r*1.25,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(235,235,235,.3)';ctx.beginPath();ctx.arc(X+r*1.6,Y-r*4,r*1.5,0,6.283);ctx.fill();
}
function dome(lx,ly,h,r,fill,glow){
  var X=PX(lx,ly),Y=PY(lx,ly,h),rx=r*1.414*gHW*gS,ry=r*1.414*gHH*gS,rv=r*gBU*2.2*gS*gHS;
  if(glow){ctx.fillStyle=glow;ctx.beginPath();ctx.ellipse(X,Y-rv*0.35,rx*1.35,rv*0.95,0,0,6.283);ctx.fill();}
  ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(X,Y,rx,rv,0,Math.PI,0);ctx.ellipse(X,Y,rx,ry,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(X-rx*0.3,Y-rv*0.55,rx*0.28,rv*0.22,-0.5,0,6.283);ctx.fill();

function drawPolicyChart(){
  var cv=$('chM');if(!cv)return;
  var s=chartSetup(cv),c=s.c,w=s.w,h=s.h,muted=cssVar('--muted','#888'),line=cssVar('--line','#ccc'),acc=cssVar('--accent','#1f6f8b'),warn=cssVar('--warn','#a96f12'),bad=cssVar('--bad','#c2452d');
  var hr=S.hist.rate.slice(-30),hi=S.hist.infl.slice(-30),hl=hr.length,fc=forecastInflation(24,pendingRate),total=hl+24,i;
  var mn=Math.min(0,S.infl,S.rate),mx=Math.max(S.rate,pendingRate,S.infl)+0.5;
  for(i=0;i<hl;i++){mn=Math.min(mn,hi[i],hr[i]);mx=Math.max(mx,hi[i],hr[i]);}
  for(i=0;i<24;i++){mn=Math.min(mn,fc.mean[i]-1.65*fc.sd[i]);mx=Math.max(mx,fc.mean[i]+1.65*fc.sd[i]);}
  mn-=0.3;mx+=0.3;
  function X(k){return 6+(w-12)*(k/Math.max(1,total-1));}
  function Y(v){return h-6-(h-12)*((v-mn)/(mx-mn));}
  c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(0,Y(2)+0.5);c.lineTo(w,Y(2)+0.5);c.stroke();
  c.fillStyle=bad;c.globalAlpha=0.18;c.beginPath();c.moveTo(X(Math.max(hl-1,0)),Y(S.infl));
  for(i=0;i<24;i++)c.lineTo(X(hl+i),Y(fc.mean[i]+1.65*fc.sd[i]));
  for(i=23;i>=0;i--)c.lineTo(X(hl+i),Y(fc.mean[i]-1.65*fc.sd[i]));
  c.closePath();c.fill();c.globalAlpha=1;
  function lineSer(arr,col,dash){c.strokeStyle=col;c.lineWidth=2;c.setLineDash(dash||[]);c.beginPath();for(var k=0;k<arr.length;k++){if(k===0)c.moveTo(X(k),Y(arr[k]));else c.lineTo(X(k),Y(arr[k]));}c.stroke();c.setLineDash([]);}

function cssVar(n,d){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||d;}
function chartSetup(cv){
  var dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||300,h=cv.clientHeight||84;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  c.font='11px '+cssVar('--font','sans-serif');
  return {c:c,w:w,h:h};
}
function drawChart(cv,series,fmt){
  var s=chartSetup(cv),c=s.c,w=s.w,h=s.h,muted=cssVar('--muted','#888'),line=cssVar('--line','#ccc');
  var len=series[0].data.length;
  if(len<2){c.fillStyle=muted;c.fillText('Collecting data\u2026',10,h/2);return;}
  var mn=Infinity,mx=-Infinity,i,k;
  for(k=0;k<series.length;k++)for(i=0;i<series[k].data.length;i++){mn=Math.min(mn,series[k].data[i]);mx=Math.max(mx,series[k].data[i]);}
  var pad=(mx-mn)*0.12||1;mn-=pad;mx+=pad;
  c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(0,h-0.5);c.lineTo(w,h-0.5);c.moveTo(0,0.5);c.lineTo(w,0.5);c.stroke();
  for(k=0;k<series.length;k++){
    c.strokeStyle=series[k].color;c.lineWidth=2;c.beginPath();
    for(i=0;i<len;i++){var px=6+(w-12)*(i/(len-1)),py=h-6-(h-12)*((series[k].data[i]-mn)/(mx-mn));if(i===0)c.moveTo(px,py);else c.lineTo(px,py);}
    c.stroke();
  }
  c.fillStyle=muted;c.fillText(fmt(mx),8,12);c.fillText(fmt(mn),8,h-8);
}

function corpAct(el){
  var a=el.getAttribute('data-act'),id=parseInt(el.getAttribute('data-id'),10);
  if(a==='tab'){corpTab=el.getAttribute('data-tab');refreshCorp();return;}
  if(a==='fdep'){var da=el.getAttribute('data-amt');fundDeposit(da==='q'?Math.floor(S.cash*0.25):parseInt(da,10));ui();return;}
  if(a==='fwd'){var wa=el.getAttribute('data-amt');fundWithdraw(wa==='all'?S.fund.bal:parseInt(wa,10));ui();return;}
  if(a==='fauto'){S.fund.auto=!S.fund.auto;ui();return;}
  if(a==='tech'){S.rd.active=el.getAttribute('data-id');S.rd.pts=0;}
  else if(a==='invest')invest(id,parseInt(el.getAttribute('data-amt'),10));
  else if(a==='buy')buyShares(id,parseFloat(el.getAttribute('data-frac')));
  else if(a==='sell')sellShares(id,parseFloat(el.getAttribute('data-frac')));
  else if(a==='buyout')buyout(id);
  else if(a==='merge')mergeFirms(id);
  else if(a==='accept')acceptOffer(id);
  else if(a==='reject')rejectOffer(id);
  ui();
}

      'The real rate (policy rate minus inflation) is '+realR.toFixed(1)+'%. '+(realR<1.5?'That is below about 2%, so inflation is accelerating. ':realR>2.5?'That is above about 2%, so inflation is slowing. ':'That is close to neutral, so inflation is roughly steady. ')+(e.tight>0.2?'Labor is tight, which adds pressure. ':e.tight<-0.2?'Labor is slack, which holds prices down. ':'')+(S.shock>0.2?'Supply shocks are adding pressure. ':''),
      'The guide suggests '+e.taylor.toFixed(2)+'%. Raising the rate, trimming deficits or easing supply problems cool prices. Stimulus and balance-sheet expansion heat them up.'];

    o.p=[Math.round(e.unemp*100)+'% of workers have no job.','Shops, factories, data centers and big projects create jobs. Power and water shortages cut them, and so do traffic jams.','Cheaper credit also gets builders moving, which creates construction work.'];

    o.a=[['Open corporate','corp'],['Open monetary policy','pol:monetary']];
  }else if(k==='supply'){
    o.t='Supply costs';
    o.p=['Construction and goods cost \u00D7'+(1+shk()).toFixed(2)+' of normal.','This blends world channels: energy, shipping, materials, chips, food and trade. Crises raise them and they fade over months. Nuclear power and ports soften the blow.'];
    o.a=[['Build ports and plants','grp:trans']];
  }else if(k==='power'){

    o.t='Water use';

    o.a=[['Open utilities','grp:util']];
  }
  else if(k==='era'){

/* ================= input ================= */
var ptrs={},gest=null,painting=false,lastIdx=-1,firstHit=false,downInfo=null;
function localXY(e){var r=$('cv').getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function paintAt(x,y){
  var i=pickTile(x,y);if(i<0||i===lastIdx)return;
  var first=firstHit;firstHit=false;
  if(lastIdx>=0&&!first){
    var x0=lastIdx%MW,y0=(lastIdx/MW)|0,x1=i%MW,y1=(i/MW)|0,n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
    if(n>1){for(var k=1;k<n;k++){act(Math.round(y0+(y1-y0)*k/n)*MW+Math.round(x0+(x1-x0)*k/n),false);}}
  }
  lastIdx=i;hoverIdx=i;act(i,first);
}
function startGesture(){
  var ids=Object.keys(ptrs),a=ptrs[ids[0]],b=ptrs[ids[1]];
  gest={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
}
var lastTap={t:0,x:0,y:0},vel={vx:0,vy:0,t:0},fling=null;
function applyCompact(){var a=$('app');if(a)a.classList.toggle('compact',compact);}
function overlayMode(){return !!(window.matchMedia&&window.matchMedia('(max-aspect-ratio: 11/10), (min-aspect-ratio: 11/10) and (min-width: 560px) and (max-height: 519px)').matches);}
function updateTrayBtn(){
  var b=$('trayBtn'),a=$('app');if(!b||!a)return;
  b.textContent=a.classList.contains('tray')?'Hide tools':('Build: '+TOOLS[tool].name);
}
function setTray(on){var a=$('app');if(a)a.classList.toggle('tray',!!on);updateTrayBtn();}
function wire(){
  var cv=$('cv');
  cv.addEventListener('pointerdown',function(e){
    if(splashOpen||sheetKind)return;e.preventDefault();fling=null;
    try{cv.setPointerCapture(e.pointerId);}catch(x){}
    var p=localXY(e);ptrs[e.pointerId]={x:p[0],y:p[1]};
    if(Object.keys(ptrs).length>=2){startGesture();if(painting)commitUndo();painting=false;downInfo=null;return;}
    if(!S||S.over)return;
    var panMode=handMode||(tool==='inspect')||e.button===1||e.button===2;
    downInfo={x:p[0],y:p[1],lx:p[0],ly:p[1],moved:false,pan:panMode};
    vel.vx=0;vel.vy=0;vel.t=performance.now();
    if(!panMode){beginUndo();painting=true;lastIdx=-1;firstHit=true;paintAt(p[0],p[1]);}
  });
  cv.addEventListener('pointermove',function(e){
    var p=localXY(e);
    if(ptrs[e.pointerId]){ptrs[e.pointerId].x=p[0];ptrs[e.pointerId].y=p[1];}
    if(gest&&Object.keys(ptrs).length>=2){
      var ids=Object.keys(ptrs),a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      zoomAt(d/gest.d,mx,my);panBy(mx-gest.mx,my-gest.my);gest.d=d;gest.mx=mx;gest.my=my;return;
    }
    if(downInfo){
      if(downInfo.pan){
        var dx=p[0]-downInfo.lx,dy=p[1]-downInfo.ly;
        if(!downInfo.moved&&Math.hypot(p[0]-downInfo.x,p[1]-downInfo.y)>6)downInfo.moved=true;
        if(downInfo.moved){
          panBy(dx,dy);
          var nw=performance.now(),dtm=Math.max(1,nw-vel.t);
          vel.vx=0.7*vel.vx+0.3*(dx/dtm);vel.vy=0.7*vel.vy+0.3*(dy/dtm);vel.t=nw;
        }
        downInfo.lx=p[0];downInfo.ly=p[1];
      }else if(painting)paintAt(p[0],p[1]);
    }else if(e.pointerType==='mouse'&&S&&!S.over&&!splashOpen&&!sheetKind){
      var hi=pickTile(p[0],p[1]);
      if(hi!==hoverIdx){hoverIdx=hi;dirty=true;if(hi>=0&&tool==='inspect')showTile(hi);}
    }
  });
  var up=function(e){
    var wasTwo=Object.keys(ptrs).length>=2;
    delete ptrs[e.pointerId];
    if(wasTwo){if(Object.keys(ptrs).length<2)gest=null;downInfo=null;if(painting)commitUndo();painting=false;return;}
    if(downInfo&&downInfo.pan&&S&&!S.over&&!splashOpen&&!sheetKind){
      if(!downInfo.moved){
        var nowT=performance.now(),dbl=(tool==='inspect'&&nowT-lastTap.t<320&&Math.hypot(downInfo.x-lastTap.x,downInfo.y-lastTap.y)<30);
        if(dbl){zoomAt(cam.z<0.9?1.7:0.55,downInfo.x,downInfo.y);lastTap.t=0;}
        else{var i=pickTile(downInfo.x,downInfo.y);if(i>=0)act(i,true);lastTap={t:nowT,x:downInfo.x,y:downInfo.y};}
      }else if(performance.now()-vel.t<90&&Math.hypot(vel.vx,vel.vy)>0.2){
        fling={vx:vel.vx,vy:vel.vy,last:performance.now()};
      }
    }
    if(painting)commitUndo();
    downInfo=null;painting=false;lastIdx=-1;
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'&&hoverIdx>=0){hoverIdx=-1;dirty=true;}});
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  cv.addEventListener('wheel',function(e){e.preventDefault();var p=localXY(e);zoomAt(Math.exp(-e.deltaY*0.0015),p[0],p[1]);},{passive:false});
  $('tools').addEventListener('click',function(e){var b=e.target.closest('.tool');if(b)selectTool(b.getAttribute('data-t'));});
  $('groups').addEventListener('click',function(e){var b=e.target.closest('button');if(b)selectGroup(b.getAttribute('data-g'));});
  $('speed').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;speed=parseInt(b.getAttribute('data-s'),10);ui();});
  $('btnPolicy').addEventListener('click',function(){if(S&&!S.over)openSheet('policy');});
  $('hand').addEventListener('click',function(){handMode=!handMode;ui();toast(handMode?'Drag pans the map. Tap to build.':'Drag paints with the current tool. Two fingers pan and zoom.');});
  $('btnEcon').addEventListener('click',function(){if(S&&!S.over)openSheet('econ');});
  $('btnCorp').addEventListener('click',function(){if(S&&!S.over)openSheet('corp');});
  $('btnMenu').addEventListener('click',function(){if(S&&!S.over&&!splashOpen)showMenu();});
  document.addEventListener('pointerdown',function(){auInit();});
  $('undo').addEventListener('click',function(){undoLast();});
  $('popx').addEventListener('click',hidePop);
  $('popAct').addEventListener('click',function(){openSheet('brief');});
  $('pprev').addEventListener('click',function(){popStep(-1);});
  $('pnext').addEventListener('click',function(){popStep(1);});
  $('turn').addEventListener('click',turnBuilding);
  $('lay').addEventListener('click',function(){cycleOverlay();});
  $('adv').addEventListener('click',function(){if(S&&!S.over)openSheet('adv');});
  $('zIn').addEventListener('click',function(){zoomAt(1.25);});
  $('zOut').addEventListener('click',function(){zoomAt(0.8);});
  $('rotL').addEventListener('click',function(){cam.rot=(cam.rot+3)%4;dirty=true;});
  $('rotR').addEventListener('click',function(){cam.rot=(cam.rot+1)%4;dirty=true;});
  $('brandBox').addEventListener('click',function(){
    if(overlayMode()){$('app').classList.toggle('chips');return;}
    compact=!compact;store('sc5000.compact',compact?'1':'0');applyCompact();if(S)ui();
  });
  $('trayBtn').addEventListener('click',function(){setTray(!$('app').classList.contains('tray'));});
  var chipOpen=function(e){var c=e.target.closest('.chip');if(c&&S&&!S.over&&c.getAttribute('data-k')){exKey=c.getAttribute('data-k');openSheet('explain');}};
  $('econ').addEventListener('click',chipOpen);
  $('econ').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();chipOpen(e);}});
  $('mm').addEventListener('pointerdown',function(e){
    var r=$('mm').getBoundingClientRect();cam.wx=clamp((e.clientX-r.left)/r.width*MW,0,MW);cam.wy=clamp((e.clientY-r.top)/r.height*MH,0,MH);dirty=true;mmDirty=true;
  });
  $('splashBody').addEventListener('click',function(e){var go=e.target.closest('[data-go]');if(go){e.preventDefault();goTo(go.getAttribute('data-go'));}});
  $('sheet').addEventListener('click',function(e){
    var go=e.target.closest('[data-go]');if(go){e.preventDefault();goTo(go.getAttribute('data-go'));return;}
    var opn=e.target.closest('[data-open]');if(opn){e.preventDefault();openSheet(opn.getAttribute('data-open'));return;}
    var br=e.target.closest('[data-br]');if(br&&sheetKind==='brief'){var pr=br.getAttribute('data-br').split('|');applyBrief(pr[0],parseInt(pr[1],10));ui();if(S.briefs.length)renderBrief();else closeSheet();return;}
    if(e.target.id==='sheet'||e.target.getAttribute('data-close')){closeSheet();return;}
    var mn=e.target.closest('[data-mn]');if(mn&&sheetKind==='menu'){menuAct(mn.getAttribute('data-mn'));return;}
    var mu=e.target.closest('[data-mu]');if(mu&&sheetKind==='mute'){toggleMute(mu.getAttribute('data-mu'));renderMute();return;}
    var ex=e.target.closest('[data-ex]');if(ex&&sheetKind==='explain'){exAct(ex.getAttribute('data-ex'));return;}
    var sv=e.target.closest('[data-sv]');if(sv&&sheetKind==='saves'){savesAct(sv);return;}
    var d=e.target.closest('[data-dis]');if(d){closeSheet();triggerDisaster(d.getAttribute('data-dis'));return;}
    var pl=e.target.closest('[data-pol]');if(pl&&sheetKind==='policy'){polAct(pl);return;}
    var a=e.target.closest('[data-act]');if(a&&sheetKind==='corp')corpAct(a);
  });
  document.addEventListener('keydown',function(e){
    var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
    var k=e.key;

    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(k==='Escape'){if(sheetKind)closeSheet();else{pending=null;distState=null;hidePop();dirty=true;}return;}
    if(splashOpen||sheetKind||!S||S.over)return;
    var st=70,lk=k.length===1?k.toLowerCase():k;

    else if(lk==='ArrowDown'||lk==='s')panBy(0,-st);

    else if(lk==='-'||lk==='_')zoomAt(0.83);

    else if(lk==='e'){cam.rot=(cam.rot+1)%4;dirty=true;}

    else if(lk==='1'||lk==='2'||lk==='3'){speed=parseInt(lk,10);ui();}

    else if(lk==='l')cycleOverlay();
    else if(lk==='h'){handMode=!handMode;ui();toast(handMode?'Drag pans the map. Click to build.':'Drag paints with the current tool.');}
    else if(lk==='t')openSheet('adv');
    else if(lk==='p')openSheet('policy');
    else if(lk==='g')openSheet('econ');
    else if(lk==='c')openSheet('corp');
    else if(lk==='m')showMenu();
  });

}
function turnBuilding(){

  if(!o||!o.size||o.size[0]===o.size[1]){toast('Pick a long building (port, convention, metro, dam) to turn it.');return;}

/* ================= main loop and boot ================= */
var lastT=0,acc=0,compact=false,lastAmb=0;
function frame(t){
  var dt=Math.min(250,t-lastT);lastT=t;
  if(S&&!S.over&&speed>0&&!sheetKind&&!splashOpen){
    acc+=dt;var per=[0,1400,700,280][speed];
    while(acc>=per){acc-=per;tick();if(!S||S.over||splashOpen)break;}
  }else acc=0;
  if(fling){var dtf=Math.min(50,t-(fling.last||t));fling.last=t;panBy(fling.vx*dtf,fling.vy*dtf);var dec=Math.pow(0.93,dtf/16);fling.vx*=dec;fling.vy*=dec;if(Math.hypot(fling.vx,fling.vy)<0.02)fling=null;}
  if(S&&animOn())dirty=true;
  else if(S&&ambientOn()&&t-lastAmb>=66){dirty=true;lastAmb=t;}
  if(dirty){dirty=false;draw();}
  if(mmDirty){mmDirty=false;drawMini();}
  requestAnimationFrame(frame);
}

,scan:scan,
    setTool:function(t){tool=t;},act:act,bailout:bailout,setDeposit:setDeposit,landfillSpace:landfillSpace,stepWaste:stepWaste,checkSite:checkSite,placeBuilding:placeBuilding,clearAt:clearAt,rootOf:rootOf,sizeOf:sizeOf,get PAR(){return PAR;},get MW(){return MW;},setPending:function(p){pending=p;},setRate:setRate,setQE:setQE,sendStimulus:sendStimulus,renderPolicy:renderPolicy,setPolTab:function(t){polTab=t;},borrow:borrow,repay:repay,draw:draw,cam:cam,view:view,pickTile:pickTile,drawMini:drawMini,
