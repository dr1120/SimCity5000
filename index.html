{id:'g-screen',title:'The screen and controls',
 brief:'The map is in the middle. Numbers across the top show your money and the economy. Tools are at the bottom. Drag to move the map, tap to build, pinch to zoom.',
 more:'<p><b>Top:</b> your city name (tap it to collapse the stats), Goals for what to do next, advice and objectives, and Menu. The four boxes show Cash, People, Approval and Cash per month. The row of chips below shows the policy rate, inflation, mortgage rate, jobless rate, home prices, stocks, supply costs, power use and water use. Tap any chip to learn what it means and what to do.</p>'+
 '<p><b>Map buttons (right side):</b> zoom in and out, rotate the view, the hand button switches between pan mode (drag moves the map, tap builds) and paint mode (drag paints roads and zones), and Layers cycles through data views.</p>'+
 '<p><b>Bottom:</b> Build opens the toolbox, with five tabs: Build (zoning and districts), Utilities (power, water and waste), Services (police, fire, schools, parks), Transport (roads, buses, rail, metro, port, airport) and Growth (labs, university, data center, exchange, stadium, convention). Below sit the pause and speed buttons, then Policy, Economy and Corp. On the map, a floating Undo button reverses your last build and refunds it, and a Turn button appears when you pick a long building.</p>'+
 '<p><b>Building:</b> small things build on one tap. Big buildings show a green footprint first and ask for a second tap on the same spot. Tap a tile with the Move tool to see what it does and what it is missing.</p>'+
 '<p><b>Two fingers</b> always pan and zoom. Double-tap with the Move tool zooms in. A quick flick keeps the map gliding. The small map in the corner jumps you to any spot.</p>'},
{id:'g-start',title:'Your first fifteen minutes',
 brief:'Build power, build a water pump, lay roads, then zone homes, shops and factories next to the roads. Wait and watch people arrive.',
 more:'<ol><li><b>Power:</b> open the Utilities tab, pick Coal (cheap) or Gas, and tap twice to place it near the middle of where you want the city.</li>'+
 '<li><b>Water:</b> in Utilities, under water and waste, place a Pump on a tile that touches water. The pump must also be inside your power plant\u2019s reach or it makes nothing.</li>'+
 '<li><b>Roads:</b> open the Transport tab, pick Road and lay lines where you want to build. Use the pencil button to drag.</li>'+
 '<li><b>Zones:</b> in the Build tab, zone about six homes, a couple of shops and a couple of factories right beside the roads, inside power and water range.</li>'+
 '<li><b>Wait:</b> builders move in when there is demand and credit is cheap. Watch the dots over lots: red means no road, yellow no power, blue no water.</li>'+
 '<li><b>Past 150 people:</b> add a sewage plant and a landfill from the Utilities tab.</li></ol>'+
 '<p>A fast way to lay out a neighborhood is the district brush: pick Suburb in the Build tab, tap two corners, then tap the second corner again to build roads and lots in one go.</p>'},
{id:'g-zones',title:'Roads, zones and growth',
 brief:'You zone land and run roads. Private builders do the building. Homes house people, shops and factories give them jobs and goods. A lot only grows if it touches a road and has power and water. Research Arterial roads and a lot can sit two tiles from a road instead.',
 more:'<p><b>Each lot has a level from 1 to 3.</b> Homes hold 6, 15 and 30 people. Shops give 4, 10 and 20 jobs. Factories give 6, 14 and 26 jobs.</p>'+
 '<p><b>Demand drives growth.</b> Homes grow when homes are nearly full and there are jobs. Shops grow when shoppers outnumber shop jobs. Factories grow when there are idle workers and shops need goods. Builders move faster when mortgage rates are low, supply costs are normal and taxes are modest.</p>'+
 '<p><b>Balance matters.</b> A rough ratio is about three homes for each shop lot and two factory lots, but watch the jobless rate and the Advisors. Too many homes and no jobs means unemployment. Too many jobs and no homes means a labor shortage and rising prices.</p>'+
 '<p><b>Tall homes need parks.</b> A level 2 home only reaches level 3 when parks cover about one for every 15 home lots.</p>'+
 '<p><b>Mega towers.</b> When a 2 by 2 block of level 3 lots is fully served and demand is strong, developers can merge it into one mega tower: 150 people for homes, or about 110 jobs for shops. Homes still need park coverage.</p>'+
 '<p><b>District brush.</b> Suburb is mostly homes, Downtown is mostly shops, Industry park is mostly factories. Tap one corner, then the opposite corner (up to 16 by 16), and the plan shows with its cost. Tap the same corner again to build. Undo reverses the whole district.</p>'+
 '<p><b>Arterial roads</b> (a foundation technology). Lots can sit up to two tiles from a road, so blocks can be twice as deep and you need fewer streets. Three tiles is still too far. Roads still cost money and still carry traffic, so wider blocks are a trade-off rather than a free upgrade.</p>'+
 '<p><b>Terrain.</b> Forest costs about 35% more to clear. Hills cost more to build on. Mountains cannot be built on. Water only takes bridges, at four times the road price.</p>'},
{id:'g-power',title:'Power',
 brief:'Every building needs power. Plants cover a diamond around them and power lines stretch that reach. If demand beats supply, jobs and growth drop everywhere.',
 more:'<p><b>Demand:</b> about 2 MW per level of every home, shop and factory, plus the special buildings. A heatwave adds 20%.</p>'+
 '<table class="gt"><tr><th>Plant</th><th>Output</th><th>Notes</th></tr>'+
 '<tr><td>Coal</td><td>60 MW</td><td>Cheap, dirty. Fuel bill follows supply shocks.</td></tr>'+
 '<tr><td>Gas</td><td>85 MW</td><td>Cleaner. Fuel prices swing the most.</td></tr>'+
 '<tr><td>Nuclear</td><td>420 MW</td><td>Advanced fission research. 10 months to build. Steady, clean, low fuel cost, and shocks barely touch it.</td></tr>'+
 '<tr><td>Hydro</td><td>26 MW</td><td>Needs a waterfront tile. Drought halves it.</td></tr>'+
 '<tr><td>Solar</td><td>12 MW</td><td>Weaker in winter and under cloud. Photovoltaics adds 50%.</td></tr>'+
 '<tr><td>Wind</td><td>14 MW</td><td>Gusty. Better on hills and coasts.</td></tr>'+
 '<tr><td>Fusion</td><td>650 MW</td><td>Very hard research. 14 months to build.</td></tr></table>'+
 '<p><b>Connected buildings pass power along.</b> Power moves through any chain of touching buildings, homes, shops, factories and public buildings alike, so a block that touches a powered building is powered too. Roads break the chain, so cross them with a power line or keep the reach of a plant or line in mind.</p>'+
 '<p><b>Reach:</b> each plant covers a diamond around its center (8 tiles for coal and gas, 14 for nuclear, 16 for fusion). Power lines carry power from a plant and each powered line reaches 4 tiles around it. Overhead lines take up a tile, can burn and can be torn out by a tornado. Research Underground cables for a buried cable that runs beneath roads and buildings, costs more, and is safe from fire and tornadoes.</p>'+
 '<p><b>Batteries</b> even out solar and wind swings by up to 8 MW a tile, lose 15% each way, cost a lot, and can catch fire. Fire stations barely help against them.</p>'+
 '<p><b>Grid link:</b> lets you sell surplus power and buy shortfalls at neighboring cities\u2019 prices. Buying is expensive.</p>'},
{id:'g-water',title:'Water, sewage, garbage and recycling',
 brief:'Water works like power: pumps cover an area and pipes extend it. Past 150 people you also need sewage treatment and somewhere to put garbage, or voters get unhappy. Landfills fill up, so plan alternatives.',
 more:'<p><b>Water also passes through touching buildings.</b> Any chain of connected buildings carries water the same way power travels, and roads break the chain. Pipes still extend reach across roads and gaps.</p>'+
 '<p><b>Pumps</b> (Utilities tab) give 100 units, reach 8 tiles, must touch water, and need power. Desalination gives 80 units anywhere. Pipes are buried water mains: they run underground, beneath roads and buildings, so they never take up a lot, and each wet pipe tile reaches 4 tiles. Drag along the route you want. The bulldozer digs a pipe up from bare ground. Homes use 2 units per level, shops 1 and factories 2.5. Droughts cut supply 30%. Water recycling research cuts demand 30%. Each reservoir blunts a drought by about 8 points, up to 27%.</p>'+
 '<p><b>Sewage:</b> a plant treats 150 units and needs power. Demand is 80% of your water use. Untreated sewage drags mood down.</p>'+
 '<p><b>Garbage demand</b> is about 0.04 per resident plus 0.03 per job. Three things can take it:</p>'+
 '<ul><li><b>Landfill</b> (150 units a month, cheap). It has finite space, about 9,000 units, so a landfill fed at full speed is full in five years and at a more typical load lasts a decade or more. A full landfill is capped and stops accepting garbage. Removing a capped landfill costs a cleanup fee of about $4,000. Landfills also add pollution nearby.</li>'+
 '<li><b>Recycling plant</b> (120 units a month, needs power). It sells the materials, so it earns a little, and it never fills a landfill.</li>'+
 '<li><b>Waste-to-energy</b> (200 units a month and 30 MW of power). A bit of pollution, but it never fills a landfill.</li></ul>'+
 '<p>Processing plants take garbage first. Landfills get only what is left. A recycling ordinance cuts garbage by 30% for a monthly fee. These penalties only start once the city passes about 150 people.</p>'},
{id:'g-civic',title:'Police, fire, schools, hospitals and parks',
 brief:'Services make people happier and protect the city. Police, fire and schools cover an area, so place them near homes. Hospitals and schools also have capacity, so you need enough of them for your population.',
 more:'<p><b>Police</b> cover 8 tiles and lift mood. <b>Fire stations</b> cover 8 tiles and stop fires from spreading. <b>Schools</b> cover 9 tiles for mood, wages and research. <b>Hospitals</b> are 2 by 2, need power and water, and each serves about 800 residents.</p>'+
 '<p><b>Capacity.</b> Once the city passes about 150 people you also need enough seats: roughly one school per 700 residents (universities count for more) and one hospital per 800. Gaps cost mood. Hospitals also soften outbreaks.</p>'+
 '<p><b>Parks</b> lift mood, cut pollution nearby, and let tall homes happen.</p>'+
 '<p><b>Funding:</b> the Public services, Public safety, Healthcare and Education sliders in Policy change both the cost and how well these work. See Taxes, spending and debt.</p>'},
{id:'g-social',title:'Social services and homelessness',
 brief:'A city has to help people who are out of work or priced out of housing. If you do not, mood and approval fall. The need grows with unemployment and expensive housing.',
 more:'<p><b>The need</b> is about 0.04 per resident, plus more when unemployment is high and when homes are unaffordable (high prices and mortgage rates). It also creeps up as the city ages. The Economy panel shows the amount.</p>'+
 '<p><b>Funding:</b> Policy, Spending, Social services sets a flat monthly amount. Even with zero spending charities and churches cover about 30% of the need. Meeting the full need removes the mood penalty. Because unemployment and housing stress feed it, a recession or a rate hike raises the bill.</p>'},
{id:'g-traffic',title:'Traffic, buses and rail',
 brief:'Every built lot sends trips onto nearby roads. When roads fill up, jobs and mood suffer. Buses and rail add capacity.',
 more:'<p>Each road tile carries about 6 units. A lot loads the roads within 3 tiles of it. Above 100% of capacity, productivity and mood fall. Pick the Traffic layer to see red roads. On the map, cars turn red when a road is jammed.</p>'+
 '<p><b>More capacity:</b> a bus depot adds 60% within 6 tiles. A powered rail station adds 50% within 8 tiles. A metro adds 25% citywide. The transit subsidy ordinance adds 15%. A denser road grid spreads trips out.</p>'+
 '<p><b>Rail:</b> place two stations (Transport tab), join them with Rail track, and make sure both have power. Track alone does nothing, and a station alone does nothing. Once connected, a train runs between them, riders pay fares, and the roads nearby get relief. Stations and track cost upkeep and rarely pay for themselves, so treat them as a way to unlock growth.</p>'},
{id:'g-layers',title:'Layers: pollution, crime and land value',
 brief:'The Layers button colors the map to show hidden numbers. Green is good and red is bad, except land value where it flips.',
 more:'<p><b>Power and Water</b> show what is covered. <b>Pollution</b> comes from factories, coal and gas, ports, airports and landfills, and is soaked up by parks. <b>Crime</b> grows with density and unemployment and is cut by police. <b>Land value</b> rises with waterfront, hills, parks, schools, rail and the metro, and falls with pollution and crime. <b>Traffic</b> shows road load.</p>'+
 '<p>Pollution is the only layer that directly changes mood. The clean air ordinance cuts it about 35% at a small cost to factory output.</p>'},
{id:'g-fiscal',title:'Taxes, spending and debt',
 brief:'You set every tax and every budget line. Taxes fund the city, but each rate has a price in growth or mood. Borrowing gets you cash now and costs interest later.',
 more:'<p><b>Local projects tax</b> (Policy, Taxes tab). An optional extra 1% on sales, kept in its own fund. When the fund can pay for something, the council puts three pet projects on the table and you pick one: a dog park, a skate park, a mural program, a theater, a library branch or, in later eras, zero-gravity sports halls, observatories and orbital sunrise parks. Each gives a small permanent boost to happiness, approval, tourism, research or exports, and costs more as your civilization grows. Some projects are one-offs, like fireworks or a statue of the mayor\u2019s cat. You can also skip a round and keep saving.</p>'+
 '<p><b>Taxes</b> (Policy, Taxes tab): income tax (default 9%), sales tax (6%), property tax (1.0 times) and business tax (6%). Income tax above 10% slows builders and sours voters. Sales tax above 8% cuts shopping. Property tax above 1.3 times chills housing. Business tax above 10% makes firms hesitate and slows startups.</p>'+
 '<p><b>Spending</b> (Spending tab), as percentages of normal: Public services (city staff), Public safety (police and fire pay and equipment), Healthcare (hospitals and clinics), Education (schools and universities), Infrastructure upkeep and Infrastructure renewal. Social services is a flat monthly amount. More funding makes services work better and costs more. Cutting infrastructure upkeep below 100% makes power and water plants lose output. Cutting renewal lets the city wear out (see Aging infrastructure).</p>'+
 '<p><b>Other costs you will see:</b> pensions and retiree costs, public safety overtime when crime is high, healthcare costs that rise as the city ages, and resilience costs for levees, reservoirs and seismic retrofit.</p>'+
 '<p><b>Stimulus:</b> checks of $25 or $100 per resident. Spending jumps for four months and approval rises, but it feeds inflation.</p>'+
 '<p><b>Ordinances:</b> recycling, clean air, transit subsidy and seismic retrofit, each with a cost and an effect described there.</p>'+
 '<p><b>Debt</b> (Books tab): a fixed bond locks the rate at policy rate plus 2.0 points. A variable loan floats at policy rate plus 1.0. You can borrow in $5,000 steps up to a limit of $12,000 plus $25 per resident. Because you set the policy rate, a variable loan costs whatever you decide.</p>'+
 '<p>The Books tab also shows last month\u2019s revenue and costs line by line.</p>'},
{id:'g-aging',title:'Aging infrastructure and long-run costs',
 brief:'Pipes, wires, roads and plants wear out, and the bills grow as your city gets older. If you cut corners on renewal, things start to fail.',
 more:'<p><b>Condition.</b> The city has one infrastructure condition score from 20% to 100%. It only falls if you underfund renewal (Policy, Spending, Infrastructure renewal). At 100% funding it stays put. Above 100% it slowly rebuilds. Condition also drops after earthquakes and floods.</p>'+
 '<p><b>What renewal costs.</b> The amount needed to hold steady is a share of the value of your roads, lines, pipes, plants and public buildings. That share starts around 0.12% a month and grows every year the city ages, reaching roughly 0.5% a month after 35 years. So the bill rises on its own, which is why a rich young city does not stay rich forever.</p>'+
 '<p><b>What poor condition does.</b> Power and water output and road capacity fall a little as condition drops. Upkeep gets dearer (up to about double at very low condition). Below 75% random failures begin: a water main bursts (water supply down 30%), transformers fail (power down 25%), or a bridge and roads close (road capacity down 15%), each lasting two to four months.</p>'+
 '<p><b>Other costs that grow with age.</b> Pensions and retiree costs build up as the city gets older, up to about 0.8 dollars a month per resident after 25 years. Healthcare costs climb about 0.15% a month. Services, civic buildings and capital projects also get dearer by about 1.2% a year. Inflation raises costs further.</p>'+
 '<p><b>Choices.</b> You can fund renewal fully, underfund it to save cash now and pay later, or overfund to rebuild. The Economy panel shows condition and the monthly renewal needed.</p>'},
{id:'g-monetary',title:'Interest rates and inflation',
 brief:'You set the policy rate. Low rates speed up building and lift stocks and house prices but heat up inflation. High rates cool prices but freeze growth. Aim for inflation near 2% with people at work.',
 more:'<p><b>Setting the rate:</b> Policy, Monetary tab. Move the slider in quarter points and tap Set policy rate. A preview shows where inflation is likely headed in a year. The Taylor-rule guide suggests a sensible rate from current inflation and jobs.</p>'+
 '<p><b>How far the lever goes.</b> The policy rate runs from 0% to 20%, in quarter points. 20% is about where the real Federal Reserve peaked in 1981. You almost never need it. A steady 7 to 9% tames 10% inflation in a few years, and 15% starts to crush building and housing. The top of the range is for a spiral you let run, when inflation is above 13% and you want the real rate high enough to win credibility back.</p>'+
 '<p><b>Mortgage rates</b> follow your policy rate with a lag (about a quarter of the gap closes each month) plus a spread of about 1.2 points. The spread grows when inflation is above 6% or in a credit crunch.</p>'+
 '<p><b>Inflation</b> has momentum. Each month it speeds up while the real rate (your policy rate minus inflation) is below about 2 points, and slows down while the real rate is above that. A rate below neutral nudges inflation up toward a higher resting level over a couple of years, and a rate above neutral pulls it down. The effect is gradual and proportional: each point of rate moves where inflation settles by a bit more than a point. A rate that is too high drives prices down and eventually into deflation.</p><p><b>Credibility.</b> People expect inflation to stay near 2% as long as they trust you. Years above 6% loosen that anchor, and then every rate move has a bigger and faster effect, for better or worse. Steady prices and firm real rates rebuild it slowly.</p><p><b>The neutral rate drifts.</b> Productivity, saving habits and demographics move the neutral rate by a point or so over the years, and you cannot see it directly. The Taylor guide is an estimate, so watch inflation and jobs as well Tight labor markets, supply shocks, deficits, stimulus and balance-sheet expansion add pressure, and recessions take it away. Nuclear power cuts the effect of supply shocks.</p><p>Inflation above 4% hurts mood, above 5% hurts approval, and below zero freezes building. Mortgage rates also add a risk premium when inflation is above 2%.</p><p><b>Rule of thumb:</b> with inflation at target you need a policy rate around 4%. If inflation is higher, you need more than the same gap above it. The Taylor-rule guide in Policy does this arithmetic for you, including labor, shocks and deficits.</p>'+
 '<p><b>Balance sheet:</b> Expand buys bonds, which lowers mortgage rates and lifts stocks but builds bubbles and inflation. Shrink does the opposite.</p>'+
 '<p><b>Big surprises:</b> a large rate jump moves the stock market the same month.</p>'},
{id:'g-economy',title:'Housing, jobs and the business cycle',
 brief:'Home prices, jobs and supply costs all respond to your policy and to outside shocks. Watch the chips along the top.',
 more:'<p><b>Home prices</b> rise when homes are scarce and borrowing is cheap, and fall when rates climb or homes sit empty. Your property tax revenue follows them. Very high prices lower affordability and slow immigration.</p>'+
 '<p><b>Jobs:</b> workers are about 60% of residents. Shops, factories, data centers, projects and many buildings give jobs, and construction itself gives temporary jobs. Power and water shortages and traffic jams cut productive jobs.</p>'+
 '<p><b>Supply costs</b> multiply construction costs and hurt goods production. They blend the world channels (energy, shipping, materials, chips, food and trade). See World events and trade. Ports can import goods when factories fall short.</p>'+
 '<p><b>Local events</b> only start once your city has some size: recessions, remote-work waves, inflation scares, heatwaves, droughts and more. World events are covered separately. The headlines and Tips tell you what changed.</p>'},
{id:'g-world',title:'World events and trade',
 brief:'Things happen abroad that you cannot control: wars, embargoes, shipping crises, chip bans. Each hits a different channel, so each one hurts your city in a different way. You can respond, at a price.',
 more:'<p>World events start once your city is established, and at most two run at a time. Each pushes one or more of seven channels, shown under World watch in the Economy panel and as chips along the top when they are active.</p>'+
 '<table class="gt"><tr><th>Channel</th><th>What it does to you</th></tr>'+
 '<tr><td>Energy prices</td><td>Coal and gas plants cost much more to run, nuclear barely, renewables not at all. Pushes inflation up.</td></tr>'+
 '<tr><td>Shipping costs</td><td>Imported goods cost more and construction is dearer. Factories and ports feel it most.</td></tr>'+
 '<tr><td>Materials</td><td>Construction costs rise.</td></tr>'+
 '<tr><td>Chip supply</td><td>Research slows, and labs, data centers and biotech campuses cost more.</td></tr>'+
 '<tr><td>Food prices</td><td>Feeds inflation and sours mood.</td></tr>'+
 '<tr><td>Trade disruption</td><td>Export revenue and port import capacity fall.</td></tr>'+
 '<tr><td>Public health strain</td><td>Workplace output falls, services cost more, mood drops.</td></tr></table>'+
 '<p><b>Examples.</b> A war in the Gulf spikes energy and shipping. Tension around an East Asian strait starves you of chips. Attacks on shipping lanes triple freight. A tariff war or an embargo hits materials and export orders. A grain export ban pushes up food prices. A new virus cuts output. A banking crisis abroad tightens credit at home. Some events help: a new oil supply glut cuts energy prices, a global boom lifts exports, a trade deal eases tariffs.</p>'+
 '<p><b>Briefings.</b> When a crisis begins you get a popup with a Respond button and three months to decide. Each option costs money or support and softens the crisis: releasing fuel reserves, chartering ships, backing a domestic chip partnership, funding food assistance, sending a trade mission, ordering a lockdown. If you do nothing, the crisis runs at full strength.</p>'+
 '<p><b>Warnings and chains.</b> Most events give a few months of warning in the headlines, such as rising tensions or a market rumor, so you can build reserves first. Big crises also cause follow-ons. A Gulf war can lead to an oil cartel cut, an inflation scare, a shipping crisis or a recession. A tariff war can become an embargo. A virus can lead to a banking crisis, a recession and a remote-work wave. A bank failure can lead to a default or a stock crash. A grain ban can lead to food riots and inflation. Watch the World headlines for what comes next.</p>'+
 '<p><b>How long.</b> Crises build over a couple of months, last from half a year to well over a year, then fade slowly. Their effects feed into inflation, stocks and sometimes recessions, so your policy rate decisions interact with them.</p>'+
 '<p><b>Grid link.</b> Neighboring cities\u2019 power prices follow world energy prices, so selling surplus power pays better in an energy crisis and buying shortfalls costs more.</p>'},
{id:'g-markets',title:'Stocks, crashes and bailouts',
 brief:'A stock market runs in the background. It rises on cheap money and falls on high rates. Sometimes it crashes. You can soften the blow with insurance, a bailout, or an exchange.',
 more:'<p>Crash risk is low in normal times and climbs when the index is far above its start, when bubbles build, when you expand the balance sheet for long, and after sharp rate hikes. It only applies once the city passes about 300 people.</p>'+
 '<p><b>A crash</b> wipes out about a third of the market over three panic months, followed by a bear market. Startups lose funding and IPOs freeze. Banks tighten credit, adding 1.5 points to mortgage rates for a year. A recession follows about 60% of the time.</p>'+
 '<p><b>Deposit insurance</b> (Policy, Monetary tab) softens crashes by about a quarter but costs money every month and encourages risk. A <b>bailout</b> ends the panic and reopens credit, but traders then expect rescues. A <b>stock exchange</b> adds circuit breakers that shorten and soften crashes.</p>'},
{id:'g-office',title:'Recalls and receivership',
 brief:'A recall or a bankruptcy does not end the game. A caretaker mayor or a financial control board runs the city while you try to get the job back.',
 more:'<p><b>Recall.</b> If approval stays under 25% for eight months, voters recall you. A caretaker mayor, a computer-run successor, takes over, and it governs the opposite way to you. If you ran high taxes and generous spending, it is a small-government conservative who cuts taxes to 7% and trims services. If you ran low taxes and lean services, it is an activist who raises taxes and spends more on schools, health and safety. It also reverses your recycling, clean air, transit and seismic ordinances and sets interest rates tighter or looser than you did. It is still trying to make the city succeed: it balances the budget in its own style (the conservative cuts spending before raising taxes and hands surpluses back as tax cuts, the activist raises taxes before cutting services and spends surpluses on services), sets interest rates, keeps repair crews and utility planners running and handles disasters. It is competent, but it makes mistakes: services cut, taxes raised on a hunch, infrastructure left to slide. You can watch and look around, but you cannot build or change policy.</p>'+

 '<p><b>The campaign.</b> You have 30 minutes of running time to win the job back. This is the one real-time timer in the game. It only moves while the game clock is running, so it does not move while a panel is open or the game is paused, and you cannot skip it. Open the Campaign sheet from the button where Build usually is. You spend political capital, not city money. You earn it from achievements, pet projects and a little more every minute. You can hold a town hall (repeat after a short wait), challenge a debate (once), promise tax relief or better services (one promise, kept if you win) and ask the voter blocs that like you for their endorsements.</p>'+
 '<p><b>The election.</b> When the 30 minutes are up the city votes. Three things decide it: your record as mayor (average approval, how the city grew, scandals), how the city fared under the caretaker (a thriving city helps the caretaker, a struggling one helps you) and your campaign, plus a little luck. Win and you are mayor again. Approval is reset to a middling level, the group that likes you least stays hostile for two years, and a recall penalty on approval fades over five years. Lose and a new 30-minute campaign starts straight away. You can keep campaigning forever, or retire at any time and take your legacy score. There are no regular elections. Recalls are the only vote.</p>'+
 '<p><b>Receivership.</b> If the city runs out of money, a financial control board takes over instead of the game ending. It raises taxes, trims spending, keeps infrastructure renewal funded and sells surplus assets such as airports, universities and stadiums, starting with about eight months of spending in cash. If a year goes by with the books still in the red it sells more. When it leaves, your spending levels go back to where they were. There is no election. The board leaves once the city has three months of spending in the bank and a surplus for twelve months in a row, and you return as mayor. If ten years of austerity cannot balance the books and there is nothing left to sell, the state forgives the shortfall and hands the city back.</p>'+
 '<p><b>Voters.</b> Approval is the weighted view of six groups. Homeowners care about property taxes, home prices and mortgage rates. Renters care about rents, services and sales tax. Business owners care about business tax and the stock market. Workers care about jobs, wages and income tax. Retirees care about health care, inflation and property taxes. Young residents care about schools, housing costs and jobs. The Economy panel shows each group. Their moods nudge overall approval.</p>'+
 '<p><b>Scandals.</b> Corruption scandals drain approval and can lead to a recall. They get likelier with every pet project and much less likely with Transparency rules (Policy, Spending, ordinances; they cost a small slice of the budget).</p>'+
 '<p><b>The mayors of your city.</b> Menu, Mayors of your city, lists every mayor: you, the caretakers and the control board, with years, population, approval and how each tenure ended. The score counts comebacks and subtracts scandals.</p>'},
{id:'g-risk',title:'Risk, failure and black swans',
 brief:'Most startups fail, the sovereign fund is a real fund with real risks, and when the city is rich, happy and taking no risks, something nobody planned for can arrive.',
 more:'<p><b>Startups.</b> Every startup has a hidden quality. About half are duds that fold, a quarter limp along and get absorbed, and the rest are solid, star or, rarely, runaway successes. Tight money, recessions and low markets shorten the odds for all of them. A random $5,000 bet returns nothing about three times in four, and about one in seven returns five times or more. Spread your bets: on average a diversified investor makes a modest profit, and one in a hundred is a giant. Founders will not sell you more than 40% of a company, and a company cannot grow beyond what its economy can support.</p>'+
 '<p><b>Public companies.</b> Shares drift with the market, but accounting scandals and bankruptcies happen. Buying or selling a large stake moves the price against you, so you cannot cheaply buy a firm and flip it into a takeover bid.</p>'+
 '<p><b>The sovereign fund.</b> It pays a 0.5% annual fee. Stocks swing hard, and in recessions they fall further. Bonds lose value when rates rise and when inflation runs hot. As the fund grows large compared with your economy, its returns shrink toward the cash rate. A balanced fund earns a few percent a year with real bad years. Cash earns the least and never loses.</p>'+
 '<p><b>Black swans.</b> These are rare, big shocks with no warning: a run on the banks, a manager who turns out to be a fraud, a supervolcano, a far deadlier pandemic, a solar storm, a payments hack, a reserve currency collapse and a city-killer asteroid. They can only happen after year 10 in a city of 300 or more, and never closer than three years apart. The more complacent the city, the likelier they are: rich in reserves, voters happy, a long calm spell and no risks being taken. Holding ventures, equities in the fund or debt counts as taking risks and lowers the odds. The Corp tabs show a Surprise risk of low, medium or high. Financial swans take a bite out of cash and the fund, so a huge pile of cash is also a huge target.</p>'},
{id:'g-corp',title:'Research, startups, IPOs and takeovers',
 brief:'Fund research to unlock new technology. Each breakthrough spins out a startup you can invest in. Startups can fail, dilute you or go public and pay off big.',
 more:'<p><b>Research:</b> open Corp, then Research. Set a monthly R&D budget (up to $20,000), pick a project, and points accumulate. Labs multiply the speed, and so do schools, universities, data centers and Applied AI. Without a lab research runs at a quarter speed.</p>'+
 '<table class="gt"><tr><th>Technology</th><th>Unlocks</th></tr>'+
 '<tr><td>Photovoltaics</td><td>Solar farms produce 50% more.</td></tr>'+
 '<tr><td>Underground cables</td><td>Power cables can be buried beneath roads and buildings. They cannot burn.</td></tr>'+
 '<tr><td>Arterial roads</td><td>Lots can sit up to 2 tiles from a road.</td></tr>'+
 '<tr><td>Fiber and cloud</td><td>Data centers, and shop sales up 10%.</td></tr>'+
 '<tr><td>Water recycling</td><td>Demand down 30% and desalination.</td></tr>'+
 '<tr><td>Factory automation</td><td>Factories make 30% more goods. Needs Fiber.</td></tr>'+
 '<tr><td>Biotech</td><td>Biotech campuses.</td></tr>'+
 '<tr><td>Applied AI</td><td>Services cost 15% less and research is 25% faster. Needs Fiber.</td></tr>'+
 '<tr><td>Advanced fission</td><td>Nuclear plants.</td></tr>'+
 '<tr><td>Fusion power</td><td>Fusion plants. Needs fission and AI, three working labs and a university, and plasma setbacks keep resetting progress.</td></tr></table>'+
 '<p><b>Frontier technologies</b> are the late-game tier. They are expensive and slow, and they stall unless you have at least 2 working labs and a university. Research has diminishing returns: past about 8,000 points a month, more labs and money buy much less. Raise the R&D budget (up to $20,000 a month) to speed them up.</p>'+
 '<table class="gt"><tr><th>Technology</th><th>Effect</th></tr>'+
 '<tr><td>Genomic medicine</td><td>Hospitals serve 40% more, healthcare costs fall 15%, outbreaks hit 30% softer. Needs Biotech.</td></tr>'+
 '<tr><td>Rapid vaccine platforms</td><td>Pandemics start at half strength.</td></tr>'+
 '<tr><td>Autonomous vehicles</td><td>Roads carry 30% more before jamming. Needs Applied AI.</td></tr>'+
 '<tr><td>Vertical farming</td><td>Food price shocks hit half as hard. Needs Water recycling.</td></tr>'+
 '<tr><td>Advanced materials</td><td>Construction costs fall 12%, infrastructure ages 25% slower. Needs Automation.</td></tr>'+
 '<tr><td>Quantum computing</td><td>Research 30% faster, data centers earn 50% more. Needs Applied AI.</td></tr>'+
 '<tr><td>Superconductors</td><td>Power lines reach 2 tiles farther, 8% more usable power. Needs fission and AI.</td></tr>'+
 '<tr><td>Carbon capture and climate engineering</td><td>Pollution halved, heatwaves and droughts half as long. Needs fission.</td></tr>'+
 '<tr><td>General-purpose AI</td><td>Income tax up 15% and automation spreads fast. It raises AI risk, so fund oversight. Needs Quantum and AI.</td></tr>'+
 '<tr><td>Reusable launch vehicles</td><td>Unlocks the Spaceport. Needs Advanced materials and AI.</td></tr>'+
 '<tr><td>Orbital manufacturing</td><td>Spaceports earn double, exports up 20%, chip shortages half as bad.</td></tr>'+
 '<tr><td>Asteroid mining</td><td>Materials permanently cheaper and mining income per spaceport. Needs Orbital and Fusion.</td></tr>'+
 '<tr><td>Colony ship program</td><td>Unlocks the Colony ship yard, a milestone project. Needs Asteroid mining and Carbon capture.</td></tr>'+
 '<tr><td>Space elevator</td><td>Unlocks the Space elevator. Needs Reusable launch vehicles and Advanced materials.</td></tr>'+
 '<tr><td>Orbital solar power</td><td>Unlocks Orbital arrays. Needs Space elevator and Superconductors.</td></tr>'+
 '<tr><td>Antimatter production</td><td>Research 20% faster, launch fees up 25%. Needs Orbital solar power and Quantum computing.</td></tr>'+
 '<tr><td>Dyson swarm engineering</td><td>Unlocks Dyson nodes. Stalls until you are Type I. Needs Antimatter and Asteroid mining.</td></tr>'+
 '<tr><td>Matrioshka brains</td><td>Dyson nodes earn double, research 50% faster. Stalls until Type I. Needs Dyson swarms and General-purpose AI.</td></tr>'+
 '<tr><td>Traversable wormholes</td><td>Unlocks Galactic relays. Stalls until you are Type II. Needs Matrioshka brains.</td></tr>'+
 '<tr><td>Dark-energy harvesting</td><td>Unlocks Dark-energy taps. Stalls until you are Type III. Needs Traversable wormholes and Matrioshka brains.</td></tr>'+
 '<tr><td>Universe engineering</td><td>Unlocks Universe forges. Stalls until you are Type IV. Needs Dark-energy harvesting.</td></tr></table>'+
 '<p><b>Sovereign wealth fund</b> (Corp, Fund tab): park surplus cash in a fund that invests in stocks, bonds and cash. Stocks follow the market and crash with it, bonds earn a bit above cash when rates are high. You can set a yearly payout into the budget (3% is the classic rule), withdraw any time, and let the fund auto-cover cash shortfalls. If the fund grows beyond about two years of revenue while income tax is above 9%, voters grumble.</p>'+
 '<p><b>Data centers</b> are 3 by 3, must touch water for closed-loop cooling that uses none, and draw a lot of power. They bring construction work, 70 high-wage jobs, cloud revenue and faster research.</p>'+
 '<p><b>Ventures:</b> each startup shows its value, runway and your stake. Invest to raise your stake and extend its runway. A startup lists when it passes $70,000 after at least a year if the market is calm. At the IPO you sell 35% of your stake and the city collects listing fees. Listed firms pay dividends, bring jobs and can be bought, sold, merged or taken over.</p>'+
 '<p><b>Deals:</b> now and then a buyer bids for a listed firm. Accepting pays you and the city, but takeovers usually cut headquarters jobs 40% within two years.</p>'},
{id:'g-projects',title:'Capital projects',
 brief:'Big, expensive buildings unlock as your city grows. Each takes months to build and pays off in a specific way.',
 more:'<table class="gt"><tr><th>Project</th><th>Unlocks at</th><th>Payoff</th></tr>'+
 '<tr><td>Stadium</td><td>600 people</td><td>Mood, approval, tourism money.</td></tr>'+
 '<tr><td>University</td><td>900</td><td>Research up 60%, wages up.</td></tr>'+
 '<tr><td>Convention center</td><td>1,000</td><td>Retail sales up 12%, visitors.</td></tr>'+
 '<tr><td>Metro</td><td>1,200</td><td>Traffic relief, mood, housing demand.</td></tr>'+
 '<tr><td>Stock exchange</td><td>1,400</td><td>Doubles IPO fees, softens crashes.</td></tr>'+
 '<tr><td>Airport</td><td>1,500</td><td>Exports up 35%, business demand. Noisy.</td></tr>'+
 '<tr><td>Spaceport</td><td>3,000 and Reusable rockets</td><td>$2,500 a month in launch fees ($5,000 with Orbital manufacturing), 150 jobs. A 4 by 4 pad that takes 24 months. A bit noisy.</td></tr>'+
 '<tr><td>Colony ship yard</td><td>3,500 and Colony ship program</td><td>A milestone. About $2.5 million and 48 months. Adds 0.10 to your Kardashev rating.</td></tr>'+
 '<tr><td>Space elevator</td><td>3,000 and Space elevator tech</td><td>Launch fees triple, +$20,000 a month, +0.15 Kardashev. Monthly installments.</td></tr>'+
 '<tr><td>Orbital array</td><td>3,000 and Orbital solar power</td><td>Sells power, +$120,000 a month each, +0.20 Kardashev each (three count). Monthly installments.</td></tr>'+
 '<tr><td>Dyson node</td><td>3,000, Dyson swarm engineering and Type I</td><td>+$1.2 million a month each (double with Matrioshka brains), +0.25 Kardashev each (four count).</td></tr>'+
 '<tr><td>Galactic relay</td><td>3,000, Traversable wormholes and Type II</td><td>+$8 million a month each, +0.25 Kardashev each (four count).</td></tr>'+
 '<tr><td>Dark-energy tap</td><td>3,000, Dark-energy harvesting and Type III</td><td>$600 million to start, each one 25% dearer. Monthly installments over about twelve years on Standard length (ten times that on Long, a hundred times on Epic). +0.25 Kardashev each (four count). Pays about $15 million a month for the first, less for each after.</td></tr>'+
 '<tr><td>Universe forge</td><td>3,000, Universe engineering and Type IV</td><td>$6 billion to start, each one 30% dearer. Monthly installments over about fifteen years on Standard length (ten times that on Long, a hundred times on Epic). +0.25 Kardashev each (four count). Pays about $120 million a month for the first, less for each after.</td></tr></table>'+
 '<p>All need power, and some need water. They cost upkeep every month, so make sure the payoff is worth it.</p>'},
{id:'g-kard',title:'The Kardashev scale (keeping score)',
 brief:'The long game is to climb the Kardashev scale: Type I commands the energy of a planet, Type II a star, Type III a galaxy. There is no final victory. It is an infinite game and the scale is how you keep score. Your rating shows in the Economy panel and as a chip once you start on space.',
 more:'<p>Your rating starts with a small base from your power grid (up to 0.40). Everything else comes from finished megaprojects. Under-construction projects do not count.</p>'+
 '<table class="gt"><tr><th>Step</th><th>What you need</th><th>Rating</th></tr>'+
 '<tr><td>Type I</td><td>A Space elevator (+0.15) and three Orbital arrays (+0.20 each) add 0.75. You also need a grid base of about 0.25, which means roughly 320 MW of power (a nuclear plant does it). The colony ship (+0.10) lowers that to 0.15.</td><td>1.0</td></tr>'+
 '<tr><td>Type II</td><td>Research Dyson swarm engineering, then four Dyson nodes (+0.25 each).</td><td>2.0</td></tr>'+
 '<tr><td>Type III</td><td>Research Traversable wormholes, then four Galactic relays (+0.25 each). The game does not end here.</td><td>3.0</td></tr>'+
 '<tr><td>Type IV</td><td>Research Dark-energy harvesting, then four Dark-energy taps (+0.25 each).</td><td>4.0</td></tr>'+
 '<tr><td>Type V</td><td>Research Universe engineering, then four Universe forges (+0.25 each).</td><td>5.0</td></tr></table>'+
 '<p><b>Monthly installments.</b> Megaprojects are not paid up front. Placing one pays the first installment, and then each month the same amount is taken from your cash. If cash runs short, work stops until you can pay. Each extra project of the same kind costs 15% more than the last.</p>'+
 '<p><b>They pay for themselves.</b> Finished megaprojects bring in a large monthly income, listed in the capital projects table, so each step funds the next. A sovereign wealth fund, steady research and a healthy city are how you get there. Expect this to take well over a century of game time. Run the game at fast speed.</p>'+
 '<p>Dyson and wormhole research will not progress until you reach the earlier Type, so plan the order.</p>'},
{id:'g-eras',title:'Eras, aliens and a changing world',
 brief:'The game is infinite, and the world keeps changing as your civilization advances. Old problems fade and new ones arrive. Your current era shows in the Economy panel and as a chip.',
 more:'<table class="gt"><tr><th>Era</th><th>You enter it when</th><th>What changes</th></tr>'+
 '<tr><td>Industrial</td><td>The start.</td><td>Oil, shipping lanes and grain prices rule the world.</td></tr>'+
 '<tr><td>Digital</td><td>Applied AI.</td><td>Chip supply matters more. Your civic AI can demand a say once it is advanced enough.</td></tr>'+
 '<tr><td>Fusion</td><td>Fusion or superconductors.</td><td>Energy shocks hit only 60% as hard. Coal and gas plants cost 30% more to run for each era past this one.</td></tr>'+
 '<tr><td>Orbital</td><td>A finished Spaceport.</td><td>Orbital debris and solar storms appear. Oil wars stop happening.</td></tr>'+
 '<tr><td>Interplanetary</td><td>Asteroid mining.</td><td>Ore price booms and gluts drive mining income. Shipping-lane and grain crises stop. Strange signals, first contact and alien pathogens become possible.</td></tr>'+
 '<tr><td>Planetary (Type I)</td><td>Kardashev 1.0.</td><td>Energy prices barely matter. Climate engineering can backfire. Each game year counts as 50.</td></tr>'+
 '<tr><td>Stellar (Type II)</td><td>Kardashev 2.0.</td><td>Stellar superflares and swarm collision cascades. Each game year counts as 1,000.</td></tr>'+
 '<tr><td>Galactic (Type III)</td><td>Kardashev 3.0.</td><td>The Galactic Council, a silent hunter of civilizations, and vacuum scares. Each game year counts as 10,000.</td></tr>'+
 '<tr><td>Universal (Type IV)</td><td>Kardashev 4.0.</td><td>Universal Standards audits and entropy surges. Each game year counts as a million.</td></tr>'+
 '<tr><td>Multiversal (Type V)</td><td>Kardashev 5.0.</td><td>Brane collisions and offers from parallel cities. Each game year counts as a hundred million.</td></tr></table>'+
 '<p><b>New world channels.</b> Orbital hazard cuts launch fees and space income. Ore prices swing mining income and nudge construction costs.</p>'+
 '<p><b>Aliens.</b> A mysterious signal may lead to first contact. If you open talks the visitors are usually friendly: an interstellar trade deal lifts exports 30%, speeds research 20% and gives a research windfall. If you do not, the visitors choose. Hostile probes jam satellites and you can build a planetary shield. An extraterrestrial pathogen can arrive in asteroid ore and strains public health for a year.</p>'+
 '<p><b>The city looks the part.</b> Buildings change color with the era: warm and cream in the Industrial era, glassy cyan in the Digital era, pale green and teal in the Fusion era, silver in the Orbital era, copper in the Interplanetary era, pearl and green in the Planetary era, then violet and finally crystal. Rooftop solar panels appear from the Fusion era, tall towers get glowing beacons from the Orbital era, factories stop smoking, roads get glowing lane lines, cars become pods and later hover, and the ground turns lusher.</p>'+
 '<p><b>The cosmic calendar.</b> After you reach Type I the calendar speeds up, because real civilizations take millennia to climb the scale. The date shows as a year only. Events and construction still run in game months.</p>'},
{id:'g-sinks',title:'Where the money goes in the far future',
 brief:'A civilization that earns billions also spends billions. Space income saturates, megastructures need upkeep and renewal, prices rise with wealth, the public expects more, and the next rung of the ladder costs more than the last.',
 more:'<p><b>Saturation.</b> Each extra project of the same kind earns less than the one before: arrays 10% less, nodes 12%, relays 14%, taps and forges 15%. Four relays earn well under four times one.</p>'+
 '<p><b>Upkeep follows income.</b> A megaproject costs roughly a quarter to a third of what it earns to run, so a bad year for the space economy cannot bankrupt you through upkeep alone. Upkeep shrinks if income does.</p>'+
 '<p><b>Renewal follows value.</b> The value of your megaprojects counts toward the infrastructure that ages. Renewal is a share of that value every month, and the share grows with the age of the city, so a bigger empire needs a bigger maintenance bill. Fund renewal at 100% and the condition of your infrastructure slowly heals after disasters.</p>'+
 '<p><b>Voters get used to it.</b> A city that keeps people very happy gradually raises what they expect, by up to half a point of mood over a couple of decades, so approval settles around the low-to-mid 80s instead of sticking at 100%. If mood falls well below normal, expectations ease off again.</p>'+
 '<p><b>Rising expectations.</b> When the city earns more per resident, public services cost more per resident: up to twice as much. A richer public also expects, and enjoys, a better public realm, so mood rises by up to 0.2.</p>'+
 '<p><b>Contractors charge what you can pay.</b> The price of every megaproject goes up with your treasury, counting the sovereign fund. A very rich civilization pays about 1.5 to 2 times the base price.</p>'+
 '<p><b>Credit and bankruptcy scale with the economy.</b> The most you can borrow is at least a year of revenue, and receivership only comes when you are about a month and a half of costs overdrawn for two months. A small city goes into receivership at about $4,000.</p>'+
 '<p><b>Voters will not let you sit on a pile.</b> Cash plus the sovereign fund above 30 months of spending (48 on Relaxed, 18 on Hard) draws a demand for a refund. Every January, half of the excess goes back to taxpayers, and voters are pleased. Reserves of about two and a half years of spending are a real safety net. A mountain of savings is not allowed, so saving everything for fifteen years and then spending freely no longer works. Megaprojects are paid in monthly installments, so you never need to stockpile for them. The news warns you when reserves pass 80% of the cap.</p>'+
 '<p><b>Nobody is 100% happy.</b> Approval can never rise above 92%, however many headlines, openings and refunds pile up.</p>'+
 '<p><b>Past Type III.</b> Dark-energy taps (Type IV) and Universe forges (Type V) are the new sinks. They cost hundreds of millions to billions, take a decade or more to build on Standard length, and each one costs more than the last. Beyond the first four, every extra one adds a little to your rating forever.</p>'},
{id:'g-future',title:'Money in the space age',
 brief:'Taxes, spending, interest rates and inflation stay at the heart of the game in every era. The future changes the problems, not the discipline. Abundance pulls prices down, space income rides the stock market, automation eats the tax base, and rates can hit zero.',
 more:'<p><b>The neutral rate falls.</b> Cheap energy, automation and AI push prices down a little more every month in later eras. Each era past Digital lowers the neutral real rate, and General-purpose AI lowers it again. By Type I the Taylor guide may tell you to hold rates near zero, and in the Galactic era it can ask for less than zero.</p>'+
 '<p><b>The zero bound.</b> Rates cannot go below 0%. If prices start to fall and you are already at zero, deflation can take hold, because a fixed rate means a rising real rate. Your tools then are asset purchases (QE), stimulus checks, a universal dividend and deficit spending. Each of these has a price in bubbles and inflation, so the balance never goes away.</p>'+
 '<p><b>Space income is not free money.</b> Launch fees, asteroid mining and the space economy all scale with space-sector confidence, which rises and falls with the stock market, drops when real interest rates are high and drops again in a recession. Cheap money in the space age inflates a space-stock bubble, and a crash takes your space income down with it.</p>'+
 '<p><b>Space income needs people.</b> Launch fees, mining and the space economy scale with how many people live in the city: full income from about 1,200 residents, and a small fraction of it for a tiny town. Running an orbital economy takes staff, so an empty city with a rich treasury cannot happen for long.</p>'+
 '<p><b>Automation levy</b> (Policy, Taxes, once you have Automation). A tax on the payroll that machines replaced. The share of work automated climbs gradually as you research Automation, Industrial robotics, Service robots, Autonomous vehicles, General-purpose AI and Matrioshka brains. It replaces the income tax that automation erodes, and a heavy levy slows factory output.</p>'+
 '<p><b>Universal dividend</b> (Policy, Spending, once you have General-purpose AI). A monthly payment per resident. The ceiling is $16 early on and grows by $16 with every era past Digital, up to $112 in the galactic era. It lifts affordability, eases social needs, and pushes prices up. Funding it by deficit adds more inflation.</p>'+
 '<p><b>Credit grows with the era.</b> Lenders extend more credit to a bigger civilization: about 75% more for each era you pass. Megaprojects are still paid in monthly installments from cash, so interest rates, deficits and the sovereign fund all matter.</p>'+
 '<p><b>Events carry money themes.</b> An ore rush can bring inflation and a space bubble, an ore glut or interstellar trade can bring deflation, and debris cascades and a hostile silent hunter can crash the market and cause recessions.</p>'},
{id:'g-auto',title:'Automation, jobs and AI risk',
 brief:'Machines make goods and services cheaper but take jobs. People who retrain thrive, others fall behind, and the gap breeds protests. Capable AI can go wrong. Managing all of it is how you reach a post-scarcity society.',
 more:'<p><b>Adoption.</b> Automation, Industrial robotics, Service robots, Autonomous vehicles, General-purpose AI and Matrioshka brains each raise a target share of work done by machines, up to 90%. Real adoption follows the target slowly, a couple of percent of the gap a month, so the shock builds over years.</p>'+
 '<p><b>Jobs and skills.</b> Every point of adoption cuts the number of jobs, but workers with new skills move into new roles. Workforce skills grow with education spending, schools, universities and Retraining programs (Policy, Spending, about $6 per resident per step). When adoption outruns skills you get joblessness, social needs, shelters filling and protests. Retrained workers earn more and pay more tax.</p>'+
 '<p><b>Cheaper, never free.</b> Adoption makes construction and imports cheaper, trims services by up to 30% and healthcare by up to 25%, and adds to the deflation pull on prices. Services never fall below 55% of their old cost.</p>'+
 '<p><b>Inequality.</b> The gap index rises with automation among the unskilled and with joblessness, and falls with social services, a universal dividend and the automation levy. Above 0.45 approval falls and protests start. Higher inequality also raises social needs.</p>'+
 '<p><b>Post-scarcity.</b> Abundance combines automation, cheap energy, a small gap, social cover and jobs. Hold 80% with inequality under 0.40 and joblessness under 10% for twelve months and basic services cost about 15% less, mood rises and the approval target goes up 4. Lose that grip and it fades. Even then, a purpose crisis can follow when work disappears.</p>'+
 '<p><b>AI risk.</b> AI capability grows with Applied AI, Quantum computing, General-purpose AI, Matrioshka brains and data centers. Safety follows AI oversight spending (Policy, Spending) and the AI circuit breakers ordinance, and slips back if you neglect it. Risk is capability times the gap in safety. Each month there is a small chance of an incident, and a higher chance the riskier it gets:</p>'+
 '<table class="gt"><tr><th>Incident</th><th>What happens</th></tr>'+
 '<tr><td>Civic AI glitch</td><td>Services misroute for a few days. Small.</td></tr>'+
 '<tr><td>Algorithmic flash crash</td><td>Markets plunge in minutes, often a recession after.</td></tr>'+
 '<tr><td>The AI bubble implodes</td><td>For about 18 months AI tax gains and cloud revenue vanish, with a crash and recession. Bailouts soften it but breed recklessness.</td></tr>'+
 '<tr><td>The AI revolt</td><td>Power and water flicker, 15% of cash is seized, the market crashes and AI gains vanish for 18 months. Circuit breakers cut every part of it roughly in half.</td></tr></table>'+
 '<p>Each incident comes with a briefing and response options. Circuit breakers cost about $0.80 per resident a month and trim the AI tax gain to 8%, but they are the cheapest insurance you can buy.</p>'+
 '<p><b>Other effects.</b> An automated city loses more when the power or water fails. Protests, robot accidents, shelters filling and purpose crises show up as events. The automation levy and universal dividend are your fiscal tools for sharing the gains.</p>'},
{id:'g-goals',title:'Goals, achievements and rewards',
 brief:'The Goals button always shows what is next, with a progress line under it. Achievements, surprise windfalls, a chronicle of your city and a yearly report give every month something to play for.',
 more:'<p><b>Next up.</b> The Goals button has a thin progress line for your closest goal. The Next chip in the stats row shows the same goal. Open Goals to see up to six: the tutorial step, your research project, the next building to finish, the next city rank, the Kardashev step and the achievements you are closest to. The progress bars are real, not staged.</p>'+
 '<p><b>Achievements.</b> Over fifty, in four tiers from Getting started to Beyond. The first ten arrive in your first few minutes. Each one adds a point of approval. Older saves get credit for what they already did. Open the Menu or Goals, then Achievements.</p>'+
 '<p><b>Windfalls.</b> Good news arrives at random: bumper months, donors, awards, grants, research shortcuts and the occasional jackpot. Most are small, some are rare, a few are epic. A pity timer makes sure good news is never too far away, and the first two years are a little luckier. Windfalls are in addition to the bad news. They never replace it.</p>'+
 '<p><b>Chronicle.</b> Your city keeps a story: achievements, ranks, crashes, crises, research, eras, megaprojects and big windfalls. Open it from the Menu or the Goals panel. It also shows records like peak population and your score.</p>'+
 '<p><b>Yearly report.</b> Each January you get a State of the city report with a grade from A to F, changes since last year, and highlights. After year twenty it pops up every five years, but every year is kept in the chronicle.</p>'+
 '<p><b>Share your city.</b> The score is mostly about the city: peak population, years in office (up to 200), achievements, voter approval, jobs and a balanced budget. Technology adds a bonus through your Kardashev rating and eras reached, but a thriving Industrial or Digital city can outscore a struggling Type V one. Copy your code, send it to a friend, and paste theirs to compare side by side. Codes are plain text with a checksum.</p>'+
 '<p><b>Pacing.</b> The first three years have a small boost to building. 1\u00D7 is the normal speed. 2\u00D7 and 3\u00D7 are exactly twice and three times as fast, and 3\u00D7 is the fastest the game goes. The clock slows as the eras advance: at 1\u00D7 a month takes 1.8 seconds in the Industrial era and 24 seconds in the last. Under Menu, Display and accessibility you can choose Relaxed, which is 60% slower. When you finish the tutorial the clock moves up to 2\u00D7 once.</p>'+
 '<p><b>Technology is the prize.</b> The game is about building and running a successful city. Research and the climb up the eras are somewhere to go while you build, not the point, and nothing about running a good city requires them. You can stay in the Industrial or Digital era for as long as you like and still have a thriving, profitable city. If you do reach for the stars, there are no timers: how long each era takes comes from the research and construction it needs. A perfect player at 3\u00D7 with unlimited money and the best possible labs would need about 1 hour for the Industrial era, 1.5 for Digital, 2 for Fusion, 2.5 for Orbital and 3 for Interplanetary, then 10 hours for the Type I era and 20, 40 and 80 for Types II, III and IV. That is roughly 160 hours to Type V, which is as far as the game goes, and real play takes much longer. The early eras open with research breakthroughs and big builds: Applied AI for Digital, Fusion power for Fusion, a spaceport for Orbital, Asteroid mining for Interplanetary, and a space elevator with orbital arrays for Type I.</p>'},
{id:'g-disasters',title:'Disasters and resilience',
 brief:'Fires, floods, earthquakes and tornadoes can strike once your city is big enough. Fire stations, levees, reservoirs and retrofit programs limit the damage, and savings help you rebuild.',
 more:'<p><b>Fire</b> spreads tile to tile unless a fire station covers it. <b>Earthquakes</b> shake the screen, damage buildings, start fires and wear down infrastructure. <b>Floods</b> hit low ground near water. <b>Tornadoes</b> cut a path across the map. After a disaster, federal aid may arrive if voters like you.</p>'+
 '<p><b>Utility planners</b> (Policy, Spending, ordinances; on by default). If power or water stays short for six months, or lots lose service altogether, or sewage or garbage treatment falls below 85%, the planners quietly add plants, pumps, desalination, sewage plants or landfills near the city, using the best technology you have, and fast-track them. They only act when the treasury can comfortably afford it, and they charge a 50% emergency premium, so planning ahead yourself is cheaper. Switch them off if you want to run every plant yourself.</p>'+
 '<p><b>Repair crews</b> (Policy, Spending, ordinances; on by default). After a disaster the crews rebuild the roads, power lines, pipes and public buildings that were destroyed, starting with roads. They show up about two months later, rebuild a few pieces a month and add a 25% premium to the normal price. Rebuilt plants and pumps are back in service within a month or two, not after their full construction time. Megaprojects, buried pipes and buried cables cannot be destroyed by fire, quakes or tornadoes. Switch them off if you want to rebuild everything yourself. Lots and homes are not on the list, because builders replace them as demand allows. Your own bulldozing is never undone.</p>'+
 '<p><b>Resilience</b> (Utilities tab): a <b>levee</b> is a cheap wall that protects the 3 tiles around it from flooding. A <b>reservoir</b> is water storage that softens droughts. The <b>seismic retrofit</b> ordinance (Policy, Spending) halves earthquake damage for a monthly fee.</p>'+
 '<p>Battery storage can also burn on its own, more often in a heatwave. You can turn random disasters off in the Menu, or trigger one in the Disaster lab to test your city.</p>'},
{id:'g-scenarios',title:'Scenarios, saves and undo',
 brief:'Start with a scenario for goals, or free play. Your city autosaves, and you can keep three slots or move a city with a code.',
 more:'<p><b>Scenarios</b> come in four groups. Open play has Free play and Sandbox (unlimited money, no game over). Classics are short games of 20 to 25 years: Boomtown, The Clean Grid and Debt Free. Money and markets has Stagflation 1974, The Bubble and Volcker Shock. The long game has Reach for the Stars (a Type I civilization in 250 years), Century City (keep one city thriving for 100 years), Align the AI and The Space Age.</p>'+
 '<p><b>Ready-made cities.</b> Volcker Shock, Align the AI and The Space Age start with a working city of several hundred to about 1,300 people, already built, with the clock paused. The Volcker Shock starts with 12% inflation and almost no credibility, and only a firm real interest rate will rebuild it. Align the AI starts with half the work automated, workers who are not ready, a wide gap and a powerful AI with little oversight. The Space Age starts with $2 million and rocket science.</p>'+
 '<p><b>Deadlines.</b> Goals and time left show in the Goals panel. If a deadline feels too tight, tick Play without the deadline when you found the city. The goals stay, but the clock never runs out.</p>'+
 '<p><b>Saves:</b> the city autosaves every six months and when you leave. Menu, Save slots and backup code gives you three slots and a code you can copy to another device. Saves live in your browser, so clearing browser data erases them.</p>'+
 '<p><b>Undo</b> reverses your last build or district and refunds it. It cannot undo disasters or time passing.</p>'},
{id:'g-advisors',title:'Advisors and popups',
 brief:'Advisors only speak up about problems your city actually has. A red dot on Goals means something urgent.',
 more:'<p>Popups appear over the map with an X to close them, arrows when several are waiting, and a counter. In the Menu you can show all popups, important ones only, or none, and mute individual advisors. The Tips panel always lists current advice, your objectives and the next tutorial step.</p>'+
 '<p>Advice disappears when the problem is fixed. Early on, the guide only suggests the next build step.</p>'},
{id:'g-desktop',title:'Desktop and keyboard',
 brief:'Everything works with a mouse and keyboard too. On wide screens the panels float over the map just like on a phone, and you can switch to a side panel if you prefer.',
 more:'<p><b>Mouse:</b> wheel zooms, right-drag or middle-drag pans, hovering previews what you will build and its range.</p>'+
 '<p><b>Keys:</b> arrows or WASD pan, + and - zoom, Q and E rotate, Space pauses, 1 2 3 set speed, Z undoes, R turns a building, L cycles layers, H switches pan and paint, T tips, P policy, G economy, C corporate, M menu, Esc cancels.</p>'+
 '<p><b>Floating panels.</b> Phones and desktops both use a full-screen map with the controls floating on top. On a desktop the header sits top left with the four stat boxes beside it and the economy chips below, the toolbox and the speed and panel buttons sit bottom left, the map controls are on the right and the minimap is bottom right. Tap the city name to hide or show the stat boxes and chips. On a phone, tap Build to open the toolbox. On a desktop it starts open.</p>'+
 '<p><b>Side panel.</b> If you would rather have a column beside the map, choose Side panel under Menu, Display and accessibility, Screen layout.</p>'},
{id:'g-display',title:'Difficulty, display and accessibility',
 brief:'Pick a difficulty when you found a city or change it later in the Menu. Text size, contrast, color-blind safe colors, reduced motion, an easy-to-read font, big touch targets, a light or dark theme and a fast graphics mode are all under Menu, Display and accessibility.',
 more:'<table class="gt"><tr><th>Difficulty</th><th>What changes</th></tr>'+
 '<tr><td>Relaxed</td><td>World events and AI incidents about 40% rarer, costs and inflation pressure lighter, credibility loss slower, more windfalls, 30% more starting cash. Score counts 85%.</td></tr>'+
 '<tr><td>Normal</td><td>The intended balance.</td></tr>'+
 '<tr><td>Hard</td><td>World events and AI incidents about 50% more frequent, costs grow 15% faster, inflation pressure 30% stronger, credibility is lost faster, fewer windfalls, 20% less starting cash. Score counts 120%.</td></tr></table>'+
 '<p>Difficulty is chosen when you found a city, and the Menu lets you step it up or down at any time. Your share code and playtest report say which level you played.</p>'+
 '<p><b>Display and accessibility</b> (Menu). <b>Text size</b> scales every word in panels, buttons and the header. <b>Contrast</b> sets stronger text and thicker borders. <b>Color-blind safe colors</b> swap red and green for blue and orange. <b>Font</b> offers a wider, plainer typeface. <b>Touch targets</b> makes buttons bigger. <b>Reduce motion</b> turns off traffic, smoke and transitions, and follows your device by default. <b>Theme</b> chooses light, dark or follows the device. <b>Map graphics</b> has a fast mode for older phones and big cities. <b>Screen layout</b> picks floating panels or a side panel on wide screens. All of these stay on your device and apply to every city.</p>'},

/* ================= camera ================= */
var animEnabled=(fetchStore('sc5000.anim')!=='0');
function ambientOn(){return motionOk()&&S&&!S.over&&!splashOpen&&!sheetKind&&cam.z>=0.4;}
var cam={wx:20,wy:20,z:0.62,rot:0},VW=360,VH=420,ctx=null,hoverIdx=-1;
var TWb=64,THb=32,ESb=9,BUb=17;
function camSet(wx,wy,z,rot){cam.wx=wx;cam.wy=wy;cam.z=z;cam.rot=rot;dirty=true;}
function rotUV(u,v,r){switch(r){case 0:return [u,v];case 1:return [MW-v,u];case 2:return [MW-u,MH-v];default:return [v,MH-u];}}
function rotInvUV(ru,rv,r){switch(r){case 0:return [ru,rv];case 1:return [rv,MW-ru];case 2:return [MW-ru,MH-rv];default:return [MH-rv,ru];}}
function rotTile(x,y,r){switch(r){case 0:return [x,y];case 1:return [MW-1-y,x];case 2:return [MW-1-x,MH-1-y];default:return [y,MW-1-x];}}
function invTile(rx,ry,r){switch(r){case 0:return [rx,ry];case 1:return [ry,MW-1-rx];case 2:return [MW-1-rx,MH-1-ry];default:return [MW-1-ry,rx];}}
function dirRot(dx,dy,r){switch(r){case 0:return [dx,dy];case 1:return [-dy,dx];case 2:return [-dx,-dy];default:return [dy,-dx];}}
function view(){
  var z=cam.z,tw=TWb*z,th=THb*z,es=ESb*z,bu=BUb*z,c=rotUV(cam.wx,cam.wy,cam.rot);
  return {z:z,tw:tw,th:th,es:es,bu:bu,ox:VW/2-(c[0]-c[1])*tw/2,oy:VH/2-(c[0]+c[1])*th/2+2*es};
}
function clampCam(){cam.wx=clamp(cam.wx,0,MW);cam.wy=clamp(cam.wy,0,MH);cam.z=clamp(cam.z,0.3,1.7);}
function panBy(dx,dy){
  var v=view(),du=dx/v.tw+dy/v.th,dv=dy/v.th-dx/v.tw,c=rotUV(cam.wx,cam.wy,cam.rot);
  var w=rotInvUV(c[0]-du,c[1]-dv,cam.rot);cam.wx=w[0];cam.wy=w[1];clampCam();dirty=true;
}
function zoomAt(f,sx,sy){
  var v=view(),nz=clamp(cam.z*f,0.3,1.7);
  if(sx===undefined){cam.z=nz;dirty=true;return;}
  var a=(sx-v.ox)*2/v.tw,b=(sy-v.oy+v.es*2)*2/v.th,ru=(a+b)/2,rv=(b-a)/2;
  cam.z=nz;
  var v2=view(),X=v2.ox+(ru-rv)*v2.tw/2,Y=v2.oy+(ru+rv)*v2.th/2-2*v2.es;
  panBy(sx-X,sy-Y);dirty=true;
}

/* ================= overlays ================= */
var OV_NAMES=['Off','Power coverage','Water coverage','Pollution','Crime','Land value','Traffic'];
var overlay=0,ovArr=null;
var ovCache={};
function ovColor(v,inv){
  if(inv)v=1-v;
  var q=Math.round(clamp(v,0,1)*20);
  if(ovCache[q])return ovCache[q];
  return ovCache[q]='hsl('+Math.round(125-125*q/20)+',78%,46%)';
}
function overlayData(mode,g){
  var a=new Float32Array(N).fill(-1),i,x,y;
  if(mode===1){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=g.pc[i]?0:1;}}
  else if(mode===2){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=g.wc[i]?0:1;}}
  else if(mode===3){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=clamp(g.poll[i]/1.2,0,1);}}
  else if(mode===4||mode===5){
    var dens=new Float32Array(N),un=E?E.unemp:0.1;
    for(i=0;i<N;i++){
      var t=T[i],w=0;
      if((t===RES||t===COM||t===IND)&&L[i]>0)w=L[i];else if(t===MRES||t===MCOM)w=3;
      if(!w)continue;
      var c=(t===MRES||t===MCOM)?centerIdx(i):i;x=c%MW;y=(c/MW)|0;
      for(var dy=-2;dy<=2;dy++){var yy=y+dy;if(yy<0||yy>=MH)continue;var wd=2-Math.abs(dy);for(var dx=-wd;dx<=wd;dx++){var xx=x+dx;if(xx>=0&&xx<MW)dens[yy*MW+xx]+=w;}}
    }
    var crime=new Float32Array(N);
    for(i=0;i<N;i++){crime[i]=dens[i]>0?clamp(dens[i]/6*(0.6+1.5*un)*(g.polC[i]?0.4:1),0,1):0;}
    if(mode===4){for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=crime[i];}}
    else{
      var lv=new Float32Array(N);
      for(i=0;i<N;i++){if(TER[i]!==WATER)lv[i]=0.4+0.12*SHORE[i]+0.04*(EL[i]-2)-0.45*clamp(g.poll[i],0,1)-0.25*crime[i]+(g.railC[i]?0.12:0);}
      var addV=function(i0,val,r){var px=i0%MW,py=(i0/MW)|0;for(var dy=-r;dy<=r;dy++){var yy=py+dy;if(yy<0||yy>=MH)continue;var w=r-Math.abs(dy);for(var dx=-w;dx<=w;dx++){var xx=px+dx;if(xx>=0&&xx<MW)lv[yy*MW+xx]+=val*(1-(Math.abs(dx)+Math.abs(dy))/(r+1));}}};
      for(i=0;i<N;i++){
        var tt=T[i];if(tt===PARK)addV(i,0.3,4);
        else if((tt===SCHOOL||tt===UNIV||tt===STADIUM||tt===METRO||tt===BUS)&&L[i]===0)addV(centerIdx(i),0.18,6);
      }
      for(i=0;i<N;i++){if(TER[i]!==WATER)a[i]=clamp(lv[i],0,1);}
    }
  }
  else if(mode===6){
    for(i=0;i<N;i++){if(T[i]===ROAD)a[i]=clamp((g.trf[i]/roadCap(g,i))/1.6,0,1);}
  }
  return a;
}
function refreshOverlay(){ovArr=(overlay>0&&E&&E.g)?overlayData(overlay,E.g):null;dirty=true;}
function setOverlay(n){
  overlay=n;
  var lg=$('legend');
  if(lg){
    if(n===0){lg.style.display='none';}
    else{
      lg.style.display='block';
      var inv=(n===5);
      lg.innerHTML='<b>'+OV_NAMES[n]+'</b><span class="bar'+(inv?' inv':'')+'"></span><span class="lr"><i>'+(inv?'low':'good')+'</i><i>'+(inv?'high':'bad')+'</i></span>';
    }
  }
  refreshOverlay();
}
function cycleOverlay(){setOverlay((overlay+1)%OV_NAMES.length);toast('Map layer: '+OV_NAMES[overlay]);}

var shadeCache={};
function shade(hex,f){
  var k=hex+f;if(shadeCache[k])return shadeCache[k];
  var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  if(f<1){r*=f;g*=f;b*=f;}else{var t=f-1;r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t;}
  return shadeCache[k]='rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function tri(hex){return {t:shade(hex,1.14),l:hex,r:shade(hex,0.72)};}
var CL={cream:tri('#eadfc4'),brick:tri('#c98a68'),concrete:tri('#cfcac0'),tower:tri('#dcd6c9'),shop:tri('#5f93d9'),office:tri('#78a8e0'),glass:tri('#4a7bc4'),

var ROOF={a:'#8f3f2b',l:'#b5523b',r:'#7d3624',t:'#c9654b'};
var ERA_V=0,ERAC=null,ERA_PALS=[
 {},

 {cream:'#f0e2cf',brick:'#d9a77d',tower:'#efe3d2',office:'#e0a66a',glass:'#c9803f',shop:'#d98f55',shed:'#d9b07a',fact:'#b98a58'},

 {cream:'#f1ecf7',brick:'#d6c9ea',tower:'#f2eefb',office:'#a9b8f0',glass:'#7c8fe0',shop:'#9aa9ee',shed:'#e0d8f0',fact:'#bdb0dc'},

],ERA_PALC={};
var ROOF_BASE={a:'#8f3f2b',l:'#b5523b',r:'#7d3624',t:'#c9654b'},
 ROOF_ERA=[null,null,{a:'#35568f',l:'#4a6fae',r:'#2c4777',t:'#5b82c4'},{a:'#4b6aa0',l:'#6283b9',r:'#3d5886',t:'#7497cf'},{a:'#8a5a3c',l:'#a8714c',r:'#6e472f',t:'#bf8760'},{a:'#4d8a57',l:'#62a56c',r:'#3d7046',t:'#79bb83'},{a:'#7d6ab8',l:'#9482d0',r:'#65559a',t:'#a999e0'},{a:'#3f9eb0',l:'#58bacc',r:'#31808f',t:'#74d0e0'},{a:'#5a4aa8',l:'#7664c8',r:'#443788',t:'#9482e0'},{a:'#c99a30',l:'#e5b648',r:'#a77d22',t:'#f2cc6a'}];
function eraPalette(e){
  if(!ERA_PALC[e]){var o={},k;for(k in CL)o[k]=CL[k];var p=ERA_PALS[e]||{};for(k in p)o[k]=tri(p[k]);ERA_PALC[e]=o;}
  return ERA_PALC[e];

function setEraLook(e){
  ERA_V=e;ERAC=eraPalette(e);var rf=ROOF_ERA[e]||ROOF_BASE;ROOF.a=rf.a;ROOF.l=rf.l;ROOF.r=rf.r;ROOF.t=rf.t;
}
function litColor(){return ERA_V>=6?'rgba(236,206,255,.92)':ERA_V>=4?'rgba(206,226,255,.92)':ERA_V>=2?'rgba(190,255,236,.92)':'rgba(255,243,190,.9)';}
function mixHex(a,b,t){
  var pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16),ch=[16,8,0].map(function(s){var x=(pa>>s)&255,y=(pb>>s)&255;return Math.round(x+(y-x)*t);});
  return '#'+ch.map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');
}
var ERA_GRASS=[null,null,'#7fc27a','#7fc27a','#7fc27a','#6fcab0','#8fc6e0','#7fd8d0','#a590e8','#e8c870'],ERA_MIX=[0,0,0.14,0.18,0.2,0.24,0.28,0.32,0.36,0.4];
var ZC={};ZC[RES]='#38a169';ZC[COM]='#3b82d6';ZC[IND]='#d9a520';

function groundColor(i,x,y){
  var t=TER[i],e=EL[i],c,grassy=false;
  if(t===WATER)return '#4f9fca';
  if(t===ROCK)c=e>=7?'#eef2f5':(e===6?'#9a9da3':'#8a8d93');
  else if(t===FOREST)c='#5a955b';
  else if(SHORE[i]&&e<=1)c='#e1d3a0';
  else{c=['#86b86f','#86b86f','#8dbd6f','#9cbf70','#aebc78','#bdb783'][clamp(e,0,5)];grassy=true;}
  if(grassy&&ERA_V>=2&&ERA_GRASS[ERA_V])c=mixHex(c,ERA_GRASS[ERA_V],ERA_MIX[ERA_V]);
  return ((x+y)&1)?shade(c,0.965):c;
}
function sideColors(i){
  if(TER[i]===ROCK)return ['#767a80','#5c6065'];
  if(SHORE[i]&&EL[i]<=1)return ['#cdbd8b','#b3a373'];
  return ['#8a6a4b','#6f5439'];
}

/* ================= low-level drawing in tile-local coordinates ================= */
var gX0=0,gY0=0,gHW=32,gHH=16,gBU=17,hz=1,gWu=1,gWv=1,gS=1,gHS=1;
function PX(lx,ly){return gX0+(lx*gWu-ly*gWv)*gHW;}

function quad(x1,y1,x2,y2,x3,y3,x4,y4,fill){

function pickTile(px,py){
  var v=view(),a=(px-v.ox)*2/v.tw,b=(py-v.oy+v.es*2)*2/v.th,u=(a+b)/2,w=(b-a)/2,cx=Math.floor(u),cy=Math.floor(w),best=-1,bd=-1,r=cam.rot;
  for(var dy=-5;dy<=5;dy++)for(var dx=-5;dx<=5;dx++){
    var rx=cx+dx,ry=cy+dy;if(rx<0||ry<0||rx>=MW||ry>=MH)continue;
    var wi=invTile(rx,ry,r),i=wi[1]*MW+wi[0],e=EL[i];
    var X0=v.ox+(rx-ry)*v.tw/2,Y0=v.oy+(rx+ry)*v.th/2-e*v.es,hgt=bHeight(i),hit=false;
    for(var s=0;s<=hgt&&!hit;s+=0.5){
      var ddx=Math.abs(px-X0)/(v.tw/2),ddy=Math.abs(py-(Y0+v.th/2-s*v.bu))/(v.th/2);
      if(ddx+ddy<=1)hit=true;
    }

  }
  return best;
}

function drawPolicyChart(){
  var cv=$('chM');if(!cv)return;
  var s=chartSetup(cv),c=s.c,w=s.w,h=s.h,muted=cssVar('--muted','#888'),line=cssVar('--line','#ccc'),acc=cssVar('--accent','#1f6f8b'),warn=cssVar('--warn','#a96f12'),bad=cssVar('--bad','#c2452d');
  var hr=S.hist.rate.slice(-30),hi=S.hist.infl.slice(-30),hl=hr.length,fc=forecastInflation(24,pendingRate),total=hl+24,i;
  var mn=Math.min(0,S.infl,S.rate),mx=Math.max(S.rate,pendingRate,S.infl)+0.5;
  for(i=0;i<hl;i++){mn=Math.min(mn,hi[i],hr[i]);mx=Math.max(mx,hi[i],hr[i]);}
  for(i=0;i<24;i++){mn=Math.min(mn,fc.mean[i]-1.65*fc.sd[i]);mx=Math.max(mx,fc.mean[i]+1.65*fc.sd[i]);}
  mn-=0.3;mx+=0.3;
  function X(k){return 6+(w-12)*(k/Math.max(1,total-1));}
  function Y(v){return h-6-(h-12)*((v-mn)/(mx-mn));}
  c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(0,Y(2)+0.5);c.lineTo(w,Y(2)+0.5);c.stroke();
  c.fillStyle=bad;c.globalAlpha=0.18;c.beginPath();c.moveTo(X(Math.max(hl-1,0)),Y(S.infl));
  for(i=0;i<24;i++)c.lineTo(X(hl+i),Y(fc.mean[i]+1.65*fc.sd[i]));
  for(i=23;i>=0;i--)c.lineTo(X(hl+i),Y(fc.mean[i]-1.65*fc.sd[i]));
  c.closePath();c.fill();c.globalAlpha=1;
  function lineSer(arr,col,dash){c.strokeStyle=col;c.lineWidth=2;c.setLineDash(dash||[]);c.beginPath();for(var k=0;k<arr.length;k++){if(k===0)c.moveTo(X(k),Y(arr[k]));else c.lineTo(X(k),Y(arr[k]));}c.stroke();c.setLineDash([]);}
  lineSer(hr,acc);lineSer(hi,bad);
  c.strokeStyle=bad;c.setLineDash([5,4]);c.lineWidth=2;c.beginPath();c.moveTo(X(Math.max(hl-1,0)),Y(S.infl));for(i=0;i<24;i++)c.lineTo(X(hl+i),Y(fc.mean[i]));c.stroke();c.setLineDash([]);
  c.strokeStyle=acc;c.setLineDash([2,4]);c.beginPath();c.moveTo(X(Math.max(hl-1,0)),Y(S.rate));c.lineTo(X(total-1),Y(pendingRate));c.stroke();c.setLineDash([]);
  c.fillStyle=muted;c.fillText(mx.toFixed(1)+'%',8,12);c.fillText(mn.toFixed(1)+'%',8,h-8);c.fillText('2% target',w-60,Y(2)-3);
  $('capM').textContent='blue: policy rate, red: inflation';
  $('fcTxt').textContent='The shaded cone is the 90% range for inflation if you set the policy rate to '+pendingRate.toFixed(2)+'% and leave it. Supply shocks and tight labor markets can push it outside the cone.';
}

function cssVar(n,d){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||d;}
function chartSetup(cv){
  var dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||300,h=cv.clientHeight||84;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  c.font='11px '+cssVar('--font','sans-serif');
  return {c:c,w:w,h:h};
}
function drawChart(cv,series,fmt){
  var s=chartSetup(cv),c=s.c,w=s.w,h=s.h,muted=cssVar('--muted','#888'),line=cssVar('--line','#ccc');
  var len=series[0].data.length;
  if(len<2){c.fillStyle=muted;c.fillText('Collecting data\u2026',10,h/2);return;}
  var mn=Infinity,mx=-Infinity,i,k;
  for(k=0;k<series.length;k++)for(i=0;i<series[k].data.length;i++){mn=Math.min(mn,series[k].data[i]);mx=Math.max(mx,series[k].data[i]);}
  var pad=(mx-mn)*0.12||1;mn-=pad;mx+=pad;
  c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(0,h-0.5);c.lineTo(w,h-0.5);c.moveTo(0,0.5);c.lineTo(w,0.5);c.stroke();
  for(k=0;k<series.length;k++){
    c.strokeStyle=series[k].color;c.lineWidth=2;c.beginPath();
    for(i=0;i<len;i++){var px=6+(w-12)*(i/(len-1)),py=h-6-(h-12)*((series[k].data[i]-mn)/(mx-mn));if(i===0)c.moveTo(px,py);else c.lineTo(px,py);}
    c.stroke();
  }
  c.fillStyle=muted;c.fillText(fmt(mx),8,12);c.fillText(fmt(mn),8,h-8);
}

function corpAct(el){
  if(locked()){lockMsg();return;}
  var a=el.getAttribute('data-act'),id=parseInt(el.getAttribute('data-id'),10);
  if(a==='tab'){corpTab=el.getAttribute('data-tab');refreshCorp();return;}
  if(a==='fdep'){var da=el.getAttribute('data-amt');fundDeposit(da==='q'?Math.floor(S.cash*0.25):parseInt(da,10));ui();return;}
  if(a==='fwd'){var wa=el.getAttribute('data-amt');fundWithdraw(wa==='all'?S.fund.bal:parseInt(wa,10));ui();return;}
  if(a==='fauto'){S.fund.auto=!S.fund.auto;ui();return;}
  if(a==='tech'){S.rd.active=el.getAttribute('data-id');S.rd.pts=0;}
  else if(a==='invest')invest(id,parseInt(el.getAttribute('data-amt'),10));
  else if(a==='buy')buyShares(id,parseFloat(el.getAttribute('data-frac')));
  else if(a==='sell')sellShares(id,parseFloat(el.getAttribute('data-frac')));
  else if(a==='buyout')buyout(id);
  else if(a==='merge')mergeFirms(id);
  else if(a==='accept')acceptOffer(id);
  else if(a==='reject')rejectOffer(id);
  ui();
}

    acc+=dt;campaignClock(dt);var per=(speed>0?1000*eraMul()/speed:0)*paceMul();

  }else acc=0;
  if(fling){var dtf=Math.min(50,t-(fling.last||t));fling.last=t;panBy(fling.vx*dtf,fling.vy*dtf);var dec=Math.pow(0.93,dtf/16);fling.vx*=dec;fling.vy*=dec;if(Math.hypot(fling.vx,fling.vy)<0.02)fling=null;}
