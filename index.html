<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimCity 5000</title>
<style>
:root{
  color-scheme: light;
  --bg:#e8edf0; --panel:#f7f9fa; --panel2:#e9eef1; --ink:#13202a; --muted:#566673; --line:#c9d3da;
  --accent:#1f6f8b; --good:#2a8450; --bad:#c2452d; --warn:#a96f12;
  --btn:#ffffff; --btnOn:#13202a; --btnOnInk:#f7f9fa; --scrim:rgba(10,20,30,.5);
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1620; --panel:#13222e; --panel2:#1a2d3b; --ink:#e8f0f5; --muted:#8fa3b1; --line:#26394a;
    --accent:#5bb5d6; --good:#4fc083; --bad:#f0715a; --warn:#e2ad4b;
    --btn:#1a2d3b; --btnOn:#e8f0f5; --btnOnInk:#0c1620; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1620; --panel:#13222e; --panel2:#1a2d3b; --ink:#e8f0f5; --muted:#8fa3b1; --line:#26394a;
  --accent:#5bb5d6; --good:#4fc083; --bad:#f0715a; --warn:#e2ad4b;
  --btn:#1a2d3b; --btnOn:#e8f0f5; --btnOnInk:#0c1620; --scrim:rgba(0,0,0,.6);
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
#app{max-width:480px;margin:0 auto;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px;height:calc(var(--app-h,100vh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;overflow-x:hidden;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12.5px}
.hbtns{display:flex;gap:6px}
.ghost{position:relative;background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.stats{flex:none;display:grid;grid-template-columns:1.25fr 1fr 1fr 1.1fr;gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.stat .lab{font-size:11.5px;color:var(--muted)}
.stat .val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--bad)} .pos{color:var(--good)}
.ticker{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.3;height:40px;overflow:hidden;flex:none}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--muted)}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--accent)}
.econ{display:flex;gap:5px;overflow-x:auto;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}.econ::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:74px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 8px}
.chip .lab{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.chip .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .tr{font-size:9px;margin-left:3px}
.board{position:relative;flex:1 1 auto;min-height:170px}
#cv{display:block;position:absolute;left:0;top:0;width:100%;height:100%;border-radius:12px;border:1px solid var(--line);touch-action:none;background:var(--panel)}
#mm{position:absolute;left:8px;bottom:8px;width:84px;height:84px;border-radius:8px;border:2px solid rgba(255,255,255,.85);image-rendering:pixelated;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.navbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.navbtns button.tx{font-size:11px;font-weight:700}
.navbtns button{width:46px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-size:19px;font-weight:700;line-height:1;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);max-width:62%;z-index:4;background:var(--btnOn);color:var(--btnOnInk);
  padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.show{opacity:1}
.info{font-size:12.5px;color:var(--muted);height:34px;overflow:hidden;line-height:1.3;flex:none}
.toolrow{flex:none;display:flex;gap:6px;align-items:center}
.groups{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.toolrow .act{padding:8px 9px;font-size:12.5px;flex:none}
.tools{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tool{flex:none;min-width:68px;scroll-snap-align:start;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:7px 6px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool .sw{width:14px;height:14px;border-radius:4px;margin-bottom:2px}
.tool .nm{font-size:13px;font-weight:600;white-space:nowrap}
.tool .ct{font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.tool.on{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn)}
.tool.lock{opacity:.55}
.bar{flex:none;display:flex;gap:6px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--btn)}
.seg button{background:transparent;border:0;padding:8px 9px;font-weight:700;min-width:36px;display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--btnOn);color:var(--btnOnInk)}
.seg svg{width:14px;height:14px;fill:currentColor}
.groups button{font-size:12.5px;padding:7px 9px;flex:none;min-width:0}
.tabs{margin:8px 0 10px}
.tabs button{flex:1;font-size:14px}
.field{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink);-webkit-user-select:text;user-select:text;resize:none}
.scn{display:block;width:100%;text-align:left;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}
.scn b{display:block;font-size:15px}.scn span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.scn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.adv{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;background:var(--panel2);border-left:4px solid var(--accent)}
.adv.bad{border-left-color:var(--bad)}.adv.warn{border-left-color:var(--warn)}.adv.info{border-left-color:var(--good)}
.adv b{margin-right:4px}
.legend{position:absolute;left:100px;bottom:8px;background:rgba(10,20,30,.72);color:#fff;border-radius:8px;padding:5px 9px;font-size:11.5px;min-width:112px}
.legend .bar{display:block;height:8px;border-radius:4px;margin:4px 0 2px;background:linear-gradient(90deg,hsl(125,78%,46%),hsl(62,78%,46%),hsl(0,78%,46%))}
.legend .bar.inv{background:linear-gradient(90deg,hsl(0,78%,46%),hsl(62,78%,46%),hsl(125,78%,46%))}
.legend .lr{display:flex;justify-content:space-between;opacity:.85}.legend i{font-style:normal}
.navbtns button.on{background:var(--btnOn);color:var(--btnOnInk)}
.act{position:relative;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.ghost.badge::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.advpop{position:absolute;left:8px;right:66px;top:8px;z-index:3;display:none;gap:8px;align-items:flex-start;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 6px 8px 10px;font-size:12.5px;line-height:1.3;box-shadow:0 3px 12px rgba(0,0,0,.35)}
.advpop span{flex:1}
.advpop button{flex:none;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:0 6px;margin-top:-3px}
.act.badge::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;z-index:20}
.overlay.open{display:flex}
.overlay{align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:16px}
.sheet,.card{width:100%;max-width:480px;background:var(--panel);color:var(--ink);overflow:auto;-webkit-user-select:none;user-select:none}
.sheet{border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh}
.card{border-radius:18px;padding:20px;max-height:92vh;border:1px solid var(--line)}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{margin:0 0 6px;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
h2{margin:0;font-size:22px;font-weight:800}
h3{margin:16px 0 6px;font-size:15px;font-weight:800}
p{margin:6px 0}
.tag{font-size:15px;color:var(--muted);margin:8px 0 14px}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.row{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.row label{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.debt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.debt .meta{display:flex;flex-direction:column;font-size:13px}
.debt .meta b{font-size:15px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.btns button,.primary,.sm{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px}
button.primary{background:var(--btnOn);color:var(--btnOnInk);border-color:var(--btnOn);font-size:16px;padding:12px}
button:disabled{opacity:.4;cursor:default}
.ln{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;font-variant-numeric:tabular-nums}
.ln.tot{font-weight:800;border-top:1px solid var(--line);margin-top:3px;padding-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.diag{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.diag div{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;display:flex;flex-direction:column}
.diag b{font-size:17px;font-variant-numeric:tabular-nums}
.chart{margin-top:12px}
.chart .ct{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:3px}
.chart .ct span{font-weight:400;color:var(--muted);text-align:right}
.chart canvas{width:100%;height:92px;display:block;background:var(--panel2);border-radius:10px}
.news{margin:0;padding:0;list-style:none}
.news li{display:flex;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.news time{flex:none;width:62px;color:var(--muted);font-size:12px}
.how{margin:16px 0 0;padding-left:20px;font-size:14px}
.how li{margin:6px 0}
.best{font-size:13px;color:var(--muted);margin-top:12px}
.tech{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.tech small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tst{flex:none;width:112px;text-align:right}
.prog{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-bottom:3px}
.prog i{display:block;height:100%;background:var(--accent)}
.firm{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel2)}
.fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fh b{font-size:15.5px}
.tagc{font-size:12px;color:var(--muted)}
.stg{margin-left:auto;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.stg.public{color:var(--good)} .stg.acquired{color:var(--warn)}
.fs{font-size:13px;margin:6px 0 8px}



.floaters{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
.floaters button{display:none;min-width:54px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--btn);font-weight:700;font-size:12.5px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.groups{display:flex}
.groups button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 3px;font-size:11.5px;min-width:0;white-space:nowrap}
.groups .gi{font-style:normal;font-size:15px;line-height:1}
.tools .hdr{flex:none;align-self:stretch;display:flex;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;color:var(--muted);padding:0 3px;white-space:nowrap}
/* ---- manual ---- */
.toc{margin:6px 0 4px;padding-left:22px;columns:1}
.toc li{margin:5px 0}
.toc a,.back{color:var(--accent);text-decoration:none;font-weight:600}
.gsec{margin-top:18px;padding-top:6px;border-top:1px solid var(--line)}
.gsec h3{font-size:17px;margin:10px 0 6px}
.gsec h4{margin:12px 0 4px;font-size:13.5px;color:var(--muted)}
.brief{background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:14px}
.more{font-size:14px}
.more p,.more li{margin:6px 0}
.gt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.gt th,.gt td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.gt th{color:var(--muted);font-weight:600}
.back{display:inline-block;margin-top:8px;font-size:13px}
#trayBtn{display:none}
/* ---- responsive layout, compact header, desktop ---- */
.upper,.lower{display:contents}
.trayBox{display:contents}
.brand{cursor:pointer}
.brand b::after{content:" \25BE";font-size:12px;opacity:.55}
#app.compact .brand b::after{content:" \25B8"}
#app.compact .stats,#app.compact .econ{display:none}
.chip{cursor:pointer}
.chip:hover{border-color:var(--accent)}
.pn{display:flex;align-items:center;gap:1px;font-size:11px;color:var(--muted);flex:none;margin-top:-1px}
.pn button{border:0;background:transparent;color:var(--ink);font-size:20px;line-height:1;padding:0 4px}
.subh{margin:12px 0 4px;font-size:13px;color:var(--muted)}
.advpop .sm{padding:5px 10px;font-size:12px;flex:none;margin-top:-2px}
.keys div{padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.keys b{display:inline-block;min-width:128px}

@media (max-aspect-ratio:11/10), (min-aspect-ratio:11/10) and (min-width:560px) and (max-height:519px){
  :root{--il:env(safe-area-inset-left,0px);--ir:env(safe-area-inset-right,0px)}
  #app{display:block;position:relative;max-width:none;padding:0;overflow:hidden}
  .board{position:absolute;left:var(--il);right:var(--ir);top:0;bottom:0;min-height:0}
  #cv{border-radius:0;border:0}
  .upper,.lower{display:contents}
  .top{position:absolute;z-index:6;left:calc(var(--il) + 8px);top:6px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 6px 3px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .brand{max-width:190px;min-width:0}
  .brand b{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand span{font-size:11.5px;white-space:nowrap}
  .stats{position:absolute;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .stat{padding:2px 6px}
  .stat .lab{font-size:10.5px}
  .stat .val{font-size:14px}
  .econ{display:none}
  #app.chips .econ{display:flex;position:absolute;z-index:6;left:calc(var(--il) + 8px);right:calc(var(--ir) + 62px)}
  .info{display:none}
  .advpop{z-index:7;left:8px;right:auto;width:calc(100% - 70px);max-width:460px}
  .trayBox{display:none}
  #app.tray .trayBox{display:flex;flex-direction:column;gap:6px;position:absolute;z-index:6;left:calc(var(--il) + 8px);right:calc(var(--ir) + 8px);bottom:calc(var(--bar-h,82px) + 12px);padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  #app.tray .toolrow{display:block}
  #app.tray .tools{display:flex}
  .bar{position:absolute;z-index:6;left:calc(var(--il) + 8px);right:calc(var(--ir) + 8px)}
  #trayBtn{display:inline-block}
}
@media (max-aspect-ratio:11/10){
  .top{right:calc(var(--ir) + 62px)}
  .stats{top:52px;left:calc(var(--il) + 8px);right:calc(var(--ir) + 62px)}
  #app.chips .econ{top:96px}
  .advpop{top:96px}
  .bar{bottom:6px;display:flex;flex-wrap:wrap;gap:6px}
  #trayBtn{flex:1 1 38%}
  .bar .seg{flex:0 0 auto}
  #btnPolicy,#btnEcon,#btnCorp{flex:1 1 27%}
  .floaters{bottom:calc(var(--bar-h,82px) + 12px)}
  #mm{bottom:calc(var(--bar-h,82px) + 12px)}
  .legend{bottom:calc(var(--bar-h,82px) + 12px)}
  .toast{bottom:calc(var(--bar-h,82px) + 24px)}
}
@media (min-aspect-ratio:11/10) and (min-width:560px) and (max-height:519px){
  .top{right:auto}
  .stats{top:6px;left:calc(var(--il) + 340px);right:calc(var(--ir) + 62px)}
  #app.chips .econ{top:50px}
  .advpop{top:50px}
  .floaters{bottom:calc(var(--bar-h,44px) + 12px)}
  .bar{bottom:6px;right:calc(var(--ir) + 62px)}
  #app.tray .trayBox{right:calc(var(--ir) + 62px)}
  #mm{bottom:calc(var(--bar-h,44px) + 12px)}
  .legend{bottom:calc(var(--bar-h,44px) + 12px)}
  .toast{bottom:calc(var(--bar-h,44px) + 24px)}
}
@media (min-aspect-ratio:11/10) and (min-width:560px) and (min-height:520px){
  #app{max-width:1280px;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);column-gap:10px;row-gap:6px;padding:6px 10px}
  .board{grid-column:1;grid-row:1 / span 2;min-height:0}
  .upper{display:flex;flex-direction:column;gap:6px;grid-column:2;grid-row:1;min-width:0}
  .lower{display:flex;flex-direction:column;gap:6px;grid-column:2;grid-row:2;min-height:0;min-width:0;overflow-y:auto;scrollbar-width:thin}
}
@media (min-aspect-ratio:11/10) and (min-width:560px) and (min-height:640px){
  .econ{flex-wrap:wrap;overflow:visible}
  .chip{min-width:96px}
  .tools{flex-wrap:wrap;overflow:visible}
  .tool{min-width:76px}
}
@media (min-width:900px){
  .overlay{align-items:center}
  .sheet{border-radius:18px;max-height:84vh}
}
button:hover:not(:disabled){filter:brightness(1.06)}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }

<body>
<div id="app">
<div class="upper">
  <header class="top">
    <div class="brand" id="brandBox" role="button" tabindex="0"><b id="brand">SimCity 5000</b><span id="date" class="muted"></span></div>
    <div class="hbtns"><button class="ghost" id="adv">Tips</button><button class="ghost" id="btnMenu">Menu</button></div>
  </header>
  <section class="stats">
    <div class="stat"><span class="lab">Cash</span><span class="val" id="cash">$0</span></div>
    <div class="stat"><span class="lab">People</span><span class="val" id="pop">0</span></div>
    <div class="stat"><span class="lab">Approval</span><span class="val" id="appr">70%</span></div>
    <div class="stat"><span class="lab">Per month</span><span class="val" id="net">$0</span></div>
  </section>
  <section class="econ" id="econ"></section>
</div>
  <div class="board" id="board">
    <canvas id="cv"></canvas>
    <canvas id="mm" width="112" height="112"></canvas>
    <div id="legend" class="legend" style="display:none"></div>
    <div id="advpop" class="advpop" style="display:none"><i class="dot" id="tdot"></i><span id="ttext"></span><button id="popAct" class="sm" style="display:none">Respond</button><div class="pn" id="pnav" style="display:none"><button id="pprev" aria-label="Previous">&lsaquo;</button><span id="pcnt"></span><button id="pnext" aria-label="Next">&rsaquo;</button></div><button id="popx" aria-label="Dismiss">&times;</button></div>
    <div class="navbtns">
      <button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">&minus;</button>
      <button id="rotL" aria-label="Rotate left">&#8634;</button><button id="rotR" aria-label="Rotate right">&#8635;</button>
      <button id="hand" aria-label="Toggle pan or paint">&#9995;</button>
      <button id="lay" class="tx" aria-label="Map layers">Layers</button>
    </div>
    <div class="floaters"><button id="turn" aria-label="Turn building">Turn</button><button id="undo" aria-label="Undo">Undo</button></div>
    <div class="toast" id="toast"></div>
  </div>
<div class="lower">
  <div class="info" id="info"></div>
  <div class="trayBox" id="trayBox">
    <div class="toolrow"><div class="seg groups" id="groups"></div></div>
    <nav class="tools" id="tools" aria-label="Build tools"></nav>
  </div>
  <div class="bar">
    <div class="seg" id="speed">
      <button data-s="0" aria-label="Pause"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button>
      <button data-s="1" aria-label="Normal speed">1&times;</button>
      <button data-s="2" aria-label="Fast">2&times;</button>
      <button data-s="3" aria-label="Fastest">3&times;</button>
    </div>
    <button class="act" id="trayBtn">Build</button>
    <button class="act" id="btnPolicy">Policy</button>
    <button class="act" id="btnEcon">Economy</button>
    <button class="act" id="btnCorp">Corp</button>
  </div>
</div>
</div>
<div id="sheet" class="overlay"><div class="sheet" id="sheetBody"></div></div>
<div id="splash" class="overlay center open"><div class="card" id="splashBody"></div></div>

function anchorFor(i,sz){return [(i%MW)-Math.floor(sz[0]/2),((i/MW)|0)-Math.floor(sz[1]/2)];}

  var tiles=(T[a]===SUB)?[i]:footOfAnchor(a);

function checkSite(ax,ay,id,rot){
  var o=OBJ[id],sz=sizeOf(id,rot);

}

function forecastInflation(n,rate){
  var infl=S.infl,shock=shk(),e=E||{tight:0,costs:0,revenue:1,g:{nukeShare:0}};

  if(rate===undefined)rate=S.rate;
  for(var t=1;t<=n;t++){
    shock*=0.93;
    infl=clamp(infl+inflDelta(infl,rate,e.tight||0,shock*(1-0.4*ns),fiscal,t<=S.stim,t<=S.recession,S.qe,S.pop),-4,30);

}

function addNews(text,tone,who,cond,sticky,act){
  var item={m:S.month,text:text,tone:tone||'info',who:who||''};
  if(cond)item.cond=cond;if(sticky)item.sticky=true;if(act)item.act=act;
  S.news.unshift(item);

}
function toast(msg,ms){

}

function renderPop(){
  var p=$('advpop');if(!p)return;
  if(!popQ.length){p.style.display='none';return;}
  var n=popQ[popIdx];
  $('ttext').textContent=n.text;$('tdot').className='dot '+n.tone;

  var pa=$('popAct');if(pa)pa.style.display=(n.act&&S&&S.briefs.length)?'inline-block':'none';

function hidePop(){clearTimeout(popTimer);popQ=[];popIdx=0;var p=$('advpop');if(p)p.style.display='none';}
function popExpire(){
  popQ=popQ.filter(function(q){return q.sticky;});
  if(popIdx>=popQ.length)popIdx=Math.max(0,popQ.length-1);

}
function prunePop(){
  if(!popQ.length)return;
  popQ=popQ.filter(function(q){return !q.cond||q.cond();});
  if(popIdx>=popQ.length)popIdx=Math.max(0,popQ.length-1);

function showPop(n){
  if(!n||popMode==='off')return;

var handMode=true;
function setRate(r){
  r=clamp(Math.round(r*4)/4,0,15);
  if(Math.abs(r-S.rate)<0.01){toast('Policy rate is already '+r.toFixed(2)+'%.');return;}
  var diff=r-S.rate;S.rate=r;
  addNews('You '+(diff>0?'raised':'cut')+' the policy rate by '+Math.abs(diff).toFixed(2)+' points to '+r.toFixed(2)+'%.',diff>0?'warn':'info');
  toast('Policy rate set to '+r.toFixed(2)+'%');
}
function setOrd(k,on){
  S.ord[k]=on;

  addNews(nm[k]+(on?' is now in force.':' was repealed.'),'info');
}
function setQE(v){
  S.qe=v;
  addNews(v>0?'You launched asset purchases. Long rates fall and stocks rally, but inflation and bubble risk rise.':v<0?'You started shrinking the balance sheet. Long rates and the dollar rise, and risk assets suffer.':'You put the balance sheet on hold.','info');
}
function sendStimulus(per){
  var c=Math.round(S.pop*per);
  if(S.pop<10){toast('Not enough residents yet.');return;}
  if(S.cash<c){toast('Not enough cash. Checks cost '+money(c)+'.');return;}
  S.cash-=c;S.stim=4;S.approval=Math.min(100,S.approval+Math.min(6,per/8));
  addNews('Stimulus checks of '+money(per)+' per resident went out. Spending jumps, and so do price pressures.','info');
  toast('Stimulus sent: '+money(c));
}
function bailout(){
  if(S.crash<=0&&S.crunch<=0&&S.panic<=0){toast('There is no crisis to fight right now.');return;}
  var c=Math.max(2000,Math.round(S.pop*30));
  if(S.cash<c){toast('Not enough cash. A bailout costs '+money(c)+'.');return;}
  S.cash-=c;S.panic=0;S.crunch=Math.min(S.crunch,3);S.crash=Math.min(S.crash,4);S.mktBubble+=0.8;S.infl+=0.3;
  addNews('You backstopped the banks for '+money(c)+'. Panic ends and credit reopens, but traders now expect rescues next time.','warn');
  toast('Bailout done');
}
function setDeposit(on){
  S.dins=on;
  addNews(on?'Deposit insurance is now funded. Crashes will hit softer, but it costs money every month and encourages risk taking.':'Deposit insurance ended. Savers and banks are on their own.','info');
}

function scheduleEvent(id,delay,warn){
  if(S.sched.some(function(q){return q.id===id;})||S.crises.some(function(c){return c.id===id;}))return;
  var ev=macroBrief(id),sp=SPECIAL[id],w=ev?ev.warn:(sp?sp.warn:'');
  if(ev&&((ev.maxEra!==undefined&&S.era>ev.maxEra)||(ev.minEra!==undefined&&S.era<ev.minEra)))return;
  if(warn&&delay>=2&&w)addNews(w,'warn','World');
  S.sched.push({id:id,at:S.month+delay});
}
function runScheduled(){
  for(var i=S.sched.length-1;i>=0;i--){
    if(S.sched[i].at>S.month)continue;
    var id=S.sched[i].id;S.sched.splice(i,1);
    var ev=macroBrief(id);
    if(ev){if(!S.crises.some(function(c){return c.id===id;}))startCrisis(ev);}
    else if(SPECIAL[id]){SPECIAL[id].run();if(SPECIAL[id].head)addNews(SPECIAL[id].head,'bad','World');}
  }
}
function macroBrief(cid){for(var i=0;i<MACRO.length;i++){if(MACRO[i].id===cid)return MACRO[i];}return null;}
function startCrisis(ev){
  var chs=ev.ch;if(S.tech.vaccine&&chs.health){chs={};for(var kk in ev.ch)chs[kk]=ev.ch[kk];chs.health*=0.5;}
  var c={id:ev.id,name:ev.name,region:ev.region,ch:chs,total:ev.dur,left:ev.dur,age:0,mult:1,end:ev.end,good:!!ev.good};
  S.crises.push(c);
  if(ev.mkt)S.mkt=clamp(S.mkt*(1+ev.mkt),20,600);
  if(ev.rec&&Math.random()<ev.rec)S.recession=Math.max(S.recession,12);
  if(ev.fn)ev.fn();
  if(ev.chain){for(var ci=0;ci<ev.chain.length;ci++){var ch=ev.chain[ci];if(Math.random()<ch.p)scheduleEvent(ch.id,ch.d[0]+rnd(ch.d[1]-ch.d[0]+1),Math.random()<0.6);}}
  var hasOpts=ev.opts&&ev.opts.length&&!ev.good,id=ev.id;
  if(hasOpts){
    S.briefs.push({cid:id,left:3});
    addNews(ev.head,'bad','World',function(){return S.briefs.some(function(b){return b.cid===id;});},true,'brief');
  }else addNews(ev.head,ev.good?'good':'warn','World');
}
function maybeMacro(){
  if(S.month<12||S.pop<60||S.crises.length>=2||S.sched.length>=3||Math.random()>0.07)return;
  var pool=MACRO.filter(function(ev){return !ev.chainOnly&&!S.crises.some(function(c){return c.id===ev.id;})&&(ev.maxEra===undefined||S.era<=ev.maxEra)&&(ev.minEra===undefined||S.era>=ev.minEra)&&(!ev.need||ev.need());}),tot=0,i;
  if(!pool.length)return;
  for(i=0;i<pool.length;i++)tot+=pool[i].w;
  var r=Math.random()*tot,ev=pool[0];
  for(i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){ev=pool[i];break;}}
  if(Math.random()<0.65)scheduleEvent(ev.id,3,true);else startCrisis(ev);
}
function stepCrises(){
  var tgt={energy:0,freight:0,materials:0,chips:0,food:0,trade:0,health:0,orbit:0,ore:0},i,k;
  for(i=S.crises.length-1;i>=0;i--){
    var c=S.crises[i];c.age++;c.left--;
    var ramp=Math.max(0.15,Math.min(1,c.age/2,(c.left+2)/3));
    for(k in c.ch)tgt[k]+=c.ch[k]*c.mult*ramp;
    if(c.left<=0){addNews(c.end,'good','World');S.crises.splice(i,1);}
  }
  for(k in tgt){
    var cur=S.mc[k]||0;
    S.mc[k]=cur+(tgt[k]-cur)*(Math.abs(tgt[k])>Math.abs(cur)?0.4:0.12);
    if(tgt[k]===0&&Math.abs(S.mc[k])<0.01)S.mc[k]=0;
  }
  for(i=S.briefs.length-1;i>=0;i--){S.briefs[i].left--;if(S.briefs[i].left<=0)S.briefs.splice(i,1);}
}
function applyBrief(cid,oi){
  var ev=macroBrief(cid),c=null,i;
  for(i=0;i<S.crises.length;i++){if(S.crises[i].id===cid)c=S.crises[i];}
  if(!ev||!c){return;}
  if(oi>=0){
    var o=OPT[ev.opts[oi]],cost=Math.round(S.pop*o.cp);
    if(!spend(cost))return;
    c.mult*=o.mult;if(o.appr)S.approval=clamp(S.approval+o.appr,0,100);if(o.fn)o.fn();
    addNews('You chose to '+o.label.toLowerCase()+' during the '+ev.name.toLowerCase()+'.','info','World');
  }else addNews('You chose to wait out the '+ev.name.toLowerCase()+'.','info','World');
  for(i=S.briefs.length-1;i>=0;i--){if(S.briefs[i].cid===cid)S.briefs.splice(i,1);}
  prunePop();
}

/* ================= aging infrastructure ================= */
function stepInfra(e){
  var r=S.renew;
  if(r<1)S.cond-=0.008*(1-r)*Math.min(1,e.assets/15000);
  else if(r>1)S.cond+=0.005*(r-1);
  S.cond=clamp(S.cond,0.2,1);
  var kinds=['water','power','road'],msgs={water:'A water main bursts and a district loses pressure.',power:'Aging transformers fail and part of the grid goes dark.',road:'A bridge and several roads close for emergency repairs.'},i;
  for(i=0;i<3;i++){
    var k=kinds[i];
    if(S.fail[k]>0)S.fail[k]--;
    else if(S.cond<0.75&&e.assets>3000&&Math.random()<(0.75-S.cond)*0.35){S.fail[k]=2+rnd(3);addNews(msgs[k]+' Condition of city infrastructure is '+Math.round(S.cond*100)+'%.','bad','Utilities');}
  }
}
function stepMacro(e){
  var prev=S.prevRate;
  S.shock*=0.93;if(S.shock<0.01)S.shock=0;
  stepCrises();
  S.bubble*=0.9;if(S.bubble<0.02)S.bubble=0;
  if(S.recession>0)S.recession--;if(S.remote>0)S.remote--;if(S.heat>0)S.heat--;if(S.drought>0)S.drought--;if(S.stim>0)S.stim--;
  S.sunF=clamp(1+0.35*Math.sin((S.month-3)*Math.PI/6)+gauss()*0.25,0.4,1.4);
  S.windF=clamp(1+gauss()*0.8,0.15,1.8);
  /* inflation reacts to labour tightness, supply shocks, policy stance and deficits */
  var fiscal=clamp((e.costs-e.revenue)/(e.revenue+500),-0.3,0.6);
  var structD=0.02*Math.max(0,S.era-1)+(S.tech.agi?0.03:0);
  S.infl-=structD;S.infl+=0.02*(S.sp.udiv||0);
  if(S.era>=3&&S.rate-S.infl<0.5)S.mktBubble+=0.1;
  S.infl=clamp(S.infl+inflDelta(S.infl,S.rate,e.tight,shk()*(1-0.4*e.g.nukeShare),fiscal,S.stim>0,S.recession>0,S.qe,S.pop)+gauss()*0.08,-4,30);
  /* mortgage rates follow the policy rate with a lag and a spread */
  var mt=S.rate+1.2+Math.max(0,S.infl-2)*0.3+(S.qe>0?-0.7:S.qe<0?0.6:0)+(e.unemp>0.2?0.4:0)+(S.crunch>0?1.5:0);
  S.mort+=(mt-S.mort)*0.25;
  S.npx=clamp(S.npx+(1+shk()*0.8+S.mc.energy*0.3-S.npx)*0.2+gauss()*0.06,0.5,3);
  if(S.qe>0)S.bubble+=0.05;
  if(S.dins)S.mktBubble+=0.03;
  var realMort=S.mort-(S.infl-2);
  var d=(e.g.resCap>0&&S.pop>=30?(e.occ-0.82)*6:0)-(realMort-5.5)*0.35+S.hpiMom*0.5+S.bubble
        -Math.max(0,S.hpi-150)*0.02+Math.max(0,85-S.hpi)*0.04-(S.tax.prop-1)*0.15+(S.qe>0?0.15:S.qe<0?-0.1:0)+(Math.random()-0.5)*0.8;
  d=clamp(d,-5,5);S.hpiMom=d;S.hpi=clamp(S.hpi*(1+d/100),40,260);
  var md=0.5-(S.rate-4.5)*0.12-(S.rate-prev)*6+S.mktBubble+(S.recession>0?-1.2:0)-Math.max(0,S.infl-5)*0.15
        +(S.qe>0?0.4:S.qe<0?-0.3:0)-(S.tax.corp-8)*0.03+gauss()*3.2;
  md=clamp(md,-22,14);
  if(S.crash>0)md-=0.8;
  if(S.panic>0){md=-(10+rnd(9))*(1-(exchOn()?0.3:0)-(S.dins?0.25:0));S.panic--;}
  else{
    var hz=0.003+0.010*Math.max(0,(S.mkt-150)/100)+0.012*S.mktBubble+(S.rate-prev>0.5?0.03:0)+(S.infl>6?0.01:0);
    if(S.crash===0&&(S.pop>=300||S.scn==='bubble')&&Math.random()<hz)startCrash();
  }
  if(S.crash>0)S.crash--;if(S.crunch>0)S.crunch--;
  S.mktD=md;S.mkt=clamp(S.mkt*(1+md/100),20,600);S.mktBubble*=0.88;if(S.mktBubble<0.05)S.mktBubble=0;
  S.prevRate=S.rate;
}
function exchOn(){return !!(E&&E.g&&E.g.act.exch);}

  toast('Market crash!');
  if(Math.random()<0.6){S.recession=Math.max(S.recession,12);}

function stepBatteries(g){

function stepWaste(e){
  var lf=e.g.lfOpen;if(!lf.length||e.garbDem<=0)return;
  var load=Math.max(0,e.garbDem-e.recyCap-e.wteCap);if(load<=0)return;

function fundDeposit(amt){
  amt=Math.min(amt,Math.floor(S.cash));
  if(amt<=0){toast('No spare cash to put in the fund.');return;}
  S.cash-=amt;S.fund.bal+=amt;toast('Deposited '+money(amt)+' in the fund');
}
function fundWithdraw(amt){
  amt=Math.min(amt,S.fund.bal);
  if(amt<=0.5){toast('The fund is empty.');return;}
  S.fund.bal-=amt;S.cash+=amt;toast('Withdrew '+money(amt)+' from the fund');
}
function fundMix(){var eq=S.fund.eq,bd=S.fund.bd;return {eq:eq,bd:bd,cs:Math.max(0,1-eq-bd)};}
function stepFund(e){
  var f=S.fund;
  if(f.bal>0){
    var mx=fundMix(),r=mx.eq*(S.mktD/100+0.0015)+mx.bd*((S.rate+0.8)/1200)+mx.cs*(S.rate*0.5/1200);
    f.last=r;f.bal=Math.max(0,f.bal*(1+r)-e.fundPay);
  }else f.last=0;
  if(f.auto&&S.cash<2000&&f.bal>0){
    var draw=Math.min(f.bal,3000-S.cash);S.cash+=draw;f.bal-=draw;
    addNews('The sovereign fund covered a cash shortfall with '+money(draw)+'.','info');

  f.hist.push(Math.round(f.bal));if(f.hist.length>180)f.hist.shift();
}

function stepConstruction(){
  for(var i=0;i<N;i++){
    var o=BYT[T[i]];
    if(o&&o.build&&L[i]>0){
      if(o.phased){
        var pay=S.phasePay[i]||Math.ceil(costFor(o.id,i)/o.build);
        if(S.cash>=pay||S.sandbox){if(!S.sandbox)S.cash-=pay;L[i]--;}
        else{if(S.month%6===0)addNews('Work on the '+TOOLS[o.id].name+' has stalled. It needs '+money(pay)+' this month.','warn');continue;}

        if(T[i]===YARD&&!S.colony){S.colony=true;sfx('cash');showSplash('colony');}
      }
    }
  }
}
function mktSentiment(){
  var h=S.hist.mkt;if(h.length<6)return 0;
  var s=0;for(var i=h.length-6;i<h.length;i++)s+=h[i];
  return S.mkt/(s/6)-1;
}

/* ================= R&D, startups, IPOs, M&A ================= */
function firmName(sector){
  for(var tries=0;tries<20;tries++){
    var n=pick(NAME_A)+pick(NAME_B),clash=false;
    for(var k=0;k<S.firms.length;k++){if(S.firms[k].name===n)clash=true;}
    if(!clash)return n;
  }
  return pick(NAME_A)+pick(NAME_B)+' '+S.fid;
}
function spawnFirm(sector,why){
  var val=Math.round((9000+rnd(7000))/100)*100;
  var f={id:S.fid++,name:firmName(sector),sector:sector,stage:'seed',val:val,stake:0,runway:16+rnd(8),
    burn:Math.round(val*0.012/10)*10,age:0,jobs:0,acq:0};
  S.firms.push(f);
  addNews(why==='lab'?f.name+' ('+sector+') spins out of a local lab and is looking for seed money.':f.name+' ('+sector+') launches a startup in your city.','info');
  return f;
}
function nextTech(){
  for(var i=0;i<TECH_ORDER.length;i++){
    var id=TECH_ORDER[i],t=TECHS[id];
    if(!S.tech[id]&&(!t.req||S.tech[t.req])&&(!t.req2||S.tech[t.req2]))return id;
  }
  return null;
}
function stepResearch(e){
  var id=S.rd.active;
  if(!id){S.rd.active=nextTech();return;}
  if(TECHS[id].tier&&e.kard<TECHS[id].tier-1){if(S.month%12===0)addNews('Research on '+TECHS[id].name+' is stalled. You must first become a Type '+(TECHS[id].tier===2?'I':'II')+' civilization.','warn');return;}
  if(TECHS[id].frontier&&id!=='fusion'&&!(e.g.act.lab>=2&&e.g.act.univ>=1)){if(S.month%12===0)addNews('Frontier research is stalled. It needs at least 2 working labs and a university.','warn');return;}
  if(id==='fusion'){
    if(!(e.g.act.lab>=3&&e.g.act.univ>=1)){if(S.month%12===0)addNews('Fusion research is stalled. It needs at least 3 working labs and a university.','warn');return;}
    if(Math.random()<0.04){S.rd.pts*=0.85;addNews('Plasma instability forces the fusion team to redo months of work.','bad');}
  }
  S.rd.pts+=rdRate(e.g);
  if(S.rd.pts>=TECHS[id].cost){
    S.tech[id]=true;S.rd.pts=0;S.rd.active=nextTech();
    addNews('Breakthrough: '+TECHS[id].name+' is ready. '+TECHS[id].desc,'good');
    toast(TECHS[id].name+' researched');
    spawnFirm(TECHS[id].sector,'tech');
  }
}
function ipo(f){
  f.stage='public';f.val*=1.25;f.jobs=18+rnd(14);
  var proceeds=f.stake*0.35*f.val*0.96,fees=f.val*0.01*(E&&E.g&&E.g.act.exch?2.5:1);
  S.cash+=proceeds+fees;f.stake*=0.65;
  sfx('cash');
  addNews(f.name+' goes public at a '+money(f.val)+' valuation. '+(proceeds>0?'Your stake raised '+money(proceeds)+'. ':'')+'Listing fees added '+money(fees)+'.','good');
  toast(f.name+' IPO!');
}
function killFirm(f,msg){
  f.stage='dead';f.val=0;f.jobs=0;
  addNews(msg,'bad');
}
function stepFirms(){
  var sent=mktSentiment(),k,f,seeds=0,exch=!!(E&&E.g&&E.g.act.exch);
  for(k=0;k<S.firms.length;k++){
    f=S.firms[k];
    if(f.stage==='seed'){
      seeds++;f.age++;f.runway--;
      var g=clamp(1.5*S.mktD/100,-0.3,0.3)+0.045-Math.max(0,S.tax.corp-8)*0.002+(Math.random()-0.5)*0.16;
      if(Math.random()<0.018)g-=0.35;
      f.val=Math.max(500,f.val*(1+g));
      if(f.runway<=0){
        if(S.mkt>=95&&Math.random()<0.55){f.runway+=10;f.stake*=0.85;f.val*=1.1;addNews(f.name+' raises a bridge round. Existing investors are diluted.','info');}
        else killFirm(f,f.name+' runs out of cash and shuts down.'+(f.stake>0?' Your stake is worthless.':''));
      }else if(f.val<=1200&&Math.random()<0.5)killFirm(f,f.name+' collapses after a failed product launch.');
      else if(f.age>=12&&f.val>=70000&&sent>-0.01&&Math.random()<0.2*(exch?1.5:1))ipo(f);
    }else if(f.stage==='public'){
      var gp=clamp(S.mktD/100,-0.25,0.25)+0.004+(Math.random()-0.5)*0.06;
      f.val=Math.max(3000,f.val*(1+gp));
      f.jobs=clamp(16+Math.round(f.val/15000),16,140);
      var hasOffer=false;for(var j=0;j<S.offers.length;j++){if(S.offers[j].fid===f.id)hasOffer=true;}
      if(!hasOffer&&S.month>12&&Math.random()<0.012*(S.mkt>110?1.5:1)){
        var prem=0.2+Math.random()*0.4,buyer=pick(BUYERS);
        S.offers.push({id:S.fid++,fid:f.id,buyer:buyer,prem:prem,expires:S.month+3});
        addNews(buyer+' bids '+Math.round(prem*100)+'% above market for '+f.name+'. Check Corp > Deals.','warn');
      }
    }else if(f.stage==='acquired'){
      f.acq++;if(f.acq===12)f.jobs=Math.round(f.jobs*0.6);
      if(f.acq===30){f.jobs=Math.round(f.jobs*0.67);}
    }
  }
  var labs=E&&E.g?E.g.act.lab:0;
  if(labs>0&&seeds<3&&Math.random()<Math.min(0.08,0.03*labs)){
    var sec=S.tech&&Object.keys(S.tech).length&&Math.random()<0.7?TECHS[pick(Object.keys(S.tech))].sector:pick(['Software','Materials','Mobility','Health']);
    spawnFirm(sec,'lab');
  }
  for(var q=S.offers.length-1;q>=0;q--){
    if(S.offers[q].expires<=S.month){addNews('The bid for '+firmById(S.offers[q].fid).name+' was withdrawn.','info');S.offers.splice(q,1);}
  }
}
function firmById(id){for(var i=0;i<S.firms.length;i++){if(S.firms[i].id===id)return S.firms[i];}return {name:'a firm',val:0,stake:0};}
function invest(id,amt){
  var f=firmById(id);if(f.stage!=='seed')return;
  if(S.cash<amt){toast('Not enough cash.');return;}
  S.cash-=amt;
  var post=f.val+amt;f.stake=(f.stake*f.val+amt)/post;f.val=post;f.runway+=Math.max(1,Math.round(amt/f.burn*0.9));
  toast('Invested '+money(amt)+' in '+f.name);
}
function buyShares(id,frac){
  var f=firmById(id);if(f.stage!=='public')return;
  frac=Math.min(frac,1-f.stake);if(frac<=0.0001){toast('You already own all of it.');return;}
  var c=frac*f.val*1.01;
  if(S.cash<c){toast('Not enough cash. You need '+money(c)+'.');return;}
  S.cash-=c;f.stake+=frac;
}
function sellShares(id,frac){
  var f=firmById(id);if(f.stage!=='public'&&f.stage!=='seed')return;
  frac=Math.min(frac,f.stake);if(frac<=0.0001)return;
  S.cash+=frac*f.val*0.99;f.stake-=frac;
}
function acceptOffer(oid){
  for(var i=0;i<S.offers.length;i++){
    var o=S.offers[i];if(o.id!==oid)continue;
    var f=firmById(o.fid),price=f.val*(1+o.prem),got=f.stake*price*0.98+price*0.012;
    S.cash+=got;f.stage='acquired';f.val=price;f.stake=0;f.acq=0;
    addNews(o.buyer+' completes its takeover of '+f.name+' for '+money(price)+'. The city collected '+money(got)+'. Expect headquarters job cuts.','warn');
    S.offers.splice(i,1);return;
  }
}
function rejectOffer(oid){
  for(var i=0;i<S.offers.length;i++){if(S.offers[i].id===oid){addNews('You turned down the bid for '+firmById(S.offers[i].fid).name+'.','info');S.offers.splice(i,1);return;}}
}
function buyout(id){
  var f=firmById(id);if(f.stage!=='public')return;
  var c=f.val*1.2*(1-f.stake);
  if(S.cash<c){toast('Not enough cash. A buyout costs '+money(c)+'.');return;}
  S.cash-=c;f.stake=1;toast('The city now owns '+f.name+' outright');
}
function mergePartner(f){
  var best=null;
  for(var i=0;i<S.firms.length;i++){var o=S.firms[i];if(o.id!==f.id&&o.stage==='public'&&(!best||o.val>best.val))best=o;}
  return best;
}
function mergeFirms(id){
  var a=firmById(id),b=mergePartner(a);if(!b||a.stage!=='public')return;
  var val=(a.val+b.val)*1.15,stake=(a.stake*a.val+b.stake*b.val)/(a.val+b.val);
  var fee=val*0.01;S.cash+=fee;
  var m={id:S.fid++,name:a.name.split(' ')[0]+'-'+b.name.split(' ')[0],sector:a.sector,stage:'public',val:val,stake:stake,runway:0,burn:0,age:0,jobs:Math.round((a.jobs+b.jobs)*0.75),acq:0};
  a.stage='dead';b.stage='dead';a.jobs=0;b.jobs=0;a.val=0;b.val=0;
  S.firms.push(m);
  addNews(a.name+' and '+b.name+' merge into '+m.name+' at a '+money(val)+' valuation. Synergies cut headcount 25%. Deal taxes: '+money(fee)+'.','info');
}

/* ================= disasters ================= */
function flammable(i){return (T[i]!==EMPTY&&T[i]!==ROAD&&T[i]!==PIPE)||TER[i]===FOREST;}
function igniteAt(i,ttl){if(F[i]===0)F[i]=ttl||4;}
function damageTile(i,n){
  var t=T[i];
  if(t===RES||t===COM||t===IND)L[i]=Math.max(0,L[i]-n);
}
function relief(){
  if(S.approval>45){var c=Math.round(2500+S.pop*2.5);S.cash+=c;addNews('Disaster relief: federal aid sends '+money(c)+' to the treasury.','good');}
}
function startFire(i){
  if(i===undefined){
    var c=[],k;for(k=0;k<N;k++){if(flammable(k)&&(T[k]!==EMPTY||TER[k]===FOREST))c.push(k);}
    if(!c.length)return;i=pick(c);
  }
  igniteAt(i,4);dirty=true;sfx('siren');
  addNews('A fire has broken out and is spreading. Fire stations stop it from jumping tiles.','bad');
}
function quake(){
  var c=[],k,i;for(k=0;k<N;k++){if(T[k]!==EMPTY)c.push(k);}
  if(!c.length)c.push(rnd(N));
  var ep=pick(c),ex=ep%MW,ey=(ep/MW)|0,hit=0;
  for(i=0;i<N;i++){
    var d=Math.abs(i%MW-ex)+Math.abs(((i/MW)|0)-ey);
    if(d>9||T[i]===EMPTY)continue;
    var rf=S.ord.retrofit?0.5:1,p=0.7*(1-d/10)*rf;
    if(Math.random()>p)continue;
    hit++;
    if(T[i]===ROAD&&Math.random()<0.3){T[i]=EMPTY;B[i]=0;}
    else if(T[i]===RES||T[i]===COM||T[i]===IND)L[i]=Math.max(0,L[i]-1-(Math.random()<0.4*rf?1:0));
    else if(T[i]!==ROAD&&Math.random()<0.25)clearAt(i);
  }
  for(k=0;k<2+rnd(3);k++){
    var fx=clamp(ex+rnd(9)-4,0,MW-1),fy=clamp(ey+rnd(9)-4,0,MH-1),fi=fy*MW+fx;
    if(flammable(fi))igniteAt(fi,4);
  }
  shakeUntil=performance.now()+1500;dirty=true;sfx('siren');S.cond=Math.max(0.2,S.cond-0.06);
  addNews('Earthquake! Buildings are damaged and fires have started. '+hit+' tiles were hit.','bad');relief();
}
function flood(){
  var n=0,i;
  for(i=0;i<N;i++){
    if(TER[i]===WATER||EL[i]>2)continue;
    var x=i%MW,y=(i/MW)|0,near=false;
    for(var dy=-2;dy<=2&&!near;dy++)for(var dx=-2;dx<=2;dx++){
      var xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=MW||yy>=MH)continue;
      if(TER[yy*MW+xx]===WATER){near=true;break;}
    }
    if(!near||Math.random()>0.7)continue;
    if(E&&E.g&&E.g.floodC&&E.g.floodC[i])continue;
    FLD[i]=2+rnd(2);n++;
    if(Math.random()<0.6)damageTile(i,1);
  }
  dirty=true;sfx('siren');S.cond=Math.max(0.2,S.cond-0.04);addNews('Flooding along the water. '+n+' low-lying tiles are under water and homes are damaged.','bad');relief();
}
function tornado(){
  var side=rnd(4),x,y,dx,dy;
  if(side===0){x=0;y=rnd(MH);dx=1;dy=rnd(3)-1;}
  else if(side===1){x=MW-1;y=rnd(MH);dx=-1;dy=rnd(3)-1;}
  else if(side===2){x=rnd(MW);y=0;dx=rnd(3)-1;dy=1;}
  else{x=rnd(MW);y=MH-1;dx=rnd(3)-1;dy=-1;}
  S.tor={x:x,y:y,dx:dx,dy:dy,steps:16};dirty=true;sfx('siren');
  addNews('A tornado touched down and is tearing across the map.','bad');
}
function stepDisasters(g){
  var i,k,list=[];
  for(i=0;i<N;i++){if(F[i]>0)list.push(i);if(FLD[i]>0)FLD[i]--;}
  for(k=0;k<list.length;k++){
    i=list[k];var covered=g.fireC[i];
    if(covered&&Math.random()<(T[i]===BATT?0.12:0.5)){F[i]=0;damageTile(i,1);continue;}
    F[i]--;
    var nn=nb4(i);
    for(var q=0;q<nn.length;q++){
      var n=nn[q];
      if(F[n]===0&&flammable(n)&&Math.random()<(g.fireC[n]?0.08:(T[i]===BATT?0.55:0.3)))F[n]=3+rnd(2);
    }
    if(F[i]===0){
      if(T[i]===EMPTY&&TER[i]===FOREST)TER[i]=GRASS;
      else if(T[i]===RES||T[i]===COM||T[i]===IND)L[i]=0;
      else if(T[i]!==EMPTY)clearAt(i);
    }
  }
  if(S.tor){
    var tr=S.tor;
    for(var s=0;s<2;s++){
      tr.x+=tr.dx;tr.y+=tr.dy;if(Math.random()<0.4)tr.y+=rnd(3)-1;if(Math.random()<0.2)tr.x+=rnd(3)-1;
      if(tr.x<0||tr.y<0||tr.x>=MW||tr.y>=MH){tr.steps=0;break;}
      var ti=tr.y*MW+tr.x,tn=[ti].concat(nb4(ti));
      for(k=0;k<tn.length;k++){
        var t2=tn[k];
        if(T[t2]===RES||T[t2]===COM||T[t2]===IND){if(Math.random()<0.7)L[t2]=0;else L[t2]=Math.max(0,L[t2]-1);}
        else if(T[t2]!==EMPTY&&T[t2]!==ROAD&&Math.random()<0.6)clearAt(t2);
        if(TER[t2]===FOREST&&Math.random()<0.5)TER[t2]=GRASS;
      }
      tr.steps--;
    }
    if(tr.steps<=0){S.tor=null;addNews('The tornado has dissipated.','info');relief();}
    dirty=true;
  }
}
function triggerDisaster(kind){
  if(!S||S.over)return;
  if(kind==='fire')startFire();else if(kind==='quake')quake();else if(kind==='flood')flood();else if(kind==='tornado')tornado();
  ui();
}
function animOn(){
  if(S&&S.tor)return true;
  if(performance.now()<shakeUntil)return true;
  for(var i=0;i<N;i++){if(F[i]>0||FLD[i]>0)return true;}
  return false;
}

/* ================= events ================= */
function popAtLeast(n){return function(){return S.pop>=n;};}
var EVENTS=[
  {w:2,tone:'warn',text:'Housing frenzy: bidding wars push home prices up fast.',need:function(e){return e.g.cnt[RES]>=12;},fn:function(){S.bubble+=1.3;}},
  {w:2,tone:'bad',text:'Recession: exports fall and wages soften.',need:popAtLeast(150),fn:function(){S.recession=14;S.mkt*=0.9;}},
  {w:2,tone:'info',text:'Remote work boom: families want space and offices empty out.',need:popAtLeast(150),fn:function(){S.remote=18;}},
  {w:2,tone:'good',text:'A federal infrastructure grant lands in the treasury.',need:popAtLeast(100),fn:function(){S.cash+=Math.round(4000+S.pop*3);}},
  {w:1.5,tone:'good',text:'A tech firm moves its headquarters here and workers follow.',need:function(e){return S.pop>=200&&e.g.resCap>S.pop*1.1;},fn:function(){var g=scan();S.pop=Math.round(Math.min(g.resCap,S.pop+0.15*g.resCap));}},
  {w:1,tone:'bad',need:function(){return S.pop>=300||S.scn==='bubble';},fn:function(){if(S.crash===0)startCrash();}},
  {w:1.5,tone:'warn',text:'Inflation scare: households brace for higher prices and demand wage hikes.',need:popAtLeast(150),fn:function(){S.infl+=1.5;}},
  {w:1.5,tone:'warn',text:'Tech euphoria: investors pile into anything with a pitch deck.',need:popAtLeast(250),fn:function(){S.mktBubble+=1.6;}},
  {w:1.5,tone:'bad',text:'Heatwave: air conditioners push power demand up.',need:function(e){return e.g.pCap>0&&S.pop>=100;},fn:function(){S.heat=S.tech.carbon?2:4;}},
  {w:1.2,tone:'bad',text:'Drought: reservoirs fall and water supply drops 30%.',need:function(e){return e.g.wCap>0&&S.pop>=100;},fn:function(){S.drought=S.tech.carbon?4:8;}},
  {w:2,tone:'bad',dis:true,need:function(e){var n=0;for(var i=0;i<N;i++){if(T[i]!==EMPTY&&T[i]!==ROAD)n++;}return n>=15;},fn:function(){startFire();}},
  {w:1.2,tone:'bad',dis:true,need:popAtLeast(100),fn:function(){flood();}},
  {w:1,tone:'bad',dis:true,need:popAtLeast(150),fn:function(){quake();}},
  {w:1,tone:'bad',dis:true,need:popAtLeast(150),fn:function(){tornado();}}
];
function fireEvent(){
  var pool=EVENTS.filter(function(ev){return (S.disasters!==false||!ev.dis)&&(!ev.need||ev.need(E));}),tot=0,i;
  if(!pool.length)return;
  for(i=0;i<pool.length;i++)tot+=pool[i].w;
  var r=Math.random()*tot,ev=pool[0];
  for(i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){ev=pool[i];break;}}
  ev.fn();if(ev.text)addNews(ev.text,ev.tone);S.lastEvent=S.month;
}

/* ================= development ================= */
function tryMerge(e,type,dem){
  if(dem<0.1||Math.random()>0.3*e.appetite)return;
  var g=e.g,f=g.flags,cands=[],x,y;
  for(y=0;y<MH-1;y++)for(x=0;x<MW-1;x++){
    var a=y*MW+x,b=a+1,c2=a+MW,d2=a+MW+1;
    if(T[a]!==type||T[b]!==type||T[c2]!==type||T[d2]!==type)continue;
    if(L[a]<3||L[b]<3||L[c2]<3||L[d2]<3)continue;
    if(f[a]!==7||f[b]!==7||f[c2]!==7||f[d2]!==7)continue;
    if(F[a]||F[b]||F[c2]||F[d2])continue;
    if(type===RES&&g.parkCov<0.3)continue;
    cands.push(a);
  }
  if(!cands.length)return;
  var a2=pick(cands),tiles=[a2,a2+1,a2+MW,a2+MW+1],lvl=Math.round((EL[a2]+EL[a2+1]+EL[a2+MW]+EL[a2+MW+1])/4),k;
  for(k=0;k<4;k++){var t=tiles[k];T[t]=SUB;PAR[t]=a2;L[t]=0;EL[t]=lvl;ORI[t]=0;}
  T[a2]=type===RES?MRES:MCOM;L[a2]=4;PAR[a2]=a2;ORI[a2]=0;
  if(!S.megaSeen){S.megaSeen=true;addNews('Developers are merging four tall lots into a single mega '+(type===RES?'residential tower.':'skyscraper.'),'good');}
}
function develop(e){
  var g=e.g,f=g.flags,kinds=[[RES,e.Rdem],[COM,e.Cdem],[IND,e.Idem]],i;
  for(var q=0;q<3;q++){
    var type=kinds[q][0],dem=kinds[q][1],elig=[],built=[];
    for(i=0;i<N;i++){
      if(T[i]!==type)continue;
      if(L[i]>0)built.push(i);
      if(f[i]===7&&L[i]<3&&F[i]===0&&FLD[i]===0){
        if(type===RES&&L[i]===2&&g.parkCov<0.3)continue;
        elig.push(i);
      }
    }
    if(dem>0.03&&elig.length){
      var n=Math.round(dem*e.appetite*(1+elig.length*0.14)*(0.5+Math.random()*1.5));
      if(n<1&&dem>0.12&&Math.random()<Math.min(1,dem*e.appetite*1.5))n=1;
      n=Math.min(n,elig.length);
      for(var k=0;k<n;k++){
        var fresh=elig.filter(function(ix){return L[ix]===0;});
        var pool=(fresh.length&&Math.random()<0.75)?fresh:elig;
        var ti=pool[rnd(pool.length)];
        L[ti]=Math.min(3,L[ti]+1);elig.splice(elig.indexOf(ti),1);
      }
    }
    if(S.pop>=30&&built.length&&dem<-0.45&&Math.random()<0.3)L[built[rnd(built.length)]]--;
  }
  for(i=0;i<N;i++){
    var t=T[i];
    if((t===RES||t===COM||t===IND)&&L[i]>0&&f[i]!==7&&Math.random()<0.04)L[i]--;
  }
  tryMerge(e,RES,e.Rdem);tryMerge(e,COM,e.Cdem);
}

/* ================= monthly tick ================= */
function tick(){
  var e=computeEconomy();
  stepMacro(e);
  S.cash+=e.net;S.shopFill=e.shopFill;
  var delta=(e.targetPop-S.pop)*0.15;
  if(Math.abs(delta)<1&&Math.abs(e.targetPop-S.pop)>=1)delta=delta<0?-1:1;
  S.pop=Math.max(0,Math.round(S.pop+delta));

var distState=null;

function buildDistrict(plan){

function placeBuilding(ax,ay,id,rot){

function act(i,first){

  for(var k in f.t){var v=f.t[k],i=+k;T[i]=v[0];L[i]=v[1];B[i]=v[2];PAR[i]=v[3];TER[i]=v[4];EL[i]=v[5];F[i]=v[6];ORI[i]=v[7];}
  S.cash+=f.spent;pending=null;dirty=true;mmDirty=true;toast('Undone. '+money(f.spent)+' refunded.');ui();

function doAct(i,first){
  var t=T[i],ok=false,o=OBJ[tool];
  if(tool!=='inspect'&&pending&&pending.tool!==tool)pending=null;
  if(distState&&distState.tool!==tool)distState=null;
  if(tool==='inspect'){pending=null;inspectIdx=rootOf(i);showTile(i);dirty=true;return;}
  if(tool==='bull'){
    if(T[i]!==EMPTY){
      var rt=rootOf(i),fsz=footSz(rt),ar=fsz[0]*fsz[1];
      var fee=(T[rt]===LF&&L[rt]>=LF_CAP)?Math.ceil(4000*mult()):0;
      if(spend(10*ar+fee)){if(fee)addNews('Capped landfill removed. Environmental cleanup cost '+money(fee)+'.','info');if(T[i]===WATER)T[i]=EMPTY;clearAt(i);ok=true;}
    }

    return;
  }

      toast(ds.plan.roads.length+' roads and '+ds.plan.zones.length+' lots for '+money(ds.plan.cost)+'. Tap the same corner again to build.');return;
    }

  if(o.kmin&&(E?E.kard:0)<o.kmin){if(first)toast('Needs a Type '+(o.kmin===1?'I':'II')+' civilization. Check the Kardashev meter in Economy.');return;}

    else if(T[i]===EMPTY)ok=place(i,'road',ROAD);
  }else if(tool==='res'||tool==='com'||tool==='ind'){

  var hasBuilt=nz>0&&S.pop>=15;

  if(S.pop>=150&&S.infl<0.5)add('infllow','Economy','warn',3,'Mayor, prices are nearly flat or falling at '+S.infl.toFixed(1)+'% with the policy rate at '+S.rate.toFixed(2)+'%. A real rate that high keeps pushing prices down. Lower the rate or send stimulus.');
  if(S.pop>=150&&e.sw<1)add('sewage','Utilities','warn',3,'Mayor, only '+Math.round(e.sw*100)+'% of sewage is treated. Add a sewage plant in the Utilities tab.');
  if(S.pop>=150&&e.gb<1)add('garbage','Utilities','warn',3,'Mayor, garbage is piling up: only '+Math.round(e.gb*100)+'% is collected. Build a landfill or start a recycling program.');
  if(hasBuilt&&e.cong>1.2)add('traffic','Growth','warn',3,'Mayor, traffic is jammed at '+Math.round(e.cong*100)+'% of road capacity. Add bus depots, a rail line, a metro or more roads.');
  if(hasBuilt&&e.pollAvg>0.5)add('pollution','Growth','warn',3,'Mayor, pollution is hurting residents. Use clean air rules, add parks, or keep industry away from homes.');
  if(S.varAmt>0&&S.infl>4)add('varyield','Finance','warn',3,'Mayor, you carry variable-rate debt while inflation runs hot. A rate hike would make it costlier. Consider locking a fixed bond.');
  if(S.offers.length)add('offer','Finance','info',3,'Mayor, a takeover bid is waiting in Corp, under Deals.');
  if(S.cond<0.85&&e.assets>3000)add('aging','Utilities',S.cond<0.7?'bad':'warn',S.cond<0.7?4:3,'Mayor, infrastructure condition is '+Math.round(S.cond*100)+'%. Pipes, wires and roads are wearing out and failures start below 75%. Raise infrastructure renewal in Policy, Spending.');
  if(S.mc.energy>0.3&&g.cnt[PLANT]+g.cnt[GAS]>0)add('wenergy','Economy','warn',3,'Mayor, world energy prices are up '+Math.round(S.mc.energy*100)+'%. Coal and gas plants cost more to run and prices are rising. Nuclear and renewables are far less exposed.');
  if(S.mc.freight>0.35&&(g.portsOK>0||g.cnt[IND]>2))add('wfreight','Economy','warn',3,'Mayor, shipping costs are up '+Math.round(S.mc.freight*100)+'%. Imported goods and construction are costing more and deliveries are late.');
  if(S.mc.chips>0.3&&(g.cnt[LAB]+g.cnt[DC]+g.cnt[BIO]>0||S.rd.budget>0))add('wchips','Economy','warn',3,'Mayor, a chip shortage is slowing research and making tech buildings dearer. Consider delaying tech projects.');
  if(S.mc.food>0.3&&S.pop>=100)add('wfood','Economy','warn',3,'Mayor, world food prices are up '+Math.round(S.mc.food*100)+'%. It is feeding inflation and souring mood.');
  if(S.mc.trade>0.3&&(g.portsOK>0||e.exports>0))add('wtrade','Economy','warn',3,'Mayor, trade disruption is cutting export orders and port imports. Look for new markets.');
  if(S.mc.health>0.3)add('whealth','Economy','warn',3,'Mayor, an outbreak abroad is cutting workplace output and raising service costs.');
  if(S.pop>=100&&e.net>0&&S.cash>Math.max(60000,e.costs*24)&&S.fund.bal<S.cash*0.2)add('idlecash','Finance','info',1,'Mayor, you are sitting on '+money(S.cash)+'. Consider the sovereign fund in Corp, a capital project, or lower taxes.');
  if(S.mc.orbit>0.3&&g.cnt[SPACEPORT]>0)add('worbit','Economy','warn',3,'Mayor, orbital hazards are cutting launch and space income. Debris sweeps and hardening can help.');
  if(S.mc.ore>0.3&&S.tech.asteroid)add('wore','Economy','info',2,'Mayor, asteroid ore prices are up '+Math.round(S.mc.ore*100)+'%. Mining income is booming.');
  if(S.mc.ore<-0.3&&S.tech.asteroid)add('wore2','Economy','warn',2,'Mayor, an ore glut is cutting mining income. Cheap materials may help your builders.');
  if((S.era|0)>=2&&S.rate<=0.5&&S.infl<1)add('zlb','Monetary','warn',4,'Mayor, rates are near zero and prices are barely moving. Abundance is pulling prices down and you cannot cut further. Try asset purchases, stimulus checks or a universal dividend before deflation sets in.');
  if((S.era|0)>=3&&S.mktBubble>0.6)add('spacebub','Monetary','warn',3,'Mayor, cheap money is inflating a space-stock bubble. Space income rides the market, so a crash would hurt it. Consider raising rates.');
  if(S.tech.agi&&S.tax.bot===0&&e.unemp>0.1)add('botlevy','Economy','info',3,'Mayor, automation is eating jobs and income tax with them. An automation levy or a universal dividend can rebalance the budget.');
  if(S.pop>=200&&e.hc<0.85)add('health','Safety','warn',3,'Mayor, hospitals cover only '+Math.round(e.hc*100)+'% of residents. Outbreaks hit harder and mood is falling. Build a hospital in the Services tab, or fund healthcare in Policy.');
  if(S.pop>=200&&e.er<0.7)add('edu','Growth','warn',2,'Mayor, schools can seat only '+Math.round(e.er*100)+'% of the people who need them. Build schools in the Services tab.');
  if(S.pop>=150&&e.socCov<0.65)add('social','Economy','warn',3,'Mayor, social services cover only '+Math.round(e.socCov*100)+'% of need (about '+money(e.socNeed)+' a month). Gaps raise homelessness and drag on mood. Raise social services in Policy, Spending.');
  var lfLeft=0;for(i=0;i<g.lfOpen.length;i++)lfLeft+=(LF_CAP-L[g.lfOpen[i]])/LF_CAP;
  if(g.lfOpen.length>0&&lfLeft/g.lfOpen.length<0.2&&e.recyCap+e.wteCap===0)add('lfspace','Utilities','warn',3,'Mayor, your landfills are about '+Math.round((1-lfLeft/g.lfOpen.length)*100)+'% full. Plan new capacity: another landfill, a recycling plant or waste-to-energy.');
  if(S.pop>=100&&g.floodC&&S.cond>0&&g.cnt[LEVEE]===0&&S.crises.length===0&&false)add('levee','Safety','info',1,'');
  if(S.pop>=300&&g.fireCov<0.5)add('fire','Safety','warn',2,'Mayor, only '+Math.round(g.fireCov*100)+'% of homes are covered by a fire station. Fires will spread.');
  if(S.pop>=300&&g.polCov<0.4)add('police','Safety','warn',2,'Mayor, police cover only '+Math.round(g.polCov*100)+'% of homes. Add stations to lift mood.');
  if(S.pop>=300&&S.mkt>220&&S.crash===0)add('froth','Finance','warn',2,'Mayor, stocks are at '+Math.round(S.mkt)+'. That looks frothy and crash risk is rising. Keep cash in reserve.');
  if(g.cnt[BATT]>0)add('batt','Safety','warn',2,'Mayor, battery storage can go into thermal runaway. Keep fire stations near it.');
  if(hasBuilt&&e.occ>0.97&&e.Rdem>0.3&&S.pop>60)add('homes','Growth','info',1,'Mayor, homes are full and people want in. Zone more housing, and add parks so towers can rise.');
  if(g.act.lab>0&&S.rd.budget===0)add('rd','Growth','info',1,'Mayor, your labs are idle. Set an R&D budget in Corp to research new tech.');
  return a;
}
var advBadge=false;
function advisorTick(e){
  tutorialTick(e);
  if(S.month%3!==0)return;
  var list=adviceList(e),i;
  advBadge=list.some(function(a){return a.tone==='bad';});
  if(S.tut<TUT.length)return;
  list.sort(function(a,b){return b.pri-a.pri;});
  for(i=0;i<list.length;i++){
    var it=list[i];if(it.tone==='info')continue;
    var last=S.advSeen[it.id];

      S.advSeen[it.id]=S.month;

      addNews(it.who+' advisor: '+it.text,it.tone==='bad'?'bad':'warn',it.who,function(){return adviceList(E).some(function(x){return x.id===id;});});
      return;
    }
  }
}

var AU={ctx:null,master:null,sfx:true,music:true,timer:0,step:0};
(function(){try{var d=JSON.parse(localStorage.getItem('sc5000.audio')||'null');if(d){AU.sfx=d.sfx!==false;AU.music=d.music!==false;}}catch(e){}})();
function auSave(){store('sc5000.audio',JSON.stringify({sfx:AU.sfx,music:AU.music}));}
function auInit(){
  if(AU.ctx){try{if(AU.ctx.state==='suspended')AU.ctx.resume();}catch(e){}return;}
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=0.6;AU.master.connect(AU.ctx.destination);}catch(e){AU.ctx=null;return;}
  if(AU.music)musicStart();
}
function tone(f,dur,type,vol,delay,f2){
  if(!AU.ctx)return;
  try{
    var c=AU.ctx,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.08,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfx(n){
  if(!AU.sfx||!AU.ctx)return;
  if(n==='build'){tone(520,0.07,'square',0.05);tone(780,0.09,'square',0.04,0.05);}
  else if(n==='big'){tone(196,0.18,'triangle',0.09);tone(294,0.18,'triangle',0.08,0.08);tone(392,0.3,'triangle',0.08,0.16);}
  else if(n==='bad'){tone(170,0.18,'sawtooth',0.06,0,120);}
  else if(n==='cash'){tone(880,0.1,'sine',0.07);tone(1320,0.25,'sine',0.06,0.08);}
  else if(n==='ok'){tone(660,0.12,'sine',0.06);tone(880,0.2,'sine',0.05,0.1);}
  else if(n==='crash'){tone(330,0.9,'sawtooth',0.08,0,70);tone(220,1.1,'sine',0.09,0.1,50);}
  else if(n==='siren'){for(var k=0;k<4;k++){tone(600,0.25,'sine',0.06,k*0.5,900);tone(900,0.25,'sine',0.06,k*0.5+0.25,600);}}
}
var CHORDS=[[220,277,330],[196,247,294],[175,220,262],[196,247,330],[165,208,247]];
function musicStep(){
  if(!AU.ctx||!AU.music||document.hidden){AU.timer=setTimeout(musicStep,3000);return;}
  var ch=CHORDS[AU.step%CHORDS.length];AU.step++;
  for(var i=0;i<ch.length;i++){
    try{
      var c=AU.ctx,t0=c.currentTime+i*0.15,o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=ch[i]*(Math.random()<0.2?2:1);
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.025,t0+1.6);g.gain.exponentialRampToValueAtTime(0.0001,t0+5.5);
      o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+5.7);
    }catch(e){}
  }
  if(Math.random()<0.6)tone(ch[2]*2*(Math.random()<0.5?1:1.5),1.4,'triangle',0.015,2+Math.random()*2);
  AU.timer=setTimeout(musicStep,5200);
}
function musicStart(){clearTimeout(AU.timer);if(AU.ctx&&AU.music)musicStep();}
function musicStop(){clearTimeout(AU.timer);}
function setAudio(kind,on){
  if(kind==='sfx')AU.sfx=on;else{AU.music=on;if(on)musicStart();else musicStop();}
  auSave();
}

/* ================= save slots and backup codes ================= */
var SLOT_N=3;
function slotKey(n){return 'sc5000.slot.'+n;}
function slotMeta(n){try{return JSON.parse(fetchStore(slotKey(n)+'.meta'));}catch(e){return null;}}
function saveSlot(n){
  if(!S)return false;
  try{
    localStorage.setItem(slotKey(n),JSON.stringify(snapshot()));
    localStorage.setItem(slotKey(n)+'.meta',JSON.stringify({city:S.city,pop:S.pop,date:dateLabel(S.month)}));
    return true;
  }catch(e){return false;}
}
function loadSlot(n){try{return restore(JSON.parse(fetchStore(slotKey(n))));}catch(e){return false;}}
function deleteSlot(n){try{localStorage.removeItem(slotKey(n));localStorage.removeItem(slotKey(n)+'.meta');}catch(e){}}
function b64FromBytes(buf){
  var b=new Uint8Array(buf),s='',CH=0x8000;
  for(var i=0;i<b.length;i+=CH)s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));
  return btoa(s);
}
function bytesFromB64(str){var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
function exportCode(cb){
  var json=JSON.stringify(snapshot());
  if(typeof CompressionStream!=='undefined'){
    try{
      var st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      new Response(st).arrayBuffer().then(function(buf){cb('SC5K1:'+b64FromBytes(buf));},function(){cb('SC5K0:'+btoa(unescape(encodeURIComponent(json))));});
      return;
    }catch(e){}
  }
  cb('SC5K0:'+btoa(unescape(encodeURIComponent(json))));
}
function importCode(code,cb){
  code=(code||'').replace(/\s+/g,'');
  try{
    if(code.indexOf('SC5K0:')===0){cb(restore(JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))))));return;}
    if(code.indexOf('SC5K1:')===0&&typeof DecompressionStream!=='undefined'){
      var st=new Blob([bytesFromB64(code.slice(6))]).stream().pipeThrough(new DecompressionStream('gzip'));
      new Response(st).text().then(function(t){try{cb(restore(JSON.parse(t)));}catch(e){cb(false);}},function(){cb(false);});
      return;
    }
  }catch(e){}
  cb(false);
}

var GUIDE=[
{id:'g-goal',title:'The goal and how the game works',
 brief:'You are the Mayor of a growing city and also its central banker. You set taxes, spending and the interest rate. Private builders put up homes, shops and factories, and residents move in. Your job is to grow the city while keeping prices, jobs, money and voters in balance.',
 more:'<p>Time runs in months. Every month the city earns tax revenue, pays its bills, grows or shrinks, and the economy moves on its own. You lose if approval stays under 25% for eight months (you get recalled) or if cash stays below minus $4,000 for two months (receivership).</p>'+
 '<p>The clock starts paused and begins when you place your first building. Pick a scenario when you found a city for a goal and a deadline, or play Free play or Sandbox with no pressure.</p>'+
 '<p>Your city ranks up as it grows: Hamlet, Village (150 people), Town (600), City (1,500) and Metropolis (3,500). Capital projects unlock at certain sizes.</p>'+
 '<p><b>There is no winning.</b> The game never ends. For a long game, the Kardashev scale is how you keep score, and as your civilization advances the world changes around you. See the sections on the Kardashev scale and eras.</p>'},
{id:'g-screen',title:'The screen and controls',
 brief:'The map is in the middle. Numbers across the top show your money and the economy. Tools are at the bottom. Drag to move the map, tap to build, pinch to zoom.',
 more:'<p><b>Top:</b> your city name (tap it to collapse the stats), Tips for advice and objectives, and Menu. The four boxes show Cash, People, Approval and Cash per month. The row of chips below shows the policy rate, inflation, mortgage rate, jobless rate, home prices, stocks, supply costs, power use and water use. Tap any chip to learn what it means and what to do.</p>'+
 '<p><b>Map buttons (right side):</b> zoom in and out, rotate the view, the hand button switches between pan mode (drag moves the map, tap builds) and paint mode (drag paints roads and zones), and Layers cycles through data views.</p>'+
 '<p><b>Bottom:</b> Build opens the toolbox, with five tabs: Build (zoning and districts), Utilities (power, water and waste), Services (police, fire, schools, parks), Transport (roads, buses, rail, metro, port, airport) and Growth (labs, university, data center, exchange, stadium, convention). Below sit the pause and speed buttons, then Policy, Economy and Corp. On the map, a floating Undo button reverses your last build and refunds it, and a Turn button appears when you pick a long building.</p>'+
 '<p><b>Building:</b> small things build on one tap. Big buildings show a green footprint first and ask for a second tap on the same spot. Tap a tile with the Move tool to see what it does and what it is missing.</p>'+
 '<p><b>Two fingers</b> always pan and zoom. Double-tap with the Move tool zooms in. A quick flick keeps the map gliding. The small map in the corner jumps you to any spot.</p>'},
{id:'g-start',title:'Your first fifteen minutes',
 brief:'Build power, build a water pump, lay roads, then zone homes, shops and factories next to the roads. Wait and watch people arrive.',
 more:'<ol><li><b>Power:</b> open the Utilities tab, pick Coal (cheap) or Gas, and tap twice to place it near the middle of where you want the city.</li>'+
 '<li><b>Water:</b> in Utilities, under water and waste, place a Pump on a tile that touches water. The pump must also be inside your power plant\u2019s reach or it makes nothing.</li>'+
 '<li><b>Roads:</b> open the Transport tab, pick Road and lay lines where you want to build. Use the pencil button to drag.</li>'+
 '<li><b>Zones:</b> in the Build tab, zone about six homes, a couple of shops and a couple of factories right beside the roads, inside power and water range.</li>'+
 '<li><b>Wait:</b> builders move in when there is demand and credit is cheap. Watch the dots over lots: red means no road, yellow no power, blue no water.</li>'+
 '<li><b>Past 150 people:</b> add a sewage plant and a landfill from the Utilities tab.</li></ol>'+
 '<p>A fast way to lay out a neighbourhood is the district brush: pick Suburb in the Build tab, tap two corners, then tap the second corner again to build roads and lots in one go.</p>'},
{id:'g-zones',title:'Roads, zones and growth',
 brief:'You zone land and run roads. Private builders do the building. Homes house people, shops and factories give them jobs and goods. A lot only grows if it touches a road and has power and water.',
 more:'<p><b>Each lot has a level from 1 to 3.</b> Homes hold 6, 15 and 30 people. Shops give 4, 10 and 20 jobs. Factories give 6, 14 and 26 jobs.</p>'+
 '<p><b>Demand drives growth.</b> Homes grow when homes are nearly full and there are jobs. Shops grow when shoppers outnumber shop jobs. Factories grow when there are idle workers and shops need goods. Builders move faster when mortgage rates are low, supply costs are normal and taxes are modest.</p>'+
 '<p><b>Balance matters.</b> A rough ratio is about three homes for each shop lot and two factory lots, but watch the jobless rate and the Advisors. Too many homes and no jobs means unemployment. Too many jobs and no homes means a labor shortage and rising prices.</p>'+
 '<p><b>Tall homes need parks.</b> A level 2 home only reaches level 3 when parks cover about one for every 15 home lots.</p>'+
 '<p><b>Mega towers.</b> When a 2 by 2 block of level 3 lots is fully served and demand is strong, developers can merge it into one mega tower: 150 people for homes, or about 110 jobs for shops. Homes still need park coverage.</p>'+
 '<p><b>District brush.</b> Suburb is mostly homes, Downtown is mostly shops, Industry park is mostly factories. Tap one corner, then the opposite corner (up to 16 by 16), and the plan shows with its cost. Tap the same corner again to build. Undo reverses the whole district.</p>'+
 '<p><b>Terrain.</b> Forest costs about 35% more to clear. Hills cost more to build on. Mountains cannot be built on. Water only takes bridges, at four times the road price.</p>'},
{id:'g-power',title:'Power',
 brief:'Every building needs power. Plants cover a diamond around them and power lines stretch that reach. If demand beats supply, jobs and growth drop everywhere.',
 more:'<p><b>Demand:</b> about 2 MW per level of every home, shop and factory, plus the special buildings. A heatwave adds 20%.</p>'+
 '<table class="gt"><tr><th>Plant</th><th>Output</th><th>Notes</th></tr>'+
 '<tr><td>Coal</td><td>60 MW</td><td>Cheap, dirty. Fuel bill follows supply shocks.</td></tr>'+
 '<tr><td>Gas</td><td>85 MW</td><td>Cleaner. Fuel prices swing the most.</td></tr>'+
 '<tr><td>Nuclear</td><td>420 MW</td><td>Advanced fission research. 10 months to build. Steady, clean, low fuel cost, and shocks barely touch it.</td></tr>'+
 '<tr><td>Hydro</td><td>26 MW</td><td>Needs a waterfront tile. Drought halves it.</td></tr>'+
 '<tr><td>Solar</td><td>12 MW</td><td>Weaker in winter and under cloud. Photovoltaics adds 50%.</td></tr>'+
 '<tr><td>Wind</td><td>14 MW</td><td>Gusty. Better on hills and coasts.</td></tr>'+
 '<tr><td>Fusion</td><td>650 MW</td><td>Very hard research. 14 months to build.</td></tr></table>'+
 '<p><b>Reach:</b> each plant covers a diamond around its centre (8 tiles for coal and gas, 14 for nuclear, 16 for fusion). Power lines carry power from a plant and each powered line reaches 4 tiles around it.</p>'+
